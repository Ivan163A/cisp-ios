<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --ink:#1b2431; --sub:#66748a;
  --line:#e3e8f0; --accent:#2f6fed; --accent-soft:#eaf1ff;
  --ok:#1f9d55; --ok-soft:#e6f6ec; --bad:#d93a3a; --bad-soft:#fdeaea;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 8px 24px rgba(20,30,50,.07);
  --radius:16px;
}
html[data-theme="dark"]{
  --bg:#12161d; --card:#1a2028; --ink:#e7ecf3; --sub:#93a1b5;
  --line:#2a333f; --accent:#5b91ff; --accent-soft:#1d2838;
  --ok:#3ecf8e; --ok-soft:#16301f; --bad:#ff6b6b; --bad-soft:#331a1c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"PingFang HK","PingFang TC","Microsoft JhengHei","Noto Sans TC","Noto Sans HK","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:17px; line-height:1.7; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:820px;margin:0 auto;padding:16px 18px 90px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{font-size:20px;font-weight:700;letter-spacing:.5px}
.brand small{display:block;font-size:12.5px;font-weight:500;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.btn{
  appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:9px 15px;border-radius:11px;font:inherit;font-size:15px;cursor:pointer;
  transition:.15s; white-space:nowrap;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
.muted{color:var(--sub)}
.small{font-size:13.5px}

/* ---- setup ---- */
.hero{padding:26px 22px;margin-bottom:16px}
.hero h1{margin:0 0 6px;font-size:25px}
.hero p{margin:0;color:var(--sub);font-size:15px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}
@media(max-width:620px){.modes{grid-template-columns:1fr}}
.mode{padding:20px;cursor:pointer;transition:.15s;border-width:2px}
.mode:hover{border-color:var(--accent);transform:translateY(-2px)}
.mode h3{margin:0 0 6px;font-size:19px}
.mode p{margin:0;color:var(--sub);font-size:14.5px;line-height:1.6}
.mode .tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.5px;
  color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:20px;margin-bottom:10px}
.field{margin:14px 0}
.field>label{display:block;font-size:13.5px;font-weight:600;color:var(--sub);margin-bottom:7px;letter-spacing:.3px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;
  border-radius:20px;font-size:14px;cursor:pointer;transition:.15s;font-family:inherit}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.chip .n{opacity:.65;font-size:12.5px;margin-left:4px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.stat{flex:1;min-width:110px;padding:14px;border-radius:12px;background:var(--accent-soft);text-align:center}
.stat b{display:block;font-size:22px;line-height:1.2}
.stat span{font-size:12.5px;color:var(--sub)}

/* ---- quiz ---- */
.bar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.prog{flex:1;min-width:140px;height:7px;background:var(--line);border-radius:20px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:20px;transition:width .3s}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pill{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}
.pill.grey{background:var(--line);color:var(--sub)}
.qstem{font-size:19.5px;font-weight:600;line-height:1.65;margin:0 0 20px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;gap:13px;align-items:flex-start;text-align:left;width:100%;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);
  padding:14px 16px;border-radius:13px;font:inherit;font-size:16.5px;line-height:1.6;cursor:pointer;transition:.12s;
}
.opt:hover{border-color:var(--accent);background:var(--accent-soft)}
.opt .k{flex:none;width:27px;height:27px;border-radius:8px;background:var(--line);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.62}
.opt:disabled{cursor:default}
.verdict{margin-top:18px;padding:16px 18px;border-radius:13px;border:1px solid var(--line)}
.verdict.ok{background:var(--ok-soft);border-color:var(--ok)}
.verdict.bad{background:var(--bad-soft);border-color:var(--bad)}
.verdict .vhead{font-weight:700;font-size:17px;margin-bottom:8px}
.verdict.ok .vhead{color:var(--ok)} .verdict.bad .vhead{color:var(--bad)}
.verdict .ans{font-weight:700;margin-bottom:8px}
.verdict .ex{font-size:15.5px;line-height:1.75}
.verdict .ex b{color:var(--accent)}
.foot{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap}
.kbd{font-size:12.5px;color:var(--sub)}
.kbd b{display:inline-block;min-width:18px;padding:1px 6px;margin:0 2px;border-radius:6px;
  border:1px solid var(--line);background:var(--accent-soft);font-weight:700;color:var(--ink);text-align:center}
.helpmask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;
  justify-content:center;z-index:60;padding:20px}
.helpcard{max-width:600px;width:100%;max-height:84vh;overflow:auto}
.helpcard table{width:100%;border-collapse:collapse;font-size:14.5px}
.helpcard td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.helpcard td:first-child{white-space:nowrap;color:var(--accent);font-weight:700}
.nav{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
select,input[type=text]{
  font:inherit;font-size:15px;padding:8px 11px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);
}
/* ---- memorise ---- */
.mem{margin-bottom:14px}
.mem .opts{margin-top:14px}
.mem .opt{cursor:default;border-color:var(--line)}
.mem .opt.right{border-color:var(--ok);background:var(--ok-soft)}
.mem .opt.right .k{background:var(--ok);color:#fff}
.exbox{margin-top:16px;padding:16px 18px;border-radius:13px;background:var(--accent-soft);border:1px solid var(--line)}
.exbox .lbl{font-size:12.5px;font-weight:700;color:var(--accent);letter-spacing:.5px;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:22px;font-size:14.5px;box-shadow:var(--shadow);opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
table.log{width:100%;border-collapse:collapse;font-size:14.5px}
table.log th,table.log td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}
table.log th{color:var(--sub);font-size:13px;font-weight:600}
.res{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}
.res .big{flex:1;min-width:130px;text-align:center;padding:18px 12px;border-radius:14px;background:var(--accent-soft)}
.res .big b{display:block;font-size:30px;line-height:1.15}
.res .big span{font-size:13px;color:var(--sub)}
h2{font-size:20px;margin:0 0 14px}
.hidden{display:none}
a{color:var(--accent)}

/* ---- iOS / mobile additions ---- */
html{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
.wrap{padding-left:max(18px, env(safe-area-inset-left));padding-right:max(18px, env(safe-area-inset-right));padding-bottom:max(90px, calc(90px + env(safe-area-inset-bottom)))}
.toast{bottom:max(26px, calc(16px + env(safe-area-inset-bottom)));max-width:calc(100vw - 32px);text-align:center}
@media (display-mode: standalone){
  body{padding-top:max(env(safe-area-inset-top), 12px)}
}
html.standalone body{padding-top:max(env(safe-area-inset-top), 12px)}
@media (max-width:820px){
  .kbd{display:none !important}
  header.top{gap:8px;margin-bottom:12px}
  .brand{font-size:17px}
  .brand small{display:none}
  .btn{min-height:44px;padding:10px 14px}
  .opt{min-height:48px;padding:14px 14px}
  .chip{padding:10px 14px;min-height:40px}
  select,input[type=text],input,textarea{font-size:16px !important}
  .foot{
    position:sticky;bottom:0;z-index:40;
    margin-top:16px;margin-left:-6px;margin-right:-6px;
    padding:10px 6px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--bg) 70%, transparent);
    flex-wrap:nowrap;gap:8px;
  }
  .foot .btn.primary{flex:1;min-width:0}
  .foot .spacer{display:none}
  .qstem{font-size:18px}
  .ios-tip{display:flex}
}
.ios-tip{
  display:none;align-items:flex-start;gap:10px;
  margin:0 0 14px;padding:12px 14px;border-radius:12px;
  background:var(--accent-soft);border:1px solid var(--line);
  font-size:14.5px;line-height:1.55;color:var(--ink);
}
.ios-tip.hidden{display:none !important}

ice 將密文和MAC 發送給Bob，Bob用密鑰K1和密文生成一個MAC並和Alice 的 MAC比較，假如相同再用K2解密Alice發送的密文，這個過程可以提供什麼安全服務？","options":["僅提供數字簽名","僅提供保密性","僅提供不可否認性","保密性和消息完整性"],"answer":"D","category":"安全模型與訪問控制","sources":[{"bank":"q545","n":9},{"bank":"rev4","n":65}]},{"id":10,"stem":"PKI 在驗證一個數字證書時需要查看_______，來確認該證書是否已經作廢。","options":["ARL","CSS","KMS","CRL"],"answer":"D","category":"密碼與加密","sources":[{"bank":"q545","n":10}]},{"id":11,"stem":"時間戳的引入主要是為了防止：","options":["死鎖","丟失","重放","擁塞"],"answer":"C","category":"綜合","sources":[{"bank":"q545","n":11}]},{"id":12,"stem":"以下對於安全套接層（SSL）的說法正確的是：","options":["主要是使用對稱密鑰體制和X509 數字證書技術保護信息傳輸的機密性和完整性","可以在網絡層建立VPN","主要適用於點對點之間的信息傳輸，常用WebServer 方式","包含三個主要協議：AH、ESP、IKE"],"answer":"C","category":"網絡安全","sources":[{"bank":"q545","n":12}]},{"id":13,"stem":"按照BLP 模型規則，以下哪種訪問不能被授權：","options":["Bob 的安全級是（機密，{NUC，EUR}），文件的安全級是（機密，{NUC，EUR，AMC}），Bob 請求寫該文件","Bob 的安全級是（機密，{NUC，EUR}），文件的安全級是（機密，{NUC}），Bob 請求讀該文件","Alice 的安全級是（機密，{NUC，EUR}），文件的安全級是（機密，{NUC，US}），Alice請求寫該文件","Alice 的安全級是（機密，{NUC，US}），文件的安全級是（機密，{NUC，US}），Alice 請求讀該文件"],"answer":"C","category":"安全模型與訪問控制","sources":[{"bank":"q545","n":13}]},{"id":14,"stem":"為了防止授權用戶不會對數據進行未經授權的修改，需要實施對數據的完整性保護，下列哪一項最好地描述了星或（﹡-）完整性原則？","options":["Bell-LaPadula 模型中的不允許向下寫","Bell-LaPadula 模型中的不允許向上讀","Biba 模型中的不允許向上寫","Biba 模型中的不允許向下讀"],"answer":"C","category":"安全模型與訪問控制","sources":[{"bank":"q545","n":14},{"bank":"rev6","n":78}]},{"id":15,"stem":"下面哪一個情景屬於身份鑑別（Authentication）過程？","options":["用戶依照系統提示輸入用戶名和口令","用戶在網絡上共享了自己編寫的一份Office 文檔，並設定哪些用戶可以閱讀，哪些用戶可以修改","用戶使用加密軟件對自己編寫的Office 文檔進行加密，以阻止其他人得到這份拷貝後看到文檔中的內容","某個人嘗試登陸到你的計算機中，但是口令輸入的不對，系統提示口令錯誤，並將這次失敗的登陸過程紀錄在系統日誌中"],"answer":"A","category":"操作系統與主機安全","sources":[{"bank":"q545","n":15}]},{"id":16,"stem":"下列對Kerberos 協議特點描述不正確的是：","options":["協議採用單點登錄技術，無法實現分佈式網絡環境下的認證","協議與授權機制相結合，支持雙向的身份認證","只要用戶拿到了TGT並且該TGT沒有過期，就可以使用該 TGT 通過TGS完成到任一個服務器的認證而不必重新輸入密碼","AS 和TGS是集中式管理，容易形成瓶頸，系統的性能和安全也嚴重依賴於AS 和TGS的性能和安全"],"answer":"A","category":"網絡安全","sources":[{"bank":"q545","n":16}]},{ A","category":"惡意代碼與漏洞","sources":[{"bank":"q545","n":44}]},{"id":45,"stem":"下列關於計算機病毒感染能力的說法不正確的是：","options":["能將自身代碼注入到引導區","能將自身代碼注入到扇區中的文件鏡像","能將自身代碼注入文本文件中並執行","能將自身代碼注入到文檔或模板的宏中代碼"],"answer":"C","category":"惡意代碼與漏洞","sources":[{"bank":"q545","n":45},{"bank":"rev3","n":12}]},{"id":46,"stem":"當用戶輸入的數據被一個解釋器當作命令或查詢語句的一部分執行時，就會產生哪種類型的漏洞？","options":["緩衝區溢出","設計錯誤","信息泄露","代碼注入"],"answer":"D","category":"惡意代碼與漏洞","sources":[{"bank":"q545","n":46},{"bank":"real","n":54}]},{"id":47,"stem":"完整性檢查和控制的防範對象是_______，防止它們進入數據庫。","options":["不合語義的數據，不正確的數據","非法用戶","非法操作","非法授權"],"answer":"A","category":"安全模型與訪問控制","sources":[{"bank":"q545","n":47}]},{"id":48,"stem":"存儲過程是SQL語句的一個集合，在一個名稱下存儲，按獨立單元方式執行。以下哪一項不是使用存儲過程的優點：","options":["提高性能，應用程序不用重複編譯此過程","降低用戶查詢數量，減輕網絡擁塞","語句執行過程中如果中斷，可以進行數據回滾，保證數據的完整性和一致性","可以控制用戶使用存儲過程的權限，以增強數據庫的安全性"],"answer":"B","category":"網絡安全","sources":[{"bank":"q545","n":48}]},{"id":49,"stem":"下列哪些措施不是有效的緩衝區溢出的防護措施？","options":["使用標準的C語言字符串庫進行操作","嚴格驗證輸入字符串長度","過濾不合規則的字符","使用第三方安全的字符串庫操作"],"answer":"A","category":"法規與標準","sources":[{"bank":"q545","n":49}]},{"id":50,"stem":"以下工作哪個不是計算機取證準備階段的工作","options":["獲得授權","準備工具","介質準備","保護數據"],"answer":"D","category":"應急與災難恢復","sources":[{"bank":"q545","n":50}]},{"id":51,"stem":"以下哪個問題不是導致DNS欺騙的原因之一？","options":["DNS 是一個分佈式的系統","為提高效率，DNS 查詢信息在系統中會緩存","DNS 協議傳輸沒有經過加密的數據","DNS 協議是缺乏嚴格的認證"],"answer":"A","category":"網絡安全","sources":[{"bank":"q545","n":51}]},{"id":52,"stem":"以下哪個是ARP欺騙攻擊可能導致的後果？","options":["ARP 欺騙可直接獲得目標主機的控制權","ARP 欺騙可導致目標主機的系統崩潰，藍屏重啓","ARP 欺騙可導致目標主機無法訪問網絡","ARP 欺騙可導致目標主機死機"],"answer":"C","category":"網絡安全","sources":[{"bank":"q545","n":52}]},{"id":53,"stem":"以下哪個攻擊步驟是IP欺騙（IP Spoof）系列攻擊中最關鍵和難度最高的？","options":["對被冒充的主機進行拒絕服務攻擊，使其無法對目標主機進行響應","與目標主機進行會話，猜測目標主機的序號規則","冒充受信主機向目標主機發送數據包，欺騙目標主機","向目標主機發送指令，進行會話操作"],"answer":"B","category":"網絡安全","sources":[{"bank":"q545","n":53}]},{"id":54,"stem":"以下哪個拒絕服務攻擊方式不是流量型拒絕服務攻擊？","options":["Land","UDPFlood","Smurf","Teardrop"],"answer":"D","category":"網絡安全","sources":[{"bank":"q545","n":54},{"bank":"rev3","n":15}]},{"id":55,"stem":"如果一名攻擊者截獲了一個公鑰，然後他將這個公鑰替換為自己的公鑰併發送給接收者，這種情況屬於哪一種攻擊？","options":["重放攻擊","Smurf 攻擊","字典攻擊","中間人攻擊"],"answer":"D","category":"密碼與加密","sources":[{"bank":"q545","n":55}]},{"id":56,"stem":"域名註冊信息可在哪裏找到？","options":["路由表","DNS 記錄","whois 數據庫","MIBs 庫"],"answer":"C","category":"網絡安全","sources":[{"bank":"q545","n":56}]},{"id":57,"stem":"網絡管理員定義“no ip directed broadcast”以減輕下面哪種攻擊？","options":["Diecast","Smurf","Batcast","Coke"],"answer":"B","category":"網絡安全","sources":[{"bank":"q545","n":57}]},{"id":58,"stem":"下面哪一項不是黑客攻擊在信息收集階段使用的工具或命令：","options":["Nmap","Nslookup","LC","Xscan"],"answer":"C","category":"綜合","sources":[{"bank":"q545","n":58}]},{"id":59,"stem":"下面關於軟件測試的說法錯誤的是：","options":["所謂“黑盒”測試就是測試過程不測試報告中進行描述，且對外嚴格保密","出於安全考慮，在測試過程中儘量不要使用真實的生產數據","測試方案和測試結果應當成為軟件開發項目文檔的主要部分被妥善的保存","軟件測試不僅應關注需要的功能是否可以被實現，還要注意是否有不需要的功能被實現了"],"answer":"A","category":"綜合","sources":[{"bank":"q545","n":59}]},{"id":60,"stem":"以下哪個不是SDL的思想之一：","options":["SDL 是持續改進的過程，通過持續改進和優化以適用各種安全變化，追求最優效果","SDL 要將安全思想和意識嵌入到軟件團隊和企業文化中","SDL 要實現安全的可度量性","SDL 是對傳統軟件開發過程的重要補充，用於完善傳統軟件開發中的不足"],"answer":"D","category":"工程與管理","sources":[{"bank":"q545","n":60}]},{"id":61,"stem":"通過向被攻擊者發送大量的ICMP回應請求，消耗被攻擊者的資源來進行響應，直至被攻擊者再也無法處理有效地網絡信息流時，這種攻擊稱之為：","options":["Land 攻擊","Smurf 攻擊","PingofDeath 攻擊","ICMP Flood"],"answer":"D","category":"網絡安全","sources":[{"bank":"q545","n":61},{"bank":"rev3","n":14}]},{"id":62,"stem":"以下哪種方法不能有效提高WLAN的安全性：","options":["修改默認的服務區標識符（SSID）","禁止SSID 廣播","啓用終端與AP 間的雙向認證","啓用無線AP 的開放認證模式"],"answer":"D","category":"網絡安全","sources":[{"bank":"q545","n":62}]},{"id":63,"stem":"以下哪項是對抗ARP欺騙有效的手段？","options":["使用靜態的ARP緩存","在網絡上阻止ARP 報文的發送","安裝殺毒軟件並更新到最新的病毒庫","使用Linux 系統提高安全性"],"answer":"A","category":"網絡安全","sources":[{"bank":"q545","n":63}]},{"id":64,"stem":"以下關於ISO/IEC27001 標準說法不正確的是：","options":["本標準可被內部和外部相關方用於一致性評估，審覈的重點就是組織信息安全的現狀，對部屬的信息安全控制是好的還是壞的做出評判","本標準採用一種過程方法米建立、實施、運行、監視、評審、保持和改進一個組織的ISMS","目前國際標準化組織推出的四個管理體系標準：質量管理體系，職業健康安全管理體系、環境管理體系、信息安全管理體系，都採用了相同的方法，即PDCA 模型","本標準注重監視和評審，因為監視和評審是持續改進的基礎，如果缺乏對執行情況和有效性的測量，改進就成了“無的放矢”"],"answer":"A","category":"工程與管理","sources":[{"bank":"q545","n":64}]},{"id":65,"stem":"下列哪一項安全控制措施不是用來檢測未經授權的信息處理活動的：","options":["設置網絡連接時限","記錄並分析系統錯誤日誌","記錄並分析用戶和管理員操作日誌","啓用時鐘同步"],"answer":"A","category":"網絡安全","sources":[{"bank":"q545","n":65},{"bank":"rev1","n":48}]},{"id":66,"stem":"下列安全控制措施的分類中，哪個分類是正確的（P-預防性的，D-檢測性的以及C-糾正性的控制）：1.網絡防火牆 2.RAID 級別3 3.銀行賬單的監督複審 4.分配計算機用戶標識 5.交易日誌","options":["P，P，C，D，andC","P，D，P，C，andD","P，C，D，P，andD","P，D，P，P，andC"],"answer":"C","category":"網絡安全","sources":[{"bank":"q545","n":66}]},{"id":67,"stem":"風險評估主要包括風險分析準備、風險要素識別、風險分析和風險結果判定四個主要過程，關於這些過程，以下的說法哪一個是正確的？","options":["風險分析準備的內容是識別風險的影響和可能性","風險要素識別的內容是識別可能發生的安全事件對信息系統的影響程度","風險分析的內容是識別風險的影響和可能性","風險結果判定的內容是發生系統存在的威脅、脆弱性和控制措施"],"answer":"C","category":"風險管理","sources":[{"bank":"q545","n":67}]},{"id":68,"stem":"你來到服務器機房隔壁的一間辦公室，發現窗戶壞了。由於這不是你的辦公室，你要求在這裏辦公的員工請維修工來把窗戶修好。你離開後，沒有再過問這扇窗戶的事情。這件事的結果對與特定脆弱性相關的威脅真正出現的可能性會有什麼影響？","options":["如果窗戶被修好，威脅真正出現的可能性會增加","如果窗戶被修好，威脅真正出現的可能性會保持不變","如果窗戶沒有被修好，威脅真正出現的可能性會下降","如果窗戶沒有被修好，威脅真正出現的可能性會增加"],"answer":"D","category":"風險管理","sources":[{"bank":"q545","n":68}]},{"id":69,"stem":"在對安全控制進行分析時，下面哪個描述是不準確的？","options":["對每一項安全控制都應該進行成本收益分析，以確定哪一項安全控制是必須的和有效的","應確保選擇對業務效率影響最小的安全措施","選擇好實施安全控制的時機和位置，提高安全控制的有效性","仔細評價引入的安全控制對正常業務帶來的影響，採取適當措施，儘可能減少負面效應"],"answer":"B","category":"工程與管理","sources":[{"bank":"q545","n":69}]},{"id":70,"stem":"以下哪一項不是信息安全管理工作必須遵循的原則？","options":["風險管理在系統開發之初就應該予以充分考慮，並要貫穿於整個系統開發過程之中","風險管理活動應成為系統開發、運行、維護、直至廢棄的整個生命週期內的持續性工作","由於在系統投入使用後部署和應用風險控制措施針對性會更強，實施成本會相對較低","在系統正式運行後，應注重殘餘風險的管理，以提高快速反應能力"],"answer":"C","category":"風險管理","sources":[{"bank":"q545","n":70},{"bank":"rev1","n":53}]},{"id":71,"stem":"對信息安全風險評估要素理解正確的是：","options":["資產識別的粒度隨着評估範圍、評估目的的不同而不同，既可以是硬件設備，也可以是業務系統，也可以是組織機構","應針對構成信息系統的每個資產做風險評價","脆弱性識別是將信息系統安全現狀與國家或行業的安全要求做符合性比對而找出的差距項","信息系統面臨的安全威脅僅包括人為故意威脅、人為非故意威脅"],"answer":"A","category":"風險管理","sources":[{"bank":"q545","n":71},{"bank":"rev1","n":55}]},{"id":72,"stem":"以下哪一項不是建築物的自動化訪問審計系統記錄的日誌的內容：","options":["出入的原因","出入的時間","出入口的位置","是否成功進入"],"answer":"A","category":"風險管理","sources":[{"bank":"q545","n":72}]},{"id":73,"stem":"信息安全策略是管理層對信息安全工作意圖和方向的正式表述，以下哪一項不是信息安全策略文檔中必須包含的內容：","options":["說明信息安全對組織的重要程度","介紹需要符合的法律法規要求","信息安全技術產品的選型範圍","信息安全管理責任的定義"],"answer":"C","category":"工程與管理","sources":[{"bank":"q545","n":73}]},{"id":74,"stem":"作為信息中心的主任，你發現沒有足夠的人力資源保證將數據庫管理員和網絡管理員的崗位分配給兩個不同的人擔任，這種情況造成了一定的安全風險，這時你應當怎麼做？","options":["抱怨且無能為力","向上級報告該情況，等待增派人手","通過部署審計措施和定期審查來降低風險","由於增加人力會造成新的人力成本，所以接受該風險"],"answer":"C","category":"風險管理","sources":[{"bank":"q545","n":74}]},{"id":75,"stem":"以下人員中，誰負有決定信息分類級別的責任？","options":["用戶","數據所有者","審計員","安全員"],"answer":"B","category":"風險管理","sources":[{"bank":"q545","n":75}]},{"id":76,"stem":"某公司正在對一臺關鍵業務服務器進行風險評估：該服務器價值138000 元，針對某個特定威脅的暴露因子（EF）是45%，該威脅的年度發生率（ARO）為每10 年發生1 次。根據以上信息，該服務器的年度預期損失值（ALE）是多少？","options":["1800 元","62100 元","140000 元","6210 元"],"answer":"D","category":"風險管理","sources":[{"bank":"q545","n":76}]},{"id":77,"stem":"下列哪些內容應包含在信息系統戰略計劃中？","options":["已規劃的硬件採購的規範","將來業務目標的分析","開發項目的目標日期","信息系統不同的年度預算目標"],"answer":"B","category":"法規與標準","sources":[{"bank":"q545","n":77}]},{"id":78,"stem":"ISO27002中描述的11個信息安全管理控制領域不包括：","options":["信息安全組織","資產管理","內容安全","人力資源安全"],"answer":"C","category":"工程與管理","sources":[{"bank":"q545","n":78}]},{"id":79,"stem":"依據國家標準《信息安全技術信息系統災難恢復規範》（GB/T20988），需要備用場地但不要求部署備用數據處理設備的是災難恢復等級的第幾級？","options":["2","3","4","5"],"answer":"A","category":"應急與災難恢復","sources":[{"bank":"q545","n":79}]},{"id":80,"stem":"以下哪一種備份方式在恢復時間上最快？","options":["增量備份","差異備份","完全備份","磁盤鏡像"],"answer":"C","category":"應急與災難恢復","sources":[{"bank":"q545","n":80}]},{"id":81,"stem":"計算機應急響應小組的簡稱是？","options":["CERT(Computer Emergency Response Team)","FIRST","SANA","CEAT"],"answer":"A","category":"應急與災難恢復","sources":[{"bank":"q545","n":81}]},{"id":82,"stem":"有一些信息安全事件是由於信息系統中多個部分共同作用造成的，人們稱這類事件為“多組件事故”，應對這類安全事件最有效的方法是：","options":["配置網絡入侵檢測系統以檢測某些類型的違法或誤用行為","使用防病毒軟件，並且保持更新為最新的病毒特徵碼","將所有公共訪問的服務放在網絡非軍事區（DMZ）","使用集中的日誌審計工具和事件關聯分析軟件"],"answer":"D","category":"應急與災難恢復","sources":[{"bank":"q545","n":82}]},{"id":83,"stem":"依據國家標準《信息安全技術信息系統災難恢復範圍》（ GB/T20988），災難恢復管理過程的主要步驟是災難恢復需求分析、災難恢復策略制定、災難恢復策略實現、災難恢復預案制定和管理；其中災難恢復策略實現不包括以下哪一項？","options":["分析業務功能","選擇和建設災難備份中心","實現災備系統技術方案","實現災備系統技術支持和維護能力"],"answer":"A","category":"應急與災難恢復","sources":[{"bank":"q545","n":83}]},{"id":84,"stem":"拒絕服務攻擊導致的危害中，以下哪個說法是不正確的：","options":["網絡帶寬被耗盡，網絡被堵塞，無法訪問網絡","主機資源被耗盡，主機無法響應請求","應用資源被耗盡，應用無法響應請求","應用系統被破壞，應用無法響應請求"],"answer":"D","category":"網絡安全","sources":[{"bank":"q545","n":84}]},{"id":85,"stem":"SSE-CMM 將工程過程區域分為三類，即風險過程、工程過程、和保證過程，下面對於保證過程的說法錯誤的是：","options":["保證是指安全需求得到滿足的可信任程度","信任程度來自於對安全工程過程結果質量的判斷","驗證與證實安全的主要手段包括觀察、論證、分析和測試","PA“建立保證論據”為PA“驗證與證實安全”提供了證據支持"],"answer":"D","category":"工程與管理","sources":[{"bank":"q545","n":85}]},{"id":86,"stem":"根據SSE-CMM 信息安全工程過程可以劃分為三個階段，其中_______確立安全解決方案的置信度並且把這樣的置信度傳遞給顧客。","options":["保證過程","風險過程","工程和保證過程","安全工程過程"],"answer":"A","category":"工程與管理","sources":[{"bank":"q545","n":86}]},{"id":87,"stem":"SSE-CMM 工程過程區域中的風險過程包含哪些過程區域：","options":["評估威脅、評估脆弱性、評估影響","評估威脅、評估脆弱性、評估安全風險","評估威脅、評估脆弱性、評估影響、評估安全風險","評估威脅、評估脆弱性、評估影響、驗證和證實安全"],"answer":"C","category":"風險管理","sources":[{"bank":"q545","n":87},{"bank":"real","n":84}]},{"id":88,"stem":"一個組織的系統安全能力成熟度達到哪個級別以後，就可以對組織層面的過程進行規範的定義？","options":["2 級——計劃和跟蹤","3 級——充分定義","4 級——量化控制","5 級——持續改進"],"answer":"B","category":"工程與管理","sources":[{"bank":"q545","n":88}]},{"id":89,"stem":"信息系統安全工程（ISSE）的一個重要目標就是在IT 項目的各個階段充分考慮安全因素，在IT 項目的立項階段，以下哪一項不是必須進行的工作：","options":["明確業務對信息安全的要求","識別來自法律法規的安全要求","論證安全要求是否正確完善","通過測試證明系統的功能和性能可以滿足安全要求"],"answer":"D","category":"法規與標準","sources":[{"bank":"q545","n":89}]},{"id":90,"stem":"信息化建設和信息安全建設的關係應該是：","options":["信息化建設的結果就是信息安全建設的開始","信息化建設和信息安全建設應同步規劃、同步實施","信息化建設和信息安全建設是交替進行的，無法區分誰先誰後","以上說法都正確"],"answer":"B","category":"綜合","sources":[{"bank":"q545","n":90}]},{"id":91,"stem":"如果你作為甲方負責 訓和教育，是信息安全發展哪一個階段的特點？","options":["通信安全","計算機安全","信息安全","信息安全保障"],"answer":"D","category":"工程與管理","sources":[{"bank":"q545","n":505}]},{"id":495,"stem":"下列對於信息安全保障深度防禦模型的說法錯誤的是：","options":["信息安全外部環境：信息安全保障是組織機構安全，國家安全的一個總要組成部分，因此對信息安全的討論必須放在國家政策、法律法規和標準的外部環境制約下。","信息安全管理和工程：信息安全保障需要在整個組織機構內建立和完善信息安全管理體系，將信息安全管理綜合至信息系統的整個生命週期，在這個過程中，我們需要採用信息系統工程的方法來建設信息系統","信息安全人才體系：在組織機構中應建立完善的安全意識，培訓體系也是信息安全保障的重要組成部分。","信息安全技術方案：“從外而內，自下而上，形成邊界到端的防護能力”。"],"answer":"D","category":"工程與管理","sources":[{"bank":"q545","n":506},{"bank":"rev1","n":7}]},{"id":496,"stem":"在網絡通信中，一般用哪一類算法來保證機密性？","options":["對稱加密算法","消息認證碼算法","消息摘要算法","數字簽名算法"],"answer":"A","category":"密碼與加密","sources":[{"bank":"q545","n":507}]},{"id":497,"stem":"近代密碼學比古典密碼學本質上的進步是什麼？","options":["保密是基於密鑰而不是密碼算法","採用了非對稱密鑰算法","加密的效率大幅提升","虛擬專用網絡（VPN）的應用。"],"answer":"A","category":"密碼與加密","sources":[{"bank":"q545","n":508}]},{"id":498,"stem":"以下哪一種非對稱加密算法的速度最快？","options":["RSA","ECC","Blowfish","IDEA"],"answer":"B","category":"密碼與加密","sources":[{"bank":"q545","n":509}]},{"id":499,"stem":"在RSA 算法中，公鑰為PU=｛e，n｝，私鑰為PR=｛d，n｝，下列關於e，d，n，的說法正確的是。","options":["收發雙方均已知n","收發雙方均已知d","由e 和n 可以很容易地確定","只有接收方已知e"],"answer":"A","category":"密碼與加密","sources":[{"bank":"q545","n":510}]},{"id":500,"stem":"下列描述中，關於摘要算法描述錯誤的是","options":["消息摘要算法的主要特徵是運算過程不需要密鑰，只有輸入相同的明文數據經過相同的消息摘要算法才能得到相同的摘要。","消息摘要算法將一個隨機長度的信息生成一個固定長度的信息摘要","為了保證消息摘要算法安全，必須保證其密鑰不被攻擊方獲取，否則所加密的數據將被破解，造成信息泄密。","消息摘要算法的一個特點是：輸入任何微小的變動都將引起加密結果的很大改變。"],"answer":"C","category":"密碼與加密","sources":[{"bank":"q545","n":511}]},{"id":501,"stem":"以下哪一項是基於一個大的整數很難分解成兩個素數因數？","options":["橢圓曲線（ECC）","RSA","數據加密標準（DES）","Diffie-Hellman"],"answer":"B","category":"密碼與加密","sources":[{"bank":"q545","n":512}]},{"id":502,"stem":"目前對消息摘要算法（MD5），安全哈希算法（SHA1）的攻擊是指？","options":["能夠構造出兩個不同的消息，這兩個消息產生了相同的消息摘要。","對於一個已知的消息，能夠構造出一個不同的消息，這兩個消息產生了相同的消息摘要。","對於一個已知的消息摘要，能夠恢復其原始消息","對於一個已知的消息，能夠構造出一個不同的消息摘要，也能通過驗證。"],"answer":"A","category":"密碼與加密","sources":[{"bank":"q545","n":513}]},{"id":503,"stem":"以下哪一項不是工作在網絡 ons":["wep","wpa","wpa2","wapi"],"answer":"A","category":"法規與標準","sources":[{"bank":"real","n":32}]},{"id":560,"stem":"以下哪種方法不能有效提高WLAN 的安全性?","options":["修改默認的服務區標示符(SSID)","禁止SSID 廣播","啓用終端與AP 之間的雙向認證","啓用無線AP 的開放認證模式"],"answer":"D","category":"網絡安全","sources":[{"bank":"real","n":33}]},{"id":561,"stem":"以下哪個不是防火牆具備的功能?","options":["防火牆是指設置在不同網絡或網絡安全域 (公共網和企業內部網) 之間的一系列部件的組合","它是不同網絡(安全域)之間的唯一出入口","能根據企業的安全政策控制 (允許、拒絕、檢測)出入網絡的信息流","防止來源於內部的威脅和攻擊"],"answer":"D","category":"網絡安全","sources":[{"bank":"real","n":34}]},{"id":562,"stem":"以下哪一項不是應用層防火牆的特點?","options":["更有效的阻止應用層攻擊","工作在OSI 模型的第七層","速度快且對用戶透明","比較容易進行審計"],"answer":"C","category":"網絡安全","sources":[{"bank":"real","n":36}]},{"id":563,"stem":"哪一類防火牆具有根據傳輸信息的內容(如關鍵字、文件類 ) 來控制訪問連接的能力?","options":["包過濾防火牆","狀態檢測防火牆","應用網關防火牆","以上都不是"],"answer":"C","category":"網絡安全","sources":[{"bank":"real","n":37}]},{"id":564,"stem":"下面哪一項不是通用IDS 模型的組成部分:","options":["傳感器","過濾器","分析器","管理器"],"answer":"B","category":"工程與管理","sources":[{"bank":"real","n":38}]},{"id":565,"stem":"下面哪一項不是IDS 的主要功能?","options":["監控和分析用戶和系統活動","統計分析異常活動模式","對被破壞的數據進行修復","識別活動模式一反映已知攻擊"],"answer":"C","category":"網絡安全","sources":[{"bank":"real","n":39}]},{"id":566,"stem":"以下關於Linux 用戶和組的描述不正確的是:","options":["在Linux 中,每一個文件和程序都歸屬於一個特定的“用戶”","系統中的每一個用戶都必須至少屬於一個用戶組","用戶和組的關係可以多對一, 一個組可以有多個用戶, 一個用戶不能屬於多個組","Root 是系統的超級用戶,無論是否文件和程序的所有者都具有訪問權限"],"answer":"C","category":"操作系統與主機安全","sources":[{"bank":"real","n":41}]},{"id":567,"stem":"以下關於Linux 超級權限的說明,不正確的是:","options":["一般情況下,為了系統安全,對於一般常規基本的應用,不需要 root 用戶來操作完成","普通用戶可以通過su 和sudo 來獲得系統的超級權限","對系統日誌的管理,添加和刪除用戶等管理工作,必須以 root 用戶登錄才能進行","Root 是系統的超級用戶,無論會否為文件和程序的所有者都具有訪問權限"],"answer":"C","category":"操作系統與主機安全","sources":[{"bank":"real","n":42}]},{"id":568,"stem":"在windows 操作系統中,欲限制用戶無效登錄的次數,應當怎麼做?","options":["在“本地安全設置”中對“密碼策略”進行設置","在“本地安全設置”中對“賬戶鎖定策略”進行設置","在“本地安全設置”中對“審覈策略”進行設置","在“本地安全設置”中對“用戶權利指派”進行設置"],"answer":"B","category":"工程與管理","sources":[{"bank":"real","n":43}]},{"id":569,"stem":"以下對windows 系統日誌描述錯誤的是:","options":["windows 系統默認有三個日誌:系統日誌、應用程序日誌、安全日誌","系統日誌跟蹤各種各樣的系統時間, 例如跟蹤系統啓動過程中的事件或者硬件和控制器的故障","應用日誌跟蹤應用程序關聯的時間, 例如應用程序產生的裝載DLL (動態鏈接庫)失敗的信息","安全日誌跟蹤各類網絡入侵時間,例如拒絕服務攻擊,口令暴力破解"],"answer":"D","category":"操作系統與主機安全","sources":[{"bank":"real","n":44}]},{"id":570,"stem":"以下關於windows SAM安全賬號管理器的說法錯誤的是:","options":["安全賬號管理器(SAM)具體表現就是% systemRoot%\\system32\\config\\sam","安全賬號管理器(SAM)存儲的賬號信息是存儲在註冊表中","安全賬號管理器(SAM)存儲的賬號信息對 administrator 和 system 是可讀和可寫的","安全賬號管理器 (SAM)是windows 的用戶數據庫, 系統進程通過 security Accounts Manager 服務進行訪問和操作"],"answer":"C","category":"操作系統與主機安全","sources":[{"bank":"real","n":45}]},{"id":571,"stem":"數據庫事務日誌的用途是:","options":["事務處理","數據恢復","完整性約束","保密性控制"],"answer":"B","category":"安全模型與訪問控制","sources":[{"bank":"real","n":47}]},{"id":572,"stem":"攻擊者在遠程 WEB 頁面的 6>HTML 代碼中插入具有惡意目的的數據,用戶認為該頁面是可信賴的,但是當瀏覽器下載該頁面,嵌入其中的腳本將被解釋執行, 這是哪種類型的漏洞?","options":["緩衝區溢出","SQL 注入","設計錯誤","跨站腳本"],"answer":"D","category":"惡意代碼與漏洞","sources":[{"bank":"real","n":48}]},{"id":573,"stem":"通常在網站數據庫中,用戶信息中的密碼一項,是以哪種形式存在?","options":["明文形式存在","服務器加密後的密文形式存在","hash 運算後的消息摘要值存在","用戶自己加密後的密文形式存在"],"answer":"C","category":"密碼與加密","sources":[{"bank":"real","n":49}]},{"id":574,"stem":"下列對跨站腳本攻擊(XSS)的描述正確的是:","options":["XSS攻擊指的是惡意攻擊者往web頁面裏插入惡意代碼，當用戶瀏覽該頁之時，嵌入其中web裏面的代碼會被執行，從而達到惡意攻擊用戶的特殊目的","XSS攻擊是DDOS攻擊的一種變種","XSS攻擊就是CC攻擊","XSS攻擊就是利用被控制的機器不斷地向被攻擊網站發送訪問請求，迫使IIS連接數超出限制，當CPU資源或帶寬資源耗盡，那麼網站也就被攻擊垮了，從而達到攻擊目的"],"answer":"A","category":"惡意代碼與漏洞","sources":[{"bank":"real","n":50}]},{"id":575,"stem":"下列關於計算機病毒感染能力的說法不正確的是:","options":["能將自身代碼注入到引導區","能將自身代碼注入到扇區中的文件鏡像","能將自身代碼注入到文本文件中並執行","能將自身代碼注入到文檔或模板的宏中代碼"],"answer":"C","category":"惡意代碼與漏洞","sources":[{"bank":"real","n":52}]},{"id":576,"stem":"下列那一項不是信息安全漏洞的載體?","options":["網絡協議","操作系統","應用系統","業務數據"],"answer":"D","category":"網絡安全","sources":[{"bank":"real","n":53}]},{"id":577,"stem":"Smurf 利用下列哪種協議進行攻擊?","options":["ICMP","IGMP","TCP","UDP"],"answer":"A","category":"網絡安全","sources":[{"bank":"real","n":55}]},{"id":578,"stem":"如果一名攻擊者截獲了一個公鑰, 然後他將這個公鑰替換為自己的公鑰併發送給接收者,這種情況輸入哪一種攻擊?","options":["重放攻擊","Smurf 攻擊","字典攻擊","中間人攻擊"],"answer":"D","category":"密碼與加密","sources":[{"bank":"real","n":56}]},{"id":579,"stem":"以下那個攻擊步驟是IP 欺騙(IP Spoof) 系列攻擊中最關鍵和難度最高的?","options":["對被冒充的主機進行絕技服務攻擊,使其無法對目標主機進行響應","與目標主機進行會話,猜測目標主機的序號規則","冒充受信主機向目標主機發送數據包, 欺騙目標主機","向目標主機發送指令,進行會話操作"],"answer":"B","category":"網絡安全","sources":[{"bank":"real","n":57}]},{"id":580,"stem":"下列哪些措施,不是有效的緩衝區溢出的防護措施?","options":["使用標準的C 語言字符串庫進行操作","嚴格驗證輸入字符串長度","過濾不合規則的字符","使用第三方安全的字符串庫操作"],"answer":"A","category":"法規與標準","sources":[{"bank":"real","n":58}]},{"id":581,"stem":"下列那一項不屬於Puzz 測試的特性?","options":["主要針對軟件漏洞或可靠性錯誤進行測試","採用大量測試用例進行激勵-響應測試","一種試探性測試方法,沒有任何理論依據","利用構造畸形的輸入數據引發被測試目標產生異常"],"answer":"C","category":"惡意代碼與漏洞","sources":[{"bank":"real","n":59}]},{"id":582,"stem":"以下哪個不是軟件安全需求分析解決的主要任務?","options":["確定團隊負責人和安全顧問","威脅建模","定義安全和隱私需求(質量標準)","設立最低安全標準/Bug 欄"],"answer":"B","category":"法規與標準","sources":[{"bank":"real","n":60}]},{"id":583,"stem":"在PDCA 模型中,ACT(處置)環節的信息安全管理活動是:","options":["建立環境","實施風險處理計劃","持續的監視與評審風險","持續改進信息安全管理過程"],"answer":"D","category":"風險管理","sources":[{"bank":"real","n":63},{"bank":"rev3","n":21}]},{"id":584,"stem":"下述選項中對於“風險管理”的描述不正確的是:","options":["風險管理是知道和控制一個組織相關風險的協調活動,它通常包括風險評估、風險處置、風險接受和風險溝通","風險管理的目的是瞭解風險並採取措施處置風險並將風險消除","風險管理是信息安全工作的重要基礎,因此信息安全風險管理必須貫穿到信息安全保障工作、信息系統的整個生命週期。","在網絡與信息系統規劃設計階段, 應通過信息安全風險評估進一步明確安全需求和安全目標。"],"answer":"B","category":"風險管理","sources":[{"bank":"real","n":64}]},{"id":585,"stem":"風險評估主要包括風險分析準備、風險要素識別、風險分析和風險結果判定四個主要過程,關於這些過程,以下的說法哪一個是正確的?","options":["風險分析準備的內容是識別風險的影響和可能性","風險要素識別的內容是識別可能發生的安全事件對信息系統的影響程度","風險分析的內容是識別風險的影響和可能性","風險結果判定的內容是發現系統存在的威脅、脆弱性和控制措施"],"answer":"C","category":"風險管理","sources":[{"bank":"real","n":66}]},{"id":586,"stem":"下列哪一項準備地描述了脆弱性、威脅、影響和風險之間的關係?","options":["脆弱性增加了威脅,威脅利用了風險並導致了影響","風險引起了脆弱性並導致了影響,影響又引起了威脅","風險允許威脅利用脆弱性,並導致了影響","威脅利用脆弱性併產生影響的可能性稱為風險,影響是威脅已造成損害的實例"],"answer":"D","category":"風險管理","sources":[{"bank":"real","n":67}]},{"id":587,"stem":"管理者何時可以根據風險分析結果對已識別的風險不採取措施?","options":["當必須的安全對策的成本高出實際風險的可能造成的潛在費用時","當風險減輕方法提高業務生產力","當引起風險發生的情況不在部門控制範圍之內時","不可接受"],"answer":"A","category":"風險管理","sources":[{"bank":"real","n":68}]},{"id":588,"stem":"下列對風險分析方法的描述正確的是:","options":["定量分析對比定性分析方法使用的工具更多","定性分析比定量分析方法使用的工具更多","同一組織只使用使用一種方法進行評估","符合組織要求的風險評估方法就是最優方法"],"answer":"D","category":"風險管理","sources":[{"bank":"real","n":70}]},{"id":589,"stem":"下列哪種處置方法屬於轉移風險?","options":["部署綜合安全審計系統","對網絡行為進行實時監控","制訂完善的制度體系","聘用第三方專業公司提供維護外包服務"],"answer":"D","category":"風險管理","sources":[{"bank":"real","n":71}]},{"id":590,"stem":"下面關於ISO27002 的說法錯誤的是:","options":["ISO27002 的前身是ISO17799-1","ISO27002 給出了通常意義的信息安全管理最佳實踐供組織機構選用, 但不是全部","ISO27002 對於每個控制措施的表述分 “控制措施” 、 “實施指南” 和 “其它信息”三個部分來進行描述","ISO27002 提出了十一大類的安全管理措施, 其中風險評估和處置是出於核心地位的一類安全措施"],"answer":"D","category":"法規與標準","sources":[{"bank":"real","n":72}]},{"id":591,"stem":"某公司正在進行信息安全風險評估, 在決定信息資產的分類與分級時, 誰負最終責任?","options":["部門經理","高級管理層","信息資產所有者","最終用戶"],"answer":"C","category":"風險管理","sources":[{"bank":"real","n":73}]},{"id":592,"stem":"應當如何理解信息安全管理體系中的“信息安全策略”?","options":["為了達到如何保護標準而提出的一系列建議","為了定義訪問控制需求而產生出來的一些通用性指引","組織高層對信息安全工作意圖的正式表達","一種分階段的安全處理結果"],"answer":"C","category":"工程與管理","sources":[{"bank":"real","n":74}]},{"id":593,"stem":"以下關於“最小特權”安全管理原則理解正確的是:","options":["組織機構內的特敏崗位不能由一個人長期負責","對重要的工作進行分解,分配給不同人員完成","一個人有且僅有其執行崗位所足夠的許可和權限","防止員工由一個崗位變動到另一個崗位,累計越來越多的權限"],"answer":"C","category":"工程與管理","sources":[{"bank":"real","n":75}]},{"id":594,"stem":"作為一個組織的信息系統普通用戶,以下哪一項不是必須瞭解的?","options":["誰負責信息安全管理制度的制定和發佈","誰負責監督信息安全制度的執行","信息系統發生災難後,進行恢復的整體工作流程","如果違反了安全制度可能會受到懲戒措施"],"answer":"C","category":"工程與管理","sources":[{"bank":"real","n":76}]},{"id":595,"stem":"職責分離式信息安全管理的一個基本概念。其關鍵是權力不能過分集中在某一個人手中。職責分離的目的是確保沒有單獨的人員《單獨進行操作》可以對應用程序系統特徵或控制功能進行破壞。當以下哪一類人員訪問安全系統軟件的時候,會造成對“職責分離”原則的違背?","options":["數據安全管理員","數據安全分析員","系統審覈員","系統程序員"],"answer":"D","category":"工程與管理","sources":[{"bank":"real","n":77}]},{"id":596,"stem":"在國家標準《信息系統災難恢復規範》中, 根據____要素。將災難恢復等級劃分為___級。","options":["7,6","6,7","7,7","6,6"],"answer":"A","category":"應急與災難恢復","sources":[{"bank":"real","n":78}]},{"id":597,"stem":"災難發生後,系統和數據必須恢復到的_____為恢復點目標(RPO)。","options":["時間要求","時間點要求","數據狀態","運行狀態"],"answer":"B","category":"應急與災難恢復","sources":[{"bank":"real","n":79}]},{"id":598,"stem":"根據災難恢復演練的深度不同, 可以將演練分為三個級別, 這三個級別按演練深度由低到高的排序正確的是:","options":["系統級演練、業務級演練、應用級演練","系統級演練、應用級演練、業務級演練","業務級演練、應用級演練、系統級演練","業務級演練、系統級演練、應用級演練"],"answer":"B","category":"應急與災難恢復","sources":[{"bank":"real","n":80}]},{"id":599,"stem":"下面對能力程度模型解釋最準確的是:","options":["它認為組織的能力依賴於嚴格定義、管理完善、可測可挖的有效業務過程","它通過嚴格考察工程成果來判斷工程能力","它與統計過程控制理論的出發點不同、所以應用於不同領域","它是隨着信息安全的發展而誕生的重要概念"],"answer":"A","category":"工程與管理","sources":[{"bank":"real","n":81}]},{"id":600,"stem":"下面哪一項為系統安全工程能力成熟度模型提供了評估方法?","options":["ISSE","SSAM","SSR","CEM"],"answer":"B","category":"風險管理","sources":[{"bank":"real","n":82}]},{"id":601,"stem":"下面對於SSE-CMM 保證過程的說法錯誤的是:","options":["保證是指安全需求得到滿足的可信任度程度","信息程度來自於對安全工程結果質量的判斷","自驗證與證實安全的主要手段包括觀察、認證、分析和測試","PA“建立保證論據”為PA“驗證與證實安全”提供了證據支持"],"answer":"D","category":"法規與標準","sources":[{"bank":"real","n":83}]},{"id":602,"stem":"一個組織的系統安全能力成熟度達到哪個級別以後, 就可以考慮為過程域 (PA) 的實施提供充分的資源?","options":["2 級――計劃和跟蹤","3 級――充分定義","4 級――量化控制","充分定義"],"answer":"A","category":"風險管理","sources":[{"bank":"real","n":86}]},{"id":603,"stem":"信息系統安全工程(ISSE)的一個重要目標就是在 IT 項目的各個階段充分考慮安全因素,在IT 項目的立項階段,以下哪一項不是必須進行的工作:","options":["明確業務對信息安全的要求","識別來自法律法規的安全要求","論證安全要求是否正確完整","通過測試證明系統的功能和性能可以滿足安全要求"],"answer":"D","category":"法規與標準","sources":[{"bank":"real","n":88},{"bank":"rev1","n":77}]},{"id":604,"stem":"信息安全工程建立工程師不需要做的工作是:","options":["編寫驗收測試方案","審覈驗收測試方案","監督驗收測試過程","審覈驗收測試報告"],"answer":"A","category":"工程與管理","sources":[{"bank":"real","n":89}]},{"id":605,"stem":"下面哪一項是監理單位在招標階段質量控制的內容?","options":["協助建設單位提出工程需求,確定工程的整體質量目標","根據監理單位的信息安全保障知識和項目經驗完成招標文件中的技術需求部分","進行風險評估和需求分析完成招標文件中的技術需求部分","對標書應答的技術部分進行審覈,修改其中不滿足安全需求的內容"],"answer":"B","category":"工程與管理","sources":[{"bank":"real","n":90}]},{"id":606,"stem":"國際標準化組織ISO 下屬208 個技術委員會 (TCs),531 個分技術委員會 (SCs), 2378 個工作組(WGs),其中負責信息安全技術標準化的組織:","options":["ISO/IES","ISO/IEC JTC1","ISO/IEC JTC 1/SC27","ISO/IEC JTC 1/SC 37"],"answer":"C","category":"法規與標準","sources":[{"bank":"real","n":91}]},{"id":607,"stem":"以下對確定信息系統的安全保護等級理解正確的是:","options":["信息系統的安全保護等級是信息系統的客觀屬性","確定信息系統的安全保護等級時應考慮已採取或將採取的安全保護措施","確定信息系統的安全保護等級時應考慮風險評估的結果","確定信息系統的安全保護等級時應僅考慮業務信息的安全性"],"answer":"A","category":"風險管理","sources":[{"bank":"real","n":93}]},{"id":608,"stem":"以下哪一個關於信息安全評估的標準首先明確提出了保密性、完成性和可用性三項信息安全特徵?","options":["ITSEC","TCSEC","GB/T8387.2","彩虹系列的橙皮書"],"answer":"A","category":"法規與標準","sources":[{"bank":"real","n":95}]},{"id":609,"stem":"目前, 我國信息安全管理格局是一個多方 “齊抓共管” 的體制, 多頭管理現狀決定法出多門, 《計算機信息系統國際聯網保密管理規定》是由下列哪個部門所指定的規章制度?","options":["公安部","國家保密局","信息產業部","國家密碼管理委員會辦公室"],"answer":"B","category":"工程與管理","sources":[{"bank":"real","n":96}]},{"id":610,"stem":"下面有關我信息安全管理體制的說法錯誤的是:","options":["目前我國的信息安全保障工作是相關部門各司其職、相互配合、齊抓共管的局面","我國的信息安全保障工作綜合利用法律、管理和技術的手段","我國的信息安全管理應堅持檢測、快速響應、綜合治理的方針","我國對於信息安全責任的原則是誰主管、誰負責、誰經營、誰負責"],"answer":"C","category":"工程與管理","sources":[{"bank":"real","n":97}]},{"id":611,"stem":"以下哪一項不是我國與信息安全有關的國家法律?","options":["《信息安全等級保護管理辦法》","《中華人民共和國保守國家祕密法》","《中華人民共和國刑法》","《中華人員共和國安全法》"],"answer":"A","category":"法規與標準","sources":[{"bank":"real","n":98}]},{"id":612,"stem":"觸犯新刑法285 條規定的非法侵入計算機系統罪可判處________。","options":["三年以下有期徒刑或拘役","1000 員罰款","三年以上五年以下有期徒刑","10000 員罰款"],"answer":"A","category":"法規與標準","sources":[{"bank":"real","n":99}]},{"id":613,"stem":"以下哪一項不是IIS服務器支持的訪問控制過濾類型？","options":["網絡地址訪問控制","web服務器許可","NTFS許可","異常行為過濾"],"answer":"D","category":"操作系統與主機安全","sources":[{"bank":"q545","n":167}]},{"id":614,"stem":"以下哪種情形下最適合使用同步數據備份策略？","options":["對災難的承受能力高","恢復時間目標(RTO)長","恢復點目標(RPO)短","恢復點目標(RPO)長"],"answer":"C","category":"應急與災難恢復","sources":[{"bank":"q545","n":201}]},{"id":615,"stem":"各國在信息安全保障組織架構有兩種主要形式，一種是由一個部門集中管理國家信息安全相關工作，另一種是多個部門分別管理，同時加強協調工作。下列各國中，哪一個國家是採取多部門協調的做法：","options":["德國","法國","美國","以上國家都不是"],"answer":"C","category":"工程與管理","sources":[{"bank":"q545","n":211}]},{"id":616,"stem":"以下關於信息安全保障說法中哪一項不正確？","options":["信息安全保障是為了支撐業務高效穩定的運行","以安全促發展，在發展中求安全","信息安全保障不是持續性開展的活動","信息安全保障的實現，需要將信息安全技術與管理相結合"],"answer":"C","category":"工程與管理","sources":[{"bank":"q545","n":222}]},{"id":617,"stem":"我國信息系統安全等級保護工作環節依次是：","options":["定級-檢查-建設整改-等級測評-備案","等級測評-建設整改-監督檢查","定級-備案-建設整改-等級測評-監督檢查","定級-等級測評-備案-建設整改-監督檢查"],"answer":"C","category":"法規與標準","sources":[{"bank":"q545","n":335}]},{"id":618,"stem":"有一類IDS系統將所觀察到的活動同認為正常的活動進行比較並識別重要的偏差來發現入侵事件，這種機制稱作：","options":["異常檢測","特徵檢測","差距分析","比對分析"],"answer":"A","category":"網絡安全","sources":[{"bank":"real","n":40}]},{"id":619,"stem":"軟件存在漏洞和缺陷是不可避免的,實踐中常使用軟件缺陷密度(Defectm/KL0C)來衡量軟件的安全性,假設某大軟件共有296萬行源代碼,總共被檢測出145個缺陷,則可以計算出其軟件缺陷密度值是()","options":["0.00049","0.049","0.49","49"],"answer":"B","category":"惡意代碼與漏洞","sources":[{"bank":"ciseA","n":1},{"bank":"cisoB","n":48},{"bank":"rev2","n":45}]},{"id":620,"stem":"GB/T 18336《信息技術安全性評估準則》是測評標準類中的重要標準,該標準定義了保護輪期(Protection Profile.PP)和安全目標(Security Target.ST)的評估準則,提出了評估保證級(Evaluation Aanurane Level,EAL),其評估保證級共分為()個遞增的評估保證等級。","options":["4","5","6","7"],"answer":"D","category":"法規與標準","sources":[{"bank":"ciseA","n":2},{"bank":"rev3","n":73}]},{"id":621,"stem":"Gery McGraw博士及其合作者提出軟件安全應由三根支柱來支撐。這三個支柱是()","options":["源代碼審覈、風險分析和滲透測試","應用風險管理、軟件安全接觸點和安全知識","威脅建模、滲透測試和軟件安全接觸點","威脅建模、源代碼審覈和模糊測試"],"answer":"B","category":"風險管理","sources":[{"bank":"ciseA","n":3},{"bank":"rev3","n":79}]},{"id":622,"stem":"國際標準化組織(International Organization for Standardization.ISO)對信息安全的定義為( )","options":["保護信息和信息系續不被未經授權的訪問、使用、泄露、修改和破壞,為信息和信息系統提供保密性、完整性 可用性、可控性和不可否認性","信息安全,有時編寫為 InfoSec,是防止未經授權的訪網、使用、被露、中斷、修改、檢查、記錄成破壞信息的做法。它是一個可以用於任何形式數據(例如電子、物理)的通用術語","在既定的密級條件下,網絡與信息系統抵禦意外事件或惡意行為的能力,這些事件和行為將威脅所存儲或傳輸的數據以及經由這些網絡和系統所提供的服務的可用性、真實性、完整性和機密性","為數據處理系統建立和採取技術、管理的安全保護,保護計算機硬件、軟件、數據不因偶然的或惡意的原因而受到破壞、更改、泄露"],"answer":"D","category":"安全模型與訪問控制","sources":[{"bank":"ciseA","n":4}]},{"id":623,"stem":"對信息安全事件的分級參考下列三個要素:信息系統的重要程度、系統損失和社會影響。依據信息系統的重要程度對信息系統進行劃分,不屬於正確劃分級別的是()。","options":["特別重要信息系統","重要信息系統","一般信息系統","關鍵信息系統"],"answer":"D","category":"應急與災難恢復","sources":[{"bank":"ciseA","n":5},{"bank":"cisoB","n":75},{"bank":"rev2","n":63}]},{"id":624,"stem":"恢復時間目標(Recovery Time Objective , RTO)和恢復點目標(Recovery Point Objective, RPO)是業務連續性和災難恢復工作中的兩個重要指標,隨着信息系統越來越重要和信息技術越來越先進,這兩個指標的數值越來越小。小華準備為其工作的信息系統擬定RTO和RPO指標,則以下描述中。正確的是()。","options":["RTO 可以為0,RPO 也可以為0","RTO 可以為0,RPO 不可以為0","RTO 不可以為 0,RPO 可以為0","RTO 不可以為0,RPO 也不可以為0"],"answer":"A","category":"應急與災難恢復","sources":[{"bank":"ciseA","n":6},{"bank":"cisoB","n":67}]},{"id":625,"stem":"為了保障系統安全,某單位需要對其跨地區大型網絡實時應用系統進行滲透測試,以下關於滲透測試過程的說法不正確的是()。","options":["由於在實際滲透測試過程中存在不可預知的風險,所以測試前要提醒用戶進行系統和數據備份,以便出現問題時可以及時恢復系統和數據","滲透測試從“逆向”的角度出發,測試軟件系統的安全性,其價值在於可以測試軟件在實際系統中運行時的安全狀況","滲透測試應當經過方案制定、信息收集、漏洞利用、完成滲透測試報告等步驟","為了深入發掘該系統存在的安全威脅,應該在系統正常業務運行高峯期進行滲透測試"],"answer":"D","category":"應急與災難恢復","sources":[{"bank":"ciseA","n":7}]},{"id":626,"stem":"小李在檢查公司對外服務網站的源代碼時,發現程序在發生諸如沒有找到資源、數據庫連接錯誤、寫臨時文件錯誤等問題時,會將詳細的錯誤原因在結果頁面上顯示出來。從安全角度考慮,小李決定修改代碼,將詳細的錯誤原因都隱藏起來,在頁面上僅僅告知用戶“抱歉,發生內部錯誤!”。請問,這種處理方法的主要目的是()。","options":["避免緩衝區溢出","安全處理系統異常","安全使用臨時文件","最小化反饋信息"],"answer":"D","category":"操作系統與主機安全","sources":[{"bank":"ciseA","n":8},{"bank":"cisoB","n":9},{"bank":"rev6","n":37}]},{"id":627,"stem":"王工是某單位的系統管理員。他在某次參加了單位組織的風險管理工作時。根據任務安排。他依據已有的資產系表,逐個分析可能危害這些資產的主體、動機、途徑等多種因素,分析這些因素出現及造成損失的可能性大樂產為其賦值。請問,他這個工作屬於下面要一個階段的工作()","options":["資產識別並賦值","脆弱性識別並賦值","威脅識別並賦值","確認已有的安全措施並賦值"],"answer":"C","category":"風險管理","sources":[{"bank":"ciseA","n":9},{"bank":"cisoB","n":21}]},{"id":628,"stem":"2016年10月21日,美國東部地區發生大規模斷網事件,此次事件是由於美國主要 DNS 服務商 Dyn 遭遇大規模DDos 攻擊所致,影響規模驚人,對人們生產生活造成嚴重影響。DDoS 攻擊的主要目的是破壞系統的()","options":["保密性","可用性","不可否認性","抗抵賴性"],"answer":"B","category":"網絡安全","sources":[{"bank":"ciseA","n":10}]},{"id":629,"stem":"某社交網站的用戶點擊了該網站上的一個廣告。該廣告含有一個跨站腳本,會將他的瀏覽器定向到旅遊網文旅遊網站則了他的社交網絡信息。雖然該用戶沒有主動訪問該旅遊網站,但旅遊網站已經截獲了他的社交網信息(還有他的好友們的信息),於是犯罪分子便可以躲藏在社交網站的廣告後面,截獲用戶的個人信息寧。這種向 Web 頁面插入惡意html代碼的攻擊方式稱為()","options":["分佈式拒絕服務攻擊",",跨站腳本攻擊","SQL 注入攻擊","緩衝區溢出攻擊"],"answer":"B","category":"惡意代碼與漏洞","sources":[{"bank":"ciseA","n":11},{"bank":"cisoB","n":93},{"bank":"rev4","n":14}]},{"id":630,"stem":"有關能力成熟度模型(CMM),錯誤的理解是()。","options":["MM的思想不關注結果,而是強調了過程的控制,過程如果是高質量的,結果通常會是高質量的","MM 的思想來源於項目管理、質量管理和過程管理","MM 是一種衡量工程實施能力的方法,是一種面向工程過程的方法","MM是建立在統計過程控制理論基礎上的,它基於這樣一個假設,即“生產過程的高質量和在過程中組織實施的成熟性可以低成本地生產出高質量產品”"],"answer":"B","category":"工程與管理","sources":[{"bank":"ciseA","n":12}]},{"id":631,"stem":"操作系統用於管理計算機資源,控制整個系統運行,是計算機軟件的基礎。操作系統安全是計算、網絡及信息系統安全的基礎。一般操作系統都提供了相應的安全配置接口。小王新買了一臺計算機,開機後首先對自帶的 Windows 操作系統進行配置。他的主要操作有:(1)關團不必要的服務和端口;(2)在“本地安全策略”中配置賬號策略、本地策略、公鑰策略和 IP安全策略;(3)備份敏感文件,禁止建立空連接,下載最新補丁;(4)關閉審覈策略,開啓口令策略,開啓賬戶策略。這些操作中錯誤的是()。","options":["操作(1),應該關閉不必要的服務和所有端口","操作(2),在“本地安全策略”中不應該配置公鑰策略,而應該配置私鑰策略","操作(3),備份敏感文件會導致這些文件遭到竊取的幾率增加","操作(4),應該開啓審覈策略"],"answer":"D","category":"工程與管理","sources":[{"bank":"ciseA","n":13}]},{"id":632,"stem":"某集團公司根據業務需要,在各地分支機構部署前置機,為了保證安全,集團總部要求前置機開放日誌共享,由總部服務器採集進行集中分析,在運行過程中發現攻擊者也可通過共享從前置機中提取日誌,從而導致部分敏感信息泄露,根據降低攻擊面的原則,應採取以下哪項處理措施()","options":["由於共享導致了安全問題,應直接關閉日誌共享,禁止總部提取日誌進行分析","為配合總部的安全策略,會帶來一定的安全問題,但不影響系統使用,因此接受此風險","日誌的存在就是安全風險,最好的辦法就是取消日誌,通過設置讓前置機不記錄日誌","只允許特定的 IP 地址從前置機提取日誌,對日誌共享設置訪問密碼且限定訪問的時間"],"answer":"D","category":"風險管理","sources":[{"bank":"ciseA","n":14},{"bank":"cisoB","n":78},{"bank":"rev2","n":46}]},{"id":633,"stem":"北京某公司利用SSE-CMM對其自身工程隊伍能力進行自我改善,其理解正確的是()。","options":["系統安全工程能力成熟度模型(SSE-CMM)定義了6個能力級別,當工程隊伍不能執行一個過程域中的基本實踐時,該過程域的過程能力是0級","達到 SSE-CM 最高級以後,工程隊伍執行同一個過程,每次執行的結果質量必須相同","系統安全工程能力成熟度模型(SSE-CMM)定義了3個風險過程:評價威脅,評價脆弱性,評價影響","SSE-QM 強調系統安全工程與其他工程學科的區別性和獨立性"],"answer":"A","category":"工程與管理","sources":[{"bank":"ciseA","n":15},{"bank":"rev2","n":68}]},{"id":634,"stem":"由於 Internet 的安全問題日益突出,基於 TCP/IP協議,相關組織和專家在協議的不同層次設計了相應的安全通信協議,用來保障網絡各層次的安全。其中,屬於或依附於傳輸層的安全協議是()。","options":["PP2P","L2TP","SSL","IPSec"],"answer":"C","category":"網絡安全","sources":[{"bank":"ciseA","n":16},{"bank":"cisoB","n":3},{"bank":"rev4","n":32}]},{"id":635,"stem":",以下哪項的行為不屬於違反國家保密規定的行為()","options":["將涉密計算機、涉密存儲設備接入互聯網及其他公共信息網絡","通過普通郵政等無保密措施的渠道傳遞國家祕密載體","在私人交往中涉及國家祕密","以不正當手段獲取商業祕密"],"answer":"D","category":"網絡安全","sources":[{"bank":"ciseA","n":17},{"bank":"rev2","n":76}]},{"id":636,"stem":"關於計算機取證描述不正確的是()","options":["計算機取證是使用先進的技術和工具,按照標準規程全面地檢查計算機系統,以提取和保護有關計算機犯罪的相關證據的活動","取證的目的包括:通過證據查找策事者、通過證據推斷犯罪過程、通過證據判斷受害者損失程度及收集證據提供法律支持","電子證據是計算機系統運行過程中產生的各種信息記錄及存儲的電子化資料及物品。對於電子證據,取證工作主要圍繞兩方面進行:證據的獲取和證據的保護","計算機取證的過程可以分為準備、保護、提取、分析和提交5個步驟"],"answer":"C","category":"應急與災難恢復","sources":[{"bank":"ciseA","n":18},{"bank":"cisoB","n":17},{"bank":"rev6","n":5}]},{"id":637,"stem":",在某信息系統的設計中,用戶登錄過程是這樣的:(1)用戶通過 HTTP 協議訪問信息系統:(2)用戶在登錄頁面輸入用戶名和口令:(3)信息系統在服務器端檢查用戶名和密碼的正確性,如果正確,則鑑別完成。可以出,這個鑑別過程屬於()。","options":["單向鑑別","雙向鑑別","三向鑑別","第三方鑑別"],"answer":"A","category":"網絡安全","sources":[{"bank":"ciseA","n":19},{"bank":"cisoB","n":73},{"bank":"rev3","n":95},{"bank":"rev6","n":13}]},{"id":638,"stem":"以下關於檢查評估和自評估說法錯誤的是()。","options":["信息安全風險評估分自評估、檢查評估兩形式。應以檢查評估為主,自評估和檢查評估相互結合、互為補充","檢查評估可以依據相關標準的要求,實施完整的風險評估,也可以在自評估實施的基礎上,對關鍵環節或重點內容實施抽樣評估","信息安全風險評估應貫穿於網絡和信息系統建設運行的全過程","自評估只能由組織自身發起並實施,對信息系統及其管理進行風險評估活動"],"answer":"A","category":"風險管理","sources":[{"bank":"ciseA","n":20},{"bank":"cisoB","n":4}]},{"id":639,"stem":"風險,在 GB/T 22081 中定義為事態的概率及其結果的組合。風險的目標可能有很多不同的方面,如財務目標、健康和人身安全目標、信息安全目標和環境目標等;目標也可能有不同的級別,如戰略目標、組織目標、項目目標、產品目標和過程目標等。ISO/IEC TR 13335-1中揭示了風險各要素關係模型,如圖所示。請結合此圖,怎麼才能降低風險對組織產生的影響?()","options":["組織應該根據風險建立響應的保護要求,通過構架防護措施降低風險對組織產生的影響","加強防護措施,降低風險","減少威脅和脆弱點,降低風險","減少資產降低風險"],"answer":"A","category":"風險管理","sources":[{"bank":"ciseA","n":21},{"bank":"cisoB","n":82},{"bank":"rev5","n":64}]},{"id":640,"stem":"小張新購入了一臺安裝了Windows操作系統的筆記本電腦。為了提升操作系統的安全性,小張在Windows系統中的-本地安全策略中,配置了四類安全策略,賬號策略、本地策略、公份策略和IP安全策略。那麼該操作於操作系統安全配置內容中的()。","options":["關閉不必要的服務","關閉不必要的端口","制定安全策略","查看日誌記錄"],"answer":"C","category":"工程與管理","sources":[{"bank":"ciseA","n":22}]},{"id":641,"stem":"有關係統安全工程-能力成熟度模型(SSE-CM),錯誤的理解是()","options":["SSE-CMM 要求實施組織與其他組織相互作用,如開發方、產品供應商、集成商和諮詢服務商等","SSE-CMM 可以使安全工程成為一個確定的、成熟的和可度量的科目。","基於SSE-CMM的工程是獨立工程,與軟件工程、硬件工程、通信工程等分別規劃實施","SSE-CMM覆蓋整個組織的活動,包括管理、組織和工程活動等,而不僅僅是系統安全的工程活動"],"answer":"C","category":"工程與管理","sources":[{"bank":"ciseA","n":23},{"bank":"rev1","n":73}]},{"id":642,"stem":"關於 Wi-Fi聯盟提出的安全協議 WPA 和 WPA2 的區別,下面描述正確的是()。","options":["WPA是有線局域安全協議,而WPA2是無線局域網協議","WPA是適用於中國的無線局域安全協議,而WPA2是適用於全世界的無線局域網協議","WPA沒有使用密碼算法對接入進行認證,而WPA2使用了密碼算法對接入進行認證","WPA是依照802.11i標準草案制定的,而WPA2是依照802.11i正式標準制定的"],"answer":"D","category":"密碼與加密","sources":[{"bank":"ciseA","n":24},{"bank":"rev2","n":20}]},{"id":643,"stem":"二十世紀二十年代,德國發明家亞瑟謝爾比烏斯(Arthur Scherbius)發明了Enigma密碼機,按照密碼學發展歷史階段劃分,這個階段屬於()。","options":["古典密碼階段。這一階段的密碼專家常常靠直覺和技巧來設計密碼,而不是憑藉推理和證明,常用的密碼運算方法包括替代方法和置換方法","近代密碼發展階段。這一階段開始使用機械代替手工計算,形成了機械式密碼設備和更進一步的機電密碼設備","現代密碼學的早期發展階段。這一階段以香農的論文“保密系統的通信理論”(“The Communication Theory of Secret Systems”)為理論基礎,開始了對密碼學的科學探索","現代密碼學的近期發展階段。這一階段以公鑰密碼思想為標誌,引發了密碼學歷史上的革命性的變革,同時,衆多的密碼算法開始應用於非機密單位和商業場合"],"answer":"B","category":"密碼與加密","sources":[{"bank":"ciseA","n":25},{"bank":"rev6","n":45}]},{"id":644,"stem":"以下關於項目的含義,理解錯誤的是()。","options":["項目是為達到特定的目的、使用一定資源、在確定的期間內、為特定發起人而提供獨特的產品、服務或成果而進行的一次性努力","項目有明確的開始日期,結束日期由項目的領導者根據項目進度來隨機確定","項目資源指完成項目所需要的人、財、物等","項目目標要遵守 SMART 原則,即項目的目標要求具體(Specific)、可測量(Measurable)、需相關方的一致同意(Agree to)、現實(Realistic)、有一定的時限(Time-oriented)"],"answer":"B","category":"操作系統與主機安全","sources":[{"bank":"ciseA","n":26},{"bank":"cisoB","n":34},{"bank":"rev1","n":5}]},{"id":645,"stem":"以下關於Web傳輸協議、服務端和客戶端軟件的安全問題說法不正確的是()。","options":["HTTP 協議主要存在明文傳輸數據、弱驗證和缺乏狀態跟蹤等方面的安全問題","HTTP 協議缺乏有效的安全機制,易導致拒絕服務、電子欺騙、嗅探等攻擊","Cookie是為了辨別用戶身份,進行會話跟蹤而存儲在用戶本地終端上的數據,用戶可以隨意查看存儲在Cookie中的數據,但其中的內容不能被修改","針對 HTTP 協議存在的安全問題,使用 HTTPS 具有較高的安全性,可以通過證書來驗證服務器的身份,併為瀏覽器和服務器之間的通信加密"],"answer":"C","category":"網絡安全","sources":[{"bank":"ciseA","n":27}]},{"id":646,"stem":"小李在某單位是負責信息安全風險管理方面工作的部門領導,主要負責對所在行業的新人進行基本業務素質培訓.一次培訓的時候,小李主要負責講解風險評估方法.請問小李的所述論點中錯誤的是哪項()","options":["風險評估方法包括:定性風險分析、定量風險分析以及半定量風險分析","定性風險分析需要憑藉分析者的經驗和直覺或者業界的標準和慣例,因此具有隨意性","定量風險分析試圖在計算風險評估與成本效益分析期間收集的各個組成部分的具體數字值,因此更具客觀性","半定量風險分析技術主要指在風險分析過程中綜合使用定性和定量風險分析技術對風險要素的賦值方式,實現對風險各要素的度量數值化"],"answer":"B","category":"風險管理","sources":[{"bank":"ciseA","n":28},{"bank":"cisoB","n":31},{"bank":"rev3","n":39}]},{"id":647,"stem":"以下關於網絡安全設備說法正確的是()。","options":["防火牆既能實現內外網物理隔離,又能實現內外網邏輯隔離","安全隔離與信息交換系統也稱為網閘,需要信息交換時,同一時間可以和兩個不同安全級別的網絡連接","入侵檢測系統的主要作用是發現並報告系統中未授權或違反安全策略的行為","虛擬專用網是在公共網絡中。利用隧道技術,建立一個永久、安全的通信網絡"],"answer":"C","category":"網絡安全","sources":[{"bank":"ciseA","n":29}]},{"id":648,"stem":"若一個組織聲稱自己的ISMS符合IS0/IEC 27001或GB/T 22080標準要求,其信息安全控制措施通常需要在資產管理方面實施常規控制,資產管理包含對資產負責和信息分類兩個控制目標。信息分類控制的目標是為了確保信息受到適當級別的保護,通常採取以下哪項控制措施()","options":["資產清單","資產責任人","資產的可接受使用","分類指南、信息的標記和處理"],"answer":"D","category":"風險管理","sources":[{"bank":"ciseA","n":30},{"bank":"cisoB","n":55},{"bank":"rev6","n":11}]},{"id":649,"stem":"具有行政法律責任強制力的安全管理規定和安全制度包括()\n(1)安全事件(事故)制度2)安全等級保護制度(3)信息系統安全監控(4)安全專用產品銷許可證制度","options":["1,2,4","2,3","2,3,4","1,2,3"],"answer":"A","category":"工程與管理","sources":[{"bank":"ciseA","n":31},{"bank":"cisoB","n":19},{"bank":"rev2","n":77}]},{"id":650,"stem":"安全專用產品銷售許可證制度是對銷售安全專用產品的企業進行管理,確保產品質量,保障信息安全,具有行政法律責任強制力。\n安全事件(事故)制度用於規範安全事件的處理流程、責任追究等,具有行政法律責任強制力。\n信息系統安全監控主要是對信息系統運行狀態的監測,本身不屬於具有行政法律責任強制力的制度。所以選A。\n32.老王是一名企業信息化負責人,由於企業員工在瀏覽網頁時總導致病毒感染系統,為了解決這一問題,老王求信息安全員給出解決措施,信息安全員給出了四條措施建議,老王根據多年的信息安全管理經驗,認為其中不太適合推廣,你認為是哪條措施()","options":["採購防病毒網關並部署在企業互聯網出口中,實現對所有瀏覽網頁進行檢測,阻止網頁中的病毒進入內網","採購並統一部署企業防病毒軟件,信息化管理部門統一進行病毒庫升級,確保每臺計算機都具備有效的病毒檢測和查殺能力","制定制度禁止使用微軟的 IE 瀏覽器上網,統一要求使用 Chrome 瀏覽器","組織對員工進行一次上網行為安全培訓,提高企業員工在互聯網瀏覽時的安全意識"],"answer":"C","category":"工程與管理","sources":[{"bank":"ciseA","n":32}]},{"id":651,"stem":"關於信息安全管理體系(Information Security Management Systems,ISMS),下面描述錯誤的是()。","options":["信息安全管理體系是組織在整體或特定範圍內建立信息安全方針和目標,以及完成這些目標所用方法的體系,包括組織架構、方針、活動、職責及相關實踐要素","管理體系(Management Systems)是為達到組織目標的策略、程序、指南和相關資源的框架,信息安全管理體系是管理體系思想和方法在信息安全領域的應用","概念上,信息安全管理體系有廣義和狹義之分,狹義的信息安全管理體系是指按照 IS027001 標準定義的管理體系,它是一個組織整體管理體系的組成部分","同其他管理體系一樣,信息安全管理體系也要建立信息安全管理組織機構、健全信息安全管理制度、構建信息安全技術防護體系和加強人員的安全意識等內容"],"answer":"D","category":"工程與管理","sources":[{"bank":"ciseA","n":33},{"bank":"cisoB","n":58},{"bank":"rev3","n":83}]},{"id":652,"stem":"Kerberos 協議是一種集中訪問控制協議,它能在複雜的網絡環境中,為用戶提供安全的單點登錄服務。單點登錄是指用戶在網絡中進行一次身份認證,便可以訪問其授權的所有網絡資源,而不再需要其他的身份認證過程,實質是消息M在多個應用系統之間的傳遞或共享.其中消息M 是指以下選項中的()。","options":["安全憑證","用戶名","加密密鑰","會話密鑰"],"answer":"A","category":"網絡安全","sources":[{"bank":"ciseA","n":34},{"bank":"rev4","n":21}]},{"id":653,"stem":"下列我國哪一個政策性文件明確了我國信息安全保障工作的方針和總體要求以及加強信息安全保障工作的主要原則()","options":["《關於加強政府信息系統安全和保密管理工作的通知》","《中華人民共和國計算機信息系統安全保護條例》","《國家信息化領導小組關於加強信息安全保障工作的意見》","《關於開展信息安全風險評估工作的意見》"],"answer":"C","category":"工程與管理","sources":[{"bank":"ciseA","n":35},{"bank":"rev1","n":95}]},{"id":654,"stem":"以下關於威脅建模流程步驟說法不正確的是()。","options":["威脅建模主要流程包括四步:確定建模對象、識別威脅、評估威脅和消減威脅","評估威脅是對威脅進行分析,評估被利用和攻擊發生的概率,瞭解被攻擊後資產的受損後果,並計算風險","消減威脅是根據威脅的評估結果,確定是否要消除該威脅以及消減的技術措施,可以通過重新設計直接消除威脅,或設計採用技術手段來消減威脅","識別威脅是發現組件或進程存在的威脅,它可能是惡意的,也可能不是惡意的,威脅就是漏洞"],"answer":"D","category":"風險管理","sources":[{"bank":"ciseA","n":36}]},{"id":655,"stem":"某商貿公司信息安全管理員考慮到信息系統對業務影響越來越重要,計劃編制本單位信息安全應急響應預案在向主管領導寫報告時,他列舉了編制信息安全應急響應預案的好處和重要性,在他羅列的四條理由中,其中不適合為理由的一條是()","options":["應急預案是明確關鍵業務系統信息安全應急響應相揮體系和工作機制的重要方式","應預案是提高應對網絡和信息系統突發事件能力,減少突發事件造成的損失和危害,保障信息系統運行平穩、安全、有序、高效的手段","編制應急預案是國家網絡安全法對所有單位的強制要求,因此必須建設","應急預案是保障單位業務系統信息安全的重要措施"],"answer":"C","category":"應急與災難恢復","sources":[{"bank":"ciseA","n":37},{"bank":"rev5","n":60}]},{"id":656,"stem":"ISO 9001-2000標準鼓勵在制定、實施質量管理體系以及改進其有效性時採用過程方法,通過滿足顧客要求增進顧客滿意。下圖是關於過程方法的示意圖,圖中括號空白處應填寫( )。","options":["策略","管理者","組織","活動"],"answer":"D","category":"工程與管理","sources":[{"bank":"ciseA","n":38},{"bank":"cisoB","n":100},{"bank":"rev4","n":37}]},{"id":657,"stem":"在某次信息安全應急響應過程中,小王正在實施如下措施:消除或阻斷攻擊源、找到並消除系統的脆弱性/漏洞、修改安全策略、加強防範措施、格式化被感染惡意程序的介質等。請問,按照PDCERF應急響應方法,這些工作應處於以下哪個階段( )","options":["準備階段","檢測階段","遏制階段","根除階段"],"answer":"D","category":"應急與災難恢復","sources":[{"bank":"ciseA","n":39},{"bank":"cisoB","n":56},{"bank":"rev2","n":61},{"bank":"rev4","n":51}]},{"id":658,"stem":"檢測階段是發現信息安全事件的發生,確定事件的性質和範圍。\n遏制階段是採取措施阻止事件的進一步擴散和惡化,如隔離受感染的系統等。\n根除階段是消除或阻斷攻擊源、找到並消除系統的脆弱性/漏洞、修改安全策略、加強防範措施、格式化被感染惡意程序的介質等,目的是徹底解決安全問題,防止事件再次發生。所以這些工作處於根除階段。\n40. Kerberos 協議是常用的集中訪問控制協議,通過可信第三方的認證服務,減輕應用服務器的負擔。Kerberos 的運行環境由密鑰分發中心(KDC)、應用服務器和客戶端三個部分組成。其中,KDC 分為認證服務器 AS 和票據授權服務器TGS兩部分。下圖展示了 Kerberos 協議的三個階段,分別為(1)Kerberos 獲得服務許可票據,(2) Kerberos 獲得服務,(3)Kerberos 獲得票據許可票據。下列選項中,對這三個階段的排序正確的是()。","options":["(1)-(2)-(3)","(3)-(2)一(1)","(2)-(1)一(3)","(3)一(1)一(2)"],"answer":"D","category":"網絡安全","sources":[{"bank":"ciseA","n":40}]},{"id":659,"stem":"關於對信息安全事件進行分類分級管理的原因描述不正確的是().","options":["信息安全事件的種類很多,產重程度也不盡相同,其響應和處理方式也應各不相同","對信息安全事件進行分類和分級管理,是有效防範和響應信息安全事件的基礎","能夠使事前準備、事中應對和事後處理的各項相關工作更具針對性和有效性","我國早期的計算機安全事件的應急響應工作主要包括計算機病毒防範和“千年蟲”問題的解決,關於網絡安全應急響應的起步最早"],"answer":"D","category":"應急與災難恢復","sources":[{"bank":"ciseA","n":41}]},{"id":660,"stem":"某集團公司信息安全管理員根據領導安排制定了下一年度的培訓工作計劃,提出了四大培訓任務和目標,關於這四個培訓任務和目標,作為主管領導,以下選項中不合理的是()","options":["由於網絡安全上升到國家安全的高度,網絡安全必須得到足夠的重視。因此安排了對集團公司下屬單位的總經理(一把手)的網絡安全法培訓","對下級單位的網絡安全管理崗人員實施全面安全培訓,建議通過CISP 培訓以確保人員能力得到保障","對其他信息化相關人員(網絡管理員、軟件開發人員)也進行安全基礎培訓,使相關人員對網絡安全有所瞭解","對全體員工安排信息安全意識及基礎安全知識培訓,實現全員信息安全意識教育"],"answer":"C","category":"工程與管理","sources":[{"bank":"ciseA","n":42},{"bank":"cisoB","n":22},{"bank":"rev3","n":92},{"bank":"rev5","n":78}]},{"id":661,"stem":"金女士經常通過計算機在互聯網上購物,從安全角度看,下面哪項是不好的操作習慣()","options":["使用專用上網購物用計算機,安裝好軟件後不要對該計算機上的系統軟件、應用軟件進行升級","為計算機安裝具有良好聲譽的安全防護軟件,包括病毒查殺、安全檢查和安全加固方面的軟件","在 IE 的配置中,設置只能下載和安裝經過簽名的、安全的ActiveX 控件","在使用網絡瀏覽器時,設置不在計算機中保留網絡歷史記錄和表單數據"],"answer":"A","category":"工程與管理","sources":[{"bank":"ciseA","n":43}]},{"id":662,"stem":"在國家標準 GB/T 20274.1-2006《信息安全技術信息系統安全保障評估框架第一部分:簡介和一般模型》中,信息系統安全保障模型包含哪幾個方面?()","options":["保障要素、生命週期和運行維護","保障要素、生命週期和安全特徵","規劃組織、生命週期和安全特徵","規劃組織、生命週期和運行維護"],"answer":"B","category":"工程與管理","sources":[{"bank":"ciseA","n":44},{"bank":"cisoB","n":39},{"bank":"rev5","n":14},{"bank":"rev6","n":9}]},{"id":663,"stem":"某信息安全公司的團隊對某款名為“紅包快搶”的外掛進行分析,發現此外掛是一個典型的木馬後門,使黑客能夠獲得受害者電腦的訪問權。該後門程序為了達到長期駐留在受害者的計算機中,通過修改註冊表啓動項來達到後門程序隨受害者計算機系統啓動而啓動。為防範此類木馬後門的攻擊,以下做法無用的是()。","options":["不下載、不執行、不接收來歷不明的軟件或文件","修改用戶名和口令","不隨意打開來歷不明的郵件,不瀏覽不健康不正規的網站","安裝反病毒軟件和防火牆,安裝專門的木馬防治軟件"],"answer":"B","category":"惡意代碼與漏洞","sources":[{"bank":"ciseA","n":45},{"bank":"cisoB","n":81},{"bank":"rev4","n":18}]},{"id":664,"stem":"若一個組織聲稱自己的ISMS符合ISO/IEC27001或GB/T 22080標準要求,其信息安全控制措施通常需要在物理和環境安全方面實施常規控制。物理和環境安全領域包括安全區域和設備安全兩個控制目標。安全區域的控制目標是防止對組織場所和信息的未授權物理訪問、損壞和干擾,關鍵或敏感的信息及信息處理設施應放在安全區域內,並受到相應保護,該目標可以通過以下控制措施來實現,不包括哪一項()","options":["物理安全邊界、物理入口控制","辦公室、房間和設施的安全保護,外部和環境威脅的安全防護","通信安全、合規性","在安全區域工作,公共訪問、交接區安全"],"answer":"C","category":"物理與環境安全","sources":[{"bank":"ciseA","n":46},{"bank":"cisoB","n":6},{"bank":"rev4","n":22}]},{"id":665,"stem":"常見的訪問控制模型包括自主訪問控制模型、強制訪問控制模型和基於角色的訪問控制模型等。下面描述中錯誤的是()。","options":["從安全性等級來看,這三個模型安全性從低到高的排序是自主訪問控制模型、強制訪問控制模型和基於角色的訪問控制模型","自主訪問控制是一種廣泛應用的方法,資源的所有者(往往也是創建者)可以規定誰有權訪問它們的資源,具有較好的易用性和可擴展性","強制訪問控制模型要求主體和客體都有一個固定的安全屬性,系統用該安全屬性來決定一個主體是否可以訪問某個客體。該模型具有一定的抗惡意程序攻擊能力,適用於專用或安全性要求較高的系統","基於角色的訪問控制模型的基本思想是根據用戶所擔任的角色來決定用戶在系統中的訪問權限,該模型便於實施授權管理和安全約束,容易實現最小特權、職責分離等各種安全策略"],"answer":"A","category":"工程與管理","sources":[{"bank":"ciseA","n":47}]},{"id":666,"stem":"PDCA循環又叫戴明環,是管理學常用的一種模型。關於PDCA四個字母,下面理解錯誤的是()。","options":["P是Prepare,指準備,包括明確對象、方法,制定活動規劃","是Do,指實施、月體運作,實現計劃中的內容","是Check,指檢查、總結執行計劃的結果,明確效果,找出問題","是Act或Adjut.指改進、完善和處理,對總結檢查的結果進行處理。對成功的經驗加以肯定,並予以標準化,總結失敗的教訓並加以重視,對沒有解決的問題,應該交給下一個 PDCA 環解決"],"answer":"A","category":"密碼與加密","sources":[{"bank":"ciseA","n":48}]},{"id":667,"stem":"小華在某電子商務公司工作。某天他在查看信息系統設計文檔時,發現其中標註該信息系統的 RPO(恢復點目標)指標為3小時,請同這意味着()。","options":["該信息系統發生重大信息安全事件後,工作人員應在3小時內到位,完成問題定位和應急處理工作","該信息系統發生重大信息安全事件後,工作人員應在3小時內完成應急處理工作,並恢復對外運行","若該信總系統發生重大信息安全事件,工作人員在完成處置和災難恢復工作後,系統至多能丟失3小時的業務類","若該信息系統發生重大信息安全事件,工作人員在完成處置和災難恢復工作後,系統運行3小時後能恢復全部數"],"answer":"C","category":"應急與災難恢復","sources":[{"bank":"ciseA","n":49},{"bank":"cisoB","n":95}]},{"id":668,"stem":"隨機進程名稱是惡意代碼迷惑管理員和系統安全檢查人員的技術手段之一,以下對於隨機進程名技術。描述正確的是()。","options":["隨機進程名技術雖然每次進程名都是隨機的,但是隻要找到了進程名稱,就找到了惡意代碼程序本身","惡意代碼生成隨機進程名稱的目的是使進程名稱不固定,因為殺毒軟件是按進程名稱進行病毒進程查殺,","惡意代碼使用隨機進程名是通過生成特定格式的進程名稱,使進程管理器中看不到惡意代碼的進程","隨機進程名技術每次啓動時隨機生成惡意代碼進程名稱,通過不確定的進程名稱使自己不容易被發現真實的惡意代碼程序名稱。"],"answer":"D","category":"惡意代碼與漏洞","sources":[{"bank":"ciseA","n":50},{"bank":"cisoB","n":69},{"bank":"rev6","n":14}]},{"id":669,"stem":"小王在學為定最風險評站方法後,快定試着為單位機房計算火災的風險大小、假設單位機房的總價值為 400萬元人民幣、桑露係數(Exposure Factor,6F)是 25%,年度發生率(Annualined Rate of Oecurrence, ARO)為0.2、那麼小王計算的年度預期損失(Annualined Loss xpectancy, ALE)應該是()","options":["100 萬元人民幣","400 萬元人民幣","20 萬元人民幣","180 萬元人民幣"],"answer":"C","category":"惡意代碼與漏洞","sources":[{"bank":"ciseA","n":51}]},{"id":670,"stem":"應急響應是信息安全事件管理的重要內容、基於應急響應工作的特點和事件的不規則性,事先制定出事件應急響應方法和過程,有助於一個組織在事件發生時院止混亂的發生成是在混配狀態中迅速恢復控制,將損失和負面影響降到最低,應急響應方法和過程並不是唯一的,一種被廣為按受的應急響應方法是將應急響應管理過程分為6個階段,為準備>檢測>送制>根除>恢復>跟蹤>總結,請問下列說法有關於信息安全應急響應管理過程錯誤的是","options":["確定重要資產和風險,實施針對風險的防護措施是信息安全應想響應規劃過程中最關健的步理","在檢測階段,首先要進行監測、報告及信息收集","遏制措施可能會因為事件的類別和級別不同而完全不同。常見的遏制措施有:完全關閉所有系統、拔掉網線等","應按照應急響應計劃中事先制定的業務恢復優先順序和恢復步驟,順次恢複相關的系統"],"answer":"C","category":"應急與災難恢復","sources":[{"bank":"ciseA","n":52},{"bank":"rev3","n":93}]},{"id":671,"stem":"某購物網站開發項目經過需求分析進入系統設計階段,為了保證用戶帳戶的安全,項目開發人員決定用戶登錄時除了用戶名口令認證方式外,還加入基於數字證書的身份認證功能,同時用戶口令使用 SHA-1 算法加密後存放在後臺數據庫中,請問以上安全設計遵循的是哪項安全設計原則()","options":["最小特權原則","職責分離原則織","深防禦原則","最少共享機制原則"],"answer":"C","category":"密碼與加密","sources":[{"bank":"ciseA","n":53},{"bank":"rev3","n":61}]},{"id":672,"stem":"在信息安全險管理過程中,背景建立是實施工作的第一步、下面哪項理解是錯誤的().","options":["背景建立的依據是國家、地區或行業的相關政策、法律、法規和標準,以及機構的使命、信息系統的業務目標和特性","背景建立階段應識別需要保護的資產、面臨的威脅以及存在的脆弱性,並分別賦值,同時確認已有的安全措施,形成需要保護的資產清單","背景建立階段應調查信息系統的業務目標、業務特性、管理特性和技術特性,形成信息系統的描述報告求報告","背景建立階段應分析信息系統的體系結構和關健要索,分析信息系統的安全環境和要求,形成信息系統的安全要"],"answer":"B","category":"法規與標準","sources":[{"bank":"ciseA","n":54},{"bank":"cisoB","n":62}]},{"id":673,"stem":"超文本傳輸協議(HyperText Transfer Protocol,HTTP)是互聯網上廣泛使用的一種網絡協議。下面哪種協議基於 HTIP 並結合 SSL 協議,具各用戶鑑別和通信數據加密等功能()、","options":["HTTP 1.0 協議","HTTP 1.1協議","HTTPS 協議","HTTPD 協議"],"answer":"C","category":"網絡安全","sources":[{"bank":"ciseA","n":55}]},{"id":674,"stem":"“統一威脅管理”是將防病毒、入侵檢測和防火牆等安全需求統一管理,目前市場上已經出現了多種此類安全設備,這裏“統一威脅管理”常常被簡稱為()。","options":["UTM","FW","IDS","SOC"],"answer":"A","category":"網絡安全","sources":[{"bank":"ciseA","n":56},{"bank":"rev3","n":77}]},{"id":675,"stem":"以下關於Windows操作系統身份標識與籤別,說法不正確的是().","options":["本地安全授權機構(LSA)生成用戶賬戶在該系統內唯一的安全標識符(SID)","用戶對鑑別信息的操作,如更改密碼等都通過一個以Administrator權限運行的服務“Security Account Manager”來實現","Windows 操作系統遠程登錄經歷了 SMB 籤別機制、LM籤別機制、NTLM鑑別機制、Kerberos 籤別體系等階段","完整的安全標識符(SID)包括用戶和組的安全描述,48比特的身份特權、修訂版本和可變的驗證值"],"answer":"B","category":"操作系統與主機安全","sources":[{"bank":"ciseA","n":57},{"bank":"cisoB","n":5}]},{"id":676,"stem":"王工是某單位的系統管理員,他在某次參加了單位組織的風險管理工作時,發現當前案例中共有兩個重要資產:資產A1和資產 2:其中資產A1面臨兩個主要威脅:威脅T1和威脅 T2;而資產 A2 面臨一個主要脅:威脅 T3:威脅 T1 可以利用的資產A1存在的兩個脆弱性:脆弱性 V1和脆弱性V2:威脅T2可以利用的資產A1存在的三個脆弱性,脆弱性 V3、脆弱性 V4和脆弱性 V5:威脅 T3 可以利用的資產 A2存在的兩個脆性:脆弱性V6和脆弱性 V7. 根據上述條件,請問:使用相乘法時,應該為資產 A1 計算幾個風險值()","options":["2","3","5","6"],"answer":"C","category":"風險管理","sources":[{"bank":"ciseA","n":58},{"bank":"rev6","n":26}]},{"id":677,"stem":"以下有關系統工程說法錯誤的是()。","options":["系統工程不屬於基本理論,也不屬於技術基礎,它研究的重點是方法論","系統工程的目的是實現總體效果最優化,即從複雜問題的總體入手,認為總體大於各部分之和,各部分雖然存在不足,但總體可以優化","系統工程只需使用定量分析的方法,通過建立實際對象的數學模型,應用合適的優化算法對模型求解,解決實際問題","霍爾三維結構將系統工程整個活動過程分為前後緊密銜接的7個階段和7個步驟"],"answer":"C","category":"工程與管理","sources":[{"bank":"ciseA","n":59},{"bank":"cisoB","n":90}]},{"id":678,"stem":"某單位根據業務需要準備立項開發一個業務軟件,對於軟件開發安全投入經費研討時開發部門和信息中心就發生了分歧,開發部門認為開發階段無需投入,軟件開發完成後發現問題後再針對性的解決,比前期安全投入要成本更低;信息中心則認為應在軟件安全開發階段投入,後期解決代價太大,雙方爭執不下,作為信息安全專家,請選擇對軟件開發安全投入的準確說法()","options":["雙方的說法都正確,需要根據具體情況分析是開發階段投入解決問題還是在上線後再解決問題費用更低","雙方的說法都錯誤,軟件安全問題在任何時候投入解決都可以,只要是一樣的問題,解決的代價相同","信息中心的考慮是正確的,在軟件開發需求分析階段開始考慮安全問題,總體經費投入比軟件運行後的費用要低","軟件開發部門的說法是正確的,因為軟件出現安全問題後更清楚問題所在,安排人員進行代碼修訂更簡單,因此費用更低"],"answer":"C","category":"工程與管理","sources":[{"bank":"ciseA","n":60}]},{"id":679,"stem":"某單位門戶網站開發完成後,測試人員使用模糊測試進行安全性測試,以下關於模糊測試過程的說法正確的是()","options":["模擬正常用戶輸入行為,生成大量數據包作為測試用例","數據處理點、數據通道的入口點和可信邊界點往往不是測試對象","監測和記錄輸入數據後程序正常運行的情況","深入分析網站測試過程中產生崩潰或異常的原因,必要時需要測試人員手工重現並分析"],"answer":"D","category":"工程與管理","sources":[{"bank":"ciseA","n":61},{"bank":"rev2","n":18}]},{"id":680,"stem":"我國等級保護政策發展的正確順序是()。\n1等級保護相關政策文件頒佈\n2計算機系統安全保護等級劃分思想提出\n3等級保護相關標準發佈\n4網絡安全法將等級保護制度作為基本國策\n5等級保護工作試點","options":["12345","23154","25134","12435"],"answer":"C","category":"法規與標準","sources":[{"bank":"ciseA","n":62}]},{"id":681,"stem":"《國家信息化領等小組關於加強信息安全保障工作的意見》(中辦發[2003]27號)明確了我國信息安全保障工作的()、加強信息安全保障工作的()、需要重點加強的信息安全保障工作。27號文的重大意義是,它標誌着我國信息安全保障工作有了、我國最近十餘年的信息安全保障工作都是圍繞此政策性文件來()的、促進了我國()的各項工作。","options":["方針;主要原則;總體綱領;展開和推進;信息安全保障建設總體要求;","總體要求;主要原則;展開;信息安全保障建設;","方針和總體要求;主要原則;總體綱領;展開和推進;信息安全保障建設;","總體要求;主要原則;總體綱領;展開;信息安全保建設;"],"answer":"C","category":"工程與管理","sources":[{"bank":"ciseA","n":63}]},{"id":682,"stem":"Linux系統的安全設置主要從磁盤分區、賬戶安全設置、禁用危險服務、遠程登錄安全、用戶鑑別安全、審計策略、保護root 賬戶、使用網絡防火牆和文件權限操作共10個方面來完成。小張在學習了Linux 系統安全的相關知識後,分試為自己計算機上的 Linux 系統進行安全配置。下列選項是他的部分操作,其中不合理的是()。","options":["編輯文件/etc/passwd,檢查文件中用戶ID,禁用所有用戶ID=0的用戶","編輯文件/etc/ssh/sshd_config,將PermitRootLogin 設置為 no","編輯文件/ete/pam.d/systemauth,設置auth required pam_tally.so onerrufail deny 6 unlock_time=300","編輯文件/etc /profile,設置TMOUT=600"],"answer":"A","category":"操作系統與主機安全","sources":[{"bank":"ciseA","n":64}]},{"id":683,"stem":"某單位在一次信息安全風險管理活動中,風險評估報告提出服務器的 FIP 服務存在高風險漏洞。隨後該單位在風險處理時選擇了安裝 FTP 服務洞補丁程序並加固 FTP 服務安全措施,請問該措施屬於哪種風險處理方式","options":["風險降低","風險規避","風險轉移","風險接受"],"answer":"A","category":"風險管理","sources":[{"bank":"ciseA","n":65}]},{"id":684,"stem":"某銀行有5臺交換機連接了大量交易機構的網絡(如圖所示),在基於以太網的通信中,計算機A需要與計算機B通信,A必須先廣播“ARP 請求信息”,獲取計算機B的物理地址。每到月底時用戶發現該銀行網絡服務速度極其緩慢、銀行經調查後發現為了當其中一臺交換機收到ARP 請求後,會轉發給接收端口以外的其他所有端口,ARP 請求會被轉發到網絡中的所有客戶機上.為降低網絡的帶寬消耗,將廣播流限制在固定區域內,可以採用的技術是()","options":["配置虛擬專用網絡","動態分配地址","為路由交換設備修改默認口令","VLAN 劃分"],"answer":"D","category":"網絡安全","sources":[{"bank":"ciseA","n":66}]},{"id":685,"stem":"關子ARP欺騙原理和防範措施,下面理解錯誤的是().","options":["RP欺騙是指攻擊者直接向受害者主機發送錯誤的 ARP 應答報文,使得受害者主機將錯誤的硬件地址映射關係有入到ARP 緩存中,從而起到冒充主機的目的","單純利用ARP欺騙攻擊時,ARP欺騙通常影響的是內部子網,不能跨越路由實施攻擊",",解決ARP欺騙的一個有效方法是採用“靜態”的ARP緩存,如果發生硬件地址的更改,則需要人工更新緩存","徹底解決ARP欺騙的方法是避免使用ARP協議和ARP緩存,直接採用IP地址和其他主機進行連接"],"answer":"D","category":"網絡安全","sources":[{"bank":"ciseA","n":67},{"bank":"cisoB","n":80},{"bank":"rev6","n":38}]},{"id":686,"stem":"由於頻繁出現軟件運行時被照客遠程攻擊獲取數據的現象,某軟件公司準備加強軟件安全開發管理,在下面做法中,對於解決問題沒有直接幫助的是()。","options":["要求所有的開發人員參加軟件安全意識培調","要求規範軟件編碼,並制定公司的安全編碼準則","要求增加軟件安全測試環節,儘早發現軟件安全問題","要求用windows10系統做開發"],"answer":"D","category":"工程與管理","sources":[{"bank":"ciseA","n":68}]},{"id":687,"stem":"下列關於軟件安全開發中的 BSI(Baild Security In)系列模型說法錯誤的是 O","options":["SI含義是指將安全內建到軟件開發過程中,而不是可有可無,更不是遊離於軟件開發生命週期之外","軟件安全的三根支柱是風險管理、軟件安全觸點和安全知識","軟件安全觸點是軟件開發生命週期中一套輕量緩最優工程化方法,它提供了從不同角度保障安全的行為方式","SI系列模型強調安全測試的重要性,要求安全測試貫穿整個開發過程及軟件生命週期"],"answer":"D","category":"工程與管理","sources":[{"bank":"ciseA","n":69}]},{"id":688,"stem":"關於信息安全應急響應管理過程描述不正確的是()。","options":["基於應急響應工作的特點和事件的不規則性,事先制定出事件應急響應方法和過程,有助於一個組織在事件發生時阻止混亂的發生或是在混亂狀態中迅速恢復控制,將損失和負面影響降至最低","應急響應方法和過程並不是唯一的","一種被廣為接受的應念響應方法是將應急響應管理過程分為準備、檢測、遏制、根除、恢復和跟蹤總結6個階段","一種被廣為接受的應急響應方法是將應急響應管理過程分為準備、檢測、遏制、根除、恢復和跟蹤總結6個階段,這6個階段的響應方法一定能確保事件處理的成功"],"answer":"D","category":"應急與災難恢復","sources":[{"bank":"ciseA","n":70},{"bank":"cisoB","n":89}]},{"id":689,"stem":"按照我國信息安全等級保護的有關政策和標準,有些信息系統只需要自主定級、自主保護,按照要求向公安機關備案即可,可以不需要上級或主管部門來測評和檢查。此類信息系續應屬於()","options":["零級系統","一級系統","二級系統","三級系統"],"answer":"C","category":"法規與標準","sources":[{"bank":"ciseA","n":71},{"bank":"rev6","n":36}]},{"id":690,"stem":"由於密碼技術都依賴於密鑰,因此密鑰的安全管理是密碼技術應用中非常重要的環節,下列關於密鑰管理說法錯誤的是()。","options":["科克霍夫在《軍事密碼學》中指出系統的保密性不依載於對加密體制或算法的保密,而依賴於密鑰","在保密通信過程中,通信雙方可以一直使用之前用過的會話密鑰,不影響安全性","密鑰管理需要在安全策略的指導下處理密鑰生命週期的整個過程,包括產生、存儲、備份、分配、更新、撤銷等","在保密通信過程中,通信雙方也可利用 DiffieHellnan 協議協商出會話密鑰進行保密通信"],"answer":"B","category":"密碼與加密","sources":[{"bank":"ciseA","n":72}]},{"id":691,"stem":",一個信息管理系統通常會對用戶進行分組並實施訪問控制。例如,在一個學校的教務系統中,教師能夠錄入學生的考試成績,學生只能查看自己的分數,而學校教務部門的管理人員能夠對課程信息、學生的選課信息等內容進行修改,下列選項中,對訪問控制的作用的理解錯誤的是()。","options":["對經過身份鑑別後的合法用戶提供所有服務","拒絕非法用戶的非授權訪問請求","在用戶對系統資源提供最大限度共享的基礎上,對用戶的訪問權進行管理","防止對信息的非授權改和濫用"],"answer":"A","category":"工程與管理","sources":[{"bank":"ciseA","n":73},{"bank":"cisoB","n":72},{"bank":"rev6","n":41}]},{"id":692,"stem":"小趙是某大學計算機科學與技術專業的畢業生,在前往一家大型企業應聘時,面試經理要求他給出該企業信息系統訪問控制模型的設計思路。如果想要為一個存在大最用戶的信息系統實現自主訪問控制功能,在以下選項中,從時間和資源消耗的角度,下列選項中他應該採取的最合適的模型或方法是()。","options":["訪問控制列表(ACL)","能力表(CL)","BLP模型","Biba模型"],"answer":"A","category":"操作系統與主機安全","sources":[{"bank":"ciseA","n":74},{"bank":"cisoB","n":42},{"bank":"rev6","n":51}]},{"id":693,"stem":"以下關於災難恢復和數據備份的理解,說法正確的是()","options":["增量備份是備份從上次完全備份後更新的全部數據文件","依據具備的災難恢復資源程度的不同,災難恢復能力分為7個等級","數據備份按數據類型劃分可以劃分為操作系統備份和數據庫備份","使用差分備份數據恢復時只需最後一次的標準備份,如果每天都有大量數據變化,差分備份工作非常費時"],"answer":"C","category":"應急與災難恢復","sources":[{"bank":"ciseA","n":75}]},{"id":694,"stem":"規範的實施流程和文檔管理,是信息安全風險評估能否取得成果的重要基礎,某單位在實施風險評估時,按照規範形成了若干文檔,其中下面()中的文檔應屬於風險評估中“風險要素識別”階段輸出的文檔。","options":["《風險評估方案》,主要包括本次風險評估的目的、範圍、目標、評估步、經費預算和進度安持等內容","《風險評估方法和工具列表》,主要包括擬用的風險評估方法和測試評估工八等內容","《風險評估準則要求》、主要包括現有風險評估參考標準、採用的風險分析方法、資產分類標準等內容","《已有安全措施列表》,主要包括經檢查確認後的已有技術和管理各方面安全措施等內容"],"answer":"D","category":"風險管理","sources":[{"bank":"ciseA","n":76}]},{"id":695,"stem":"為了能夠合理、有序地處理安全事件,應事先制定出事件應救響成方法和過程,有助於一個組織在事件發生時限止淝亂的發生或是在混亂狀態中迅速恢復控制,將損失和負面影響降至最低。PDCERP方法論是一種廣泛使用的方法,其將應急響應分成六個階段,如下圖所示,請為圖中括號空白處選擇合適的內容()。","options":["培訓階段","文檔階段","報告階段","檢測階段"],"answer":"D","category":"應急與災難恢復","sources":[{"bank":"ciseA","n":77},{"bank":"cisoB","n":79},{"bank":"rev4","n":46},{"bank":"rev4","n":64}]},{"id":696,"stem":"以下關於互聯網協議安全(Internet Protocol Security,IPsec)協議說法錯誤的是()。","options":["在傳送模式中,保護的是IP負載","驗證頭協議(Authentication Header,AH)和IP封裝安全載荷協議(Encapsulating Security Payload,ESP)都能以傳輸模式和隧道模式工作。","在隨道模式中,保護的是整個互聯網協議(Internet Protocol,IP)包,包括IP頭","IPsec 僅能保證傳輸數據的可認證性和保密性。"],"answer":"D","category":"網絡安全","sources":[{"bank":"ciseA","n":78},{"bank":"rev1","n":25}]},{"id":697,"stem":"目前,信息系統面臨外部攻擊者的惡意攻擊威脅,從威脅能力和掌握資源分,這些或脅可以按照個人威脅、組織威脅和國家威脅三個層面劃分,則下面選項中屬於組織威脅的是 ()。","options":["喜歡惡作劇、實現自我挑戰的娛樂型黑客","實施犯罪、獲取非法經濟利益網絡犯罪團伙","蒐集政治、軍事、經濟等情報信息的情報機構","鞏固戰略優勢,執行軍事任務、進行目標破壞的信息作戰部隊"],"answer":"B","category":"風險管理","sources":[{"bank":"ciseA","n":79},{"bank":"rev6","n":10}]},{"id":698,"stem":"某電子商務網站在開發設計時,使用了威脅建模方法來分析電子商務網站所面臨的威脅。STRIDE 是微軟 SDL 中提出的威脅建模方法,將威脅分為六類,為每一類威脅提供了標準的消減措施,Spoofing 是 STRIDE 中欺騙類的威,以下威脅中哪個可以歸入此類威脅(()","options":["網站競爭對手可能僱傭攻擊者實施 DDoS 攻擊,降低網站訪問速度","網站使用 http 協議進行瀏覽等操作,未對數據進行加密,可能導致用戶傳輸信息泄露,例如購買的商品金額等","網站使用http 協議進行瀏覽等操作,無法確認數據與用戶發出的是否一致,可能數據被中途篡改","網站使用用戶名、密碼進行登錄驗證,攻擊者可能會利用弱口令或其他方式獲得用戶密碼,以該用戶身份登錄修改用戶訂單等信息"],"answer":"D","category":"風險管理","sources":[{"bank":"ciseA","n":80},{"bank":"rev1","n":26}]},{"id":699,"stem":"保護-檢測-響應(Protection-Detection-Response,PDR)模型是()工作中常用的模型,其思想是承認()中漏洞的存在,正視系統面臨的(),通過採取適度防護、加強()、落實對安全事件的響應、建立對威勝的防護來保障系統的安全。","options":["信息系統;信息安全保障:威脅;檢測工作","信息安全保障;信息系統;檢測工作;威脅","信息安全保障;信息系統;威脅;檢測工作","信息安全保障; 威脅; 信息系統; 檢測工作"],"answer":"C","category":"工程與管理","sources":[{"bank":"ciseA","n":81}]},{"id":700,"stem":"數據庫的安全很複雜,往往需要考慮多種安全策略,纔可以更好地保護數捌庫的安全,以下關於數據庫常用的安全策略理解不正確的題( )","options":["最小特權數則,是讓用戶可以合法的訪問或能改數據庫的前提下,分配最小的特權,使得這些信息恰好能夠完成 用戶的工作","最大共享策略,在保證數據庫的完整性,保密性和可用性的前提下,最大程度地共享數據庫中的信息","粒度最小策略,將數據庫中的數據項進行劃分,粒度越小,安全級別越高,在實際中需要選擇最小粒度","按內容訪問控制策略,不同權限的用戶訪問數據庫的不同部分"],"answer":"C","category":"工程與管理","sources":[{"bank":"ciseA","n":82},{"bank":"rev2","n":30},{"bank":"rev4","n":42}]},{"id":701,"stem":"若一個組織聲稱自己的ISMS 符合IS0/IEC 27001或GB/T 22080標準要求,其信息安全控制措施通常在以下方面實施常規控制,以下哪個選項的內容不屬於常規控制措施的範圍","options":["信息安全方針、信息安全組織、資產管理","人力資源安全、物理和環境安全、通信安全","安全採購、開發與維護、合規性","安全事件管理、供應商關係、業務安全性審計"],"answer":"D","category":"工程與管理","sources":[{"bank":"ciseA","n":83}]},{"id":702,"stem":"關於《網絡安全法》域外適用效力的理解,以下哪項是錯誤的()","options":["當前對於境外的網絡攻擊,我國只能通過向來源國採取抗議。","對於來自境外的網絡安全威脅我國可以組織技術力量進行監測、防禦和處置","對於來自境外的違法信息我國可以加以斷傳播","對於來自境外的網絡攻擊我國可以追究其法律責任"],"answer":"A","category":"網絡安全","sources":[{"bank":"ciseA","n":84},{"bank":"cisoB","n":57}]},{"id":703,"stem":",信息系統安全保障評估概念和關係如圖所示。信息系統安全保障評估,就是在信息系統所處的運行環境中對信息系統安全保障的具體工作和活動進行客觀的評估,通過信息系統安全保障評估所蒐集的(),向信息系統的所有相關方提供信息系統的()能夠實現其安全保障策略,能夠將其所面臨的風險降低到其可接受的程度的主觀信心。信息系統安全保障評估的評估對象是(),信息系統不僅包含了僅討論技術的信息技術系統,還包括同信息系統所處的運行環境相關的人和管理等領域,信息系統安全保障是一個動態持續的過程,沙及信息系統整個(),因此信息系統安全保障的評估也應該提供一種()的信心。","options":["安全保障工作;客觀證據;信息系統;生命週期;動態持續","客觀證據;安全保障工作;信息系統;生命週期;動態持續","客觀證據;安全保障工作;生命週期;信息系統;動態持續","客觀證據;安全保障工作;動態持續;信息系統;生命週期"],"answer":"B","category":"工程與管理","sources":[{"bank":"ciseA","n":85},{"bank":"cisoB","n":46},{"bank":"rev6","n":18},{"bank":"rev6","n":77}]},{"id":704,"stem":"數據在進行傳輸前,需要由協議棧自上而下對數據進行封裝。TCP/IP 協議中,數據封裝的順序是()","options":["傳輸層、網絡接口層、互聯網絡層","傳輸層、互聯網絡層、網絡接口層","互聯網絡層、傳輸層、網絡接口層","互聯網絡層、網絡接口層、傳輸層"],"answer":"B","category":"網絡安全","sources":[{"bank":"ciseA","n":86},{"bank":"cisoB","n":60},{"bank":"rev2","n":31}]},{"id":705,"stem":"跟據《信息安全等級保護管理辦法》、《關於開展信息安全等級保護測評體系建設試點工作的通知》(公信安(20091812)級保護建設和開展()工作的知(公信安[20101303 號)等文件,由公安部對等級保護測評機構管理,接受測評機構的中請、考覈和定期(),對不具備能力的測評機構則()","options":["等級測評;測評體系;等級保護評估中心;能力驗證;取消授權","測評體系;等級保護評估中心;等級測評;能力驗證;取消授權","測評體系;等級測評;等級保護評估中心;能力驗證;取消授權","測評體系;等級保護評估中心;能力驗證;等級測評;取消授權"],"answer":"C","category":"法規與標準","sources":[{"bank":"ciseA","n":87},{"bank":"rev6","n":2}]},{"id":706,"stem":"若一個組織聲稱自己的ISMS 符合IS0/IEC 27001成GB/T 22080 標準要求,其信息安全控制措施通常需要在符合性方面實施常規控制,符合性常規控制這一領域不包括以下哪項控制目標()","options":["符合法律要求","符合安全策略和標準以及技術符合性","信息系統審覈考慮","訪問控制的業務要求、用戶訪問管理"],"answer":"D","category":"法規與標準","sources":[{"bank":"ciseA","n":88},{"bank":"cisoB","n":98}]},{"id":707,"stem":"隨着信息技術的不斷發展,信息系統的重要性也越來越突出,而與此同時,發生的信息安全事件也越來越多。綜合分析信息安全問題產生的根源,下面描述正確的是(),","options":["信息系統自身存在脆弱性是根本原因。信息系統越來越重要,同時自身在開發、部署和使用過程中存在的脆弱性,導致了諸多的信息安全事件發生。因此,杜絕脆弱性的存在是解決信息安全問題的根本所在","信息系統面臨諸多黑客的威脅,包括惡意攻擊者和惡作劇攻擊者。信息系統應用越來越廣泛,接觸信息系統的人越多,信息系統越可能遭受攻擊。因此,避免有惡意攻擊可能的人接觸信息系統就可以解決信息安全問題","信息安全問題產生的根源要從內因和外因兩個方面分析,因為信息系統自身存在脆弱性,同時外部又有威脅源,從而導致信息系統可能發生安全事件。因此,要防範信息安全風險,需從內外因同時着手","信息安全問題的根本原因是內因、外因和人三個因素的綜合作用,內因和外因都可能導致安全事件的發生,但最重要的還是人的因素,外部攻擊者和內部工作人員通過遠程攻擊、本地破壞和內外勾結等手段導致安全事件發生。因此,對人這個因素的防範應是安全工作重點"],"answer":"C","category":"風險管理","sources":[{"bank":"ciseA","n":89},{"bank":"rev6","n":31}]},{"id":708,"stem":"即使最好用的安全產品也存在()。結果,在任何的系統中散手最終都能夠找出一個被開發出的漏洞。一種有效的對策是在敵手和它的目標之間配備多種()。每一種機制都應包括()兩種手段。","options":["安全機制:安全缺陷;保護和檢測","安全缺陷;安全機制:保護和檢測","安全缺陷;保護和檢測:安全機制","安全缺陷;安全機制:外邊和內部"],"answer":"B","category":"惡意代碼與漏洞","sources":[{"bank":"ciseA","n":90},{"bank":"cisoB","n":18},{"bank":"rev6","n":33}]},{"id":709,"stem":"某貿易公司的 0A 系統由於存在系統漏洞,被攻擊者上傳了木馬病毒並刪除了系統中的數據,由於系統備份是每週六進行一次,事件發生時間為週三,因此導致該公司三個工作日的數據丟失並使得0A 系統在隨後兩天內無法訪問,影響到了與公司有業務往來部分公司業務。在事故處理報告中,根據 GB/Z 20986-2007《信息安全事件分級分類指南》,該事件的準確分類和定級應該是()","options":["有害程序事件 特別重大事件( I級)","信息破壞事件 重大事件(II級)","有害程序事件 較大事件(III級)","信息破壞事件 一般事件(IV級)"],"answer":"C","category":"應急與災難恢復","sources":[{"bank":"ciseA","n":91},{"bank":"cisoB","n":86}]},{"id":710,"stem":"從 Linux 內核 2.1 版開始,實現了基於權能的特權管理機制,實現了對超級用戶的特權分割,打破了 UNIX/LINUX 操作系統中超級用戶/普通用戶的概念,提高了操作系統的安全性。下列選項中,對特權管理機制的理解錯誤的是()","options":["普通用戶及其 shell 沒有任何權能,而超級用戶及其 shell 在系統啓動之初擁有全部權能","系統管理員可以剝奪和恢復超級用戶的某些權能","進程可以放棄自己的菜的權地","當普通用戶的某些操作設計特權操作時,仍然通過setuid實現"],"answer":"B","category":"應急與災難恢復","sources":[{"bank":"ciseA","n":92}]},{"id":711,"stem":"以下哪項制度或標準被作為我國的一項基礎制度加以推行,並且有一定強制性,其實施的主要目標是提高我國信息和信息系統安全建設的整體水平,重點保障基礎信息網絡和重要信息系統的安全。()","options":["信息安全管理體系(ISMS)","信息安全等級保護","NIST SP800","IS0 270000 系列"],"answer":"B","category":"工程與管理","sources":[{"bank":"ciseA","n":93},{"bank":"cisoB","n":94},{"bank":"rev2","n":51}]},{"id":712,"stem":"小牛在對某公司的信息系統進行風險評估後,因考慮到該業務系統中部分涉及金融交易的功能模塊風險太高,他建議該公司以放棄這個功能模塊的方式來處理該風險。請問這種風險處置的方法是()。","options":["降低風險","規避風險","轉移風險","放棄風險"],"answer":"B","category":"風險管理","sources":[{"bank":"ciseA","n":94},{"bank":"rev3","n":86}]},{"id":713,"stem":"部署互聯網協議安全虛擬專用網(Internet Protocol Security Virtual Private Network, IPsec VPN)時,以下說法正確的是().","options":["配置MD5安全算法可以提供可靠地數據加密","配置 AES 算法可以提供可靠的數據完整性驗證","部署IPsec VPN網絡時,需要考慮IP地址的規劃,儘量在分支節點使用可以聚合的IP地址段,來減少IPsec安全關聯(Security Authentication,SA)資源的消耗","報文驗證頭協議(Authentication Header,AH)可以提供數據機密性"],"answer":"C","category":"網絡安全","sources":[{"bank":"ciseA","n":95},{"bank":"rev2","n":10}]},{"id":714,"stem":"私有 IP 地址是一段保留的 IP 地址。只使用在局域網中,無法在 Internet 上使用。關於私有地址,下面描述正確的是()。","options":["類和B類地址中沒有私有地址,C類地址中可以設置私有地址","類地址中沒有私有地址,B類和C類地址中可以設置私有地址","類、B 類和C類地址中都可以設置私有地址","類、B類和C類地址中都沒有私有地址"],"answer":"C","category":"網絡安全","sources":[{"bank":"ciseA","n":96},{"bank":"rev2","n":24}]},{"id":715,"stem":"PKI的主要理論基礎是()","options":["對稱密碼算法","公鑰密碼算法","量子密碼","摘要算法"],"answer":"B","category":"密碼與加密","sources":[{"bank":"ciseA","n":97},{"bank":"rev3","n":96}]},{"id":716,"stem":"你是單位安全主管,由於微軟剛發佈了數個系統漏洞補丁,安全運維人員給出了針對此批漏洞修補的四個建議方案,請選擇其中一個最優方案執行()","options":["由於本次發佈的數個漏洞都屬於高危漏洞,為了避免安全風險,應對單位所有的服務器和客戶端儘快安裝補丁","本次發佈的漏洞目前尚未出現利用工具,因此不會對系統產生實質性危害,所以可以先不做處理","對於重要的服務,應在測試環境中安裝並確認補丁兼容性問題後再在正式生產環境中部署","對於服務器等重要設備,立即使用系統更新功能安裝這批補丁,用戶終端計算機由於沒有重要數據,由終端自行升級"],"answer":"C","category":"惡意代碼與漏洞","sources":[{"bank":"ciseA","n":98},{"bank":"cisoB","n":28},{"bank":"rev6","n":83}]},{"id":717,"stem":"某網絡安全公司基於網絡的實時入侵檢測技術,動態監測來自於外部網絡和內部網絡的所有訪問行為。當檢測到來自內外網絡針對或通過防火牆的攻擊行為,會及時響應,並通知防火牆實時阻斷攻擊源,從而進一步提高了系統的抗攻擊能力,更有效地保護了網絡資源,提高了防禦體系級別。但入侵檢測技術不能實現以下哪種功能()。","options":["檢測並分析用戶和系統的活動","覈查系統的配置瀾洞,評估系統關鍵資源和數據文件的完整性","防止 IP 地址欺騙","識別違反安全策略的用戶活動"],"answer":"C","category":"網絡安全","sources":[{"bank":"ciseA","n":99},{"bank":"rev3","n":78}]},{"id":718,"stem":"某IT公司針對信息安全事件已經建立了完善的預案,在年度企業信息安全總結會上,信息安全管理員對今應急預案工作做出了四個總結,其中有一項總結工作是錯誤,作為企業的CSO,請你指出存在問題的是哪個總結","options":[".公司制定的應急演練流程包括應急事件通報、確定應急事件優先級、應急響應啓動實施、應急響應時間後期維、更新現有應急預案五個階段,流程完善可用","公司應急預案包括了基礎環境類、業務系統類、安全事件類和其他類,基本覆蓋了各類應急事件類型","公司應急預案對事件分類依據 GB/220986-2007《信息安全技術信息安全事件分類分級指南》,分為7個基本類別,預案符合國家相關標準","公司成立了信息安全應急響應組織,該組織由業務和技術人員組成,劃分成應急響應領導小組、技術保障小專家小組、實施小組和日常運行小組"],"answer":"D","category":"應急與災難恢復","sources":[{"bank":"ciseA","n":100},{"bank":"cisoB","n":8}]},{"id":719,"stem":"若一個組織聲稱自己的ISMS符合ISO/IEC 27001或GB22080標準要求,其信息安全控制措施通常在以下方面實施常規控制,不包括哪一項()","options":["信息安全方針、信息安全組織、資產管理","人力資源安全、物理和環境安全、通信安全","安全採購、開發與維護、合規性","安全事件管理、供應商關係、業務安全性審計"],"answer":"D","category":"風險管理","sources":[{"bank":"cisoB","n":1}]},{"id":720,"stem":"關於信息安全管理體系的作用,下面理解錯誤的是()。","options":["對內而言,有助於建立起文檔化的信息安全管理規範,實現有“法”可依,有章可循,有據可查","對內而言,是一個光花錢不掙錢的事情,需要組織通過其他方面收入來彌補投入","對外而言,有助於使各利益相關方對組織充滿信心","對外而言,能起到規範外包工作流程和要求,幫助界定雙方各自信息安全責任"],"answer":"B","category":"工程與管理","sources":[{"bank":"cisoB","n":2},{"bank":"rev4","n":24}]},{"id":721,"stem":"由於頻繁出現軟件運行時被黑客遠程攻擊獲取數據的現象,某軟件公司準備加強軟件安全開發管理,在下面做法中,對於解決問題沒有直接幫助的是()。","options":["要求所有的開發人員參加軟件安全意識培訓","要求規範軟件編碼,並制定公司的安全編碼準則","要求增加軟件安全測試環節,儘早發現軟件安全問題","要求開發人員採用瀑布模型進行開發"],"answer":"D","category":"工程與管理","sources":[{"bank":"cisoB","n":7}]},{"id":722,"stem":"作為信息安全從業人員,以下哪種行為違反了CISP 職業道德準則()","options":["抵制通過網絡系統侵犯公衆合法權益","通過公衆網絡傳播非法軟件","不在計算機網絡系統中進行造謠、欺詐、誹謗等活動","幫助和指導信息安全同行提升信息安全保障知識和能力"],"answer":"B","category":"網絡安全","sources":[{"bank":"cisoB","n":10},{"bank":"rev6","n":21}]},{"id":723,"stem":"規範的實施流程和文檔管理,是信息安全風險評估能否取得成果的重要基礎.某單位在實施風險評估時,按照規範形成了若干文檔,其中,下面()中的文檔應屬於風險評估中“風險要素識別”階段輸出的文檔。","options":["《風險評估方案》主要包括本次風險評估的目的、範圍、目標、評估步驟、經費預算和進度安排等內容","《風險評估方法和工具列表》,主要包括擬用的風險評估方法和測試評估工具等內容","《風險評估準則要求》,主要包括現有風險評估參考標準、採用的風險分析方法、資產分類標準等內容","《已有安全措施列表》,主要包括經檢查確認後的已有技術和管理各方面安全措施等內容"],"answer":"D","category":"風險管理","sources":[{"bank":"cisoB","n":11},{"bank":"cisoB","n":77}]},{"id":724,"stem":"以下關於信息安全工程說法正確的是()。","options":["信息化建設中系統功能的實現是最重要的","信息化建設可以先實施系統,而後對系統進行安全加固","信息化建設中在規劃階段合理規劃信息安全,在建設階段要同步實施信息安全建設","信息化建設沒有必要涉及信息安全建設"],"answer":"C","category":"工程與管理","sources":[{"bank":"cisoB","n":12},{"bank":"rev2","n":71}]},{"id":725,"stem":"關於信息安全事件管理和應急響應,以下說法錯誤的是:","options":["應急響應是指組織為了應對突發/重大信息安全事件的發生所做的準備,以及在事件發生後所採取的措施","應急響應方法,將應急響應管理過程分為遏制、根除、處置、恢復、報告和跟蹤6 個階段","對信息安全事件的分級主要參考信息系統的重要程度、系統損失和社會影響三方面因素","根據信息安全事件的分級參考要素,可將信息安全事件劃分為4個級別:特別重大事件(I級)、重大事件(II級)、較大事件(III級)和一般事件(IV級)"],"answer":"B","category":"應急與災難恢復","sources":[{"bank":"cisoB","n":13}]},{"id":726,"stem":"關於信息安全保障技術框架(IATF),以下說法不正確的是:","options":["分層策略允許在適當的時候採用低安全級保障解決方案以便降低信息安全保障的成本","IATF從人、技術和操作三個層面提供一個框架實施多層保護,使攻擊者即使攻破一層也無法破壞整個信息基礎設施","允許在關鍵區域(例如區域邊界)使用高安全級保障解決方案,確保系統安全性","IATF深度防禦戰略要求在網絡體系結構各個可能位置實現所有信息安全保障機制"],"answer":"D","category":"應急與災難恢復","sources":[{"bank":"cisoB","n":14}]},{"id":727,"stem":"以下關於災難恢復和數據備份的理解,說法正確的是()。","options":["增量備份是備份從上次完全備份後更新的全部數據文件","依據具備的災難恢復資源程度的不同,災難恢復能力分為7個等級","數據備份按數據類型劃分可以劃分為操作系統備份和數據庫備份","使用差分備份,數據恢復時只需最後一次的標準備份與差分備份,如果每天都有大量數據變化,差分備份工作非常費時"],"answer":"C","category":"應急與災難恢復","sources":[{"bank":"cisoB","n":15}]},{"id":728,"stem":"以下關於互聯網協議安全(Internet Protocol Security,IPSec)協議說法錯誤的是:","options":["在傳送模式中,保護的是IP負載。","驗證頭協議(Authentication Header,AH)和IP封裝安全載荷協議(Encapsulating Security Payload,ESP)都能以傳輸模式和隧道模式工作。","在隧道模式中,保護的是整個互聯網協議IP包,包括IP 頭。","IPSec僅能保證傳輸數據的可認證性和保密性"],"answer":"D","category":"應急與災難恢復","sources":[{"bank":"cisoB","n":16}]},{"id":729,"stem":"安全專用產品銷售許可證制度是對銷售安全專用產品的企業進行管理,確保產品質量,保障信息安全,具有行政法律責任強制力。\n安全事件(事故)制度用於規範安全事件的處理流程、責任追究等,具有行政法律責任強制力。\n信息系統安全監控主要是對信息系統運行狀態的監測,本身不屬於具有行政法律責任強制力的制度。所以選A。\n20.北京某公司利用SSE-CMM對其自身工程隊伍能力進行自我改善,其理解正確的是:","options":["系統安全工程能力成熟度模型(SSE-CMM)定義了6個能力級別,當工程隊不能執行一個過程域中的基本實踐時,該過程域的過程能力為0級","達到SSE-CMM最高級以後,工程隊伍執行同一個過程,每次執行結果質量必須相同。","系統安全工程能力成熟度模型(SSE-CMM)定義了3個風險過程:評價威脅,評價脆弱性,評價影響。","SSE-CMM強調系統安全工程與其他工程科學的區別和獨立性"],"answer":"A","category":"工程與管理","sources":[{"bank":"cisoB","n":20}]},{"id":730,"stem":"某商貿公司信息安全管理員考慮到信息系統對業務影響越來越重要,計劃編制本單位信息安全應急響應預案,在向主管領導寫報告時,他列舉了編制信息安全應急響應預案的好處和重要性,在他羅列的四條理由中,其中不適合作為理由的一條是()","options":["應急預案是保障單位業務系統信息安全的重要措施","應急預案是提高應對網絡和信息系統突發事件能力,減少突發事件造成的損失和危害,保障信息系統運行平穩、安全、有序、高效的手段","編制應急預案是國家網絡安全法對所有單位的強制要求,因此必須建設","應急預案是保障單位業務系統信息安全的重要措施"],"answer":"C","category":"應急與災難恢復","sources":[{"bank":"cisoB","n":23}]},{"id":731,"stem":"SABSA模型包括(),它是一個(),它在第一層從安全的角度定義了()。模型的每一層在抽象方面逐層減少,細節逐層增加,因此,它的層級都是建在其他層之上的,從策略逐漸到技術和解決方案的()。其思路上創新提出了一個包括戰略、概念、設計、實施、度量和審計層次的()","options":["五層:業務需求:分層模型:實施實踐,安全鏈條","六層;分層模型;業務需求;實施實踐:安全鏈條","五層;分層模型;業務需求:實施實踐;安全鏈條","六層;分層模型:實施實踐;業務需求:安全鏈條"],"answer":"B","category":"工程與管理","sources":[{"bank":"cisoB","n":24}]},{"id":732,"stem":"信息安全管理體系(ISMS)的建設和實施是一個組織的戰略性舉措。若一個組織聲稱自己的ISMS符合ISO/IEC 27001或GB/T 22080標準要求,則需實施準要求,則需實施以下ISMS建設的各項工作,哪一項不屬於ISMS建設的工作.()","options":["規劃與建立 ISMS","實施和運行ISMS","監視和評審 ISMS","保持和審覈 ISMS"],"answer":"D","category":"工程與管理","sources":[{"bank":"cisoB","n":25}]},{"id":733,"stem":"Kerberos協議是常用的集中訪問控制協議,通過可信第三方的認證服務,減輕應用服務器的負擔。Kerberos的運行環境由密鑰分發中心(KDC)、應用服務器和客戶端三個部分組成。其中,KDC分為認證服務器AS和票據授權服務器TGS兩部分。下圖展示了Kerberos協議的三個階段,分別為(1)Kerberos獲得服務許可票據,(2)Kerberos獲得服務,(3)Kerberos獲得票據許可票據。下列選項中,對這三個階段的排序正確的是()。","options":["(2)→(1)→(3)","(3)→(1)→(2)","(1)→(2)→(3)","(3)→(2)→(1)"],"answer":"B","category":"網絡安全","sources":[{"bank":"cisoB","n":26}]},{"id":734,"stem":"為保障信息系統的安全,某經營公衆服務系統的公司準備並編制一份針對性的信息安全保障方案,並將編制任務交給了小王,為此,小王決定首先編制出一份信息安全需求描述報告。關於此項工作,下面說法錯誤的是()。","options":["信息安全需求報告應依據該公衆服務信息系統的功能設計方案為主要內容來撰寫","信息安全需求描述報告是設計和撰寫信息安全保障方案的前提和依據","信息安全需求描述報告應當基於信息安全風險評估結果和有關政策法規和標準的合規性要求得到","信息安全需求描述報告的主體內容可以按照技術、管理和工程等方面需求展開編寫"],"answer":"A","category":"工程與管理","sources":[{"bank":"cisoB","n":27}]},{"id":735,"stem":"GB/T 22080-2008《信息技術安全技術信息安全管理體系要求》指出,建立信息安全管理體系應參照PDCA模型進行,即信息安全管理體系應包括建立ISMS、實施和運行ISMS、監視和評審ISMS、保持和改進ISMS等過程,並在這些過程中應實施若干活動,請選出以下描述錯誤的選項()","options":["“制定ISMS方針”是建設ISMS階段工作內容","“實施培訓和意識教育計劃“是實施和運行ISMS階段工作內容","“進行有效性測量”是監視和評審ISMS階段工作內容","“實施內部審覈”是保護和改進ISMS階段工作內容"],"answer":"D","category":"工程與管理","sources":[{"bank":"cisoB","n":29}]},{"id":736,"stem":"信息系統建設完成後,( )的信息系統的而運營使用單位應當選擇符合國家規定的測評機構進行測評合格後方可投入使用","options":["二級以上","三級以上","四級以上","五級以上"],"answer":"B","category":"法規與標準","sources":[{"bank":"cisoB","n":30},{"bank":"rev2","n":78}]},{"id":737,"stem":"小王在學習定量風險評估方法後,決定試着為單位機房計算火災的風險大小。假設單位機房的總價值為400萬元人民幣,暴露係數(ExposureFactor,EF)是25%,年度發生率(Annualized Rate of Occurrence,ARO)為0.2,那麼小王計算的年度預期損失(Annualized Loss Expectancy,ALE)應該是()","options":["100 萬元人民幣","400 萬元人民幣","20 萬元人民幣","180 萬元人民幣"],"answer":"C","category":"風險管理","sources":[{"bank":"cisoB","n":32},{"bank":"rev3","n":43},{"bank":"rev6","n":30}]},{"id":738,"stem":"以下關於威脅建模流程步驟說法不正確的是()。","options":["威脅建模主要流程包括四步:確定建模對象、識別威脅、評估威脅和消減威脅","評估威脅是對威脅進行分析,評估被利用和攻擊發生的概率,瞭解被攻擊後資產的受損後果,並計算風險","消減威脅是根據威脅的評估結果,確定是否要消除該威脅以及消減的技術措施,可以通過重新設計直接消除威脅,或設計採用技術手段來消減威脅。","識別威脅是發現組件或進程存在的威脅,它可能是惡意的,威脅就是漏洞"],"answer":"D","category":"風險管理","sources":[{"bank":"cisoB","n":33},{"bank":"rev3","n":62}]},{"id":739,"stem":"有關能力成熟度模型(CMM)錯誤的理解是","options":["MM的基本思想是,因為問題是由技術落後引起的,所以新技術的運用會在一定程度上提高質量、生產率和利潤率","MM的思想來源於項目管理和質量管理","MM是一種衡量工程實施能力的方法,是一種面向工程過程的方法","MM是建立在統計過程控制理論基礎上的,它基於這樣一個假設,即“生產過程的高質量和在過程中組織實施的成熟性可以低成本地生產出高質量產品”"],"answer":"A","category":"工程與管理","sources":[{"bank":"cisoB","n":35},{"bank":"rev3","n":64}]},{"id":740,"stem":"保護-檢測-響應(Protection-Detection-Response,PDR)模型是()工作中常用的模型,其思想是承認()中漏洞的存在,正視系統面臨的()。通過採取適度防護、加強()、落實對安全事件的響應、建立對威脅的防護來保障系統的安全","options":["信息系統;信息安全保障;威脅;檢測工作","信息安全保障;信息系統;檢測工作;威脅","信息安全保障;信息系統;威脅;檢測工作","信息安全保障;威脅;信息系統;檢測工作"],"answer":"C","category":"工程與管理","sources":[{"bank":"cisoB","n":36},{"bank":"rev6","n":88}]},{"id":741,"stem":"王工是某單位的系統管理員,他在某次參加了單位組織的風險管理工作時,發現當前案例中共有兩個重要資產;資產A1和資產A2;其中資產A1面臨兩個主要威脅;威脅T1和威脅T2;面資產A2面臨一個主要威脅;威脅T3;威脅T1可以利用的資產A1存在的兩個脆弱性;脆弱性V1和脆弱性V2;威脅T2利用資產A1存在的三個脆弱性,脆弱性V3、V4和V5。資產A2面臨一個威脅T3,威脅T3利用A2的兩個脆弱性V6和V7。根據上述條件,請問;使用相乘法時,應該為資產A1計算幾個風險值()","options":["2","3","5","6"],"answer":"C","category":"風險管理","sources":[{"bank":"cisoB","n":37}]},{"id":742,"stem":"信息安全組織的管理涉及內部組織和外部各方兩個控制目標。為了實現對組織內部信息安全的有效管理,應該實施常規的控制措施,不包括哪些選項()","options":["信息安全的管理承諾、信息安全協調、信息安全職責的分配","信息處理設施的授權過程、保密性協議、與政府部門的聯繫","與特定利益集團的聯繫、信息安全的獨立評審","與外部各方相關風險的識別、處理外部各方協議中的安全問題"],"answer":"D","category":"工程與管理","sources":[{"bank":"cisoB","n":38},{"bank":"rev6","n":35}]},{"id":743,"stem":"某銀行有5臺交換機連接了大量交易機構的網絡（如圖所示）。在基於以太網的通信中，計算機A需要與計算機B通信，A必須先廣播“ARP請求信息”，獲取計算機B的物理地址。每到月底時用戶發現該銀行網絡服務速度極其緩慢。銀行經調查後發現，當其中一臺交換機收到ARP請求後，會轉發給接收端口以外的其他所有端口，ARP請求會被轉發到網絡中的所有客戶機上。為降低網絡的帶寬消耗，將廣播流限制在固定區域內，可以採用的技術是（）。","options":["VLAN劃分","動態分配地址","設立入侵防禦系統","為路由交換設備修改默認口令"],"answer":"A","category":"網絡安全","sources":[{"bank":"cisoB","n":40},{"bank":"rev4","n":57}]},{"id":744,"stem":"Gary McGraw博士及其合作者提出軟件安全應由三根支柱來支撐,這三個支柱是()。","options":["源代碼審覈、風險分析和滲透測試","應用風險管理、軟件安全接觸點和安全知識","威脅建模、滲透測試和軟件安全接觸點","威脅建模、源代碼審覈和模糊測試"],"answer":"B","category":"網絡安全","sources":[{"bank":"cisoB","n":41}]},{"id":745,"stem":"有關係統安全工程-能力成熟度模型(SSE-CMM),錯誤的理解是:","options":["SSE-CMM要求實施組織與其他組織相互作用,如開發方、產品供應商、集成商和諮詢服務商等","SSE-CMM可以使安全工程成為一個確定的、成熟的和可度量的科目","基於SSE-CMM的工程是獨立工程,與軟件工程、硬件工程、通信工程
