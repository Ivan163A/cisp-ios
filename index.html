484":"ARP欺騙、MAC地址泛洪與嗅探均針對數據鏈路層的地址解析與交換機制；分片攻擊、SYN Flood、死亡之Ping及IP源地址欺騙作用於網絡層與傳輸層，不屬於網絡接口層的攻擊。","485":"簡單包過濾防火牆依據網絡層IP地址與傳輸層端口、協議等報頭字段匹配規則放行或丟棄數據包，不解析應用層載荷，也不工作在鏈路層與會話層。","486":"PRIMARY KEY定義主鍵，要求其取值唯一且非空，用以保證關係中每個元組均可被唯一標識，這正是實體完整性約束；參照完整性涉及外鍵與表間引用，NOT NULL等屬於用戶自定義完整性。","487":"病毒名稱中的Macro即宏，Melissa是典型的辦公軟件宏病毒，寄生於文檔與模板的宏代碼中並隨文件傳播，故屬宏病毒，而非感染可執行文件、引導扇區或目錄的文件型、引導型病毒。","488":"風險管理的核心是在風險與成本、效益之間權衡取捨，從技術、經濟與管理上的可行性和有效性確定可接受風險水平；安全不可能完美無缺，最完備的策略也未必最優，防範過多同樣會造成不必要的損失。","489":"信息安全風險無法徹底消除，應對風險的目標是把風險及其發生可能性與影響控制在可接受範圍內，使風險造成的問題降至最低限度；追求消除一切威脅與風險既不現實也不經濟。","490":"人員離職或崗位變化時的管理程序包括明確其不再承擔原有職責、收回並歸還應當歸還的資產、撤銷原職責對應的訪問權限；由安全管理員陪同其離開工作場所並非必要的管理程序。","491":"IATF深度防禦戰略從人員、技術、運行三個層面構建防護能力，三者相互補充形成整體保障，法律並不屬於該模型的三個層面之一。","492":"《中華人民共和國保守國家祕密法》規定國家祕密的密級分為絕密、機密、祕密三個級別，分別對應最重要的祕密、重要的祕密與一般的祕密；普密與商密、低級與高級等劃分均無法律依據。","493":"信息安全已不再侷限於信息技術本身，組織、管理、工程過程與人員同樣是影響信息系統安全的重要因素，故該項正確；當前階段是信息安全保障而非計算機安全，其演進順序應為通信安全、計算機安全、信息技術安全到信息安全保障。","494":"信息安全保障階段強調在組織層面建立並持續完善安全管理體系，通過人員安全意識培訓與教育形成管理、技術與運行相協調的保障能力；通信安全與計算機安全階段則以密碼技術和單機防護為主。","495":"深度防禦模型要求技術方案從外到內、自頂向下逐層展開，形成從邊界到終端的縱深防護能力，而非自下而上，故該項表述錯誤；關於外部環境、管理工程與人才體系的描述均符合模型內涵。","496":"機密性依靠加密算法對報文內容作可逆變換，對稱加密算法以共享密鑰加解密、運算效率高，是網絡通信中保證機密性的常用手段；消息認證碼、消息摘要與數字簽名用於完整性與抗抵賴，不提供機密性。","497":"近代密碼學的本質進步是確立以Kerckhoffs原則為代表的安全觀：系統的安全性不依賴算法保密，而依賴密鑰的保密，算法可以公開、密鑰必須保密；非對稱密鑰算法屬現代密碼學成果，加密效率與VPN應用是應用層面的發展，不是本質上的進步。","498":"ECC基於橢圓曲線離散對數問題，以遠小於RSA的密鑰長度即可獲得同等安全強度，運算規模與密鑰尺寸顯著更小，故速度最快；Blowfish與IDEA屬於對稱加密算法，並非非對稱算法。","499":"RSA中模數n由兩個大素數相乘得到幷包含在公鑰中，對所有通信方公開，故收發雙方均已知n；私鑰指數d必須保密、僅私鑰持有者知曉，由e與n求d等價於分解大整數，在計算上不可行。","500":"消息摘要算法是單向的無密鑰算法，其安全性不依賴任何密鑰的保密，也不存在解密過程，故該項描述錯誤；摘要算法把任意長度消息壓縮為固定長度摘要，輸入微小變動即引起摘要顯著改變。","501":"RSA的安全性基於大整數分解難題，即已知兩個大素數之積而難以將其分解還原；ECC基於橢圓曲線離散對數問題，Diffie-Hellman基於離散對數問題，DES是對稱分組密碼，均與因數分解無關。","502":"對MD5與SHA-1的攻擊是碰撞攻擊，即攻擊者能夠構造出兩個不同的消息，使其經同一摘要算法產生相同的消息摘要，從而以僞造內容替換真實內容；摘要算法單向不可逆，無法由摘要恢復原文。","503":"WTP是無線事務協議，屬於應用層協議，與隧道封裝無關；L2F、PPTP與L2TP均為工作在數據鏈路層的第二層隧道協議，用於封裝鏈路層幀以承載隧道通信。","504":"BLP模型（機密性）與Biba模型（完整性）都以安全標級和強制策略實施訪問控制，同屬強制訪問控制模型，故A正確；Chinese Wall屬利益衝突的多策略模型而非完整性模型，訪問控制矩陣是自主訪問控制的典型形式，基於角色的訪問控制由角色與策略分配權限、不屬於強制訪問控制。","505":"自主訪問控制以訪問控制矩陣（訪問控制列表為其實現形式）記錄各主體對客體的訪問權限，由客體所有者自主決定授權；強制訪問控制依賴安全標號與敏感標記，集中式與分佈式是按控制方式劃分而非矩陣結構。","506":"Kerberos採用對稱密鑰體制，密鑰分發中心由認證服務器與票據授權服務器組成，且要求客戶端與服務器時鐘基本同步；用戶完成身份鑑別後先取得票據許可票據，再憑其申請具體服務的服務票據。","507":"RADIUS是一項通用的認證、授權與計費協議，採用客戶端/服務器結構並基於UDP通信，其基本組件為認證、授權與計費三項，而非加密。","508":"DHCP用於自動為主機分配IP地址、子網掩碼、默認網關及WINS服務器地址；ARP用於IP地址到MAC地址的解析，IGMP用於組播成員管理，ICMP用於傳遞差錯與控制報文，均無地址分配功能。","509":"防火牆的功能包括按協議與規則進行過濾、實現訪問控制規則以及擴展審計能力；包交換是交換機與路由器在鏈路層和網絡層轉發數據的基本職能，不屬於防火牆的功能。","510":"通用IDS模型由傳感器、分析器和管理器三部分構成：傳感器負責採集數據，分析器負責檢測與分析，管理器負責策略配置與響應管理；過濾器不是該模型的組成部分。","511":"SYN Cookie是抵禦SYN Flood攻擊、保護服務端半連接隊列的技術，屬於防火牆與主機防護手段，並非網絡入侵檢測系統的常見技術；協議分析、零拷貝與IP碎片重組都是NIDS為提升檢測能力與效率採用的技術。","512":"WindowsNT提供的分佈式安全環境被稱為域(Domain),域是一種管理方式,可將網絡中的計算機和用戶組織起來,方便管理和控制。工作組是一種簡單的網絡組織形式;對等網強調網絡中計算機地位平等;安全網不是WindowsNT分佈式安全環境的特定稱呼。所以選A。","513":"chmod以三位八進制數表示權限，7對應所有者讀、寫與執行，4對應所屬組讀權限，4對應其他用戶讀權限，故所有者具有讀寫和執行權限，組與其他用戶僅有讀權限。","514":"漏洞是信息系統在物理、邏輯、實現與使用等環節客觀存在的缺陷，可能源於設計疏忽、編碼失誤、配置不當或管理缺失，並非都是人為故意引入；漏洞寄生於特定客體與環境，本身不造成破壞，但可被攻擊者利用形成威脅。","515":"蠕蟲主要利用系統與協議漏洞自動傳播，大量消耗網絡帶寬與系統資源，其危害主要體現為對可用性的破壞，而非數據保密性；蠕蟲無需以其他程序為媒介即可在系統間自我複製，傳播通常無需用戶操作。","516":"網頁中的惡意代碼可藉助腳本、控件、插件等多種途徑在各類瀏覽器中執行，並非只能通過IE發揮作用；其危害包括修改系統註冊表與系統文件、竊取用戶機密文件等。","517":"ARP欺騙的根源在於協議無狀態、對報文真實性缺乏驗證，以及ARP緩存動態可被改寫；ARP協議是用於地址尋址的重要協議，這只是其功能定位，並非遭受欺騙攻擊的原因。","518":"UDP Flood以海量UDP小包衝擊應用服務器，或利用Echo等UDP服務形成數據流造成網絡擁塞，均屬流量型拒絕服務；發送錯誤的UDP報文導致系統崩潰屬於報文缺陷類攻擊，不是UDP Flood的方式。","519":"SYN洪水攻擊利用TCP三次握手的半連接隊列耗盡目標系統資源，並可由殭屍網絡多節點協同發起，屬於典型的分佈式拒絕服務攻擊；中間人攻擊與SQL注入均不以耗盡資源為目的，TCP連接攻擊一般指單點行為。","520":"信息系統的業務特性應從機構的業務內容與業務流程中獲取，業務內容決定系統承載的信息資產，業務流程決定其運行方式與連續性要求；機構使命與戰略目標用於確定安全目標，組織結構和管理制度屬於環境因素。","521":"風險減緩是針對已評估出的風險選取控制措施、實施安全措施並接受殘餘風險等處置動作；計算風險屬於風險評估階段的工作，故不在減緩內容之列。","522":"運行維護階段的風險評估是針對真實運行的信息系統、資產與脆弱性進行的定期或不定期評估，屬持續性評估而非全面評估，故該描述不正確；其餘各階段描述均符合標準。","523":"信息安全策略是組織信息安全工作的綱領性文件，闡述安全工作的基本原則、總體要求與職責分工；安全架構、技術參數與實施手段屬下層方案與規範的內容。","524":"計算機取證應先做好準備，再保護現場與證據的完整性，繼而提取證據、分析取證並最終提交，順序不可顛倒，以免證據被污染而喪失法律效力。","525":"災難恢復策略依據災難恢復需求分析的結果制定，據以明確恢復目標、優先級與資源要求；風險分析與業務影響分析只是支撐需求分析的輸入。","526":"異地備份中心的核心在於與生產中心面臨相同區域性風險的幾率很小，使區域性災難發生時數據仍可恢復；所在城市與具體距離只是實現手段，並非判定標準。","527":"成本控制的目標是在批准的預算條件下確保項目保質按期完成，追求的是合理性價比而非成本越低越好；監理單位應對成本實施監控，而非僅記錄開銷。","528":"CC 通用標準主要由簡介和一般模型、安全功能要求、安全保證要求以及 PP 和 ST 產生指南等部分構成，其中安全功能要求與安全保證要求是核心內容。","529":"提供信息安全工作所必需的資源屬於高級管理層的職責，信息安全部門主管負責組織制定並落實安全策略與日常管理，故該項職責劃分不合理。","530":"快速格式化僅清除文件分配表與目錄項，磁盤上的數據仍可被恢復工具還原，無法真正清除保密信息；應採用徹底覆寫擦除或物理銷燬的方式。","531":"CSIRT 通常由技術、法律、管理等人員兼職組成，並不要求全部成員專職常設；其餘說法均符合應急響應需事先準備、爭取主動的原則。","532":"表示層負責對應用層送來的命令與數據進行語法轉換、編碼、格式解釋與加密，使通信雙方能理解其含義；會話層僅負責對話的建立與管理。","533":"動態安全指安全保障必須覆蓋信息系統整個生命週期，並隨資產、威脅與脆弱性的變化持續調整控制措施，而非一次性、靜態的達標狀態。","534":"RSA 為非對稱密碼算法，除數據加密外還可實現數字簽名與密鑰交換；DES 僅為對稱分組加密，不具備簽名能力，且存在密鑰分發困難的問題。","535":"通信安全階段的重點是保護數據在傳輸過程中不被竊聽與截獲，主要面臨的威脅是信息泄露；病毒與非法訪問屬計算機安全與網絡安全階段的威脅。","536":"動態安全要求安全保障覆蓋信息系統整個生命週期，並隨安全風險的變化有針對性地調整控制措施，體現為持續改進的過程而非靜態達標。","537":"IATF 的核心是縱深防禦，通過本地計算環境、區域邊界、網絡和基礎設施、支撐性基礎設施的多層防護保障業務安全，並非以監測與自適應填充漏洞為循環。","538":"IATF 將信息系統的安全需求劃分為本地計算環境、區域邊界、網絡和基礎設施、支撐性基礎設施四個部分，據此分層定義防護要求並配置措施。","539":"完整性保證數據未被非法篡改、增刪或替換，維持其真實與一致；可生存性強調抗毀與恢復能力，參考完整性僅指數據之間的引用對應關係。","540":"安全保障是主觀與客觀的結合：通過對技術、管理、工程與人員方面的客觀評估，向系統所有者說明現有保障措施能否滿足其安全目標，主觀需求由客觀證據支撐。","541":"ATM 故障後業務系統及時對賬戶餘額進行衝正，使數據恢復到正確且一致的狀態，正是數據完整性保護的體現；A 屬可用性，C 屬審計，D 屬物理安全。","542":"PPDR 模型由策略、保護、檢測與響應四個環節構成，形成動態安全閉環；加密只是具體的技術手段，不屬於該模型的基本組成部分。","543":"安全目標 ST 描述被評估產品的安全特性與評估範圍，需在開發者、評估者與用戶三方之間達成一致，作為安全評估活動的共同依據。","544":"現代密碼學始於香農提出的理論，擴散與混淆、Diffie-Hellman 密鑰交換、差分分析與線性分析皆屬其研究範疇；Enigma 密碼機的破譯屬古典密碼學階段。","545":"消息驗證碼 MAC 基於對稱密鑰計算，用於驗證消息的完整性與來源，屬對稱密碼技術；數字簽名、密鑰交換與身份認證均可由公鑰密碼實現。","546":"RSA 既可用公鑰對數據加密，也可用於密鑰交換與數字簽名；DSS 僅用於數字簽名，Diffie-Hellman 只能協商密鑰，AES 為對稱加密算法。","547":"對 MD5 與 SHA-1 的攻擊主要指碰撞攻擊，即構造兩個不同消息使其產生相同的消息摘要；摘要算法具單向性，無法由摘要還原原始消息。","548":"數字簽名用於驗證簽名者身份、認證被簽名消息的完整性並支持第三方驗證與抗抵賴；它本身不對數據加密，因而不提供機密性保護。","549":"數字證書將公鑰與持有者身份綁定，可用於加密、數字簽名與身份認證；消息摘要是哈希算法的功能，並非數字證書所提供的功能。","550":"註冊機構 RA 負責受理申請並審覈申請人身份與數據的真實性，再向 CA 提交簽發建議；證書籤發、註銷與目錄查詢服務由 CA 承擔。","551":"一般訪問控制過程由主體、客體、訪問控制決策與訪問控制實施四部分組成；訪問控制模型既可形式化描述也可非形式化描述，決策與實施是兩個獨立環節。","552":"強制訪問控制可以與自主訪問控制結合使用，形成混合訪問控制機制；其特點是主體與客體均被分配安全屬性，所有訪問請求由策略統一強制控制。","553":"Biba 模型與 Clark-Wilson 模型均以防止數據被非法篡改為目標，關注信息系統的完整性；Bell-LaPadula 模型關注機密性，Chinese Wall 模型關注利益衝突。","554":"BLP 的寫規則要求主體安全級支配客體，即主體級別不低於客體且範疇包含客體範疇；Alice 的範疇不含 US，故無權寫入該文件。","555":"Chinese Wall 規定同一利益衝突域內的數據只能訪問其一，Y 與 Z 同屬一個衝突域，因此無論是否訪問過 W，用戶在兩者中僅能選擇其一訪問。","556":"生物特徵鑑別系統以錯誤接受率 FAR 與錯誤拒絕率 FRR 的交點，即交叉錯判率 CER 綜合衡量準確度，CER 越小說明系統性能越好。","557":"蜜網由蜜罐組成，用於誘捕攻擊者並在不被察覺的情況下記錄、監視與分析攻擊活動；實時的攻擊檢測與報警由入侵檢測系統完成，並非蜜網的功能。","558":"OSI 七層安全體系結構定義的五類安全服務為認證、訪問控制、數據保密性、數據完整性與抗抵賴；數字簽名是實現簽名與抗抵賴的具體技術，不屬於五類服務。","559":"WEP 使用 RC4 與靜態共享密鑰，初始向量過短且存在弱密鑰，攻擊者收集數據包後即可破解，安全性明顯弱於 WPA、WPA2 與 WAPI。","560":"開放認證模式允許任何終端接入而無需身份鑑別，會明顯降低 WLAN 的安全性；修改默認 SSID、禁止廣播及啓用雙向認證均為有效的加固手段。","561":"防火牆設置在網絡或安全域之間，作為其唯一出入口，並依安全策略允許、拒絕、檢測出入的信息流；其控制範圍限於邊界，對源自內部的威脅與攻擊難以有效防止，故選D。","562":"應用層防火牆工作在OSI模型第七層，能深入協議內容有效阻擋應用層攻擊且便於審計；但因需解析應用層報文，處理開銷大、速度較慢，故速度快且對用戶透明並非其特點。","563":"應用網關防火牆以代理方式解析應用層報文內容，可依關鍵字、文件類型等內容規則控制訪問連接；包過濾只檢查IP與端口等報頭，狀態檢測僅跟蹤連接狀態，均不檢查內容。","564":"通用IDS模型由傳感器、分析器和管理器等組成，傳感器採集數據、分析器比對判識、管理器集中管理並下發策略；過濾器並不屬於該模型的組成部分。","565":"IDS的主要功能是監控和分析用戶與系統活動、統計異常活動模式並標識反映已知攻擊的活動模式；它只負責檢測與告警，不能修復被破壞的數據，數據修復屬備份恢復範疇。","566":"Linux中用戶與組是多對多關係，一個用戶除主組外還可屬於多個附加組，故一個用戶不能屬於多個組的說法不正確；其餘關於文件歸屬用戶、用戶必屬一個組及root權限的描述均正確。","567":"普通用戶可通過su切換身份，或以sudo在授權範圍內臨時獲得超級權限完成日誌管理、增刪用戶等任務，並非必須以root登錄後才能進行，故該說法不正確。","568":"限制無效登錄次數應在本地安全設置的賬戶鎖定策略中設置鎖定閾值、鎖定時間與重置計數器時間，達到閾值即鎖定賬戶；密碼策略管理密碼複雜度與有效期，審覈策略管理事件審計。","569":"安全日誌記錄登錄、特權使用、對象訪問、策略變更等與安全相關的事件，並不記錄網絡入侵行為；拒絕服務攻擊、口令暴力破解等入侵活動不會被安全日誌直接跟蹤，故D錯誤。","570":"SAM是Windows的用戶賬號數據庫，其信息只能由系統進程通過SAM服務訪問，對administrator與system並非直接可讀可寫，文件本身受系統保護，故C的說法錯誤。","571":"事務日誌記錄每筆事務修改數據的前後值，在系統故障時據此回滾未提交事務、重做已提交事務，將數據恢復到一致狀態，故其用途是數據恢復；完整性約束與保密性控制另有機制。","572":"攻擊者在遠程網頁的HTML代碼中插入惡意腳本，瀏覽器下載頁面時將腳本作為頁面內容解釋執行，從盜取用戶信息，此即跨站腳本漏洞；緩衝區溢出是內存寫越界，SQL注入針對查詢語句。","573":"網站數據庫中的口令通常以hash運算後的摘要值存儲，驗證時對輸入口令作同樣運算再比對，避免明文存儲被竊取後直接泄露；加密密文可被解密還原，安全性不及不可逆的摘要。","574":"XSS是攻擊者向網頁插入惡意代碼，用戶瀏覽時嵌入的代碼被瀏覽器執行，從而達到竊取會話信息、篡改頁面等攻擊用戶的目的；它並非DDoS或CC攻擊，後兩者是耗盡服務器資源的流量型攻擊。","575":"計算機病毒可將自身代碼注入引導區、注入扇區中的文件鏡像，也可嵌入文檔或模板的宏代碼中隨宏執行；純文本文件不含可執行代碼，注入其中的代碼無法運行，故C說法不正確。","576":"信息安全漏洞源於設計、實現與配置的缺陷，其載體是網絡協議、操作系統和應用系統等實現環節；業務數據是漏洞被利用後遭受損害的保護對象，本身不構成漏洞載體。","577":"Smurf攻擊向網段廣播地址發送大量源地址僞造成受害主機IP的ICMP_echo請求，網段內大量主機同時應答形成放大式拒絕服務，故其利用的是ICMP協議。","578":"攻擊者截獲通信一方的公鑰後替換為自己的公鑰發送給接收者，使雙方以為使用真實公鑰加密而實際由攻擊者解密轉發，屬典型的中間人攻擊；重放攻擊是重複發送截獲報文，字典攻擊針對口令。","579":"IP欺騙中攻擊者須與目標主機進行會話並猜出其TCP序列號的遞增規律，才能僞造出被目標接受的數據包，此步難度最高；先對被冒充主機實施拒絕服務攻擊，是使其無法干擾會話。","580":"標準C語言字符串庫中的strcpy、strcat等函數不檢查邊界，正是緩衝區溢出漏洞的常見成因，使用它無防護作用；嚴格驗證輸入長度、過濾不合規則字符、改用安全字符串庫纔是有效防護。","581":"模糊測試以大量隨機及畸形輸入數據激勵被測目標引發異常，屬採用大量測試用例的激勵—響應測試，主要發現軟件漏洞與可靠性錯誤；它並非毫無理論依據的試探性測試，故C不屬其特性。","582":"軟件安全需求分析的主要任務是確定團隊負責人與安全顧問、定義安全和隱私需求、設立最低安全標準與Bug欄等；威脅建模屬於安全設計階段的活動，不是需求分析所解決的任務。","583":"PDCA中的ACT處置環節針對檢查發現的問題進行糾正並總結標準化經驗，目的是持續改進信息安全管理過程；建立環境屬Plan，實施風險處理計劃屬Do，持續監視與評審風險屬Check。","584":"風險管理通過評估、處置、接受與溝通把風險控制在可接受水平，風險只能降低、轉移、規避或接受，並不能徹底消除，故將風險消除的說法不正確。","585":"風險分析過程是對標識出的威脅、脆弱性及其後果進行評估，判斷風險發生的可能性與影響程度；風險要素標識負責發現威脅、脆弱性與現有控制措施，風險結果判定則將風險值與準則比對分級。","586":"風險是威脅利用資產脆弱性並造成影響的可能性，影響則是威脅已造成損害的實際結果；脆弱性是被利用的條件而非增加威脅，風險也不會引起脆弱性，故D最準確。","587":"當必須採取的安全對策成本超過風險可能造成的潛在損失時，繼續投入不符合成本效益，管理者可選擇接受該風險而不採取措施；風險是否在部門控制之內、能否提升生產力均非不作為的理由。","588":"定量與定性分析各有適用場景，方法本身無絕對優劣，能符合組織的風險容忍度、資源與管理要求的評估方法即為最優方法；同一組織常結合多種方法，工具多寡也不是取捨依據。","589":"轉移風險是將風險後果連同部分責任轉嫁給第三方，如購買保險或聘用第三方專業公司提供維護外包服務；部署安全審計系統、實時監控網絡行為、制訂制度體系均屬降低風險的措施。","590":"ISO27002的前身是ISO17799-1，給出供組織選用的信息安全管理最佳實踐，每項控制措施按控制措施、實施指南與其他信息三部分描述；其控制措施按各大類平等排列，並未將風險評估與處置置於核心地位。","591":"信息資產的分類與分級由信息資產所有者負最終責任，因其最瞭解資產的價值、敏感性和業務影響；高級管理層與部門經理負責指導和批准，最終用戶只按分級結果執行具體操作。","592":"信息安全策略是組織高層對信息安全工作意圖與方向的正式表達，為整個管理體系確立原則與框架；保護標準的建議、訪問控制指引屬下層的標準與規範，分階段處理結果屬措施執行。","593":"最小特權原則要求用戶和程序有且僅有執行其崗位任務所足夠的許可和權限，多餘權限一律不予授予；敏感崗位輪換、工作分解分配、防止權限累計屬職責分離等其他原則。","594":"普通用戶需瞭解制度由誰制定發佈、由誰監督執行以及違反制度將受到的懲戒措施；災難恢復的整體工作流程屬管理層與應急響應團隊掌握的內容，普通用戶只需知悉自身的配合事項。","595":"系統程序員負責開發安全系統軟件，若同時獲得對該軟件的訪問與操作權限，即可自行修改並掩蓋痕跡，破壞開發與運行審覈的分離；數據安全管理員、分析員和系統審覈員屬運行與監督角色。","596":"國家標準《信息系統災難恢復規範》依據數據備份點、網絡、系統、數據、技術、人員、預案七項要素，將災難恢復能力劃分為六個等級，等級越高要求越完備，故為七要素、六級。","597":"恢復點目標RPO指災難發生後系統和數據必須恢復到的時間點要求，即所能容忍的數據丟失窗口，由備份週期決定；恢復到運行狀態所需的時長屬恢復時間目標RTO。","598":"演練深度由低到高依次為系統級演練、應用級演練、業務級演練：系統級只驗證單個系統的切換，應用級驗證應用系統整體恢復，業務級驗證業務連續運作與組織協同，範圍逐級擴大。","599":"能力程度模型認為組織的能力依賴於嚴格定義、管理完善、可測可量化的有效業務過程，過程成熟度決定結果質量；它並非僅憑工程成果判斷能力，其出發點與統計過程控制理論一致。","600":"SSAM即系統安全工程評估方法，為系統安全工程能力成熟度模型提供評估過程能力的方法；ISSE是系統安全工程過程本身而非評估方法，SSR、CEM亦非該模型的評估方法。","601":"保證過程的邏輯順序是先通過觀察、認證、分析與測試等手段驗證與證實安全，再由這些驗證結果為建立保證論據提供證據支持，選項 D 將兩者的支持關係說反，故為錯誤說法。","602":"SSE-CMM 能力等級二（計劃和跟蹤）要求組織為過程域的實施建立計劃與跟蹤機制，並配置足夠的人力、資金與基礎設施，因此達到二級即可為過程域實施提供充分資源；三級以上側重過程標準化與量化改進。","603":"立項階段的重點是標識與論證安全需求，包括明確業務對信息安全的要求、標識法律法規要求並論證其正確完整性；通過測試證明系統功能與性能滿足安全要求屬於測試驗收階段的工作，並非立項階段必須完成。","604":"建設工程師的職責是審覈驗收測試方案、監督驗收測試過程並審覈驗收測試報告；驗收測試方案應由建設單位或第三方測試機構編寫，以保持測試的獨立性與公正性，故編寫方案不是建設工程師的工作。","605":"招標階段監理單位質量控制的內容，是根據監理單位的信息安全保障知識和項目經驗完成招標文件中的技術需求部分；協助建設單位提出工程需求、確定工程整體質量目標屬於立項階段的工作，對標書應答的技術部分進行審覈屬評標階段的工作。","606":"ISO/IEC JTC 1 是信息技術聯合技術委員會，其下屬的 SC 27（安全、密碼與隱私技術分技術委員會）專責信息安全與密碼技術標準化；SC 37 等分委會負責生物特徵標識等領域，並非信息安全主責機構。","607":"信息系統安全保護等級由業務信息與系統服務受侵害的客體及其嚴重程度客觀決定，是信息系統的客觀屬性，定級時不應考慮已採取或將採取的安全保護措施，也不以風險評估結果為依據，且須兼顧業務信息與系統服務。","608":"歐洲的 ITSEC 首次明確提出保密性、完整性與可用性三項信息安全特徵，並將安全性與評估保證分離；TCSEC 與彩虹系列橙皮書主要針對軍方保密性需求，僅突出保密性與完整性，未完整提出三性並列框架。","609":"《計算機信息系統國際聯網保密管理規定》由國家保密局制定發佈，規範國際聯網環境下的保密管理；公安部主管計算機信息系統安全保護監督工作，國家密碼管理部門負責密碼管理，均非該規定的制定主體。","610":"我國信息安全管理堅持“積極防禦、綜合防範”的方針，而非“檢測、快速響應、綜合治理”；其餘三項關於各司其職齊抓共管、法律管理技術手段並用以及“誰主管誰負責、誰經營誰負責”的責任原則均為正確表述。","611":"《信息安全等級保護管理辦法》由主管部門聯合印發，屬於部門規範性文件與管理辦法，並非全國人民代表大會及其常務委員會制定的法律；保守國家祕密法、刑法與國家安全法均屬與信息安全相關的國家法律。","612":"刑法第二百八十五條規定，違反國家規定侵入國家事務、國防尖端技術科學研究、尖端技術領域的計算機信息系統的，處三年以下有期徒刑或者拘役，故該罪的主刑為三年以下有期徒刑或拘役，罰金並非該條規定的刑罰。","613":"IIS 支持的訪問控制過濾類型包括基於網絡地址（IP 地址）與域名的訪問限制、網站服務器訪問許可以及 NTFS 文件系統許可；異常行為過濾屬於入侵檢測系統的檢測機制，不是 IIS 提供的訪問控制類型。","614":"同步數據備份將生產數據實時複製到備份介質，數據丟失量極小，適用於恢復點目標 RPO 短、要求接近零數據丟失的關鍵業務；恢復時間目標 RTO 較長或對災難承受能力高的場景，採用週期性離線備份即可。","615":"信息安全保障組織架構有集中管理與多部門分別管理並加強協調兩種形式。美國由國土安全部（DHS）、國家安全局（NSA）、國家標準與技術研究院（NIST）、管理和預算辦公室（OMB）等多個部門分別承擔信息安全相關工作並加強協調，屬多部門協調做法；德國、法國等國由專門機構集中統籌。","616":"信息系統與威脅態勢持續變化，信息安全保障必須貫穿系統全生命週期持續開展、不斷改進，並非一次性活動；保障的目的確為支撐業務高效穩定運行，並需將信息安全技術與管理相結合，以安全促發展、在發展中求安全。","617":"等級保護工作依定級、備案、建設整改、等級測評、監督檢查的順序依次開展：先確定安全保護等級並向公安機關備案，再按標準進行建設整改，通過等級測評驗證防護效果，最後由職能部門組織監督檢查。","618":"將觀察到的活動與認為正常的活動基準進行比較並標識重要偏差以發現入侵事件，這種機制稱為異常檢測，其優點是能發現未知攻擊；特徵檢測依賴已知攻擊模式庫，差距分析與比對分析並非入侵檢測的標準術語。","619":"軟件缺陷密度的計算公式為：軟件缺陷密度 = 缺陷數 ÷ 千行代碼數（KLOC）。本題題幹給出的是 296 萬行源代碼，換算為千行：296 萬行 = 2960000 行 = 2960000 ÷ 1000 = 2960 KLOC。總共被檢測出 145 個缺陷，因此缺陷密度 = 145 ÷ 2960 ≈ 0.049（Defects/KLOC）。所以選B。（注意：本題另有題幹寫作“29.6萬行”的變體，那一版的答案是 0.49，即選C；做題時以本題題幹中的“296萬行”為準。）","620":"GB/T18336《信息技術安全性評估準則》中的評估保證級共分為7個遞增的評估保證等級,分別是EAL1至EAL7。","621":"正確答案：B。應用風險管理、軟件安全接觸點和安全知識","622":"正確答案：D。為數據處理系統建立和採取技術、管理的安全保護,保護計算機硬件、軟件、數據不因偶然的或惡意的原因而受到破壞、更改、泄露","623":"《信息安全技術信息安全事件分類分級指南》(GB/Z20986-2007)“信息系統的重要程度主要考慮信息系統所承載的業務對國家安全、經濟建設、社會生活的重要性以及業務對信息系統的依賴程度,劃分為特別重要信息系統、重要信息系統和一般信息系統。”","624":"RTO(恢復時間目標):指從災難發生到信息系統恢復運行所需的時間,即業務中斷的容忍上限。","625":"業務高峯期測試的風險:性能影響:滲透測試的流量或攻擊行為可能加劇系統負載,導致業務中斷或數據丟失。","626":"選項A:隱藏錯誤原因與避免緩衝區溢出沒有直接關係,緩衝區溢出是由於程序未正確檢查緩衝區邊界導致的。選項B:安全處理系統異常是一個寬泛的概念,隱藏錯誤原因主要是為了減少信息泄露,而不是單純的安全處理異常。選項C:隱藏錯誤原因與安全使用臨時文件無關,臨時文件的安全使用主要涉及文件的訪問權限、存儲位置等方面。選項D:“最小化反饋信息”是安全領域的核心原則之一,即僅向用戶提供必要的信息,避免泄露系統內部細節。是為了最小化反饋給用戶的信息,防止攻擊者利用這些詳細錯誤信息進行進一步的攻擊。","627":"A選項資產識別並賦值是對資產本身進行;B選項脆弱性識別並賦值是找系統的弱點;D選項確認已有的安全措施並賦值是對安全措施相關,所以選C。","628":"DDoS(分佈式拒絕服務)攻擊的主要目的是通過大量的請求使目標系統資源耗盡,無法正常為合法用戶提供服務,從而破壞系統的可用性。A選項保密性是防止信息泄露;C選項不可否認性和D選項抗抵賴性是防止發送方或接收方否認已經發生的行為,所以選B。","629":"向Web頁面插入惡意html代碼的攻擊方式稱為跨站腳本攻擊(XSS)。分佈式拒絕服務攻擊(DDoS)是通過大量合法的請求佔用大量系統資源,使合法用戶無法得到服務響應;SQL注入攻擊是通過在應用程序中注入惡意的SQL代碼,竊取或篡改數據庫中的數據;緩衝區溢出攻擊是通過向程序的緩衝區寫入超過其容量的數據,導致程序崩潰或執行惡意代碼。所以選B。","630":"正確答案：B。MM 的思想來源於項目管理、質量管理和過程管理","631":"操作(1)中關閉不必要的服務和端口,但不是所有端口,A選項錯誤;操作(2)在“本地安全策略”中配置公鑰策略是合理的,B選項錯誤;操作(3)備份敏感文件是必要的安全措施,不會導致文件遭到竊取幾率增加,C選項錯誤;操作(4)應該開啓審覈策略,以便記錄系統活動,便於安全審計,所以選D。","632":"選項A錯誤:直接關閉日誌共享,禁止總部提取日誌進行分析,會影響總部對安全事件的分析和處理,不是合理的措施。選項B錯誤:接受此風險會帶來敏感信息泄露的安全問題,不是降低攻擊面的做法。選項C錯誤:取消日誌不利於對系統安全事件的監測和分析,不是合理的措施。選項D正確:只允許特定的IP地址從前置機提取日誌,對日誌共享設置訪問密碼且限定訪問時間,可以降低攻擊面,減少安全風險。","633":"系統安全工程能力成熟度模型(SSE-CMM)定義了6個能力級別,當工程隊伍不能執行一個過程域中的基本實踐時,該過程域的過程能力是0級,A選項正確。達到SSE-CMM最高級後,工程隊伍執行同一個過程,每次執行結果質量會提高,但不是必須相同,B選項錯誤;SSE-CMM定義了6個基本實踐,而不是3個風險過程,C選項錯誤;SSE-CMM強調系統安全工程與其他工程學科的相似性和相關性,D選項錯誤。所以選A。","634":"PPTP(點對點隧道協議)和L2TP(第二層隧道協議)是數據鏈路層協議;SSL(安全套接層)是依附於傳輸層的安全協議,用於保障網絡通信的安全;IPSec是網絡層的安全協議。","635":"A選項將涉密計算機、涉密存儲設備接入互聯網及其他公共信息網絡,B選項通過普通郵政等無保密措施的渠道傳遞國家祕密載體,C選項在私人交往中涉及國家祕密,都屬於違反國家保密規定的行為;D選項以不正當手段獲取商業祕密屬於侵犯商業祕密的行為,不屬於違反國家保密規定的行為,所以選D。","636":"電子證據取證工作不僅包括“證據的獲取和保護”,還包括“證據的分析(如還原攻擊過程)和提交(如形成法律認可的證據報告)”。","637":"用戶通過HTTP協議訪問信息系統,在服務器端檢查用戶名和密碼正確性完成鑑別,這是單向鑑別,即一方對另一方的身份進行驗證。雙向鑑別是雙方互相驗證身份;三向鑑別和第三方鑑別題幹未體現,所以選A。","638":"信息安全風險評估分自評估、檢查評估兩種形式,應以自評估為主,自評估和檢查評估相互結合、互為補充。","639":"根據ISO/IECTR13335-1揭示的風險各要素關係模型,降低風險對組織產生的影響,組織應根據風險建立響應的保護要求,通過構架防護措施來達成。B選項“加強防護措施,降低風險”表述過於籠統,沒有明確建立保護要求與構架防護措施的邏輯;C選項減少威脅和脆弱點是降低風險的手段,但沒有體現出基於風險建立保護要求並構架防護措施這一完整邏輯;D選項減少資產不是降低風險的合理常規方式,還可能影響組織正常運營。所以選A。","640":"小張在Windows系統中的“本地安全策略”中配置賬號策略、本地策略、公鑰策略和IP安全策略,這屬於制定安全策略的操作。A選項關閉不必要的服務、B選項關閉不必要的端口,題幹中均未提及;D選項查看日誌記錄與配置這些策略無關。所以選C。","641":"SSE-CMM強調系統安全工程與其他工程學科如軟件工程、硬件工程、通信工程等是相互關聯和影響的,並非獨立工程。","642":"WPA是依照802.11i標準草案制定的,而WPA2是依照802.11i正式標準制定的。A選項WPA和WPA2都是無線局域網安全協議;B選項WPA並非僅適用於中國;C選項WPA和WPA2都使用了密碼算法對接入進行認證。所以選D。","643":"二十世紀二十年代德國發明家亞瑟謝爾比烏斯發明的Enigma密碼機,開始使用機械代替手工計算,形成了機械式密碼設備,屬於近代密碼發展階段。A選項古典密碼階段主要靠直覺和技巧設計密碼,常用替代和置換方法,該階段不符合;C選項現代密碼學的早期發展階段以香農的論文為理論基礎;D選項現代密碼學的近期發展階段以公鑰密碼思想為標誌。所以選B。","644":"項目有明確的開始日期和結束日期,結束日期不是由項目領導者隨機確定的,而是根據項目目標、範圍、資源等多種因素預先規劃好的。","645":"Cookie是為了辨別用戶身份,進行會話跟蹤而存儲在用戶本地終端上的數據,用戶不僅可以隨意查看存儲在Cookie中的數據,其中的內容也可以被修改。","646":"定性風險分析雖然憑藉分析者的經驗和直覺或者業界的標準和慣例,但並不是具有隨意性,而是在一定規則和經驗基礎上進行的。","647":"入侵檢測系統的主要作用是發現並報告系統中未授權或違反安全策略的行為。A選項防火牆主要實現內外網邏輯隔離,不能實現物理隔離。B選項安全隔離與信息交換系統(網閘)需要信息交換時,同一時間只能和一個不同安全級別的網絡連接;D選項虛擬專用網是在公共網絡中利用隧道技術建立臨時、安全的通信網絡,不是永久。","648":"信息分類控制的目標是為了確保信息受到適當級別的保護,通常採取分類指南、信息的標記和處理等控制措施。A選項資產清單是資產管理中對資產進行登記的內容;B選項資產責任人是明確資產管理責任;C選項資產的可接受使用是規定資產的使用規範。","649":"安全等級保護制度是國家信息安全保障的基本制度、基本策略和基本方法,具有行政法律責任強制力。","650":"選項C禁止使用微軟的IE瀏覽器而統一要求使用Chrome瀏覽器,這種做法過於絕對。不同瀏覽器都有其特點和適用場景,而且不能從根本上解決病毒感染問題,因為其他瀏覽器也可能存在安全漏洞,不太適合推廣。","651":"選項D中,信息安全管理體系主要側重於信息安全方面的管理,雖然也會涉及組織機構、制度、技術防護和人員意識等內容,但與其他管理體系在目標和重點上有明顯區別,不能簡單等同。","652":"解析:Kerberos協議中,用戶在網絡中進行一次身份認證後獲得安全憑證,憑藉該安全憑證可以訪問其授權的所有網絡資源,而不再需要其他的身份認證過程,實現單點登錄。用戶名只是用戶身份的標識;加密密鑰和會話密鑰是用於加密和解密數據的工具,不是實現單點登錄時在多個應用系統之間傳遞或共享的消息。","653":"《國家信息化領導小組關於加強信息安全保障工作的意見》(中辦2003年27號文件)規定了信息安全工作的原則,例如立足國情、以我為主、堅持技管並重等。","654":"選項D威脅和漏洞是不同的概念,威脅是指可能對系統造成損害的潛在因素,而漏洞是系統中存在的弱點,威脅可能利用漏洞進行攻擊,但不能說威脅就是漏洞。","655":"選項C雖然國家網絡安全法對一些單位有信息安全相關的要求,但並不是對所有單位都強制要求編制信息安全應急響應預案,該說法過於絕對,不適合作為編制預案的理由。","656":"選項A策略是指導原則,不直接參與過程管控;選項B管理者負責制定方針、監控過程、確保資源,是過程方法的核心管控角色;選項C組織是主體,而非過程中的管控節點;選項D活動是過程的組成部分,在ISO9001:2000標準的過程方法模型中,過程被定義為一組“相互關聯或相互作用的活動”,這些活動利用資源將輸入轉化為輸出。題目附圖中的藍色矩形框代表一個“過程”,框內五個小方塊表示流程步驟,而括號位於該過程框的上方,通常標註的是過程的組成單位,即“活動”。","657":"按照PDCERF應急響應方法,消除或阻斷攻擊源、找到並消除系統的脆弱性/漏洞、修改安全策略、加強防範措施、格式化被感染惡意程序的介質等工作處於根除階段,目的是徹底消除安全事件的影響和根源。準備階段主要是進行應急響應的準備工作;檢測階段是發現安全事件的發生;遏制階段是採取措施防止事件的進一步擴大。所以選D。","658":"Kerberos協議的三個階段順序為:首先Kerberos獲得票據許可票據,用戶向認證服務器AS申請票據許可票據;然後Kerberos獲得服務許可票據,用戶憑藉票據許可票據向票據授權服務器TGS申請服務許可票據;最後Kerberos獲得服務,用戶憑藉服務許可票據嚮應用服務器申請服務。所以順序是(3)-(1)-(2)。","659":"選項D:我國早期計算機安全事件的應急響應工作主要包括計算機病毒防範和“千年蟲”問題的解決,但這與對信息安全事件進行分類分級管理的原因無關。","660":"按培訓優先級排序：選項A優先級最高——管理層是安全策略的決策者，其法律意識直接影響企業合規性和資源投入，屬於“自上而下”的安全文化推動；選項B優先級中等——安全專崗是技術防護的核心力量，CISP 認證能系統提升其專業能力，屬於“關鍵能力建設”；選項D優先級次之——全員培訓覆蓋範圍廣、是法律合規的體現，需長期持續推進；選項C優先級最低——給本就懂技術的人員培訓安全基礎，培訓效果最低，例如網絡管理員本身已具備安全基礎知識。本題問的是“不合理的是”，所以選C。注：若該題變為選出最合理的，則選A。","661":"選項A:使用專用上網購物用計算機是正確的,但不安裝系統軟件和應用軟件的升級是不好的操作習慣。軟件升級通常包含安全補丁,可以修復已知的安全漏洞,提高系統的安全性,不升級會使計算機容易受到攻擊。","662":"在國家標準GB/T20274.1-2006《信息安全技術信息系統安全保障評估框架第一部分:簡介和一般模型》中,信息系統安全保障模型包含保障要素、生命週期和安全特徵三個方面。保障要素是實施安全保障的基礎;生命週期涵蓋了信息系統從規劃、設計、實施、運行到廢棄的整個過程;安全特徵則描述了信息系統應具備的安全屬性。","663":"選項B:修改用戶名和口令對於防範通過修改註冊表啓動項來達到長期駐留的木馬後門攻擊沒有作用。此類木馬後門主要關注的是系統的啓動機制和註冊表信息,與用戶名和口令無關。","664":"選項C:通信安全主要涉及信息在傳輸過程中的保密性、完整性和可用性等,合規性是指組織遵守相關法律法規和標準的要求,它們不屬於物理和環境安全領域中安全區域的控制措施。","665":"自主訪問控制安全性最低,強制訪問控制安全性最高,基於角色的訪問控制的靈活性和安全性介於自主訪問控制和強制訪問控制之間,並非安全性最高。","666":"選項A:P是Plan,指計劃,包括明確對象、方法,制定活動規劃,而不是Prepare(準備),該選項理解錯誤。","667":"RPO(恢復點目標)是指在一個信息系統發生重大信息安全事件後,工作人員在完成處置和災難恢復工作後,系統能容忍丟失的數據量所對應的時間點。該信息系統的RPO指標為3小時,意味着若該信息系統發生重大信息安全事件,工作人員在完成處置和災難恢復工作後,系統至多能丟失3小時的業務數據。","668":"選項A:隨機進程名技術每次啓動時隨機生成惡意代碼進程名稱,即使找到了某一次的進程名稱,下次啓動時進程名稱又會改變,所以不能僅僅通過找到進程名稱就找到惡意代碼程序本身,該選項描述錯誤。","669":"年度預期損失(ALE)的計算公式為:ALE=單次預期損失額(SLE)×年度發生率(ARO)。其中單次預期損失額(SLE)=資產價值×暴露係數(EF),已知資產價值為400萬元人民幣,暴露係數(EF)是25%,則SLE=400×25%=100萬元人民幣,年度發生率(ARO)為0.2,所以ALE=100×0.2=20萬元人民幣。","670":"遏制措施需根據事件類型和級別動態調整,但“完全關閉所有系統”或“拔掉網線”屬於極端手段,可能影響業務連續性。正確的遏制措施應平衡安全與業務需求(如隔離受感染設備、限制訪問權限)。“完全關閉所有系統”過於絕對,未考慮最小化影響原則。","671":"縱深防禦原則是指在信息系統中採用多層防護機制,從不同的角度對系統進行保護,以提高系統的安全性。本題中除了用戶名口令認證方式外,還加入基於數字證書的身份認證功能,同時對口令進行加密,採用了多種安全防護措施,遵循了縱深防禦原則,該選項正確。選項A:最小特權原則是指每個主體(用戶或進程)只被授予完成其任務所必需的最小權限集合。選項B:職責分離原則是指將不同的職責分配給不同的人員或角色,以降低欺詐或錯誤的風險。選項D:最少共享機制原則是指儘量減少系統中共享資源的數量和範圍,以降低安全風險。","672":"識別需要保護的資產、面臨的威脅以及存在的脆弱性,並分別賦值,同時確認已有的安全措施,形成需要保護的資產清單,這些工作是在風險評估階段完成的,而不是背景建立階段。","673":"HTTPS協議是基於HTTP協議並結合SSL協議,具備用戶鑑別和通信數據加密等功能,能夠提供更安全的網絡通信。而HTTP1.0協議和HTTP1.1協議不具備這些安全功能,HTTPD協議不是基於HTTP並結合SSL協議的協議。","674":"“統一威脅管理”常常被簡稱為UTM,它將防病毒、入侵檢測和防火牆等安全需求統一管理。FW是防火牆的簡稱,IDS是入侵檢測系統的簡稱,SOC是安全運營中心的簡稱。","675":"SAM服務的權限:安全賬戶管理器(SAM)是Windows中存儲用戶賬戶和密碼的數據庫,但用戶對鑑別信息的操作(如更改密碼)並非直接通過SAM服務以Administrator權限運行。實際流程:用戶通過LSASS(LocalSecurityAuthoritySubsystemService)進程提交密碼修改請求,LSASS調用SAM接口更新數據,且LSASS以SYSTEM權限運行(高於Administrator)。SAM是數據庫,而非獨立服務;密碼操作由LSASS代理,而非直接以Administrator權限運行SAM。","676":"A1風險值是由兩個值來決定,一個是安全事件的可能性,一個是安全事件造成的損失,先算第一個安全事件的可能性,就是它的發生的這個頻率,它是由這個威脅去乘以這個脆弱性的,A1資產有2個威脅,T1是利用的是2個脆弱性,就是1個威脅*2脆弱性,1*2=2,T2是3個脆弱性,就是1個威脅*3脆弱性,1*3=3,兩者比較,取值選大的,最後它發生的這個頻率是3,算出安全事件的可能性是3,然後再算第二個安全事件造成的損失。就是資產受到破壞的程度,它是由資產去乘以這個脆弱性,一個資產,正好是5個脆弱性,1*5=5。安全事件可能性是3,安全事件造成的損失是5,兩者比較,一個是3,一個是5,取值選大的,得到5,選C。","677":"系統工程需要使用定量分析和定性分析相結合的方法,通過建立實際對象的數學模型,應用合適的優化算法對模型求解,同時結合定性分析來綜合考慮各種因素,解決實際問題,而不是隻需使用定量分析的方法。","678":"在軟件開發需求分析階段開始考慮安全問題,進行安全設計和開發,可以避免在後期發現安全問題時進行大規模的代碼修改和系統調整,總體經費投入比軟件運行後的費用要低。開發階段不投入安全經費,後期解決安全問題往往代價更大。所以信息中心的考慮是正確的。","679":"選項A:模糊測試是通過向被測系統輸入非預期的、隨機的或畸形的數據,來檢測系統是否存在安全漏洞,而不是模擬正常用戶輸入行為生成大量數據包作為測試用例。選項B數據處理點、數據通道的入口點和可信邊界點往往是模糊測試的重點測試對象,因為這些地方容易出現安全漏洞。選項C:模糊測試主要是監測和記錄輸入數據後程序出現崩潰、異常等情況,而不是正常運行的情況。選項D:深入分析網站測試過程中產生崩潰或異常的原因,必要時需要測試人員手工重現並分析,這有助於找出系統的安全漏洞,所以D選項正確。","680":"《中華人民共和國計算機信息系統安全保護條例》(國務院147號令)首先計算機系統安全保護等級劃分思想提出;《關於信息安全等級保護工作的實施意見》(公通字[2004]66號)接着進行等級保護工作試點;然後等級保護相關政策文件頒佈;之後《信息系統安全等級保護基本要求》(GBT22239-2008)等級保護相關標準發佈;最後網絡安全法將等級保護制度作為基本國策。2017年《網絡安全法》正式將等級保護制度上升為法律層面的基本制度,是政策的最高保障所以正確順序是25134。","681":"《國家信息化領導小組關於加強信息安全保障工作的意見》(中辦發[2003]27號)明確了我國信息安全保障工作的方針和總體要求、加強信息安全保障工作的主要原則、需要重點加強的信息安全保障工作。27號文的重大意義是,它標誌着我國信息安全保障工作有了總體綱領,我國最近十餘年的信息安全保障工作都是圍繞此政策性文件來展開和推進的,促進了我國信息安全保障建設的各項工作。","682":"選項A不合理:/etc/passwd中用戶ID(UID)=0的賬戶是root賬戶(系統超級管理員),禁用所有UID=0的用戶會導致系統失去超級管理員,無法進行核心配置、維護操作,破壞系統正常運行。正確做法是加強root賬戶保護(如禁止遠程登錄),而非禁用。","683":"選項A:風險降低是指採取措施降低風險發生的可能性或減少風險發生後造成的損失。安裝FTP服務漏洞補丁程序並加固FTP服務安全措施,降低了服務器因FTP服務漏洞被攻擊的風險,屬於風險降低,所以A選項正確。","684":"選項A:配置虛擬專用網絡主要是用於在不同網絡之間建立安全的通信通道,不能將廣播流限制在固定區域內,所以A錯誤。\n選項B:動態分配地址主要是解決IP地址分配和管理的問題,不能降低廣播流的帶寬消耗,所以B錯誤。\n選項C:為路由交換設備修改默認口令主要是提高設備的安全性,防止設備被非法訪問,不能解決廣播流的問題,所以C錯誤。\n選項D:VLAN劃分可以將一個物理網絡劃分為多個邏輯子網,將廣播流限制在固定區域內,降低網絡的帶寬消耗,所以D正確。","685":"ARP協議是網絡通信中用於解析IP地址和物理地址的重要協議,不能避免使用ARP協議和ARP緩存,否則網絡將無法正常通信。","686":"D選項:要求用windows10系統做開發,與軟件運行時被黑客遠程攻擊獲取數據的問題沒有直接關係,不能直接解決問題。","687":"D選項:BSI系列模型強調將安全內建到軟件開發過程中,而不是強調安全測試的重要性。","688":"雖然將應急響應管理過程分為準備、檢測、遏制、根除、恢復和跟蹤總結6個階段是一種被廣為接受的方法,但不能確保事件處理的成功,因為事件的不確定性和複雜性,所以D選項錯誤。","689":"選二級,按標準和政策來,國家政策66號文,等保分為5個等級,每個級別都叫自主定級,自主保護。明確三級及以上需測評。","690":"在保密通信過程中,會話密鑰不能一直使用。如果長期使用同一個會話密鑰,一旦該密鑰被破解,之前的所有通信內容都將面臨泄露風險,所以需要定期更換會話密鑰。","691":"選項A:訪問控制的作用不是對經過身份鑑別後的合法用戶提供所有服務,而是根據用戶的身份和權限,為其提供相應的服務,限制其對系統資源的訪問。","692":"A選項:訪問控制列表(ACL)是一種簡單有效的自主訪問控制方法,它通過在系統中為每個對象(如文件、目錄等)設置一個訪問控制列表,記錄哪些用戶或用戶組對該對象具有何種訪問權限。對於存在大量用戶的信息系統,ACL實現起來相對簡單,時間和資源消耗較少,A選項正確。","693":"選項A:增量備份是備份從上次完全備份或增量備份後更新的數據文件,而不是從上次完全備份後更新的全部數據文件,該說法錯誤。","694":"選項A:《風險評估方案》(含目的、範圍、進度等)是“準備階段”的核心文檔,用於明確評估計劃,不屬於識別階段。選項B:《風險評估方法和工具列表》是“準備階段”確定的評估手段,用於規範評估過程,不屬於識別階段。選項C:《風險評估準則要求》(含標準、分析方法、資產分類標準)是“準備階段”制定的評估依據,用於統一評估口徑,不屬於識別階段。選項D:《已有安全措施列表》記錄經檢查確認後的已有技術和管理各方面安全措施,是在風險要素識別階段,對資產面臨的風險進行識別時,需要考慮已有的安全措施情況,所以屬於該階段輸出的文檔。","695":"PDCERF方法論是應急響應的經典框架,其六個階段的固定順序為:\nPreparation(準備階段)→Detection(檢測階段)→Containment(控制階段)→Eradication(根除階段)→Recovery(恢復階段)→Follow-up(總結階段)","696":"選項D:IPsec的核心功能包括三方面:1數據保密性(ESP加密)、2數據完整性(AH/ESP認證)、3數據源認證(AH/ESP認證),部分場景還支持“抗重播攻擊”,並非“僅保證可認證性和保密性”。","697":"選項A:“娛樂型黑客”以個人興趣為驅動,無組織協作或資源支持,屬於“個人威脅”。\n選項B:“網絡犯罪團伙”有明確分工(如技術攻擊、資金轉移)、組織架構和資源支持,以非法經濟利益為目標,屬於“組織威脅”。\n選項C:“情報機構”是國家層面的官方組織,以獲取他國戰略情報為目標,屬於“國家威脅”。\n選項D:“信息作戰部隊”是國家軍事力量的組成部分,以破壞敵方信息系統、鞏固戰略優勢為目標,屬於“國家威脅”。","698":"選項A:DDoS攻擊的核心是“消耗目標資源,導致服務不可用”,對應STRIDE中的“DenialofService(拒絕服務)”,而非欺騙。","699":"PDR模型是信息安全保障工作中常用的模型。其思想是承認信息系統中漏洞的存在,正視系統面臨的威脅,通過採取適度防護、加強檢測工作、落實對安全事件的響應、建立對威脅的防護來保障系統的安全。所以依次應填入信息安全保障、信息系統、威脅、檢測工作。","700":"選項A正確描述了最小特權原則的核心思想,即僅分配用戶完成工作所需的最小權限,防止過度授權導致安全風險。選項B準確概括了最大共享策略的目標,即在保證數據庫安全屬性(完整性、保密性、可用性)的前提下,儘可能實現數據共享,避免過度限制導致數據庫失去實用價值。選項C數據庫安全中的粒度劃分需根據實際需求權衡安全與效率,並非粒度越小越好。例如,對整表設置權限可能降低管理複雜度,但若過度細化到字段級則可能影響性能。因此,實際應選擇合理適當的粒度。選項D正確描述了按內容訪問控制策略,即根據數據內容動態分配用戶權限,確保不同權限用戶僅能訪問其授權範圍內的數據。","701":"常規控制措施範圍包括信息安全方針、信息安全組織、資產管理;人力資源安全、物理和環境安全、通信安全;安全採購、開發與維護、合規性;安全事件管理、供應商關係等。業務安全性審計不屬於常規控制措施範圍。","702":"《網絡安全法》具有域外適用效力。對於來自境外的網絡安全威脅,我國可以組織技術力量進行監測、防禦和處置;對於來自境外的違法信息可以加以阻斷傳播;對於來自境外的網絡攻擊可以追究其法律責任,並非只能通過向來源國採取抗議。","703":"信息系統安全保障評估通過蒐集客觀證據,向相關方提供信息系統的安全保障工作能夠實現其安全保障策略,將風險降低到可接受程度的主觀信心。評估對象是信息系統,涉及信息系統整個生命週期,應提供動態持續的信心。所以順序為客觀證據、安全保障工作、信息系統、生命週期、動態持續。","704":"在TCP/IP協議中,數據封裝的順序是傳輸層、互聯網絡層、網絡接口層。傳輸層將數據封裝成段(Segment),添加傳輸層頭部;互聯網絡層將段封裝成包(Packet),添加IP頭部;網絡接口層將包封裝成幀(Frame),添加幀頭部和幀尾部。所以選B。","705":"根據相關文件,由公安部對等級保護測評機構管理,先開展測評體系建設試點工作,然後進行等級保護建設和開展等級測評工作,接受測評機構申請、考覈和定期由等級保護評估中心進行能力驗證,對不具備能力的測評機構取消授權。所以順序為測評體系、等級測評、等級保護評估中心、能力驗證、取消授權。","706":"符合性常規控制這一領域的控制目標主要包括符合法律要求、符合安全策略和標準以及技術符合性、信息系統審覈考慮等。訪問控制的業務要求、用戶訪問管理屬於訪問控制領域的控制目標,並非符合性常規控制領域的目標,所以答案選D。","707":"信息安全問題產生的根源要從內因和外因分析,內因是信息系統自身存在脆弱性,外因是外部有威脅源,二者共同作用導致信息系統可能發生安全事件。因此要防範信息安全風險,需從內外因同時着手,C選項正確。A選項杜絕脆弱性存在不現實;B選項避免有惡意攻擊可能的人接觸信息系統不能完全解決問題;D選項雖然人的因素重要,但內因和外因同樣關鍵,不能只強調人的因素。","708":"即使最好的安全產品也存在安全缺陷,所以任何系統最終都可能被找出漏洞。有效的對策是在敵手和目標之間配備多種安全機制,每種機制都應包括保護和檢測兩種手段。","709":"該事件是由於系統漏洞被攻擊者上傳木馬病毒並刪除數據,屬於有害程序事件。事件導致三個工作日數據丟失且OA系統兩天無法訪問,影響部分公司業務,根據GB/Z20986-2007《信息安全事件分級分類指南》,應定為較大事件(III級)。","710":"系統管理員對超級用戶權能的剝奪與恢復:\n傳統UNIX/Linux中,root權限是固有的,無法通過用戶層工具直接剝奪或恢復其核心權能(如CAP_SYS_ADMIN)。權能機制允許進程主動放棄權能(如通過capset系統調用),但系統管理員無法強制剝奪root的某些權能,除非修改內核參數或使用安全模塊(如SELinux)限制其行為。","711":"信息安全等級保護是我國的一項基礎制度,有一定強制性,主要目標是提高我國信息和信息系統安全建設的整體水平,重點保障基礎信息網絡和重要信息系統的安全。信息安全管理體系(ISMS)、NISTSP800、ISO27000系列都不是我國特有的基礎制度,答案選B。","712":"規避風險是指通過改變項目計劃,消除風險或產生風險的條件,或者保護項目目標免受風險的影響。小牛建議公司放棄涉及金融交易且風險太高的功能模塊,屬於規避風險的處置方法,答案選B。降低風險是通過降低風險發生的可能性或減少風險造成的損失來應對風險;轉移風險是將風險的後果連同應對的責任轉移給第三方;放棄風險表述不準確,一般是規避風險的說法。","713":"MD5是一種摘要算法,不能提供可靠的數據加密,A選項錯誤;AES算法是一種對稱加密算法,主要用於數據加密,不能提供可靠的數據完整性驗證,B選項錯誤;部署IPsecVPN網絡時,考慮IP地址規劃,在分支節點使用可聚合的IP地址段,可減少IPsec安全關聯(SA)資源的消耗,C選項正確;報文驗證頭協議(AH)主要提供數據完整性、數據源認證和抗重放攻擊,不能提供數據機密性,D選項錯誤。","714":"私有IP地址包括A類地址中的10.0.0.0-10.255.255.255,B類地址中的172.16.0.0-172.31.255.255,C類地址中的192.168.0.0-192.168.255.255。所以A類、B類和C類地址中都可以設置私有地址,答案選C。","715":"PKI(公鑰基礎設施)的主要理論基礎是公鑰密碼算法,通過公鑰和私鑰的配合實現加密、解密、數字簽名等功能,保障信息安全,答案選B。對稱密碼算法使用相同的密鑰進行加密和解密;量子密碼是一種新興的密碼技術;摘要算法主要用於生成數據的摘要信息,用於完整性驗證等。","716":"對於微軟發佈的系統漏洞補丁,不能因為尚未出現利用工具就不處理,B選項錯誤;也不能立即對所有服務器和客戶端安裝補丁,可能會因補丁兼容性問題影響系統正常運行,A選項錯誤;對於服務器等重要設備,應先在測試環境中安裝並確認補丁兼容性問題後再在正式生產環境中部署,而不是立即使用系統更新功能安裝,D選項錯誤;C選項的做法合理,能最大程度減少補丁對系統的影響。","717":"入侵檢測技術可以檢測並分析用戶和系統的活動、覈查系統的配置漏洞和評估系統關鍵資源和數據文件的完整性、識別違反安全策略的用戶活動。但防止IP地址欺騙通常需要通過網絡地址轉換(NAT)、訪問控制列表(ACL)等技術實現,入侵檢測技術不能直接實現,答案選C。","718":"參考《信息安全技術信息安全應急響應計劃規範》GB/T24363-2009,內容如下,“應急響應的工作機構由管理、業務、技術和行政後勤等人員組成”,不僅是業務和技術。","719":"常規控制措施範圍包括信息安全方針、信息安全組織、資產管理;人力資源安全、物理和環境安全、通信安全;安全採購、開發與維護、合規性;安全事件管理、供應商關係等。業務安全性審計不屬於常規控制措施範圍。","720":"信息安全管理體系雖然需要一定的投入,但從長遠來看,它能降低信息安全事件帶來的損失,提升組織的運營效率和競爭力,並非光花錢不掙錢。","721":"選項A:開發人員參加軟件安全意識培訓能提高他們對軟件安全的重視程度,減少因安全意識不足導致的漏洞,對解決軟件被攻擊問題有幫助。選項B:規範軟件編碼並制定安全編碼準則可以從源頭上減少軟件中的安全漏洞,降低被攻擊的風險。選項C:增加軟件安全測試環節能儘早發現軟件中的安全問題並及時修復,提高軟件的安全性。選項D:瀑布模型是一種軟件開發模型,它強調開發的階段性和順序性,但對解決軟件安全被攻擊問題沒有直接幫助,不能直接提升軟件的安全性。","722":"通過公衆網絡傳播非法軟件違反了法律法規和職業道德準則,會對網絡環境和社會造成危害。","723":"選項A:《風險評估方案》(含目的、範圍、進度等)是“準備階段”的核心文檔,用於明確評估計劃,不屬於識別階段。選項B:《風險評估方法和工具列表》是“準備階段”確定的評估手段,用於規範評估過程,不屬於識別階段。選項C:《風險評估準則要求》(含標準、分析方法、資產分類標準)是“準備階段”制定的評估依據,用於統一評估口徑,不屬於識別階段。選項D:《已有安全措施列表》記錄經檢查確認後的已有技術和管理各方面安全措施,是在風險要素識別階段,對資產面臨的風險進行識別時,需要考慮已有的安全措施情況,所以屬於該階段輸出的文檔。","724":"選項A:信息化建設中,信息安全與系統功能同樣重要,不能只強調系統功能的實現,而忽視信息安全,否則可能導致系統面臨各種安全威脅,該選項錯誤。","725":"選項A:應急響應是組織為應對突發/重大信息安全事件所做的準備以及事件發生後採取的措施,該說法正確。","726":"選項A:IATF的分層策略允許在適當的時候採用低安全級保障解決方案,以降低信息安全保障的成本,同時通過多層保護來提高整體安全性,該說法正確。","727":"選項A:增量備份是備份從上次完全備份或增量備份後更新的數據文件,而不是從上次完全備份後更新的全部數據文件,該說法錯誤。","728":"選項D:IPsec的核心功能包括三方面:1數據保密性(ESP加密)、2數據完整性(AH/ESP認證)、3數據源認證(AH/ESP認證),部分場景還支持“抗重播攻擊”,並非“僅保證可認證性和保密性”。","729":"正確答案：A。系統安全工程能力成熟度模型(SSE-CMM)定義了6個能力級別,當工程隊不能執行一個過程域中的基本實踐時,該過程域的過程能力為0級","730":"選項C雖然國家網絡安全法對一些單位有信息安全相關的要求,但並不是對所有單位都強制要求編制信息安全應急響應預案,該說法過於絕對,不適合作為編制預案的理由。","731":"SABSA模型包括六層,它是一個分層模型,在第一層從安全的角度定義了業務需求。模型的每一層在抽象方面逐層減少,細節逐層增加,層級建在其他層之上,從策略逐漸到技術和解決方案的實施實踐。其思路上創新提出了一個包括戰略、概念、設計、實施、度量和審計層次的安全鏈條。所以選B。","732":"ISMS建設的工作包括規劃與建立ISMS、實施和運行ISMS、監視和評審ISMS。而保持和審覈ISMS不屬於ISMS建設的工作,而是後續持續改進和監督的環節。所以選D。","733":"Kerberos協議的三個階段順序為:首先Kerberos獲得票據許可票據,然後Kerberos獲得服務許可票據,最後Kerberos獲得服務。所以排序正確的是(3)→(1)→(2),答案選B。","734":"A選項:信息安全需求報告應依據信息安全風險評估結果和有關政策法規和標準的合規性要求得到,而不是主要依據公衆服務信息系統的功能設計方案來撰寫,該說法錯誤。","735":"“實施內部審覈”是監視和評審ISMS階段的工作內容,用於檢查ISMS是否符合標準要求和實際運行情況,而不是保持和改進ISMS階段。","736":"信息系統建設完成後,三級以上的信息系統的運營使用單位應當選擇符合國家規定的測評機構進行測評合格後方可投入使用。","737":"年度預期損失(ALE)的計算公式為:ALE=單次預期損失額(SLE)×年度發生率(ARO)。其中單次預期損失額(SLE)=資產價值×暴露係數(EF),已知資產價值為400萬元人民幣,暴露係數(EF)是25%,則SLE=400×25%=100萬元人民幣,年度發生率(ARO)為0.2,所以ALE=100×0.2=20萬元人民幣。","738":"選項D威脅和漏洞是不同的概念,威脅是指可能對系統造成損害的潛在因素,而漏洞是系統中存在的弱點,威脅可能利用漏洞進行攻擊,但不能說威脅就是漏洞。","739":"選項A:CMM的基本思想是把軟件開發的努力集中呈現為一個有序的、有紀律的且能自我管理的軟件過程,從而生產出高質量的軟件,而不是認為問題是由技術落後引起且單純靠新技術運用提高質量等。","740":"PDR模型是信息安全保障工作中常用的模型。其思想是承認信息系統中漏洞的存在,正視系統面臨的威脅,通過採取適度防護、加強檢測工作、落實對安全事件的響應、建立對威脅的防護來保障系統的安全。所以依次應填入信息安全保障、信息系統、威脅、檢測工作。","741":"A1風險值是由兩個值來決定,一個是安全事件的可能性,一個是安全事件造成的損失,先算第一個安全事件的可能性,就是它的發生的這個頻率,它是由這個威脅去乘以這個脆弱性的,A1資產有2個威脅,T1是利用的是2個脆弱性,就是1個威脅*2脆弱性,1*2=2,T2是3個脆弱性,就是1個威脅*3脆弱性,1*3=3,兩者比較,取值選大的,最後它發生的這個頻率是3,算出安全事件的可能性是3,然後再算第二個安全事件造成的損失。就是資產受到破壞的程度,它是由資產去乘以這個脆弱性,一個資產,正好是5個脆弱性,1*5=5。安全事件可能性是3,安全事件造成的損失是5,兩者比較,一個是3,一個是5,取值選大的,得到5,選C。","742":"D選項:與外部各方相關風險的識別、處理外部各方協議中的安全問題屬於對外部各方風險管理的控制目標,不是組織內部信息安全管理的常規控制措施。","743":"VLAN(虛擬局域網)劃分可以將網絡劃分為多個邏輯上的子網,限制廣播流在固定區域內傳播,從而降低網絡的帶寬消耗。動態分配地址不能解決廣播流問題;設立入侵防禦系統主要用於防禦入侵行為;為路由交換設備修改默認口令是安全加固措施,但不能解決廣播流問題。所以選A。","744":"GaryMcGraw博士及其合作者提出軟件安全應由三根支柱來支撐,這三個支柱是應用風險管理、軟件安全接觸點和安全知識。A選項中源代碼審覈、風險分析和滲透測試是軟件安全測試和評估的常見方法;C選項中威脅建模、滲透測試是軟件安全的部分技術和方法,軟件安全接觸點是重要支柱之一;D選項中威脅建模、源代碼審覈和模糊測試也是軟件安全的相關技術和方法。","745":"C選項:基於SSE-CMM的工程不是獨立工程,它與軟件工程、硬件工程、通信工程等相互關聯,需要在整個系統工程的背景下進行規劃和實施。","746":"嚴重違反保密規定行為只要發生,無論是否產生泄密實際後果,都要依法追究責任。非法獲取國家祕密和過失泄露國家祕密,情節嚴重會構成刑事犯罪;承擔了刑事責任,還可能需承擔行政責任和/或其他處分。","747":"遏制措施需根據事件類型和級別動態調整,但“完全關閉所有系統”或“拔掉網線”屬於極端手段,可能影響業務連續性。正確的遏制措施應平衡安全與業務需求(如隔離受感染設備、限制訪問權限)。“完全關閉所有系統”過於絕對,未考慮最小化影響原則。","748":"《風險分析報告》是在風險評估階段對信息系統的資產、威脅、脆弱性等進行評估和分析後形成的文檔,用於確定信息系統面臨的風險狀況,屬於風險評估階段的輸出成果。風險處理階段是根據風險評估的結果採取相應的風險處理措施;批准監督階段是對風險處理措施的批准和監督;監控審查階段是對風險處理效果的監控和審查。所以選A。","749":"我國標準《信息安全風險管理指南》(GB/Z24364)給出“信息安全風險管理包括背景建立、風險評估、風險處理、批准監督、監控審查和溝通諮詢6個方面的內容。背景建立、風險評估、風險處理和批准監督是信息安全風險管理的4個基本步驟,監控審查和溝通諮詢則貫穿於這4個步驟中”。","750":"A選項:ACL在增加客體時,只需在客體的訪問控制列表中增加相關主體的訪問控制權限,操作較為簡單,該說法正確。","751":"Cookie是為了辨別用戶身份,進行會話跟蹤而存儲在用戶本地終端上的數據,用戶不僅可以隨意查看存儲在Cookie中的數據,其中的內容也可以被修改。","752":"定量風險分析雖然能得到量化結果,但需要大量準確數據和複雜模型,實際工作\n中往往難以滿足這些條件,且定性風險分析也有其優勢,如能快速識別主要風險,考慮\n難以量化的因素等,所以應根據實際情況選擇合適方法,不能只使用定量風險分析。A選\n項定量風險分析從財務數字上評估安全,度量風險可能性和損失量正確;C選項定性風險\n分析依賴分析者經驗,結果與團隊素質等密切相關正確;D選項定性主觀性強,定量客觀\n性強正確。","753":"選項C:應急響應是組織在處置應對突發/重大信息安全事件時的工作,其主要包括事件發生前的預防和準備、事件發生時的正確指揮和處置、事件發生後的全面總結和改進等工作,而不只是正確指揮和全面總結,該說法錯誤。","754":"A選項:在組織中,應由管理層制定並頒佈信息安全方針,為組織的ISMS建設指明方向並提供總體綱領,明確總體要求,而不是由信息技術責任部門制定。","755":"終端實體(用戶)從認證權威機構CA申請、撤銷和更新數字證書的流程中,中間框空白處應為RA(註冊機構),RA負責接收用戶的證書申請、審覈用戶身份等信息,並將申請轉發給CA。證書庫是存儲證書和CRL(證書撤銷列表)的地方;OCSP(在線證書狀態協議)用於實時查詢證書的狀態;CRL庫是存儲證書撤銷列表的數據庫。所以選B。","756":"選項B:GP適用於域維中所有過程區域(PA)的活動,而不僅僅是部分PA的活動,該說法錯誤。","757":"選項A:將損害的涉密計算機的國外品牌硬盤送到該品牌中國區維修中心修理,可能會導致涉密信息泄露,不符合《保守國家祕密法》要求。","758":"選項A:防火牆實現“邏輯隔離”(通過規則控制訪問),無法實現“物理隔離”(物理上斷開連接),表述錯誤。","759":"選項D不合理:/etc/passwd中用戶ID(UID)=0的賬戶是root賬戶(系統超級管理員),禁用所有UID=0的用戶會導致系統失去超級管理員,無法進行核心配置、維護操作,破壞系統正常運行。正確做法是加強root賬戶保護(如禁止遠程登錄),而非禁用。","760":"《國家信息化領導小組關於加強信息安全保障工作的意見》中辦發[2003]27號明確了我國信息安全保障工作的方針和總體要求、加強信息安全保障工作的主要原則、需要重點加強的信息安全保障工作。27號文的重大意義是,它標誌着我國信息安全保障工作有了總體綱領、我國最近十餘年的信息安全保障工作都是圍繞此政策性文件來展開和推進的、促進了我國信息安全保障建設的各項工作。所以選D。","761":"DDoS攻擊是通過大量合法的請求佔用大量系統資源,從而使合法用戶無法得到服務響應,破壞了系統的可用性。保密性是指信息不被泄露給非授權用戶;不可否認性和抗抵賴性類似,是指防止發送方或接收方否認自己發送或接收過信息。所以選B。","762":"選項A：普通用戶及其shell沒有任何權能，超級用戶及其shell在系統啓動之初擁有全部權能，這是基於權能的特權管理機制的特點，A正確。選項B：當普通用戶涉及特權操作時，通過setuid實現，即臨時獲得特權，B正確。選項C：權能機制允許進程主動放棄權能（如通過capset系統調用），但系統管理員無法強制剝奪root的某些核心權能（如CAP_SYS_ADMIN），除非修改內核參數或使用SELinux等安全模塊限制其行為，C錯誤。選項D：進程可以放棄自己的某些權能，以提高安全性，D正確。","763":"在保密通信過程中,會話密鑰不能一直使用。如果長期使用同一個會話密鑰,一旦該密鑰被破解,之前的所有通信內容都將面臨泄露風險,所以需要定期更換會話密鑰。","764":"可接受的風險是指在綜合考慮了風險的成本、收益等因素後,組織願意承擔的風險。最小的風險表述不準確;殘餘風險是在採取了風險處理措施後仍然存在的風險;未識別的風險是尚未被發現的風險。所以選D。","765":"《網絡安全法》中網絡的定義是指由計算機或者其他信息終端及相關設備組成的按照一定的規則和程序對信息進行收集、存儲、傳輸、交換、處理的系統,涵蓋處理各種信息的設備的網絡空間。計算機局域網只是網絡的一種形式;包含服務器、交換機等設備的系統表述不準確;人與人交往聯繫的社會網絡不是《網絡安全法》中網絡的定義。所以選C。","766":"選項A:在實際應用中,密碼協議應按照明確的步驟制定,不能過於靈活和模糊,否則會導致協議執行的不一致和安全問題。","767":"信息安全保障技術框架(IATF)的目的是為保障政府和工業的信息基礎設施提供了技術指南。其核心思想是深度防禦。深度防禦戰略的三個核心要素是人員、技術和運行(亦稱為操作)。所以選A。","768":"使用專用上網購物計算機是好的習慣,但安裝好軟件後不進行系統軟件和應用軟件的升級是錯誤的。軟件升級通常包含安全補丁,能修復已知漏洞,提高系統安全性。B選項,為計算機安裝具有良好聲譽的安全防護軟件,包括病毒查殺、安全檢查和安全加固方面的軟件,能有效防範安全威脅;C選項,在IE的配置中設置只能下載和安裝經過簽名的、安全的ActiveX控件,可防止惡意控件的安裝;D選項,在使用網絡瀏覽器時設置不在計算機中保留網絡歷史紀錄和表單數據,能減少個人信息泄露的風險。","769":"安裝FTP服務漏洞補丁程序並加固FTP服務安全措施,降低了服務器A的FTP服務存在高風險漏洞帶來的風險,屬於風險降低的處理方式。風險規避是採取措施避免風險的發生;風險轉移是將風險轉移給其他方;風險接受是接受風險的存在。所以選A。","770":"《保密法》第二十三條規定存儲、處理國家祕密的計算機信息系統(以下簡稱涉密信息系統)按照涉密程度實行分級保護。涉密信息系統應當按照國家保密標準配備保密設施、設備。保密設施、設備應當與涉密信息系統同步規劃、同步建設、同步運行(三同步)。涉密信息系統應當按照規定,經檢查合格後,方可投入使用。所以選A。","771":"C選項:CC標準並沒有強調將安全的功能和保證分離","772":"選項C禁止使用微軟的IE瀏覽器而統一要求使用Chrome瀏覽器,這種做法過於絕對。不同瀏覽器都有其特點和適用場景,而且不能從根本上解決病毒感染問題,因為其他瀏覽器也可能存在安全漏洞,不太適合推廣。","773":"人力資源安全劃分為3個控制階段,分別是任用之前、任用中、任用終止或變化。任用之前主要是對人員的背景調查、資質審查等;任用中包括對人員的安全意識培訓、權限管理等;任用終止或變化時涉及權限回收、信息交接等。而任用公示不屬於人力資源安全的控制階段內容,所以答案選D。","774":"根據信息安全風險要素關係:“威脅利用脆弱性,作用於資產,產生安全事件,導致資產損失”。","775":"選項A:信息安全管理體系的建立應基於組織自身的業務需求、風險狀況等因素,而不是單純基於最新的信息安全技術。雖然要遵循國家有關信息安全的法律和法規,但這不是基於最新技術,且信息安全管理體系強調的是管理,而非僅僅依靠技術預防控制。","776":"依據國家標準GB/T20274《信息系統安全保障評估框架》,信息系統安全目標(ISST)中,安全保障目的包含信息系統整體安全保障目的、管理安全保障目的、技術安全保障目的和工程安全保障目的。","777":"美國已經設立中央政府級的專門機構。","778":"CNCI第一個防線針對漏洞進行風險控制,第二個防線針對威脅進行風險控制,總體的目標是降低網絡風險。B、C、D答案均無法從題幹反應。","779":"用戶通過賬號、密碼和驗證碼成功登陸銀行個人網銀系統,此過程是個人網銀系統對用戶身份的單向鑑別,即系統驗證用戶身份的合法性。不是雙向鑑別(雙向鑑別是雙方互相驗證身份);也不是由可信第三方完成的用戶身份鑑別;用戶沒有對個人網銀系統合法性進行鑑別。所以選C。","780":"Alice用Bob的公鑰加密明文,將密文發送給Bob,Bob再用自己的私鑰解密,恢復出明文,這種密碼體制為公鑰密碼體制,也稱為非對稱密碼體制。對稱密碼體制、私鑰密碼體制、單鑰密碼體制都是指使用相同密鑰進行加密和解密的密碼體制。所以選D。","781":"實體所有鑑別包括身份證、IC卡、鑰匙、USB-Key等。","782":"題目中安全登錄會涉及到賬號密碼為實體所知,智能卡和短信是實體所有。","783":"滲透測試是模擬攻擊的黑盒測試,有利於發現系統明顯的問題。","784":"用戶隱私保護應告訴用戶收集數據及使用方式,給用戶選擇是否允許使用數據的\n權利,確保數據使用符合法律法規。用戶提交的用戶名和密碼屬於隱私數據,但其他如\n用戶行為數據、偏好數據等也可能屬於隱私數據,C選項說法錯誤。","785":"軟件的安全測試根據實際情況進行測試措施的選擇和組合。","786":"定義主體訪問客體的權限叫作CL。定義客體被主體訪問的權限叫ACL。","787":"RBAC模型能實現多級安全中的訪問控制。","788":"TACACS+是AAA權限控制系統,不屬於VPN。","789":"令牌是基於實體所有的鑑別方式。","790":"在技術條件允許情況下,可以實現IDS和FW的聯動。","791":"權限分離是將一個較大的權限分離為多個子權限組合操作來實現。","792":"SHA不提供加密,SHA是摘要算法提供數據完整性校驗。","793":"IPS在串聯情況下,會影響網絡性能。","794":"在多重備份存儲情況下,可以防護日誌被篡改的攻擊(前提非實時同步)。","795":"一個用戶可以屬於多個組。","796":"操作系統和應用安全裝應分開不同磁盤部署。","797":"賬號鎖定是為了解決暴力破解攻擊的。","798":"D屬於社會工程學攻擊。","799":"設計階段是發現和改正問題的最佳階段。","800":"SAMM模型四個部分是治理、構造、驗證和部署。","801":"SSE-CMM是面向工程過程質量控制的一套方法。","802":"A答案中BP是基於工程實踐總結的工程單元。B答案中BP是經過測試和實踐驗證的。C答案中一項BP適用於組織的生存週期是正確的。D一項BP不能和其他BP重疊。","803":"信息安全問題是多方面存在的,不能認為主要為技術問題,同時技術漏洞不是犯罪的根源所在。","804":"年度預期損失(ALE)=資產價值×損失比例×年發生率。資產價值100萬,損失比例24%,年發生率3÷8=0.375次/年,ALE=100×24%×0.375=9萬。","805":"電子簽名不可以與認證服務提供者共有。","806":"題目中B為等級保護三級,該考點為等級保護定級指南。","807":"通過部署信息安全策略並配合部署防護措施,不能杜絕信息安全事件的發生,只能降低發生的可能性和減少損失。A選項信息安全事件定義正確;B選項事件管理重要性正確;C選項應急響應重要性正確","808":"即使系統有充分預防控制措施,安裝監測控制設備也是可選的,它能實現深度防禦,進一步增強系統安全性。監測控制可檢測預防控制是否有效,但不是多餘的,也不是必須的,且在計算機系統中同樣有安裝監測控制設備的意義,所以選C。","809":"D描述的是信息安全保障工作目標,而非主要原則。ABC描述的是信息安全保障的原則。","810":"信息安全風險評估應以自評估(自查)為主。","811":"自2004年1月起,國內各有關部門在申報信息安全國家標準計劃項目時,必須經由全國信息安全標準化技術委員會(TC260)提出工作意見,協調一致後由該組織申報,所以選B。","812":"Ia表示安全事件作用資產的價值,Va表示安全事件發生後該資產對應的脆弱性嚴重程度。","813":"應急響應方法將應急響應管理過程分為準備、檢測、遏制、根除、恢復和跟蹤6個階段,B選項中“處置”表述錯誤。A選項對應急響應的定義正確;C選項對信息安全事件分級參考因素描述正確;D選項對信息安全事件級別的劃分正確。所以選B。","814":"監理模型組成包括監理諮詢支撐要素、監理諮詢階段過程、控制和管理手段。","815":"A錯誤,因為差分備份是上次全備後的更新數據;增量備份是任何上一次備份後的更新數據。全備份週期最長、次之差分備份,更新週期最短是增量備份。B錯誤,我國災備能力級別一共分為6級。D是明顯的錯誤。","816":"ABC其均屬於項目管理文檔。需求說明書、設計說明書、測試方案、測試用例等屬於開發類文檔。","817":"監理從項目招標開始到項目的驗收結束,在投資計劃階段沒有監理。","818":"NAS優點數據集中、節約空間,缺點是佔用網絡帶寬、存儲中心存在單點故障。","819":"首先應檢查災難恢復站點的錯誤事件報告,以找到服務器運行速度緩慢的根本原因,再檢查測試計劃、災難恢復計劃、配置文件等,所以選A。","820":"業務影響分析(BIA)的步驟是標識關鍵業務過程、標識關鍵IT資源、表示中斷影響和允許中斷時間、開發恢復優先級,所以選A。","821":"信息系統安全保障要素為技術、工程、管理和人員四個領域。信息系統安全保障的安全特徵是完整、保密和可用性。","822":"基本實施(BP):是具體的活動或任務,是安全工程實踐的基礎單元。但它們本身並不直接作為能力成熟度的測量單位。","823":"單位對信息系統運行維護和使用的人員在能力和培訓方面需要投入。","824":"IATF是在網絡的各位置實現所需的安全機制。","825":"滲透測試以攻擊者思維模擬真實攻擊,能發現如配置錯誤等運行維護期產生的漏洞。","826":"信息安全工程主要解決信息系統生命週期的過程安全問題。","827":"BP屬於安全工程的最小單元,其不限定於特定的方法工具,不同業務背景中可以使用不同的方法;是根據廣泛的現有資料,實施和專家意見綜合得出的;代表着信息安全工程領域的最佳實踐;並且是過程區域(ProcessAreas,PA)的強制項。","828":"正確答案為D。一級文件中一般為安全方針、策略文件;二級文件中一般為管理規範制度;三級文件一般為操作手冊和流程;四級文件一般表單和管理記錄。","829":"管理體系包括PDCA(Plan-Do-Check-Act)四個階段,題幹中1-7的工作都屬於管理體系的實施階段(D-Do),而8和9屬於檢查階段(C-Check)。","830":"資產價值與其重要性密切相關,不是指採購費用或維護費用,且可以估計。","831":"答案為B。A-現代軟件工程體系中軟件最重要的階段為設計階段。C-SDL最大的特點是增加了安全培訓和應急響應。D-第三方測試是必要的軟件安全測試類型。","832":"滲透測試可以發現系統中類似管理員將備份存放在WEB目錄下導致可直接下載備份的問題,模糊測試、源代碼測試、軟件功能測試不能很好地發現此類問題。","833":"ABD與軟件安全開發無關。","834":"D屬於ARM系統,不屬於WEB安全領域。","835":"HTTPS具有數據加密機制。","836":"管理體系PDCA分別指的階段是:P-規劃建立、D-實施運行、C-監視和評審、A-保持和改進。","837":"GB/T22240-2008《信息系統安全保護等級定級指南》規定了等級保護定級階段的依據等內容。","838":"指紋識別系統存在安全威脅問題,同時存在着錯誤拒絕率和錯誤接受率的問題。","839":"A為國標推薦標準;B為國標強制標準;C為地方標準;D為國標指導標準。","840":"棄用不安全的函數為編碼實施階段。","841":"統一採用Windows8系統對軟件安全無幫助。","842":"A錯誤,因為IATF不用於代碼審覈;C錯誤,因為人工和攻擊相結合;D錯誤,安全測試由需求確定。","843":"R-抵賴是無法通過過濾、流控和隱私保護實現的,R-抵賴的實現方式包括數字簽名、安全審計、第三方公證。","844":"2006年進入到深化落實階段。選項A,2001年國家信息化領導小組重組及網絡與信息安全協調小組成立,確實標誌着我國信息安全保障工作正式啓動;選項B,2003年7月國家信息化領導小組制定出臺的《關於加強信息安全保障工作的意見》(中辦發27號文),明確提出“積極防禦、綜合防範”的國家信息安全保障方針;選項D,在深化落實階段,信息安全法律法規、標準化、信息安全基礎設施建設以及信息安全等級保護和風險評估確實取得了新進展。","845":"建立信息安全技術體系的目的是保障國家信息化的安全,而非實現自主創新。","846":"無法消除或降低該銀行信息系統面臨的所有安全風險。","847":"測評包括信息系統風險評估和信息系統等級保護測評。","848":"美國政府強調重點保障關鍵信息基礎設施信息安全的主要原因並非這些行業信息系統普遍存在安全隱患且信息安全專業人才缺乏的現象比其他行業更突出。雖然這些行業可能存在安全隱患和人才問題,但這不是美國政府強調保障其信息安全的主要原因。","849":"設計信息系統安全保障方案應採用合適的技術。","850":"分組密碼算法和序列密碼算法是兩類不同的密碼算法。","851":"虛擬專用網絡(VPN)中的“P”代表“Private”,即私有的、專有的。VPN通過隧道技術在公共網絡中建立一個臨時的、安全的網絡,為用戶提供私有的網絡連接。","852":"存儲在註冊表中的賬號數據只有System賬號才能訪問,具有較高的安全性。這樣可以防止其他用戶隨意訪問和修改賬號數據,保障賬號信息的安全。","853":"網頁防篡改系統可以實時監測和恢復被篡改的網頁內容,有效防止黑客對網站主頁的修改。","854":"按照運行平臺,惡意代碼可以分為Windows平臺、Linux平臺、工業控制系統等。","855":"從流量監測圖顯示該網站在當天17:00到20:00間受到攻擊,這種在特定時間段內對網站進行大量訪問,導致網站無法正常響應的攻擊最可能是拒絕服務(DoS)攻擊。","856":"應用軟件編碼所採用的高級語言與漏洞的產生沒有直接關係。漏洞的產生主要是由於傳統的軟件開發工程未能充分考慮安全因素、開發人員對信息安全知識掌握不足以及應用軟件功能越來越多、軟件越來越複雜等原因。","857":"“信息安全保障技術框架(IATF)”主要側重於信息安全保障的整體技術框架,與軟件安全開發過程關聯不大。而微軟提出的“安全開發生命週期(SDL)”、GrayMcGraw等提出的“使安全成為軟件開發必須的部分(BSI)”和OWASP維護的“軟件保證成熟度模型(SAMM)”都與軟件安全開發密切相關。A選項,SDL是微軟提出的軟件安全開發模型;B選項,BSI強調將安全融入軟件開發過程;C選項,SAMM用於評估和改進軟件安全開發能力。","858":"模糊測試的效果與覆蓋能力與輸入樣本選擇密切相關,需要通過合理選擇輸入樣本來提高測試的覆蓋率和效果;為保障安全測試的效果和自動化過程,需要現場保護記錄發現的異常,並在系統恢復異常狀態後進行後續測試;對於可能產生的大量異常報告,不需要人工全部分析,可以通過自動化的工具和方法對異常報告進行篩選和分類,優先處理可能存在安全漏洞的報告。A選項,輸入樣本選擇對模糊測試效果影響很大;B選項,系統應能在恢復異常狀態後進行後續測試;D選項,不需要人工全部分析異常報告。","859":"防火牆不能進行物理隔離,但可以通過邏輯隔離的方式,根據預設的規則對網絡流量進行過濾和控制,實現內外網的隔離。A選項,防火牆不能進行物理隔離;B選項,防火牆能進行邏輯隔離;D選項,防火牆能進行邏輯隔離。","860":"實施誤用入侵檢測(或特徵檢測),是將當前獲取行為數據和已知入侵攻擊行為特徵相比較,若匹配則認為有攻擊發生。","861":"選項A:總部服務器和用戶終端未分開地址段,管理混亂;分支機構使用私有C類地址(192.168.x.x),但未明確子網劃分,20個分支機構需20個獨立子網,但選項未說明是否合理分配子網掩碼(如/24),可能導致地址浪費或不足。選項B:總部地址分配緊湊,但分支機構地址隨意分配會導致衝突風險;缺乏統一規劃,專網環境下路由難以管理。選項C:服務器和用戶終端分開地址段,便於管理;按部門劃分用戶終端(10.0.2.x)支持進一步子網細分。分支機構:分配兩個A類地址段(如10.1.x.x和10.2.x.x),每個段可容納大量主機,雖浪費但滿足100個終端需求,且專網環境下地址空間充足;獨立地址段便於路由和訪問控制。選項D:專網互聯需直接使用內部IP通信,NAT用於互聯網訪問,不能替代內部地址規劃;隨意分配會導致地址衝突和路由混亂。","862":"不是所有用戶。賬戶鎖定策略只適用於普通用戶,但是對於administrator它是不生效的,所以暴力破解很多的時候,administrator很容易被爆破。","863":"Windows的ACL機制中,文件和文件夾的權限是與客體(文件和文件夾)進行關聯的,即訪問權限信息是寫在文件和文件夾的屬性中,而不是寫在用戶數據庫中。A選項安裝Windows系統用NTFS文件格式以支持ACL機制正確;B選項Windows有大量文 理體系標準,與信息安全管理體系(ISMS)的ISO27001無關。建立ISMS可通過ISO27001認證,而非ISO9001。","986":"選項A、B、D都與網絡冗餘相關,選項A為網絡鏈路冗餘;選項B為網絡設備冗餘,選選項D為網絡性能冗餘,針對網絡的“承載能力”設計冗餘,保障網絡高效性(避免擁堵)和可擴展性。選項C是網絡規劃與管理,目的是便於管理、避免衝突。\n注:如果題目為“不屬於網絡冗餘的”則選C。但題目強調的是“防止網絡主線路出現故障”,而主線路更多指對外連接的通信鏈路,最符合的題意的選項為A。","987":"防火牆應部署在內網與外網之間,形成保護屏障。正確順序為:內網主機→交換機→防火牆→外網。","988":"正確答案：B。軟件安全的三根支柱是風險管理、軟件安全觸點和安全測試","989":"ACL可由管理員或授權用戶管理,非僅管理員,選項A錯誤。","990":"用本地的TGS做代理去獲取遠程的TGT","991":"減少對外服務端口和修改服務旗標屬於技術防護,與防範社會工程學攻擊(如僞裝誘導)無關","992":"數據庫包含常用密碼,攻擊者可利用字典攻擊嘗試常見密碼組合。","993":"P2DR模型(策略、防護、檢測、響應)中,策略是核心,指導其他環節。","994":"強制訪問控制是系統級控制,非對單個用戶的過程控制,選項D錯誤。","995":"正確答案：D。1是主體,2是實施3是客體,4是決策","996":"模糊測試通過非預期輸入發現故障,屬於黑盒測試,無需瞭解內部代碼。","997":"正確答案：D。遠程服務器的操作系統是windows系統","998":"RPO(恢復點目標)指災難後最大可接受數據丟失時間,3小時即最多丟失3小時數據。","999":"風險構成過程為:威脅利用脆弱性,通過途徑影響受體,導致後果。空白處為“脆弱性”。","1000":"依據GB/T20984-2007《信息安全風險評估規範》,選D","1001":"補丁安裝前需測試,避免系統崩潰;獲取應通過官方渠道;安裝時需備份並準備應急措施。","1002":"權限分離原則要求操作需多人審覈,避免單點風險。","1003":"使用支付方式屬於“實體特徵的鑑別方法”。","1004":"ALE=資產價值×EF×ARO→5萬=200萬×EF×0.1→EF=25%。","1005":"Kerberos支持雙向認證(用戶↔服務器),非僅服務器對用戶單向認證。","1006":"首先Kerberos獲得票據許可票據,用戶向認證服務器AS申請票據許可票據;然後Kerberos獲得服務許可票據,用戶憑藉票據許可票據向票據授權服務器TGS申請服務許可票據;最後Kerberos獲得服務,用戶憑藉服務許可票據嚮應用服務器申請服務。所以順序是(3)-(1)-(2)。","1007":"自主訪問控制(DAC)允許用戶指定訪問權限,符合題幹描述。","1008":"根據Bell-Lapadula模型安全策略,下讀上寫原則,即主體可以讀取低於自己安全級別的客體信息,但不能寫入;可以向上寫入高於自己安全級別的客體,但不能讀取。圖中主體安全級別高於左邊客體,可讀不可寫,但圖片問的是寫這種情況,沒問讀,所以結論為不可寫。主體與右邊的客體,其密級高於客體,但範疇不同,範疇不同所以沒法比,所以是不可讀也不可寫的。","1009":"Windows用戶SID隨刪除重建變化,新用戶與原用戶不同,無法繼承權限。","1010":"ISO27002前身為ISO17799,由BS7799-1演化而來。","1011":"ACL增加客體時,只需在客體鏈表中添加主體權限,操作簡單。","1012":"信息系統安全保障模型中,保障要素包括管理、工程、技術、人員。","1013":"要為文件主增加執行權限,刪除組外其他用戶的寫權限,-rwxrw-r--,二進制表示為111110100,轉換成十進制為764。","1014":"隧道模式的IPSec處理通常由網絡邊界設備(如安全網關、路由器、防火牆)完成,而非終端主機。","1015":"終端實體(用戶)從認證權威機構CA申請、撤銷和更新數字證書的流程中,中間框空白處應為RA(註冊機構),RA負責接收用戶的證書申請、審覈用戶身份等信息,並將申請轉發給CA。證書庫是存儲證書和CRL(證書撤銷列表)的地方;OCSP(在線證書狀態協議)用於實時查詢證書的狀態;CRL庫是存儲證書撤銷列表的數據庫。所以選B。","1016":"社會工程學攻擊利用人的弱點獲取信息,通過信息安全培訓,使相關信息發佈人員瞭解信息收集風險,遵循發佈信息最小化原則,可以有效對抗此類信息收集和分析。減少系統對外服務端口數量、修改服務旗標,關閉不必要服務、部署防火牆、IDS等措施,系統安全管理員使用漏洞掃描軟件對系統進行安全審計,這些措施主要針對技術層面的安全防護,對社會工程學攻擊效果有限。所以選A。","1017":"SYNFlood攻擊通過僞造大量虛假SYN包,使目標主機上有大量連接請求等待確認,佔用目標主機資源,導致正常連接請求無法被接受,屬於拒絕服務攻擊。分佈式拒絕服務攻擊是多個攻擊源同時發起攻擊;緩衝區溢出攻擊是利用程序緩衝區溢出漏洞進行攻擊;SQL注入攻擊是利用Web應用程序對SQL語句處理不當進行攻擊。所以選A。","1018":"各國在信息安全保障方面,雖然加強國際交流與對話,但由於各國國情、安全需求等不同,不會建立一致的安全保障系統,C選項總結錯誤。A選項各國將關鍵基礎設施作為保障重點正確;B選項各國重視戰略規劃工作正確;D選項各國推動信息安全立法和標準規範建設等正確。所以選C。","1019":"風險要素識別主要過程包括識別資產、識別面臨的威脅、識別存在的脆弱性並賦值、識別已有安全措施等,圖中空白框處應為識別存在的脆弱性並賦值,以進一步評估風險。識別面臨的風險並賦值是在前面步驟基礎上進行;制定安全措施實施計劃和檢查安全措施有效性是風險評估後續的風險處理和監控階段工作。所以選B。","1020":"管理信息管理體系ISMS需要監視和評審ISMS,以持續改進其有效性和適應性。監控和反饋ISMS表述不準確;批准和監督ISMS不是主要環節;溝通和諮詢ISMS是ISMS實施過程中的一部分,但不是圖中空白處核心內容。所以選C。","1021":"從圖中數據看,17:00到20:00之間網站流量急劇增加,可能是遭受拒絕服務攻擊,攻擊者通過發送大量請求,使網站服務器資源耗盡,無法正常響應合法用戶請求。跨站腳本攻擊主要是利用網站漏洞注入惡意腳本;TCP會話劫持是劫持已建立的TCP連接;IP欺騙攻擊是僞造IP地址進行攻擊,這些攻擊通常不會直接導致流量急劇增加。所以選D。","1022":"IATF強調人、技術、操作三個核心要素。PDR(保護、檢測、響應)、PPDR(策略、保護、檢測、響應)、PDCA(計劃、執行、檢查、改進)。","1023":"微軟的SDL(安全開發生命週期)原則中,棄用不安全的函數屬於實現階段。在實\n現階段,開發人員需要按照安全編碼規範進行代碼編寫,棄用不安全的函數是其中的重\n要內容,以避免潛在的安全漏洞。","1024":"優秀源代碼審覈工具應具備安全性,能保障審覈過程及系統本身安全;多平臺性\n,可在不同操作系統和開發環境下使用;可擴展性,方便根據需求添加新功能和規則;\n知識性,內置豐富的安全知識庫輔助審覈;集成性,能與開發流程中的其他工具集成,\n提高審覈效率。","1025":"信息安全風險管理包括背景建立、風險評估、風險處理、批准監督、監控審查和\n溝通諮詢六個方面內容。背景建立、風險評估、風險處理和批准監督是四個基本步驟,\n監控審查和溝通諮詢貫穿於這四個基本步驟中,對風險管理過程進行持續監督和溝通。","1026":"對確認為不適當的安全措施,應及時進行改進或替換,而不能置之不顧,否則會\n給系統帶來安全風險。A選項對有效安全措施繼續保持可避免不必要工作和費用;B選項\n安全措施分為預防性、檢測性和糾正性三種是正確的分類;C選項確認安全措施有效性,\n評估其是否降低系統脆弱性、抵禦威脅是必要的步驟。","1027":"A選項使用和用戶名相同的口令,容易被猜測和破解;B選項選擇在字典或語言中\n能找到的口令,也容易被字典攻擊破解;C選項選擇和個人信息有關的口令,可能因個人\n信息泄露導致口令被猜出;D選項採取數字、字母和特殊符號混合並且易於記憶的密碼,\n增加了密碼的複雜度,提高了安全性。","1028":"基於對權威的信任,請求來自“權威”人士時可能被毫不懷疑地執行。在電信詐騙\n中,攻擊者常僞裝成“公安部門”人員利用這種信任;在網絡攻擊中,可能僞裝成監管部\n門、信息系統管理人員等身份要求受害者執行操作,如僞裝成系統管理員要求更改密碼\n。","1029":"A選項高級管理人員正式承諾支持項目,能為項目提供資源和決策支持,與風險相\n關;B選項開發人員和用戶充分理解系統需求,可減少需求不明確帶來的風險;D選項開\n發需求資金按時到位,保證項目順利進行,與風險相關;C選項最終用戶同意部署已開發\n系統是在系統開發完成後的事,在評估項目風險時,它不是影響項目風險的關鍵因素。","1030":"A選項安全區域主要指物理區域,不包括信息系統等軟件區域;B選項建立安全區\n域需要建立安全屏蔽及訪問控制機制,以限制對區域的訪問,保障設施安全;C選項雖然\n傳統門鎖安全性較低,但在一些安全要求不高的場景仍可使用,並非禁止採用;D選項閉\n路電視監控系統前端設備包括攝像機等,後端設備包括中央控制設備、監視器等,數字\n式控制錄像設備一般屬於前端或中間處理設備。","1031":"瀏覽器兼容性測試主要關注瀏覽器相關方面,如不同瀏覽器能否提供合適安全設\n置、腳本和插件是否適用不同瀏覽器、符合最新HTML版本的頁面能否正確顯示等。而軟\n件在不同J2EE中運行屬於服務器端環境兼容性問題,與瀏覽器兼容性無關。","1032":"A選項白盒測試通過程序內部邏輯結構測試,黑盒測試通過程序輸入輸出測試,二\n者都需運行程序,屬於動態測試;B選項功能測試關注程序功能,不考慮內部結構,屬於\n黑盒測試;C選項結構測試依據程序內部結構進行測試,屬於白盒測試;D選項對功能測\n試通常不考慮程序內部結構,而是從用戶角度測試功能是否正確實現。","1033":"完全備份是對所有數據進行備份,恢復時只需恢復一次完全備份的數據,速度最\n快;差量備份是備份與上一次完全備份的差異數據,恢復時先恢復完全備份,再恢復差\n量備份,速度次之;增量備份是備份上一次備份後的變化數據,恢復時需按順序恢復完\n全備份和所有增量備份,速度最慢。","1034":"Web應用軟件表示層測試關注排版結構、客戶端兼容性、鏈接結構等方面。數據完\n整性測試屬於數據層或業務邏輯層測試範疇,主要驗證數據的準確性和一致性等。","1035":"《國家網絡空間安全戰略》闡述了我國網絡空間當前任務包括捍衛網絡空間主權、\n保護關鍵信息基礎設施、提升網絡空間防護能力等。阻斷與國外網絡連接不符合我國對\n外開放和國際合作的原則,也不是我國網絡空間的任務。","1036":"雖然我國信息安全人才培養取得了一定成績,但尚未完全成熟和體系化,每年培\n養的信息安全人員數量還不能完全滿足社會實際需求,且高校信息安全專業畢業人才綜\n合能力要求高、知識更全面,但社會化培養仍需加強,不能重點放在非安全專業人才培\n養上而忽視安全專業人才培養。A選項關於信息安全人才建設指導精神正確;B選項增設\n“網絡空間安全”一級學科對人才培養有積極作用正確;D選項我國信息安全非學歷教育體\n系基本形成正確。","1037":"A選項選擇具備防止安全威脅能力的藍牙設備可降低安全風險;B選項選擇合適功\n能設備、關閉不使用服務和功能可減少攻擊面;D選項配對時使用隨機密鑰、不使用時設\n置不可被發現可提高安全性;C選項如果藍牙設備丟失,應及時採取措施如遠程鎖定、擦\n除數據等,不做任何操作會導致數據泄露等安全風險。","1038":"在災難恢復測試中,備份系統有缺陷或不能正常工作,導致測試失敗是最應該引\n起關注的問題,因為這直接影響到在真正災難發生時系統的恢復能力。A選項僅測試部分\n系統可在後續補充測試;C選項開啓備份站點時間問題可通過優化流程解決;D選項不使\n用文檔依賴人員記憶雖有問題,但不如備份系統缺陷影響大。","1039":"Kerberos認證過程包括獲得票據許可票據、獲得服務許可票據和獲得服務三個主\n要步驟。獲得票據許可票據是用戶向認證服務器申請票據;獲得服務許可票據是用戶憑\n票據許可票據向特定服務器申請服務許可票據;獲得服務是用戶使用服務許可票據獲取\n服務。不包括獲得密鑰分配中心的管理權限。","1040":"[pic]","1041":"A選項需求管理不僅是對需求開發的管理,還包括對需求變更、跟蹤等方面的管理\n;B選項需求獲取、需求分析、需求定義和需求驗證屬於需求開發過程;C選項需求開發\n是將用戶需求轉換為軟件需求規格說明的過程;D選項在需求管理中要求維持對原有需求\n和所有產品需求的雙向跟蹤,以確保需求的完整性和一致性。","1042":"教材文章中的一段:“信息安全是通過實施一組合適的控制措施而達到的,包括策\n略、過程、規程、組織結構以及軟件和硬件功能。在需要時需建立、實施、監視、評審\n和改進這些控制措施,以確保滿足該組織的特定安全和業務目標。這個過程應與其他業\n務管理過程聯合進行。”","1043":"瞭解社會工程學攻擊是應對和防禦社會工程學攻擊的關鍵,對於信息系統管理人\n員和用戶,應瞭解攻擊的概念和原理。通過培訓幫助員工判斷是否存在攻擊,更好保護\n信息系統和個人數據。對攻擊方式瞭解,用戶識破攻擊者僞裝就越容易。組織應持續提\n供安全意識培訓和教育,灌輸安全意識,降低攻擊風險。","1044":"應急演練是檢驗和完善應急預案的重要手段,即使公司有優秀技術人員和自研系\n統,也應進行應急演練,以發現潛在問題,提高應急響應能力。B選項應急演練流程完善\n;C選項應急預案覆蓋各類事件類型;D選項應急預案符合國家相關標準都是正確的做法\n。","1045":"A選項BLP模型用於保證系統信息的保密性,而非完整性;B選項BLP模型規則是“向\n下讀,向上寫”,即主體只能讀取安全級別低於或等於自身的客體信息,只能寫入安全級\n別高於或等於自身的客體;C選項BLP的強制安全策略通過比較主體與客體的安全屬性控\n制訪問,自主安全策略是主體自主決定訪問權限;D選項BLP的強制安全策略使用安全標\n籤表示,而非訪問控制矩陣。","1046":"對操作系統軟件安裝應建立安裝控制規程,運行系統安裝批准的可執行代碼,不\n安裝開發代碼和編譯程序。應用和操作系統軟件經測試後由受過培訓的管理員根據管理\n授權更新。應定義並強制執行用戶安裝軟件方針,使用最小特權方針。不受控制的軟件\n安裝可能導致信息安全事件或違反知識產權。","1047":"應急響應流程從右至左依次為專家小組、技術保障、實施小組、日常運行小組,\n確保協調配合。","1048":"SQLServer混合模式下,Windows獲取用戶輸入的用戶名和密碼,提交給SQL\nServer進行身份驗證,並決定用戶的數據庫訪問權限。B選項是SQL\nServer將用戶信息提交給Windows驗證錯誤;C選項是Windows身份驗證模式特點;D選項\n登錄本地Windows用戶不能無限制訪問SQLServer數據庫,需經過身份驗證和授權。","1049":"物聯網感知層安全技術主要包括RFID安全技術和傳感器網絡安全技術。RFID安全\n性機制採用物理機制、密碼機制及二者相結合的方法。傳感器網絡認證技術包含內部實\n體認證、網絡與用戶認證以及廣播認證。","1050":"建立並完善信息安全管理體系,通過安全管理制度的建立,使信息系統用戶遵循\n規範操作,降低社會工程學影響。例如對於密碼修改,網絡管理員按管理制度要求進行\n電話回撥確認,可防止外部攻擊僞裝內部人員進行社會工程學攻擊。","1051":"網頁掛馬、利用即時通訊關係鏈或僞裝P2P下載資源傳播、垃圾郵件都可能是惡意\n代碼傳播方式。Google認證過的插件經過嚴格審覈,相對安全,一般不會傳播惡意代碼\n。","1052":"管理是指管理主體組織並利用人、財、物、信息和時空等要素,藉助管理手段完\n成組織目標的過程。信息像其他重要業務資產和管理要素一樣,對組織業務至關重要,\n需加以保護。業務環境互連增加使信息暴露於更多威脅和脆弱性中。","1053":"安全的哈希函數強抗碰撞性是指找到兩個不同的輸入,使其具有相同的哈希值在\n計算上是不可行的。兩份文件內容不同卻有相同SHA-\n1數字簽名,違背了強抗碰撞性。單向性是指從哈希值難以反推出原始輸入;弱抗碰撞性\n是指對於給定輸入,找到另一個不同輸入具有相同哈希值在計算上不可行;機密性不是\n哈希函數性質。","1054":"信息安全管理體系採用PDCA模型,可應用於所有ISMS過程。ISMS將相關方信息安\n全要求和期望作為輸入,通過行動和過程,產生滿足要求的信息安全結果。","1055":"A選項,《信息安全技術信息系統物理安全技術要求》(GB/T\n21052—2007)“信息系統物理安全(簡稱物理安全)是指為了保證信息系統安全可靠運行\n,確保信息系統在對信息進行採集、處理、傳輸、存儲過程中,不致受到人為或自然因\n素的危害,而使信息丟失、泄露或破壞,對計算機設備、設施(包括機房建築、供電、\n空調等)、環境人員、系統等採取適當的安全措施。”B選項物理安全面對環境風險和人\n類活動正確;C選項,《信息安全技術信息系統物理安全技術要求》(GB/T\n21052—2007)“物理安全包括設備安全、環境安全/設施安全以及介質安全。”不包括系統\n安全;D選項影響物理安全因素包括自然和人為因素正確。","1056":"風險處理依據風險評估結果,選擇和實施合適安全措施,目的是將風險控制在可\n接受範圍內。風險處理方式主要有降低、規避、轉移和接受四種。","1057":"信息收集是社會工程學攻擊實施基礎,攻擊者實施前會對目標進行信息收集,了\n解相關資料和信息,這些信息對攻擊者有價值,收集越多離實現身份僞裝越近。組織若\n不重視信息保護,正是攻擊者所希望的。","1058":"信息流動需識別途徑的載體與環境,信息敏感性定義是信息保護的基礎與依據,\n信息存儲和表現形式決定風險管理效果,不同載體體現信息不同特性,使風險管理複雜\n。","1059":"A選項筆記本電腦不是19世紀中葉電磁技術發展誕生的成果;B選項1837年美國人\n莫爾斯發明電報機,不是費曼;C選項1875年貝爾發明電話機,1878年進行首次長途電話\n實驗正確;D選項1906年美國物理學家費森登發明無線電廣播,不是摩斯。","1060":"A選項DOI是永久性標識號;B選項DOI具有唯一性、持久性、兼容性、互操作性、\n動態更新等優點正確;C選項DOI命名規則中前綴和後綴用“/”分開;D選項DOI體現形式有\n網絡域名、字符碼等多種形式。","1061":"攻擊者通過發送僞造ARP應答報文修改目標計算機ARP緩存,屬於ARP欺騙攻擊。I\nP欺騙是通過僞造IP地址進行攻擊;DNS欺騙是篡改DNS解析結果進行攻擊;SN不是常見欺\n騙攻擊類型。","1062":"組織應限制對信息和應用系統功能的訪問,訪問控制策略與組織策略一致,建立\n安全登錄規程,選擇合適身份驗證技術,強認證時使用替代密碼方法,建立交互式口令\n管理系統,限制實用工具使用並嚴格控制,嚴格控制程序源代碼訪問以保護保密性和知\n識產權,可通過中央存儲控制或源程序庫保存源代碼。","1063":"OSI模型中,網絡層負責將數據包從源節點傳輸到目標節點,IP層對應OSI模型的\n網絡層,主要功能是進行網絡互聯和路由選擇。","1064":"非CISP來源,來源於CISSP的曾經的練習題,是翻譯的,可參考百度文庫2017年0\n4月18日關於《軟件安全錯誤區別》ISO/IEC/IEEE24765-\n2010的翻譯。Bug,defect,error,fault,failure,mistake等區別。","1065":"DAC模型不能抵禦特洛伊木馬攻擊,因為特洛伊木馬可以竊取用戶權限,繞過DAC\n的安全策略。A選項DAC中資源所有者可規定誰有權訪問資源正確;B選項DAC是對單個用\n戶執行訪問控制正確;D選項DAC中主體可自主授予其他主體訪問權正確。","1066":"CISP知識點範圍內,在知識點理解的基礎上,進一步參考“防病毒軟件通過對有毒\n軟件的檢測,將軟件行為與惡意代碼為模型進行匹配”參考教材第388頁第三段的內容。","1067":"信息安全風險值是信息資產價值、面臨的威脅以及自身存在的脆弱性的函數。通\n過評估資產價值、威脅可能性和脆弱性嚴重程度,計算風險值。B選項病毒、黑客、漏洞\n等是威脅的具體表現;C選項保密信息是信息資產類型;D選項網絡、系統、應用複雜程\n度與風險值計算無關。","1068":"CISP知識點範圍內,但內容需要理解或背誦,來源於教材第113頁,第一段和第二\n段,請背誦下來,最好要理解。","1069":"無線信道開放,攻擊者可通過適當設備搭線竊聽通信內容,A選項表述不準確;傳\n輸流分析一般不能直接掌握精確通信內容;羣通信方式不能防止外部人員獲取內部通信\n內容;無線局域網絡和無線個人區域網絡通信內容更易被竊聽,C選項正確。","1070":"可理解性和可測試性在可維護性特性中相互促進,可理解性好有助於測試,可測\n試性強能更好發現可理解方面的問題。效率和可移植性、效率和可修改性、效率和可理\n解性之間不存在明顯相互促進關係。","1071":"信息系統審計是對信息系統相關控制獲取並評價證據,判斷信息系統能否保證安\n全性等屬性,不是單一對會計信息系統安全性、有效性檢查,還包括其他方面,C選項錯\n誤。A、B、D選項對信息系統審計描述正確。","1072":"索引器功能是理解搜索器獲取信息並建立索引,向用戶顯示查詢結果是檢索器功\n能,。","1073":"PDCA過程又叫質量環,最早由休哈特於1930年構想,後被戴明博士挖掘並廣泛宣\n傳用於持續改善產品質量,是科學程序,建立符合國際標準的質量管理體系等都是類似\n管理體系。","1074":"IEEE802.15.4規範是一種經濟、高效、低數據速率(<250kbps)、工作在2.4GHz和\n868/915MHz的無線技術。ZigBee主要信息安全服務為訪問控制、數據加密、數據完整性\n、序列抗重播保護;設備在ACL中維護設備列表;數據完整性利用消息完整性校驗碼保證\n,確認消息來自知道密鑰節點。","1075":"動態分配IP地址是在計算機連接到網絡時,每次從IP地址池中臨時選擇一個IP地\n址分配,適用於網絡地址容量不夠或普通終端無需靜態IP地址情況。","1076":"信息安全風險管理是基於風險的信息安全管理,以風險為主線,根據實際信息系\n統不同理解風險管理側重點,即信息系統選擇範圍和對象重點不同。","1077":"數據鏈路層負責相鄰節點信息傳輸,數據單元是幀,報文是網絡層數據單元,比\n特流是物理層數據單元,包是網絡層及以上常用術語。","1078":"標準化具有動態性,隨着科技進步和社會發展需要不斷更新,不是靜態的,B選項\n錯誤。A、C、D選項對標準化特點描述正確。","1079":"ISO是國際信息安全標準化組織簡稱,ANSI是美國國家標準學會,IEEE是電氣和電\n子工程師協會,NIST是美國國家標準與技術研究院。","1080":"將恢復服務器上被刪除日誌文件本地恢復再提取取證,可能覆蓋原有數據,導致\n證據丟失,不恰當。","1081":"不同操作系統回應數據包初始TTL值不同,通過TTL值可大致判斷操作系統類型,\n不能判斷內存容量、對方物理位置和MAC地址。","1082":"書本的229頁,右邊最下面的一段話。","1083":"內容安全主要關注信息內容合法性、版權等方面,D選項對用戶信息加密存儲屬於\n數據安全範疇,不屬於內容安全。","1084":"動態分析是在虛擬運行環境中檢測惡意代碼行為,C選項是對靜態分析描述,錯誤\n。","1085":"來源CISSP的,參考百度問答庫,某信息安全知識競賽題目。解析:安全評估技術\n採用安全掃描器,它能自動檢測遠程或本地主機和網絡安全性弱點。","1086":"惡意代碼軟件部署常見方式有攻擊者上傳、隨軟件部署傳播、內嵌在軟件中,惡\n意代碼通過網上激活不是常見實現方式。","1087":"操作系統安全機制包括標識與鑑別、訪問控制、權限管理等,網絡雲盤訪問保護\n不屬於操作系統安全機制。","1088":"應急響應管理流程圖中空白方應填檢測階段,先檢測到安全事件才能進行後續處\n理。","1089":"涉及重要操作包括轉賬需通過多種方式確認,D選項措施錯誤。","1090":"攻擊者通過搜索特定文件找到網站非公開信息並進行攻擊,屬於定點挖掘。","1091":"信息安全特徵包括系統安全、動態安全、無邊界安全、非傳統安全等。","1092":"來源於27002標準的原文。信息應按敏感性分類,分類表明資產價值,信息要有標\n記並體現分類,物理標籤和元數據標籤是常見形式,組織要建立與信息分類一致的資產\n處理等交換規程。","1093":"檢測系統函數運行狀態等是動態分析內容,不是靜態分析,C選項錯誤。","1094":"數據庫安全要求拒絕非法用戶訪問、拒絕執行不正確數據操作、能跟蹤記錄等,\n不是向所有用戶提供可靠信息服務,A選項錯誤。","1095":"信息系統安全保障需要確保信息系統保密性等,同時對信息系統運行維護和使用\n人員在能力和培訓方面也要投入,D選項錯誤。","1096":"相關政策是《關於開展信息安全風險評估工作的意見》,內容包括分析信息系統資\n產重要程度等,兩類信息系統工作開展,涉密信息系統參照“分級保護”等。","1097":"攻擊者實施攻擊前需收集僞裝身份所需信息,這些信息是僞裝成功基礎,如僞裝\n成系統管理員需瞭解相關行業規則等信息。","1098":"IPv6優點包括網絡地址空間極大擴展、對多播改進、良好擴展性等,繁雜報頭格\n式不是優點,C選項錯誤。","1099":"《等級保護實施指南》原以公安部政策文件方式發佈,後修改為標準發佈,主要對\n如何開展等級保護工作做詳細規定,在等級保護試點工作期間發佈過相關文件,後修改\n為《等級保護測評要求》發佈,主要對等級保護測評工作做詳細規定。","1100":"評估結果文檔包括描述資產識別和賦值結果等;描述評估結果中不可接受風險制\n定風險處理計劃等的是《風險處理計劃》;文檔分發中作廢文檔要添加標識保留;D選項對\n風險評估文檔描述正確。","1101":"螺旋模型支持需求不明確的大型軟件系統開發,支持多種軟件開發方法。原型模\n型主要用於需求不明確小型項目;瀑布模型需求明確且固定;噴泉模型以用戶需求為動\n力,以對象為驅動。","1102":"該答案按照理論和實踐的合理分析,答案為C。教材第337頁。部署電湧保護器可\n確保電力供應穩定性,A選項雙路供電是確保電力供應不中斷措施;B選項UPS會受電湧影\n響;D選項發動機供電不是最主要技術措施。","1103":"主動掃描工作方式類似於網絡掃描器,不是IDS,A選項錯誤。","1104":"組織應開發和使用加密控制措施保護信息,確定加密信息保護級別,考慮密碼策\n略,進行密鑰管理,對生成、存儲等密鑰設備進行物理保護。","1105":"按照《信息安全技術信息安全事件分類分級指南》(GB/Z20986—2007)\n[pic][pic]","1106":"要求識別惡意代碼的具體類型和名稱,這超出了審計的技術範圍,需依賴專用惡\n意代碼工具","1107":"DOI後綴部分由資源發行者自行指定,用於區分單獨數字資料,具有唯一性,D選\n項錯誤。","1108":"RSA算法和SM2算法可用於加密分享,MD5算法和SHA-\n1算法是哈希算法,DSA算法主要用於數字簽名。","1109":"應讓安全管理人員重新評估漏洞風險並給出防護措施後再處理,A選項重新開發成\n本高;B選項不理會不正確;D選項自己修改源代碼不現實且可能引入新問題。","1110":"DDOS攻擊會影響網絡運行安全,網頁篡改主要影響信息完整性等,個人信息泄露\n涉及隱私,發佈謠言信息涉及信息內容合法性。","1111":"解答:參考什麼是軟件工程方法學的概念,軟件工程是技術和管理緊密結合所形成的工\n程學科,通過計劃、組織和控制等一系列的活動,合理地配置和使用各種資源,以達到\n既定目標的過程,軟件工程方法學三要素(方法、過程、工具),軟件工程方法學類型\n,傳統方法學和麪向對象的方法學。具體來源於www.xuexiba.com\n找答案—2014年12月11日計算機三級考試《信息管理技術題庫》。四個選項:生產工程化、\n軟件安全、軟件質量、開發效率。","1112":"風險評估過程包括風險評估準備、風險要素識別、風險分析、風險結果判定四個\n階段,監控審查和溝通諮詢貫穿其中。","1113":"CC標準(信息技術安全評估準則)的先進性體現在結構開放性、表達通用性和實\n用性。","1114":"動態性指信息安全風險隨時間變化。新漏洞導致新風險,體現了風險的動態變化\n,符合信息安全特徵的動態性。","1115":"禁用ID=0的用戶不合理,因root用戶ID必須為0,禁用會導致系統無法管理。其他\n選項為合理安全配置。","1116":"PDCA中A代表“Act”(處理),指根據檢查結果採取改進措施,而非“Aim”(瞄準問\n題)。","1117":"質量管理體系通過過程方法(PDCA)管理,而非結果管理方法。","1118":"選項A即時通訊軟件的文件傳送功能允許用戶發送任意文件類型,包括可執行文件\n(如.exe、.bat)。選項B攻擊者可發送短鏈接或僞裝成正常網站的URL,用戶點擊後跳\n轉到惡意網頁(如釣魚網站、漏洞利用頁面)。選項C的二維碼需用戶主動掃描,且即時\n通訊軟件不直接解析二維碼內容,傳播依賴用戶行為,非軟件功能本身。選項D的惡意圖\n片可通過軟件漏洞或社會工程學直接傳播,屬於對軟件功能的利用。","1119":"“實施內部審覈”是監視和評審ISMS階段的內容,非保持和改進階段。","1120":"靜態發佈通過消除動態交互(如用戶輸入)徹底避免SQL注入,其他選項為減輕威\n脅而非消除。","1121":"關閉自動播放可防止U盤等移動存儲介質自動執行惡意代碼,其他選項或治標不治\n本,或影響業務。","1122":"DDoS攻擊通過大量請求耗盡目標資源,破壞可用性。","1123":"修改httpd.conf中的ServerTokens和ServerSignature參數可隱藏Apache版本信息\n。","1124":"選項A複雜代碼易引入未處理的邊界條件、邏輯錯誤或未授權訪問路徑,是漏洞的\n直接成因。選項B信息不對稱指開發者與用戶之間對軟件安全性認知的差異(如開發者隱\n瞞漏洞,用戶不知情)。選項C異構網絡(如不同協議、設備、操作系統)可能因兼容性\n問題或配置錯誤引入漏洞(如未加密通信、默認密碼)。選項D攻擊者利用漏洞是漏洞的\n後果或威脅行為,而非漏洞產生的原因。漏洞的存在是獨立於攻擊者的,即使無攻擊者\n,漏洞仍可能存在。","1125":"匿名訪問無需認證,攻擊者可自由訪問,攻擊面最大。","1126":"FTP協議明文傳輸,設計時未遵循最小攻擊面原則,應改用HTTPS。","1127":"SABSA生命週期依次為戰略與規劃、設計、邏輯設計、實施、管理與衡量。","1128":"/etc/passwd存儲加密口令(如x),明文口令通常在/etc/shadow中。","1129":"保留臨時文件會暴露攻擊痕跡,其他選項為清除痕跡的方法。","1130":"SSL加密傳輸數據,確保保密性;雙因子認證用於身份驗證;加密會話cookie防止\n篡改;IP校驗易僞造。","1131":"BLP模型保證機密性,規則為“向下讀,向上寫”。","1132":"風險等級由影響和可能性共同決定。","1133":"災難恢復需冗餘資源,成本通常提高。","1134":"主體可同時作為客體(如進程訪問文件時為主體,被其他進程訪問時為客體)。","1135":"數字簽名用於防抵賴、防僞造,保密通信需加密技術。","1136":"誤報是IDS最常見問題,需平衡檢測率和誤報率。","1137":"變更必須文檔化並批准,確保可追溯性和合規性","1138":"IPSec是協議族(包含AH、ESP等),非單一協議。","1139":"DFD(數據流圖)面向數據流分析,分層DFD中父圖子圖平衡,子圖數量為0到N,\n加工間數據流可多條且名稱唯一。","1140":"社會工程學本質是心理操縱,攻擊者通過引導受害者思維實現目標。西奧迪尼研\n究心理操縱,總結出6種傾向,為社會工程學所依賴。","1141":"ITIL的5個生命週期階段依次為戰略、設計、轉換、運營、改進。","1142":"COBIT組件包括框架、流程描述、控制目標、管理指   <div class="card hero">
    <h1>CISP 模擬考試系統</h1>
    <p>共 ${BANK.length} 題 · 答完即時顯示答案和題解 · 進度自動保存在瀏覽器</p>
    <p class="kbd">鍵盤：<b>←</b> <b>→</b> 切換題庫來源 · <b>Enter</b> 開始測試 · <b>M</b> 背題模式 · <b>T</b> 主題 · <b>?</b> 全部快捷鍵</p>
  </div>

  <div class="modes">
    <div class="card mode" id="mTest">
      <span class="tag">TEST MODE</span>
      <h3>測試模式</h3>
      <p>一次一題。選完答案立刻批改：綠色為正確、紅色為選錯，隨後顯示答案和題解，點“下一題”繼續。適合模擬考試。</p>
    </div>
    <div class="card mode" id="mMem">
      <span class="tag">STUDY MODE</span>
      <h3>背題模式</h3>
      <p>直接顯示正確答案和題解。自己評“會”或“不會”，不會的會循環重複，直到全部標記為會。</p>
    </div>
  </div>

  <div class="card">
    <h2>題目範圍</h2>
    <div class="field">
      <label>題庫來源</label>
      <div class="chips" id="selBank"></div>
    </div>
    <div class="field">
      <label>分類</label>
      <div class="chips" id="selCat"></div>
    </div>
    <div class="field">
      <label>特別範圍</label>
      <div class="chips" id="selSpecial"></div>
    </div>
    <div class="field">
      <label>順序</label>
      <div class="chips" id="selOrder"></div>
    </div>
    <div class="stats">
      <div class="stat"><b id="sPool">0</b><span>本次題目數</span></div>
      <div class="stat"><b>${wrongN}</b><span>錯題本</span></div>
      <div class="stat"><b>${seenN}/${BANK.length}</b><span>已做過</span></div>
      <div class="stat"><b>${knownN}</b><span>標記為會</span></div>
    </div>
    <div class="nav">
      <button class="btn ghost small" id="resetWrong">清空錯題本</button>
      <button class="btn ghost small" id="resetAll">清除全部進度</button>
    </div>
  </div>`;

  const sel = S.sel = S.sel || {bank:"all", cat:"all", wrong:false, random:true};

  const bankOpts = [["all","全部題庫",banks.all]];
  Object.keys(banks).filter(k=>k!=="all").forEach(k=> bankOpts.push([k, bankLabel(k), banks[k]]));
  chips("selBank", bankOpts, sel.bank, v=>{ sel.bank=v; renderSetup(); });

  const catOpts = [["all","全部分類",BANK.length]];
  CATS.forEach(c=>{ if(catCount[c]) catOpts.push([c,c,catCount[c]]); });
  chips("selCat", catOpts, sel.cat, v=>{ sel.cat=v; renderSetup(); });

  chips("selSpecial", [["no","正常題目",0],["yes","只做錯題本",wrongN]], sel.wrong?"yes":"no",
        v=>{ sel.wrong = v==="yes"; renderSetup(); });

  chips("selOrder", [["r","隨機順序",0],["s","按題號順序",0]], sel.random?"r":"s",
        v=>{ sel.random = v==="r"; renderSetup(); });

  document.getElementById("sPool").textContent = poolOf(sel).length;

  document.getElementById("mTest").onclick = ()=> startQuiz("test");
  document.getElementById("mMem").onclick  = ()=> startQuiz("mem");
  document.getElementById("resetWrong").onclick = ()=>{
    if(!confirm("清空錯題本？")) return;
    S.wrong = {}; save(); renderSetup(); toast("錯題本已清空");
  };
  document.getElementById("resetAll").onclick = ()=>{
    if(!confirm("清除全部答題記錄、錯題本和背題進度？")) return;
    localStorage.removeItem(LS); S = load(); document.documentElement.dataset.theme=""; renderSetup(); toast("進度已清除");
  };
}

function chips(elId, opts, active, cb){
  const el = document.getElementById(elId);
  el.innerHTML = opts.map(([v,label,n])=>
    `<button class="chip${v===active?" on":""}" data-v="${esc(v)}">${esc(label)}${n?`<span class="n">${n}</span>`:""}</button>`
  ).join("");
  el.querySelectorAll(".chip").forEach(b=> b.onclick = ()=> cb(b.dataset.v));
}

/* ============ quiz ============ */
let Q = null;
function startQuiz(mode){
  const sel = S.sel;
  let list = poolOf(sel);
  if(!list.length){ toast(sel.wrong ? "錯題本是空的" : "這個範圍內沒有題目"); return; }
  list = sel.random ? shuffle(list) : list.slice();
  Q = { mode, list, i:0, order:list.map(q=>q.id), answered:false, picked:-1, score:0, done:0, queue:list.slice() };
  homeBtn.classList.remove("hidden");
  renderQ();
}

function cur(){ return Q.queue[Q.i]; }

function renderQ(){
  const q = cur();
  const isMem = Q.mode === "mem";
  const total = Q.queue.length;
  const pct = Math.round((Q.done/total)*100);
  const srcNames = q.sources.map(s=> bankLabel(s.bank)).join(" + ");

  let optsHtml = q.options.map((o,i)=>{
    const cls = [];
    if (isMem) { if (LETTERS[i]===q.answer) cls.push("right"); else cls.push("dim"); }
    else if (Q.answered) {
      if (LETTERS[i]===q.answer) cls.push("right");
      else if (i===Q.picked) cls.push("wrong");
      else cls.push("dim");
    }
    else if (i===Q.picked) cls.push("sel");
    return `<button class="opt${cls.length?" "+cls.join(" "):""}" data-i="${i}" ${isMem||Q.answered?"disabled":""}>
      <span class="k">${LETTERS[i]}</span><span>${esc(o)}</span></button>`;
  }).join("");

  let verdict = "";
  if (!isMem && Q.answered){
    const good = Q.picked >= 0 && LETTERS[Q.picked] === q.answer;
    if (good) Q.score++;
    verdict = `<div class="verdict ${good?"ok":"bad"}">
      <div class="vhead">${good?"正確！":"不正確"}</div>
      <div class="ans">正確答案：${q.answer}${good?"":"　你選了："+(Q.picked>=0?LETTERS[Q.picked]:"（未選）")}</div>
      <div class="ex"><b>題解：</b>${esc(expl(q.id))}</div>
    </div>`;
  }
  if (isMem){
    verdict = `<div class="exbox"><div class="lbl">題解</div><div>${esc(expl(q.id))}</div></div>`;
  }

  const isLast = Q.i + 1 >= Q.queue.length;
  const foot = isMem
    ? `<button class="btn" id="bNo">不會 <span class="small muted">[2]</span></button>
       <button class="btn primary" id="bKnow">已會 <span class="small muted">[1]</span></button>`
    : `<button class="btn primary" id="bNext" ${Q.answered?"":"disabled"}>${isLast?"完成並看成績":"下一題"} <span class="small" style="opacity:.7">[Enter]</span></button>
       <button class="btn" id="bSkip" ${Q.answered?"disabled":""}>跳過 <span class="small" style="opacity:.7">[S]</span></button>`;

  view.innerHTML = `
  <div class="bar">
    <span class="pill grey">${isMem?"背題":"測試"} ${Q.i+1}/${total}</span>
    <div class="prog"><i style="width:${pct}%"></i></div>
    <span class="small muted">${isMem? "會 "+Q.score : "對 "+Q.score+" / 已做 "+Q.done}</span>
  </div>
  <div class="card">
    <div class="qhead">
      <span class="pill">${esc(q.category)}</span>
      <span class="pill grey">${esc(srcNames)}</span>
      ${S.wrong[q.id]>0?`<span class="pill grey">錯過 ${S.wrong[q.id]} 次</span>`:""}
      ${S.mem[q.id]==="k"?`<span class="pill grey">背題：會</span>`:""}
    </div>
    <p class="qstem">${esc(q.stem)}</p>
    <div class="opts">${optsHtml}</div>
    ${verdict}
    <div class="foot">
      ${foot}
      <div class="spacer"></div>
      <span class="kbd">${isMem
        ? `<b>←</b>上一題 <b>→</b>下一題 <b>1</b>已會 <b>2</b>不會 <b>Enter</b>已會 <b>?</b>快捷鍵`
        : `<b>←</b>上一題 <b>→</b>下一題 <b>1-4</b>/<b>A-D</b>選答案 <b>Enter</b>下一題 <b>S</b>跳過 <b>?</b>快捷鍵`}</span>
    </div>
  </div>
  <div class="nav">
    <button class="btn ghost small" id="bPrev">上一題 <span class="small muted">[←]</span></button>
    <input type="text" id="jump" placeholder="跳轉到題號" style="width:110px">
    <button class="btn ghost small" id="bJump">前往</button>
    <button class="btn ghost small" id="bFinish">結束並查看成績 <span class="small muted">[F]</span></button>
  </div>`;

  view.querySelectorAll(".opt").forEach(b=> b.onclick = ()=> pick(+b.dataset.i));
  const nx = document.getElementById("bNext"); if(nx) nx.onclick = ()=> next();
  const sk = document.getElementById("bSkip"); if(sk) sk.onclick = ()=> next(true);
  const kn = document.getElementById("bKnow"); if(kn) kn.onclick = ()=> rate(true);
  const no = document.getElementById("bNo"); if(no) no.onclick = ()=> rate(false);
  document.getElementById("bPrev").onclick = prevQ;
  document.getElementById("bJump").onclick = jump;
  document.getElementById("jump").onkeydown = e=>{ if(e.key==="Enter") jump(); };
  document.getElementById("bFinish").onclick = finish;
}

function jump(){
  const v = parseInt(document.getElementById("jump").value,10);
  if(!v) return;
  const idx = Q.queue.findIndex(q=> q.id === v);
  if(idx>=0){ Q.i = idx; Q.answered=false; Q.picked=-1; renderQ(); }
  else toast("這個範圍內沒有題號 "+v);
}

function pick(i){
  if (Q.answered) return;
  const q = cur();
  Q.picked = i; Q.answered = true;
  S.seen[q.id] = true;
  const good = LETTERS[i] === q.answer;
  if (good){ if (S.wrong[q.id]) S.wrong[q.id] = 0; }
  else S.wrong[q.id] = (S.wrong[q.id]||0) + 1;
  Q.done++;
  S.log.push({id:q.id, picked:LETTERS[i], ok:good, t:Date.now()});
  if (S.log.length > 4000) S.log = S.log.slice(-4000);
  save();
  renderQ();
}

function next(skip){
  const q = cur();
  if (skip){ S.seen[q.id] = S.seen[q.id] || false; }
  if (Q.i+1 >= Q.queue.length){ finish(); return; }
  Q.i++; Q.answered = false; Q.picked = -1;
  renderQ();
  window.scrollTo(0,0);
}

function prevQ(){
  if (!Q || Q.i <= 0) { toast("已經是第一題"); return; }
  Q.i--; Q.answered = false; Q.picked = -1;
  renderQ(); window.scrollTo(0,0);
}

function rate(know){
  const q = cur();
  S.mem[q.id] = know ? "k" : "u";
  S.seen[q.id] = true;
  Q.done++;
  if (know) Q.score++;
  if (!know){
    // re-queue the unknown card a few cards later so it repeats
    const at = Math.min(Q.queue.length, Q.i + 1 + Math.floor(Math.random()*4));
    Q.queue.splice(at, 0, q);
    Q.score = Math.max(0, Q.score - 1);
  }
  save();
  if (Q.i+1 >= Q.queue.length){ finish(); return; }
  Q.i++; renderQ(); window.scrollTo(0,0);
  if (!know) toast("已加入循環重複");
}

/* ============ results ============ */
function finish(){
  Q.over = true;
  homeBtn.classList.remove("hidden");
  const total = Q.done;
  const pct = total ? Math.round(Q.score/total*100) : 0;
  const isMem = Q.mode === "mem";
  const recent = S.log.slice(-12).reverse();
  view.innerHTML = `
  <div class="card">
    <h2>${isMem ? "背題完成" : "測試完成"}</h2>
    <div class="res">
      <div class="big"><b>${pct}%</b><span>${isMem?"標記為會的比例":"正確率"}</span></div>
      <div class="big"><b>${Q.score}/${total}</b><span>${isMem?"會 / 總計":"對 / 已做"}</span></div>
      <div class="big"><b>${Q.queue.length}</b><span>本次題數</span></div>
      <div class="big"><b>${Object.keys(S.wrong).filter(k=>S.wrong[k]>0).length}</b><span>錯題本</span></div>
    </div>
    <p class="muted small">${isMem
      ? "標記為“不會”的題目會循環重複，直到你標記為會。只想背錯題：在主頁選“只做錯題本”。"
      : "答錯的題已自動進入錯題本。在主頁選“只做錯題本”可以專門練這些題。"}</p>
    <div class="nav">
      <button class="btn primary" id="again">再做一輪</button>
      <button class="btn" id="home">返回主頁</button>
      <button class="btn ghost" id="showWrong">查看錯題本</button>
    </div>
  </div>
  ${isMem?"":`
  <div class="card" style="margin-top:14px">
    <h2>最近答過的題</h2>
    <table class="log"><thead><tr><th>題號</th><th>題目</th><th>你選</th><th>答案</th><th>結果</th></tr></thead><tbody>
    ${recent.map(l=>{ const q=BANK.find(x=>x.id===l.id); if(!q) return "";
      return `<tr><td>${l.id}</td><td>${esc(q.stem.slice(0,42))}…</td><td>${l.picked||"-"}</td><td>${q.answer}</td>
      <td style="color:${l.ok?"var(--ok)":"var(--bad)"};font-weight:700">${l.ok?"對":"錯"}</td></tr>`;}).join("")}
    </tbody></table>
  </div>`}`;
  document.getElementById("again").onclick = ()=> startQuiz(Q.mode);
  document.getElementById("home").onclick = renderSetup;
  document.getElementById("showWrong").onclick = ()=>{ S.sel.wrong = true; renderSetup(); };
}

/* ============ keyboard ============ */
let HELP = false;
function showHelp(on){
  HELP = on;
  const old = document.getElementById("helpMask");
  if (old) old.remove();
  if (!on) return;
  const rows = [
    ["← / →", "上一題 / 下一題。測試模式還沒作答時 → 等於跳過本題"],
    ["1 2 3 4 或 A B C D", "測試模式選答案，選完立刻批改"],
    ["Enter / 空格", "測試模式：下一題（需先作答）；背題模式：標記「已會」"],
    ["S", "跳過本題，不作答"],
    ["1 / 2（背題模式）", "1＝已會，2＝不會；標「不會」的會循環重複"],
    ["F", "結束並查看成績"],
    ["T", "切換明 / 暗主題"],
    ["Esc", "返回主頁；在快捷鍵窗口裏＝關閉"],
    ["? 或 H", "打開 / 關閉本快捷鍵窗口"],
    ["主頁：← / →", "切換題庫來源"],
    ["主頁：Enter", "開始測試模式"],
    ["主頁：M", "開始背題模式"],
    ["成績頁：Enter", "再做一輪"]
  ];
  const mask = document.createElement("div");
  mask.id = "helpMask"; mask.className = "helpmask";
  mask.innerHTML = `<div class="card helpcard"><h2>鍵盤快捷鍵</h2>
    <table><tbody>${rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("")}</tbody></table>
    <div class="nav"><button class="btn primary" id="helpClose">關閉 [Esc]</button></div></div>`;
  document.body.appendChild(mask);
  mask.onclick = e=>{ if (e.target === mask || e.target.id === "helpClose") showHelp(false); };
}

function cycleBank(dir){
  const keys = ["all"];
  BANK.forEach(q=> q.sources.forEach(s=>{ if(keys.indexOf(s.bank) < 0) keys.push(s.bank); }));
  const sel = S.sel = S.sel || {bank:"all", cat:"all", wrong:false, random:true};
  let i = keys.indexOf(sel.bank); if (i < 0) i = 0;
  i = (i + dir + keys.length) % keys.length;
  sel.bank = keys[i];
  renderSetup();
  toast("題庫來源：" + (keys[i] === "all" ? "全部題庫" : bankLabel(keys[i])) + "（" + poolOf(sel).length + " 題）");
}

document.addEventListener("keydown", e=>{
  if (e.target.tagName === "INPUT") return;
  const k = e.key.toLowerCase();

  if (HELP){
    if (k === "escape" || k === "?" || k === "h"){ showHelp(false); e.preventDefault(); }
    return;
  }
  if (k === "?" || k === "h"){ showHelp(true); e.preventDefault(); return; }
  if (k === "t"){ toggleTheme(); e.preventDefault(); return; }

  /* 主頁（沒有進行中的測試） */
  if (!Q){
    if (e.key === "ArrowLeft" || e.key === "ArrowRight"){ cycleBank(e.key === "ArrowLeft" ? -1 : 1); e.preventDefault(); }
    else if (e.key === "Enter"){ startQuiz("test"); e.preventDefault(); }
    else if (k === "m"){ startQuiz("mem"); e.preventDefault(); }
    return;
  }

  /* 成績頁 */
  if (Q.over){
    if (e.key === "Enter"){ startQuiz(Q.mode); e.preventDefault(); }
    else if (k === "escape"){ renderSetup(); e.preventDefault(); }
    return;
  }

  const isMem = Q.mode === "mem";

  if (e.key === "ArrowLeft"){ prevQ(); e.preventDefault(); return; }
  if (e.key === "ArrowRight"){
    if (isMem) next(true);
    else if (Q.answered) next();
    else next(true);
    e.preventDefault(); return;
  }

  if (/^[1-4]$/.test(k)){
    if (isMem){ if (k === "1") rate(true); else if (k === "2") rate(false); }
    else if (!Q.answered) pick(+k - 1);
    e.preventDefault(); return;
  }
  const li = "abcd".indexOf(k);
  if (li >= 0 && !isMem){ if (!Q.answered) pick(li); e.preventDefault(); return; }

  if (e.key === "Enter" || k === " "){
    if (isMem) rate(true);
    else if (Q.answered) next();
    e.preventDefault(); return;
  }
  if (isMem && k === "2"){ rate(false); e.preventDefault(); return; }
  if (!isMem && k === "s" && !Q.answered){ next(true); e.preventDefault(); return; }
  if (k === "f"){ finish(); e.preventDefault(); return; }
  if (k === "escape"){ renderSetup(); e.preventDefault(); return; }
});


(function(){
  try{
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
    if (standalone) document.documentElement.classList.add('standalone');
    var tip = document.getElementById('iosTip');
    var key = 'cisp_ios_tip_v1';
    if (!tip) return;
    if (standalone || localStorage.getItem(key) === '1') {
      tip.classList.add('hidden');
    } else if (window.matchMedia && window.matchMedia('(max-width:820px)').matches) {
      tip.classList.remove('hidden');
    }
    var btn = document.getElementById('iosTipClose');
    if (btn) btn.addEventListener('click', function(){
      localStorage.setItem(key, '1');
      tip.classList.add('hidden');
    });
  }catch(e){}
})();

renderSetup();
</script>
