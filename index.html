等分別規劃實施","SSE-CMM覆蓋整個組織的活動,包括管理、組織和工程活動等,而不僅僅是系統安全的工程活動"],"answer":"C","category":"工程與管理","sources":[{"bank":"cisoB","n":43}]},{"id":746,"stem":"有關危害國家祕密安全的行為的法律責任,正確的是:","options":["嚴重違反保密規定行為只要發生,無論產生泄密實際後果,都要依法追究責任","非法獲取國家祕密,不會構成刑事犯罪,不需承擔刑事責任","過失泄露國家祕密,不會構成刑事犯罪,不需承擔刑事責任","承擔了刑事責任,無需再承擔行政責任和/或其他處分"],"answer":"A","category":"法規與標準","sources":[{"bank":"cisoB","n":44},{"bank":"rev1","n":49}]},{"id":747,"stem":"應急響應是信息安全事件管理的重要內容。基於應急響應工作的特點和事件的不規則性,事先創定出事件應急響應方法和過程,有助於一個組織在事件發生時阻止混亂的發生成是在混亂狀態中迅速恢復控制,將損失和負面影響降到最低。應急響應方法和過程並不是唯一的。一種被廣為接受的應急響應方法是將應急響應管理過程分為6個階段,為準備→檢測→遏制→根除→恢復→跟蹤總結。請問下列說法有關於信息安全應急響應管理過程錯誤的是( ):","options":["確定重要資產和風險,實施針對風險的防護措施是信息安全應急響應規劃過程中最關鍵的步驟","在檢測階段,首先要進行監測、報告及信息收集","遏制措施可能會因為事件的類別和級別不同而完全不同。常見的遏制措施有完全關閉所有系統、拔掉網線等","應按照應急響應計劃中事先制定的業務恢復優先順序和恢復步驟,順次恢複相關的系統"],"answer":"C","category":"應急與災難恢復","sources":[{"bank":"cisoB","n":45}]},{"id":748,"stem":"根據相關標準,信息安全風險管理可分為背景建立、風險評估、風險處理、批准監督、監控審查和溝通諮詢等階段。按照該框架,文檔《風險分析報告》應屬於哪個階段的輸出成果()","options":["風險評估","風險處理","批准監督","監控審查"],"answer":"A","category":"風險管理","sources":[{"bank":"cisoB","n":47}]},{"id":749,"stem":"我國標準《信息安全風險管理指南》(GB/Z24364)給出了信息安全風險管理的內容和過程,可以用下圖來表示。圖中空白處應該填寫()","options":["風險計算","風險評價","風險預測","風險處理"],"answer":"D","category":"風險管理","sources":[{"bank":"cisoB","n":49},{"bank":"rev4","n":43}]},{"id":750,"stem":"自主訪問控制模型(DAC)的訪問控制關係可以用訪問控制表(ACL)來表示,該ACL利用在客體上附加一個主體明細表的方法來表示訪問控制矩陣,通常使用由客體指向的鏈表來存儲相關數據。下面選項中說法正確的是()。","options":["ACL在增加客體時,增加相關的訪問控制權限較為簡單","ACL對於統計某個主體能訪問哪些客體比較方便","ACL在刪除用戶時,去除該用戶所有的訪問權限比較方便","ACL是Bell-LaPadula模型的一種具體實現"],"answer":"A","category":"操作系統與主機安全","sources":[{"bank":"cisoB","n":50}]},{"id":751,"stem":"以下關於Web傳輸協議、服務端和客戶端軟件的安全問題說法不正確的是()","options":["HTTP協議主要存在明文傳輸數據、弱驗證和缺乏狀態跟蹤等方面的安全問題","HTTP協議缺乏有效的安全機制,易導致拒絕服務、電子欺騙、嗅探等攻擊","Cookie是為了辨別用戶身份,進行會話跟蹤而存儲在用戶本地終端上的數據,用戶可以隨意查看存儲在Cookie中的數據,但其中的內容不能被修改","針對HTTP協議存在的安全問題,使用HTTPS 具有較高的安全性,可以通過證書來驗證服務器的身份,併為瀏覽器和服務器之間的通信加密"],"answer":"C","category":"操作系統與主機安全","sources":[{"bank":"cisoB","n":51}]},{"id":752,"stem":"不同的信息安全風險評估方法可能得到不同的風險評估結果,所以組織機構應當根據各自的實際情況,選擇適當的風險評估方法。下面的描述中,錯誤的是()","options":["定量風險分析試圖從財務數字上對安全風險進行評估,得出可以量化的風險分析結果,以度量風險的可能性和損失量","定量風險分析相比定性風險分析能得到準確的數值,所以在實際工作中應使用定量風險分析,而不應選擇定性風險分析","定性風險分析過程中,往往需要憑藉分析者的經驗直接進行,所以分析結果和風險評估團隊的素質、經驗和知識技能密切相關","定性風險分析更具主觀性,而定量風險分析更具客觀性"],"answer":"B","category":"風險管理","sources":[{"bank":"cisoB","n":52},{"bank":"rev1","n":91},{"bank":"rev5","n":9}]},{"id":753,"stem":"應急響應是信息安全事件管理的重要內容之一。關於應急響應工作,下面描述錯誤的是()","options":["信息安全應急響應,通常是指一個組織為了應對各種安全意外事件的發生所採取的防範措施,既包括預防性措施,也包括事件發生後的應對措施","應急響應工作有其鮮明的特點:具有高技術複雜性與專業性、強突發性、對知識經驗的高依賴性,以及需要廣泛的協調與合作","應急響應是組織在處置應對突發/重大信息安全事件時的工作,其主要包括兩部分工作:安全事件發生時正確指揮、事件發生後全面總結","應急響應工作的起源和相關機構的成立和1988年11月發生的莫里斯蠕蟲病毒事件有關,基於該事件,人們更加重視安全事件的應急處置和整體協調的重要性"],"answer":"C","category":"應急與災難恢復","sources":[{"bank":"cisoB","n":53},{"bank":"rev3","n":74}]},{"id":754,"stem":"隨着信息安全涉及的範圍越來越廣,各個組織對信息安全管理的需求越來越迫切,越來越多的組織開始嘗試使用參考IS0 27001介紹的ISMS 來實施信息安全管理體系,提高組織的信息安全管理能力。關於ISMS,下面描述錯誤的是()。","options":["在組織中,應由信息技術責任部門(如信息中心)制定並頒佈信息安全方針,為組織的ISMS建設指明方向並提供總體綱領,明確總體要求","組織的管理層應確保ISMS 目標和相應的計劃得以制定,信息安全管理目標應明確、可度量,風險管理計劃應具體,具備可行性","組織的信息安全目標、信息安全方針和要求應傳達到全組織範圍內,應包括全體員工,同時,也應傳達到客戶、合作伙伴和供應商等外部各方","組織的管理層應全面瞭解組織所面臨的信息安全風險,決定風險可接受級別和風險可接受準則,並確認接受相關殘餘風險"],"answer":"A","category":"工程與管理","sources":[{"bank":"cisoB","n":54},{"bank":"rev6","n":29}]},{"id":755,"stem":"公鑰基礎設施(Public Key Infrastructure,PKI)引入數字證書的概念,用來表示用戶的身份。下圖簡要地描述了終端實體(用戶)從認證權威機構CA申請、撤銷和更新數字證書的流程。請為中間框空白處選擇合適的選項()。","options":["證書庫","RA","OCSP","RL庫"],"answer":"B","category":"密碼與加密","sources":[{"bank":"cisoB","n":59}]},{"id":756,"stem":"有關係統安全工程-能力成熟度模型(SSE-CMM)中的通用實施(Generic Practices,GP)錯誤理解是().","options":["GP 是涉及過程的管理、測量和制度化方面的活動","GP 適用於域維中部分過程區域(Process Areas,PA)的活動而非所有 PA 的活動","在工程實施時,GP 應該作為基本實施(Base Practices,BP)的一部分加以執行","在評估時,GP 用於判定工程組織執行某個PA 的能力"],"answer":"B","category":"工程與管理","sources":[{"bank":"cisoB","n":61},{"bank":"rev2","n":73}]},{"id":757,"stem":"王先生是某政府信息中心主任。以下哪項項目是符合《保守國家祕密法》要求的()","options":["王先生安排下屬小李將損害的涉密計算機的某國外品牌硬盤送到該品牌中國區維修中心修理","王先生要求下屬小張把中心所有計算機貼上密級標誌","王先生每天晚上 12 點將涉密計算機連接上互聯網更新殺毒軟件病毒庫","王先生提出對加密機和紅黑電源插座應該與涉密信息系統同步投入使用"],"answer":"D","category":"密碼與加密","sources":[{"bank":"cisoB","n":63},{"bank":"rev6","n":4}]},{"id":758,"stem":"以下關於網絡安全設備說法正確的是() .","options":["防火牆既能實現內外網物理隔離,又能實現內外網邏輯隔離","安全隔離與信息交換系統也稱為網閘,需要信息交換時,同一時間可以和兩個不同安全級別的網絡連接","入侵檢測系統的主要作用是發現並報告系統中未授權或違反安全策略的行為","虛擬專用網是在公共網絡中,利用隧道技術,建立一個永久.安全的通信網絡"],"answer":"C","category":"網絡安全","sources":[{"bank":"cisoB","n":64}]},{"id":759,"stem":"Linux系統的安全設置主要從磁盤分區、賬戶安全設置、禁用危險服務、遠程登錄安全、用戶鑑別安全、審計策略、保護root賬戶、使用網絡防火牆和文件權限操作共10個方面來完成。小張在學習了Linux系統安全的相關知識後,嘗試為自己計算機上的Linux系統進行安全配置。下列選項是他的部分操作,其中不合理的是()。","options":["編輯文件/etc/ssh/sshd_config,將PermitRootLogin設置為no","編輯文件/etc/profile,設置TMOUT=600","編輯文件/etc/pam.d/system-auth,設置auth required pam_tally.so onerr=fail deny=6 unlock_time=300","編輯文件/etc/passwd,檢查文件中用戶ID,禁用所有用戶ID=0的用戶"],"answer":"D","category":"網絡安全","sources":[{"bank":"cisoB","n":65}]},{"id":760,"stem":"《國家信息化領導小組關於加強信息安全保障工作的意見》中辦發[2003]27號明確了我國信息安全保障工作的()、加強信息安全保障工作的()、需要重點加強的信息安全保障工作。27號文的重大意義是,它標誌着我國信息安全保障工作有了()、我國最近十餘年的信息安全保障工作都是圍繞此政策性文件來()的、促進了我國()的各項工作。","options":["方針;主要原則;總體綱領;展開和推進;信息安全保障建設","總體要求;總體綱領:主要原則;展開;信息安全保障建設","總體要求;主要原則;總體綱領;展開;信息安全保障建設","方針和總體要求;主要原則;總體綱領;展開和推進;信息安全保障建設"],"answer":"D","category":"工程與管理","sources":[{"bank":"cisoB","n":66}]},{"id":761,"stem":"RPO(恢復點目標)是指災難發生後,系統和數據能夠恢復到的時間點,理論上也可以為0,即實時備份,不丟失任何數據。所以選A。\n68. 2016年10月21日,美國東部地區發生大規模斷網事件,此次事件是由於美國主要DNS服務商Dyn遭遇大規模攻擊所致,影響規模驚人,對人們生產生活造成嚴重影響。DDoS攻擊的主要目的是破壞系統的()。","options":["保密性","可用性","不可否認性","抗抵賴性"],"answer":"B","category":"應急與災難恢復","sources":[{"bank":"cisoB","n":68}]},{"id":762,"stem":"從Linux內核2.1版開始，實現了基於權能的特權管理機制，實現了對超級用戶的特權分割，打破了UNIX/LINUX操作系統中超級用戶/普通用戶的概念，提高了操作系統的安全性。下列選項中，對特權管理機制的理解錯誤的是（）。","options":["普通用戶及其shell沒有任何權能,而超級用戶及其shell在系統啓動之初擁有全部權能","當普通用戶的某些操作設計特權操作時,仍然通過setuid實現","系統管理員可以剝奪和恢復超級用戶的某些權能","進程可以放棄自己的某些權能"],"answer":"C","category":"工程與管理","sources":[{"bank":"cisoB","n":70}]},{"id":763,"stem":"由於密碼技術都依賴於密鑰,因此密鑰的安全管理是密碼技術應用中非常重要的環節,下列關於密鑰管理說法錯誤的是()。","options":["科克霍夫在《軍事密碼學》中指出系統的保密性不依賴於對加密體制或算法的保密,而依賴於密鑰","在保密通信過程中,通信雙方可以一直使用之前用過的會話密鑰,不影響安全性","密鑰管理需要在安全策略的指導下處理密鑰生命週期的整個過程,包括產生、存儲、備份、分配、更新、撤銷等","在保密通信過程中,通信雙方也可利用Diffie-Hellman協議協商出會話密鑰進行保密通信"],"answer":"B","category":"密碼與加密","sources":[{"bank":"cisoB","n":71}]},{"id":764,"stem":"以下哪種風險被認為是合理的風險()。","options":["最小的風險","殘餘風險","未識別的風險","可接受的風險"],"answer":"D","category":"風險管理","sources":[{"bank":"cisoB","n":74}]},{"id":765,"stem":"以下哪個說法最符合《網絡安全法》中關於網絡的定義()","options":["計算機局域網","包含服務器、交換機等設備的系統","涵蓋處理各種信息的設備的網絡空間","人與人交往聯繫的社會網絡"],"answer":"C","category":"網絡安全","sources":[{"bank":"cisoB","n":76}]},{"id":766,"stem":"密碼學是網絡安全的基礎,但網絡安全不能單純依靠安全的密碼算法、密碼協議也是網絡安全的一個重要組成部分。下面描述中,錯誤的是()","options":["在實際應用中,密碼協議應按照靈活性好、可擴展性高的方式制定,不要限制和框住的執行步驟,有些複雜的步驟可以不明確處理方式。","密碼協議定義了兩方或多方之間為完成某項任務而指定的一系列步驟,協議中的每個參與方都必須瞭解協議,且按步驟執行。","根據密碼協議應用目的的不同,參與該協議的雙方可能是朋友和完全信息的人,也可能是敵人和互相完全不信任的人。","密碼協議(Crypto graphic protocol) ,有時也稱安全協議(security protocol), 是使用密碼學完成某項特定的任務並滿足安全需求的協議,其末的是提供安全服務"],"answer":"A","category":"網絡安全","sources":[{"bank":"cisoB","n":83},{"bank":"rev2","n":9}]},{"id":767,"stem":"信息安全保障技術框架.(Information Assurance Technical Framework, IATF) ,目的是為保障政府和工業的()提供了()。信息安全保障技術框架的一個核心思想是()。深度防禦戰略的三個核心要素:()、技術和運行(亦稱為操作)","options":["信息基礎設施;技術指南;深度防禦:人員","技術指南;信息基礎設施;深度防禦;人員","信息基礎設施;深度防禦:技術指南,人員","信息基礎設施:技術指南;人員深度防禦"],"answer":"A","category":"工程與管理","sources":[{"bank":"cisoB","n":84}]},{"id":768,"stem":"金女士經常通過計算機在互聯網上購物,從安全角度看,下面哪項是不好的操作習慣()","options":["使用專用上網購物用計算機,安裝好軟件後不要對該計算機上的系統軟件、應用軟件進行升級","為計算機安裝具有良好蘆譽的安全防護軟件,包括病毒查殺、 安全檢查和安全加固方面的軟件","在IE的配置中,設置只能下載和安裝經過簽名的、安全的ActiveX控件","在使用網絡瀏覽器時,設置不在計算機中保留網絡歷史記錄和表單數據"],"answer":"A","category":"網絡安全","sources":[{"bank":"cisoB","n":85},{"bank":"rev2","n":2}]},{"id":769,"stem":"某單位在一次信息安全風險管理活動中,風險評估報告提出服務器A的FIP 服務存在高風險漏洞。隨後該單位在風險處理時選擇了安裝FIP 服務漏洞補丁程序並加固FTP服務安全措施,請問該措施屬於哪種風險處理方式","options":["風險降低","風險規避","風險轉移","風險接受"],"answer":"A","category":"風險管理","sources":[{"bank":"cisoB","n":87}]},{"id":770,"stem":"()第二十三條規定存儲、處理國家祕密的計算機信息系統(以下簡稱涉密信息系統)按照()實行分級保護。()應當按照國家保密標準配備保密設施、設備。()、設備應當與涉密信息系統同步規劃、同步建設、同步運行。(三同步)涉密信息系統應當按照規定,經()後,方可投入使用。","options":["《保密法》;涉密程度;涉密信息系統;保密設施;檢查合格","《國家保密法》;涉密程度;涉密系統;保密設施;檢查合格","《網絡保密法》;涉密程度;涉密系統;保密設施;檢查合格","《安全保密法》;涉密程度;涉密信息系統;保密設施;檢查合格"],"answer":"A","category":"法規與標準","sources":[{"bank":"cisoB","n":88},{"bank":"rev6","n":6}]},{"id":771,"stem":"CC標準是目前系統安全認證方面最權威的標準,以下哪一項沒有體現CC標準的先進性()","options":["結構的開放性,即功能和保證要求都可以在具體的“保護輪廓”和“安全目標”中進一步細化和擴展","表達方式的通用性,即給出通用的表達方式","獨立性,它強調將安全的功能和保證分離","實用性,將CC的安全性要求具體應用到IT產品的開發、生產、測試和評估過程中"],"answer":"C","category":"法規與標準","sources":[{"bank":"cisoB","n":91},{"bank":"rev2","n":81}]},{"id":772,"stem":"老王是一名企業信息化負責人,由於企業員工在瀏覽網頁時總導致病毒感染系統,為了解決這一問題,老王要求信息安全員給出解決措施,信息安全員給出了四條措施建議,老王根據多年的信息安全管理經驗,認為不太適合推廣你認為是哪條措施()","options":["採購防病毒網關並部署在企業互聯網出口中,實現對所有瀏覽網頁進行檢測,阻止網頁中的病毒進入內網","採購並統一部署企業防病毒軟件,信息化管理部門統一進行病毒庫升級,確保每臺計算機都具備有效的病毒檢測和查殺能力","制定制度禁止使用微軟的 IE 瀏覽器上網,統一要求使用Chrome 瀏覽器","組織對員工進行一次上網行為要全培訓,提高企業員工在互聯網瀏覽時的安全意識"],"answer":"C","category":"惡意代碼與漏洞","sources":[{"bank":"cisoB","n":92}]},{"id":773,"stem":"若一個組織聲稱自己的ISMS符合IS0/IEC 27001或GB/T 22080 標準要求,其信息安全控制措施通常需要在人力資源安全方面實施常規控制,人力資源安全劃分為3個控制階段,不包括哪一項()","options":["任用之前","任用中","任用終止或變化","任用公示"],"answer":"D","category":"法規與標準","sources":[{"bank":"cisoB","n":96},{"bank":"rev4","n":16}]},{"id":774,"stem":"根據信息安全風險要素之間的關係,下圖中空白處應該填寫()","options":["資產","安全事件","脆弱性","安全措施"],"answer":"C","category":"風險管理","sources":[{"bank":"cisoB","n":97},{"bank":"rev2","n":99}]},{"id":775,"stem":"小王在學習信息安全管理體系相關知識之後,對於建立信息安全管理體系,自己總結了下面四條要求,其中理解不正確的是( )。","options":["信息安全管理體系的建立應基於最新的信息安全技術,因為這是國家有關信息安全的法律和法規方面的要求,這體現以預防控制為主的思想正確答案","信息安全管理體系的建立應參照國際國內有關標準實施,因為這些標準是標準化組織在總結研究了很多實際的或潛在的問題後,制定的能共同的和重複使用的規則","信息安全管理體系應強調全過程和動態控制的思想,因為安全問題是動態的,系統所處的安全環境也不會一成不變的,不可能建設永遠安全的系統","信息安全管理體系應體現科學性和全面性的特點,因為要對信息安全管理涉及的方方面面實施較為均衡的管理,避免遺漏某些方面而導致組織的整體信息安全水平過低"],"answer":"A","category":"工程與管理","sources":[{"bank":"cisoB","n":99}]},{"id":776,"stem":"依據國家標準/T20274《信息系統安全保障評估框架》,信息系統安全目標(ISST)中,安全保障目的指的是:","options":["信息系統安全保障目的","環境安全保障目的","信息系統安全保障目的和環境安全保障目的","信息系統整體安全保障目的、管理安全保障目的、技術安全保障目的和工程安全保障目的"],"answer":"D","category":"工程與管理","sources":[{"bank":"rev1","n":1}]},{"id":777,"stem":"進入21世紀以來,信息安全成為世界各國安全戰略關注的重點,紛紛制定並頒佈網絡空間安全戰略,但各國曆史、國情和文化不同,網絡空間安全戰略的內容也各不相同,以下說法不正確的是:","options":["與國家安全、社會穩定和民生密切相關的關鍵基礎設施是各國安全保障的重點","美國尚未設立中央政府級的專門機構處理網絡信息安全問題,信息安全管理職能由不同政府部門的多個機構共同承擔","各國普遍重視信息安全事件的應急響應和處理","在網絡安全戰略中,各國均強調加強政府管理力度,充分利用社會資源,發揮政府與企業之間的合作關係"],"answer":"B","category":"網絡安全","sources":[{"bank":"rev1","n":3}]},{"id":778,"stem":"2008年1月2日,美目發佈第54號總統令,建立國家網絡安全綜合計劃(Comprehensive National Cyber security Initiative,CNCI)。CNCI計劃建立三道防線:第一道防線,減少漏洞和隱患,預防入侵;第二道防線,全面應對各類威脅;第三道防線,強化未來安全環境.從以上內容,我們可以看出以下哪種分析是正確的:","options":["NCI是以風險為核心,三道防線首要的任務是降低其網絡所面臨的風險","從CNCI可以看出,威脅主要是來自外部的,而漏洞和隱患主要是存在於內部的","NCI的目的是儘快研發並部署新技術徹底改變其糟糕的網絡安全現狀,而不是在現在的網絡基礎上修修補補","NCI徹底改變了以往的美國信息安全戰略,不再把關鍵基礎設施視為信息安全保障重點,而是追求所有網絡和系統的全面安全保障"],"answer":"A","category":"網絡安全","sources":[{"bank":"rev1","n":6}]},{"id":779,"stem":"某用戶通過賬號、密碼和驗證碼成功登錄某銀行的個人網銀系統,此過程屬於以下哪一類:","options":["個人網銀系統和用戶之間的雙向鑑別","由可信第三方完成的用戶身份鑑別","個人網銀系統對用戶身份的單向鑑別","用戶對個人網銀系統合法性的單向鑑別"],"answer":"C","category":"密碼與加密","sources":[{"bank":"rev1","n":8},{"bank":"rev4","n":93}]},{"id":780,"stem":"Alice 用Bob的密鑰加密明文,將密文發送給Bob。Bob再用自己的私鑰解密,恢復出明文。以下說法正確的是:","options":["此密碼體制為對稱密碼體制","此密碼體制為私鑰密碼體制","此密碼體制為單鑰密碼體制","此密碼體制為公鑰密碼體制"],"answer":"D","category":"密碼與加密","sources":[{"bank":"rev1","n":9},{"bank":"rev4","n":88}]},{"id":781,"stem":"下列哪一種方法屬於基於實體“所有”鑑別方法:","options":["用戶通過自己設置的口令登錄系統,完成身份鑑別","用戶使用個人指紋,通過指紋識別系統的身份鑑別","用戶利用和系統協商的祕密函數,對系統發送挑戰進行正確應答,通過身份鑑別","用戶使用集成電路卡(如智能卡)完成身份鑑別"],"answer":"D","category":"操作系統與主機安全","sources":[{"bank":"rev1","n":10}]},{"id":782,"stem":"為防範網絡欺詐確保交易安全,網銀系統首先要求用戶安全登錄,然後使用“智能卡+短信認證”模式進行網上轉賬等交易,在此場景中用到下列哪些鑑別方法?","options":["實體“所知”以及實體“所有”的鑑別方法","實體“所有”以及實體“特徵”的鑑別方法","實體“所知”以及實體“特徵”的鑑別方法","實體“所有”以及實體“行為”的鑑別方法"],"answer":"A","category":"法規與標準","sources":[{"bank":"rev1","n":11}]},{"id":783,"stem":"某單位開發了一個面向互聯網提供服務的應用網站,該單位委託軟件測評機構對軟件進行了源代碼分析、模糊測試等軟件安全性測試,在應用上線前,項目經理提出了還需要對應用網站進行一次滲透性測試,作為安全主管,你需要提出滲透性測試相比源代碼測試、模糊測試的優勢給領導做決策,以下哪條是滲透性測試的優勢?","options":["滲透測試以攻擊者的思維模擬真實攻擊,能發現如配置錯誤等運行維護期產生的漏洞","滲透測試是用軟件代替人工的一種測試方法,因此測試效率更高","滲透測試使用人工進行測試,不依賴軟件,因此測試更準確","滲透測試中必須要查看軟件源代碼,因此測試中發現的漏洞更多"],"answer":"A","category":"惡意代碼與漏洞","sources":[{"bank":"rev1","n":12}]},{"id":784,"stem":"軟件安全設計和開發中應考慮用戶穩私包,以下關於用戶隱私保護的說法哪個是錯誤的?","options":["告訴用戶需要收集什麼數據及蒐集到的數據會如何披使用","當用戶的數據由於某種原因要被使用時,給用戶選擇是否允許","用戶提交的用戶名和密碼屬於穩私數據,其它都不是","確保數據的使用符合國家、地方、行業的相關法律法規"],"answer":"C","category":"法規與標準","sources":[{"bank":"rev1","n":13},{"bank":"rev5","n":40}]},{"id":785,"stem":"軟件安全保障的思想是在軟件的全生命週期中貫徹風險管理的思想,在有限資源前提下實現軟件安全最優防護,避免防範不足帶來的直接損失,也需要關注過度防範造成的間接損失。在以下軟件安全開發策略中,不符合軟件安全保障思想的是:","options":["在軟件立項時考慮到軟件安全相關費用,經費中預留了安全測試、安全評審相關費用,確保安全經費得到落實","在軟件安全設計時,邀請軟件安全開發專家對軟件架構設計進行評審,及時發現架構設計中存在的安全不足","確保對軟編碼人員進行安全培訓,使開發人員瞭解安全編碼基本原則和方法,確保開發人員編寫出安全的代碼","在軟件上線前對軟件進行全面安全性測試,包括源代碼分析、模糊測試、滲透測試,未經以上測試的軟件不允許上線運行"],"answer":"D","category":"工程與管理","sources":[{"bank":"rev1","n":14}]},{"id":786,"stem":"主體S對客體01有讀(R)權限,對客體02有讀(R)、寫(W)、擁有(Own)權限,該訪問控制實現方法是:","options":["訪問控制表(ACL)","訪問控制矩陣","能力表(CL)","前綴表(Profiles)"],"answer":"C","category":"操作系統與主機安全","sources":[{"bank":"rev1","n":16},{"bank":"rev4","n":69}]},{"id":787,"stem":"以下場景描述了基於角色的訪問控制模型(Role-based Access Control.RBAC):根據組織的業務要求或管理要求,在業務系統中設置若干崗位、職位或分工,管理員負責將權限(不同類別和級別的)分別賦予承擔不同工作職責的用戶。關於RBAC模型,下列說法錯誤的是:","options":["當用戶請求訪問某資源時,如果其操作權限不在用戶當前被激活角色的授權範圍內,訪問請求將被拒絕","業務系統中的崗位、職位或者分工,可對應RBAC模型中的角色","通過角色,可實現對信息資源訪問的控制","RBAC模型不能實現多級安全中的訪問控制"],"answer":"D","category":"工程與管理","sources":[{"bank":"rev1","n":17}]},{"id":788,"stem":"下面哪一項不是虛擬專用網絡(VPN)協議標準:","options":["第二層隧道協議(L2TP)","Internet安全性(IPSEC)","終端訪問控制器訪問控制系統(TACACS+)","點對點隧道協議(PPTP)"],"answer":"C","category":"網絡安全","sources":[{"bank":"rev1","n":18}]},{"id":789,"stem":"鑑別的基本途徑有三種:所知、所有和個人特徵,以下哪一項不是基於你所知道的:","options":["口令","令牌","知識","密碼"],"answer":"B","category":"密碼與加密","sources":[{"bank":"rev1","n":20}]},{"id":790,"stem":"某公司已有漏洞掃描和入侵檢測系統(Intrusion Detection System,IDS)產品,需要購買防火牆,以下做法應當優先考慮的是:","options":["選購當前技術最先進的防火牆即可","選購任意一款品牌防火牆","任意選購一款價格合適的防火牆產品","選購一款同已有安全產品聯動的防火牆"],"answer":"D","category":"網絡安全","sources":[{"bank":"rev1","n":22}]},{"id":791,"stem":"某單位人員管理系統在人員離職時進行賬號刪除,需要離職員工所在部門主管經理和人事部門人員同時進行確認才能在系統上執行,該設計是遵循了軟件安全哪項原則","options":["最小權限","權限分離","不信任","縱深防禦"],"answer":"B","category":"工程與管理","sources":[{"bank":"rev1","n":24}]},{"id":792,"stem":"以下關於PGP(Pretty Good Privacy)軟件敘述錯誤的是:","options":["PGP可以實現對郵件的加密、簽名和認證","PGP可以實現數據壓縮","PGP可以對郵件進行分段和重組","PGP採用SHA算法加密郵件"],"answer":"D","category":"密碼與加密","sources":[{"bank":"rev1","n":27}]},{"id":793,"stem":"入侵防禦系統(IPS)是繼入侵檢測系統(IDS)後發展期出來的一項新的安全技術,它與IDS有着許多不同點,請指出下列哪一項描述不符合IPS 的特點?","options":["串接到網絡線路中","對異常的進出流量可以直接進行阻斷","有可能造成單點故障","不會影響網絡性能"],"answer":"D","category":"網絡安全","sources":[{"bank":"rev1","n":28}]},{"id":794,"stem":"某公司系統管理員最近正在部署一臺Web服務器,使用的操作系統是windows,在進行日誌安全管理設置時,系統管理員擬定四條日誌安全策略給領導進行參考,其中能有效應對攻擊者獲得系統權限後對日誌進行修改的策略是:","options":["網絡中單獨部署syslog服務器,將Web服務器的日誌自動發送並存儲到該syslog日誌服務器中","嚴格設置Web日誌權限,只有系統權限才能進行讀和寫等操作","對日誌屬性進行調整,加大日誌文件大小、延長覆蓋時間、設置記錄更多信息等","使用獨立的分區用於存儲日誌,並且保留足夠大的日誌空間"],"answer":"A","category":"操作系統與主機安全","sources":[{"bank":"rev1","n":30}]},{"id":795,"stem":"關於linux下的用戶和組,以下描述不正確的是 。","options":["在linux中,每一個文件和程序都歸屬於一個特定的“用戶”","系統中的每一個用戶都必須至少屬於一個用戶組","用戶和組的關係可是多對一,一個組可以有多個用戶,一個用戶不能屬於多個組","root是系統的超級用戶,無論是否文件和程序的所有者都具有訪問權限"],"answer":"C","category":"操作系統與主機安全","sources":[{"bank":"rev1","n":31}]},{"id":796,"stem":"安全的運行環境是軟件安全的基礎,操作系統安全配置是確保運行環境安全必不可少的工作,某管理員對即將上線的Windows操作系統進行了以下四項安全部署工作,其中哪項設置不利於提高運行環境安全?","options":["操作系統安裝完成後安裝最新的安全補丁,確保操作系統不存在可被利用的安全漏洞","為了方便進行數據備份,安裝Windows操作系統時只使用一個分區C,所有數據和操作系統都存放在C盤","操作系統上部署防病毒軟件,以對抗病毒的威脅","將默認的管理員賬號Administrator改名,降低口令暴力破解攻擊的發生可能"],"answer":"B","category":"操作系統與主機安全","sources":[{"bank":"rev1","n":32}]},{"id":797,"stem":"賬號鎖定策略中對超過一定次數的錯誤登錄賬號進行鎖定是為了對抗以下哪種攻擊?","options":["分佈式拒絕服務攻擊(DDoS)","病毒傳染","口令暴力破解","緩衝區溢出攻擊"],"answer":"C","category":"操作系統與主機安全","sources":[{"bank":"rev1","n":35}]},{"id":798,"stem":"張三將微信個人頭像換成微信羣中某好友頭像,並將暱稱改為該好友的暱稱,然後向該好友的其他好友發送一些欺騙消息。該攻擊行為屬於以下哪類攻擊?","options":["口令攻擊","暴力破解","拒絕服務攻擊","社會工程學攻擊"],"answer":"D","category":"操作系統與主機安全","sources":[{"bank":"rev1","n":37}]},{"id":799,"stem":"關於軟件安全開發生命週期(SDL),下面說法錯誤的是:","options":["在軟件開發的各個週期都要考慮安全因素","軟件安全開發生命週期要綜合採用技術、管理和工程等手段","測試階段是發現並改正軟件安全漏洞的最佳環節,過早或過晚檢測修改漏洞都將增大軟件開發成本","在設計階段就儘可能發現並改正安全隱患,將極大減少整個軟件開發成本"],"answer":"C","category":"工程與管理","sources":[{"bank":"rev1","n":38}]},{"id":800,"stem":"在軟件保障成熟度模型(Software Assurance Maturity Mode,SAMM)中,規定了軟件開發過程中的核心業務功能,下列哪個選項不屬於核心業務功能:","options":["治理,主要是管理軟件開發的過程和活動","構造,主要是在開發項目中確定目標並開發軟件的過程與活動","驗證,主要是測試和驗證軟件的過程與活動","購置,主要是購買第三方商業軟件或者採用開源組件的相關管理過程與活動"],"answer":"D","category":"工程與管理","sources":[{"bank":"rev1","n":39},{"bank":"rev2","n":42}]},{"id":801,"stem":"從系統工程的角度來處理信息安全問題,以下說法錯誤的是:","options":["系統安全工程旨在瞭解企業存在的安全風險,建立一組平衡的安全需求,融合各種工程學科的努力將此安全需求轉換為貫穿系統整個生存期的工程實施指南。","系統安全工程需對安全機制的正確性和有效性做出詮釋,證明安全系統的信任度能夠達到企業的要求,或系統遺留的安全薄弱性在可容許範圍之內。","系統安全工程能力成熟度模型(SSE-CMM)是一種衡量安全工程實踐能力的方法,是一種使用面向開發的方法。","系統安全工程能力成熟度模型(SSE-CMM)是在原有能力成熟度模型(CMM)的基礎上,通過對安全工作過程進行管理的途徑,將系統安全工程轉變為一個完好定義的、成熟的、可測量的先進學科。"],"answer":"C","category":"工程與管理","sources":[{"bank":"rev1","n":40}]},{"id":802,"stem":"有關係統安全工程-能力成熟度模型(SSE-CMM)中的基本實施(Base Practices,BP),正確的理解是:","options":["P是基於最新技術而制定的安全參數基本配置","大部分BP是沒有經過測試的","一項BP適用於組織的生存週期而非僅適用於工程的某一特定階段","一項BP可以和其他BP有重疊"],"answer":"C","category":"工程與管理","sources":[{"bank":"rev1","n":41},{"bank":"rev2","n":72}]},{"id":803,"stem":"以下關於信息安全法治建設的意義,說法錯誤的是:","options":["信息安全法律環境是信息安全保障體系中的必要環節","明確違反信息安全的行為,並對行為進行相應的處罰,以打擊信息安全犯罪活動","信息安全主要是技術問題,技術漏洞是信息犯罪的根源","信息安全產業的逐漸形成,需要成熟的技術標準和完善的技術體系"],"answer":"C","category":"工程與管理","sources":[{"bank":"rev1","n":43}]},{"id":804,"stem":"小張是信息安全風險管理方面的專家,被某單位邀請過去對其核心機房經受某種災害的風險進行評估,已知:核心機房的總價價值一百萬,災害將導致資產總價值損失二成四(24%),歷史數據統計告知該災害發生的可能性為八年發生三次,請問小張最後得到的年度預期損失為多少:","options":["24萬","0.09 萬","37.5 萬","9 萬"],"answer":"D","category":"風險管理","sources":[{"bank":"rev1","n":44}]},{"id":805,"stem":"2005 年4 月1日正式施行的《電子簽名法》,被稱為“中國首部真正意義上的信息化法律”,自此電子簽名與傳統手寫簽名和蓋章具有同等的法律效力。以下關於電子簽名說法錯誤的是:","options":["電子簽名——是指數據電文中以電子形式所含、所附用於識別簽名人身份並表明簽名人認可其中內容的數據","電子簽名適用於民事活動中的合同或者其他文件、單證等文書","電子簽名需要第三方認證的,由依法設立的電子認證服務提供者提供認證服務","電子簽名製作數據用於電子簽名時,屬於電子簽名人和電子認證服務提供者共有"],"answer":"D","category":"密碼與加密","sources":[{"bank":"rev1","n":45}]},{"id":806,"stem":"信息安全等級保護要求中,第三級適用的正確的是:","options":["適用於一般的信息和信息系統,其受到破壞後,會對公民、法人和其他組織的權益有一定影響,但不危害國家安全、社會秩序、經濟建設和公共利益","適用於一定程度上涉及國家安全、社會秩序、經濟建設和公共利益的一般信息和信息系統,其受到破壞後,會對國家安全、社會秩序、經濟建設和公共利益造成一般損害","適用於涉及國家安全、社會秩序、經濟建設和公共利益的信息和信息系統,其受到破壞後,會對國家安全、社會秩序、經濟建設和公共利益造成嚴重損害","適用於涉及國家安全、社會秩序、經濟建設和公共利益的重要信息和信息系統的核心子系統。其受到破壞後,會對國家安全、社會秩序,經濟建設和公共利益造成特別嚴重損害"],"answer":"B","category":"法規與標準","sources":[{"bank":"rev1","n":47}]},{"id":807,"stem":"以下對於信息安全事件理解錯誤的是:","options":["信息安全事件,是指由於自然或者人為以及軟硬件本身缺陷或故障的原因,對信息系統造成危害,或在信息系統內發生對社會造成負面影響的事件","對信息安全事件進行有效管理和響應,最小化事件所造成的損失和負面影響,是組織信息安全戰略的一部分","應急響應是信息安全事件管理的重要內容","通過部署信息安全策略並配合部署防護措施,能夠對信息及信息系統提供保護,杜絕信息安全事件的發生"],"answer":"D","category":"應急與災難恢復","sources":[{"bank":"rev1","n":50}]},{"id":808,"stem":"假設一個系統已經包含了充分的預防控制措施,那麼安裝監測控制設備:","options":["是多餘的,因為它們完成了同樣的功能,但要求更多的開銷","是必須的,可以為預防控制的功效提供檢測","是可選的,可以實現深度防禦","在一個人工系統中是需要的,但在一個計算機系統中則是不需要的,因為預防控制功能已經足夠"],"answer":"C","category":"風險管理","sources":[{"bank":"rev1","n":51}]},{"id":809,"stem":"關於我國加強信息安全保障工作的主要原則,以下說法錯誤的是:","options":["立足國情,以我為主,堅持技術與管理並重","正確處理安全和發展的關係,以安全保發展,在發展中求安全","統籌規劃,突出重點,強化基礎工作","全面提高信息安全防護能力,保護公衆利益,維護國家安全"],"answer":"D","category":"工程與管理","sources":[{"bank":"rev1","n":52}]},{"id":810,"stem":"根據《關於開展信息安全風險評估工作的意見》的規定,錯誤的是:","options":["信息安全風險評估分自評估、檢查評估兩形式。應以檢查評估為主,自評估和檢查評估相互結合、互為補充","信息安全風險評估工作要按照“嚴密組織、規範操作、講求科學、注重實效”的原則開展","信息安全風險評估應貫穿於網絡和信息系統建設運行的全過程","開展信息安全風險評估工作應加強信息安全風險評估工作的組織領導"],"answer":"A","category":"風險管理","sources":[{"bank":"rev1","n":57}]},{"id":811,"stem":"自2004年1月起,國內各有關部門在申報信息安全國家標準計劃項目時,必須經由以下哪個組織提出工作意見,協調一致後由該組織申報。","options":["全國通信標準化技術委員會(TC485)","全國信息安全標準化技術委員會(TC260)","中國通信標準化協會(CCSA)","網絡與信息安全技術工作委員會"],"answer":"B","category":"法規與標準","sources":[{"bank":"rev1","n":59}]},{"id":812,"stem":"風險計算原理可以用下面的範式形式化地加以說明:風險值=R(A,T,V)=R(L(T,V),F(Ia,Va))以下關於上式各項說明錯誤的是:","options":["R表示安全風險計算函數,A表示資產,T表示威脅,V表示脆弱性","L表示威脅利資產脆弱性導致安全事件的可能性","F表示安全事件發生後造成的損失","Ia,Va分別表示安全事件作用全部資產的價值與其對應資產的嚴重程度"],"answer":"D","category":"風險管理","sources":[{"bank":"rev1","n":60}]},{"id":813,"stem":"關於信息安全事件管理和應急響應,以下說法錯誤的是:","options":["應急響應是指組織為了應對突發/重大信息安全事件的發生所做的準備,以及在事件發生後所採取的措施","應急響應方法,將應急響應管理過程分為遏制、根除、處置、恢復、報告和跟蹤6 個階段","對信息安全事件的分級主要參考信息系統的重要程度、系統損失和社會影響三方面因素","根據信息安全事件的分級參考要素,可將信息安全事件劃分為4個級別:特別重大事件(I級)、重大事件(II級)、較大事件(III級)和一般事件(IV級)"],"answer":"B","category":"應急與災難恢復","sources":[{"bank":"rev1","n":64},{"bank":"rev2","n":62},{"bank":"rev4","n":53}]},{"id":814,"stem":"以下哪一項不屬於信息安全工程監理模型的組成部分:","options":["監理諮詢支撐要素","控制和管理手段","監理諮詢階段過程","監理組織安全實施"],"answer":"D","category":"工程與管理","sources":[{"bank":"rev1","n":65}]},{"id":815,"stem":"以下關於災難恢復和數據備份的理解,說法正確的是:","options":["增量備份是備份從上次完全備份後更新的全部數據文件","依據具備的災難恢復資源程度的不同,災難恢復能力分為7個等級","數據備份按數據類型劃分可以劃分為系統數據備份和用戶數據備份","如果系統在一段時間內沒有出現問題,就可以不用再進行容災演練了"],"answer":"C","category":"應急與災難恢復","sources":[{"bank":"rev1","n":66}]},{"id":816,"stem":"某公司擬建設面向內部員工的辦公自動化系統和麪向外部客戶的營銷系統,通過公開招標選擇M公司為承建單位,並選擇了H監理公司承擔該項目的全程監理工作,目前,各個應用系統均已完成開發,M公司已經提交了驗收申請,監理公司需要對A公司提交的軟件配置文件進行審查,在以下所提交的文檔中,哪一項屬於開發類文檔:","options":["項目計劃書","質量控制計劃","評審報告","需求說明書"],"answer":"D","category":"法規與標準","sources":[{"bank":"rev1","n":67}]},{"id":817,"stem":"在某網絡機房建設項目中,在施工前,以下哪一項不屬於監理需要審覈的內容:","options":["審覈實施投資計劃","審覈實施進度計劃","審覈工程實施人員","企業資質"],"answer":"A","category":"工程與管理","sources":[{"bank":"rev1","n":68}]},{"id":818,"stem":"以下關於直接附加存儲(Direct Attached Storage,DAS)說法錯誤的是:","options":["AS能夠在服務器物理位置比較分散的情況下實現大容量存儲.是一種常用的數據存儲方法","AS實現了操作系統與數據的分離,訪問性能較高並且實施簡單","AS的缺點在於對服務器依賴性強,當服務器發生故障時,連接在服務器上的存儲設備中的數據不能被訪問","較網絡附加存儲(Network Attached Storage,NAS),DAS節省硬盤空間,數據非常集中,便於對數據進行管理和備份"],"answer":"D","category":"操作系統與主機安全","sources":[{"bank":"rev1","n":69}]},{"id":819,"stem":"DAS優點數據分散、風險分散,缺點是存儲空間利用率低、不便於統一管理。SAN基於NAS的進一步實現,基於高速網絡、多備份中心來進行實現。\n某公司在執行災難恢復測試時.信息安全專業人員注意到災難恢復站點的服務器的運行速度緩慢,為了找到根本願因,他應該首先檢查:","options":["災難恢復站點的錯誤事件報告","災難恢復測試計劃","災難恢復計劃(DRP)","主站點和災難恢復站點的配置文件"],"answer":"A","category":"應急與災難恢復","sources":[{"bank":"rev1","n":70}]},{"id":820,"stem":"作為業務持續性計劃的一部分,在進行業務影響分析(BIA)時的步驟是:\n1.標識關鍵的業務過程;\n2.開發恢復優先級;\n3.標識關鍵的IT資源;\n4.表示中斷影響和允許的中斷時間","options":["1-3-4-2","1-3-2-4","1-2-3-4","1-4-3-2"],"answer":"A","category":"應急與災難恢復","sources":[{"bank":"rev1","n":72}]},{"id":821,"stem":"下面關於信息系統安全保障的說法不正確的是:","options":["信息系統安全保障與信息系統的規劃組織、開發採購、實施交付、運行維護和廢棄等生命週期密切相關","信息系統安全保障要素包括信息的完整性、可用性和保密性","信息系統安全需要從技術、工程、管理和人員四個領域進行綜合保障","信息系統安全保障需要將信息系統面臨的風險降低到可接受的程度,從而實現其業務使命"],"answer":"B","category":"工程與管理","sources":[{"bank":"rev1","n":74}]},{"id":822,"stem":"在使用系統安全工程-能力成熟度模型(SSECMM)對一個組織的安全工程能力成熟度進行測量時,正確的理解是:","options":["測量單位是基本實施(Base Practices,BP)","測量單位是通用實踐(Generic Practices,GP)","測量單位是過程區域(Process Areas,PA)","測量單位是公共特徵(Common Features,CF)"],"answer":"D","category":"工程與管理","sources":[{"bank":"rev1","n":75}]},{"id":823,"stem":"下面關於信息系統安全保障模型的說法不正確的是:","options":["國家標準《信息系統安全保障評估框架第一部分:簡介和一般模型》(GB/T20274.1-2006)中的信息系統安全保障模型將風險和策略作為基礎和核心","模型中的信息系統生命週期模型是抽象的概念性說明模型,在信息系統安全保障具體操作時,可根據具體環境和要求進行改動和細化","信息系統安全保障強調的是動態持續性的長效安全,而不僅是某時間點下的安全","信息系統安全保障主要是確保信息系統的保密性、完整性和可用性,單位對信息系統運行維護和使用的人員在能力和培訓方面不需要投入"],"answer":"D","category":"工程與管理","sources":[{"bank":"rev1","n":76}]},{"id":824,"stem":"關於信息安全保障技術框架(IATF),以下說法不正確的是:","options":["分層策略允許在適當的時候採用低安全級保障解決方案以便降低信息安全保障的成本","IATF從人、技術和操作三個層面提供一個框架實施多層保護,使攻擊者即使攻破一層也無法破壞整個信息基礎設施","允許在關鍵區域(例如區域邊界)使用高安全級保障解決方案,確保系統安全性","IATF深度防禦戰略要求在網絡體系結構各個可能位置實現所有信息安全保障機制"],"answer":"D","category":"工程與管理","sources":[{"bank":"rev1","n":78}]},{"id":825,"stem":"某單位開發一個面向互聯網提供服務的應用網站,該單位委託軟件測評機構對軟件進行了源代碼分析,模糊測試等軟件測試,在應用上線前,項目經理提出了還需要對應用網站進行一次滲透性測試,作為安全主管,你需要提出滲透性測試相比源代碼測試,模糊測試的優勢給領導做決策,以下哪條是滲透性的優勢?","options":["滲透測試使用人工進行測試,不依賴軟件,因此測試更準確","滲透測試是用軟件代替人工的一種測試方法。因此測試效率更高","滲透測試以攻擊者思維模擬真實攻擊,能發現如配置錯誤等運行維護期產生的漏洞","滲透測試中必須要查看軟件源代碼,因此測試中發現的漏洞更多"],"answer":"C","category":"惡意代碼與漏洞","sources":[{"bank":"rev1","n":79}]},{"id":826,"stem":"信息安全工程作為信息安全保障的重要組成部門,主要是為了解決:","options":["信息系統的技術架構安全問題","信息系統組成部門的組件安全問題","信息系統生命週期的過程安全問題","信息系統運行維護的安全管理問題"],"answer":"C","category":"工程與管理","sources":[{"bank":"rev1","n":81}]},{"id":827,"stem":"有關係統安全工程-能力成熟度模型(SSE-CMM)中基本實施(Base Practice)正確的理解是:","options":["P不限定於特定的方法工具,不同業務背景中可以使用不同的方法","P不是根據廣泛的現有資料,實施和專家意見綜合得出的","P不代表信息安全工程領域的最佳實踐","P不是過程區域(Process Areas,PA )的強制項"],"answer":"A","category":"工程與管理","sources":[{"bank":"rev1","n":82}]},{"id":828,"stem":"層次化的文檔是信息安全管理體系《Information Security Management System.ISMS》建設的直接體系,也ISMS建設的成果之一,通常將ISMS的文檔結構規劃為4層金字塔結構,那麼,以下選項()應放入到一級文件中.","options":["《風險評估報告》","《人力資源安全管理規定》","《ISMS內部審核計劃》","《單位信息安全方針》"],"answer":"D","category":"工程與管理","sources":[{"bank":"rev1","n":83}]},{"id":829,"stem":"信息安全管理體系(information Security Management System.簡稱ISMS)的實施和運行ISMS 階段,是ISMS過程模型的實施階段(Do),下面給出了一些備1制定風險處理計劃2實施風險處理計劃3開發有效性測量程序4實施培訓和意識教育計劃5管理ISMS的運行6管理ISMS的資源7執行檢測事態和響應事件的程序8實施內部審覈9實施風險再評估選的活動,選項()描述了在此階段組織應進行的活動。","options":["123456","1234567","12345678","123456789"],"answer":"B","category":"工程與管理","sources":[{"bank":"rev1","n":84}]},{"id":830,"stem":"在實施信息安全風險評估時,需要對資產的價值進行識別、分類和賦值,關於資產價值的評估,以下選項中正確的是()","options":["資產的價值指採購費用","資產的價值指維護費用","資產的價值與其重要性密切相關","資產的價值無法估計"],"answer":"C","category":"風險管理","sources":[{"bank":"rev1","n":85}]},{"id":831,"stem":"某軟件公司準備提高其開發軟件的安全性,在公司內部發起了有關軟件開發生命週期的討論,在下面的發言觀點中,正確的是()","options":["軟件安全開發生命週期較長,而其中最重要的是要在軟件的編碼安全措施,就可以解決90%以上的安全問題。","應當儘早在軟件開發的需求和設計階段增加一定的安全措施,這樣可以比在軟件發佈以後進行漏洞修復所花的代價少得多。","和傳統的軟件開發階段相比,微軟提出的安全開發生命週期(SDL)最大特點是增加了一個專門的安全編碼階段。","軟件的安全測試也很重要,考試到程序員的專業性,如果該開發人員已經對軟件進行了安全性測試,就沒有必要再組織第三方進行安全性測試。"],"answer":"B","category":"工程與管理","sources":[{"bank":"rev1","n":86},{"bank":"rev2","n":43}]},{"id":832,"stem":"某網站在設計對經過了威脅建模和攻擊面分析,在開發時要求程序員編寫安全的代碼,但是在部署時由於管理員將備份存放在WEB目錄下導致了攻擊者可直接下載備份,為了發現系統中是否存在其他類擬問題,一下那種測試方式是最佳的測試方法。","options":["模糊測試","源代碼測試","滲透測試","軟件功能測試"],"answer":"C","category":"應急與災難恢復","sources":[{"bank":"rev1","n":87}]},{"id":833,"stem":"下面哪項屬於軟件開發安全方面的問題()","options":["軟件部署時所需選用服務性能不高,導致軟件執行效率低。","應用軟件來考慮多線程技術,在對用戶服務時按序排隊提供服務","應用軟件存在SQL注入漏洞,若被黑客利用能竊取數據庫所用數據","軟件受許可證(license)限制,不能在多臺電腦上安裝。"],"answer":"C","category":"操作系統與主機安全","sources":[{"bank":"rev1","n":88}]},{"id":834,"stem":"為增強Web應用程序的安全性,某軟件開發經理決定加強Web軟件安全開發培訓,下面哪項內容不在考慮範圍內()","options":["關於網站身份籤別技術方面安全知識的培訓","針對OpenSSL心臟出血漏洞方面安全知識的培訓","針對SQL注入漏洞的安全編程培訓","關於ARM系統漏洞挖掘方面安全知識的培訓"],"answer":"D","category":"惡意代碼與漏洞","sources":[{"bank":"rev1","n":89}]},{"id":835,"stem":"以下關於https協議http協議相比的優勢說明,那個是正確的:","options":["Https協議對傳輸的數據進行加密,可以避免嗅探等攻擊行為","Https使用的端口http不同,讓攻擊者不容易找到端口,具有較高的安全性","Https協議是http協議的補充,不能獨立運行,因此需要更高的系統性能","Https協議使用了挑戰機制,在會話過程中不傳輸用戶名和密碼,因此具有較高的"],"answer":"A","category":"網絡安全","sources":[{"bank":"rev1","n":90}]},{"id":836,"stem":"小李去參加單位組織的信息安全管理體系(Information Security Management System.ISMS)的理解畫了一下一張圖(圖中包括了規劃建立、實施運行、保持和改進),但是他還存在一個空白處未填寫,請幫他選擇一個最合適的選項()。","options":["監控和反饋ISMS","批准和監督ISMS","監視和評審ISMS","溝通和諮詢ISMS"],"answer":"C","category":"工程與管理","sources":[{"bank":"rev1","n":92}]},{"id":837,"stem":"為推動和規範我國信息安全等級保護工作,我國制定和發佈了信息安全等級保護工作所需要的一系列標準,這些標準可以按照等級保護工作的工作階段大致分類。下面四個標準中,()規定了等級保護定級階段的依據、對象、流程、方法及等級變更等內容。","options":["GB/T 20271-2006《信息系統通用安全技術要求》","GB/T 22240-2008《信息系統安全保護等級定級指南》","GB/T 25070-2010《信息系統等級保護安全設計技術要求》","GB/T 20269-2006《信息系統安全管理要求》"],"answer":"B","category":"法規與標準","sources":[{"bank":"rev1","n":93}]},{"id":838,"stem":"某移動智能終端支持通過指紋識別解鎖系統的功能,與傳統的基於口令的鑑別技術相比,關於此種鑑別技術說法不正確的是:","options":["所選擇的特徵(指紋)便於收集、測量和比較","每個人所擁有的指紋都是獨一無二的","指紋信息是每個人獨有的,指紋識別系統不存在安全威脅問題","此類系統一般由用戶指紋信息採集和指紋信息識別兩部分組成"],"answer":"C","category":"操作系統與主機安全","sources":[{"bank":"rev1","n":94}]},{"id":839,"stem":"在以下標準中,屬於推薦性國家標準的是?","options":["GB/T XXXX.X-200X","GB XXXX-200X","BXX/T XXX-200X","GB/Z XXX-XXX-200X"],"answer":"A","category":"法規與標準","sources":[{"bank":"rev1","n":96}]},{"id":840,"stem":"微軟SDL將軟件開發生命週期制分為七個階段,並列出了十七項重要的安全活動。其中“棄用不安全的函數”屬於()的安全活動","options":["要求階段","設計階段","實施階段","驗證階段"],"answer":"C","category":"工程與管理","sources":[{"bank":"rev1","n":97}]},{"id":841,"stem":"由於頻繁出現計算機運行時被黑客遠程攻擊獲取數據的現象,某軟件公司準備加強軟件安全開發管理,在下面做法中,對於解決問題沒有直接幫助的是()","options":["要求所有的開發人員參加軟件安全開發知識培訓","要求增加軟件源代碼審覈環節,加強對軟件代碼的安全性審查","要求統一採用Windows8系統進行開發,不能採用之前的Windows 版本","要求邀請專業隊伍進行第三方安全性測試,儘量從多角度發現軟件安全問題"],"answer":"C","category":"工程與管理","sources":[{"bank":"rev1","n":98}]},{"id":842,"stem":"關於源代碼審覈,描述正確的是()","options":["源代碼審覈過程遵循信息安全保障技術框架模型(IATF),在執行時應一步一步嚴格執行","源代碼審覈有利於發現軟件編碼中存在的安全問題,相關的審覈工具既有商業開源工具","源代碼審覈如果想要有效率高,則主要依賴人工審覈而不是工具審覈,因為人工智能的,需要人的腦袋來判斷","源代碼審覈能起到很好的安全保證作用,如果執行了源代碼審覈,則不需要安全測試"],"answer":"B","category":"工程與管理","sources":[{"bank":"rev1","n":99}]},{"id":843,"stem":"微軟提出了STRIDE模型,其中R是Repudiation(抵賴)的縮寫,此項錯誤的是()","options":["某用戶在登錄系統並下載數據後,卻聲稱“我沒有下載過數據\"軟件R 威脅","某用戶在網絡通信中傳輸完數據後,卻聲稱“這些數據不是我傳輸的”威脅也屬於R威脅。","對於R威脅,可以選擇使用如強認證、數字簽名、安全審計等技術","對於R威脅,可以選擇使用如隱私保護、過濾、流量控制等技術"],"answer":"D","category":"風險管理","sources":[{"bank":"rev1","n":100}]},{"id":844,"stem":"我國信息安全保障工作先後經歷啓動、逐步展開和積極推進,以及深化落實三個階段,以下關於我國信息安全保障各階段說法不正確的是:","options":["2001國家信息化領導小組重組,網絡與信息安全協調小組成立,我國信息安全保障工作正式啓動","2003年7月,國家信息化領導小組制定出臺了《關於加強信息安全保障工作的意見》(中辦發27號文),明確了“積極防禦、綜合防範“的國家信息安全保障方針","2003年中辦發27號文件的發佈標誌着我國信息安全保障進入深化落實階段","在深化落實階段,信息安全法律法規、標準化,信息安全基礎設施建設,以及信息安全等級保護和風險評估取得了新進展。"],"answer":"C","category":"工程與管理","sources":[{"bank":"rev2","n":1}]},{"id":845,"stem":"我國信息安全保障建設包括信息安全組織與管理體制、基礎設施、技術體系等方面,以下關於安全保障建設主要工作內容說法不正確的是:","options":["建全國家信息安全組織與管理體制機制,加強信息安全工作的組織保障","建設信息安全基礎設施,提供國家信息安全保障能力支撐","建立信息安全技術體系,實現國家信息化發展的自主創新","建立信息安全人才培養體系,加快信息安全學科建設和信息安全人才培養"],"answer":"C","category":"工程與管理","sources":[{"bank":"rev2","n":3}]},{"id":846,"stem":"某銀行信息系統為了滿足業務的需要準備進行升級改造,以下哪一項不是此次改造中信息系統安全需求分析過程需要考慮的主要因素","options":["信息系統安全必須遵循的相關法律法規,國家以及金融行業安全標準","信息系統所承載該銀行業務正常運行的安全需求","消除或降低該銀行信息系統面臨的所有安全風險","該銀行整體安全策略"],"answer":"C","category":"法規與標準","sources":[{"bank":"rev2","n":4}]},{"id":847,"stem":"信息安全測評是指依據相關標準,從安全功能等角度對信息技術產品、信息系統、服務提供商以及人員進行測試和評估,以下關於信息安全測評說法不正確的是:","options":["信息產品安全評估是測評機構的產品的安全性做出的獨立評價,增強用戶對已評估產品安全的信任","目前我國常見的信息系統安全測評包括信息系統風險評估和信息系統安全保障測評兩種類型","信息安全工程能力評估是對信息安全服務提供者的資格狀況、技術實力和實施服務過程質量保證能力的具體衡量和評價。","信息系統風險評估是系統地分析網絡與信息系統所面臨的威脅及其存在的脆弱性,評估安全事件可能造成的危害程度,提出遊針對性的安全防護策略和整改措施"],"answer":"B","category":"風險管理","sources":[{"bank":"rev2","n":5}]},{"id":848,"stem":"美國的關鍵信息基礎設施(Critical Information Infrastructure,CII)包括商用核設施、政策設施、交通系統、飲用水和廢水處理系統、公共健康和醫療、能源、銀行和金融、國防工業基地等等,美國政府強調重點保障這些基礎設施信息安全,其主要原因不包括:","options":["這些行業都關係到國計民生,對經濟運行和國家安全影響深遠","這些行業都是信息化應用廣泛的領域","這些行業信息系統普遍存在安全隱患,而且信息安全專業人才缺乏的現象比其他行業更突出","這些行業發生信息安全事件,會造成廣泛而嚴重的損失。"],"answer":"C","category":"法規與標準","sources":[{"bank":"rev2","n":6}]},{"id":849,"stem":"在設計信息系統安全保障方案時,以下哪個做法是錯誤的:","options":["要充分切合信息安全需求並且實際可行","要充分考慮成本效益,在滿足合規性要求和風險處置要求的前提下,儘量控制成本","要充分採取新技術,使用過程中不斷完善成熟,精益求精,實現技術投入保值要求","要充分考慮用戶管理和文化的可接受性,減少系統方案障礙"],"answer":"C","category":"工程與管理","sources":[{"bank":"rev2","n":7},{"bank":"rev4","n":38}]},{"id":850,"stem":"分組密碼算法是一類十分重要的密碼算法,下面描述中,錯誤的是()","options":["分組密碼算法要求輸入明文按組分成固定長度的塊","分組密碼的算法每次計算得到固定長度的密文輸出塊","分組密碼算法也稱作序列密碼算法","常見的DES、IDEA算法都屬於分組密碼算法"],"answer":"C","category":"密碼與加密","sources":[{"bank":"rev2","n":8}]},{"id":851,"stem":"虛擬專用網絡(VPN)通常是指在公共網路中利用隧道技術,建立一個臨時的,安全的網絡。這裏的字母P的正確解釋是()","options":["Special-purpose. 特定、專用用途的","Proprietary 專有的、專賣的","Private 私有的、專有的","Specific 特種的、具體的"],"answer":"C","category":"網絡安全","sources":[{"bank":"rev2","n":11}]},{"id":852,"stem":"以下Windows系統的賬號存儲管理機制SAM(Security Accounts Manager)的說法哪個是正確的:","options":["存儲在註冊表中的賬號數據是管理員組用戶都可以訪問,具有較高的安全性","存儲在註冊表中的賬號數據administrator賬戶纔有權訪問,具有較高的安全性","存儲在註冊表中的賬號數據任何用戶都可以直接訪問,靈活方便","存儲在註冊表中的賬號數據只有System賬號才能訪問,具有較高的安全性"],"answer":"D","category":"操作系統與主機安全","sources":[{"bank":"rev2","n":12},{"bank":"rev4","n":36}]},{"id":853,"stem":"某公司的對外公開網站主頁經常被黑客攻擊後修改主頁內容,該公司應當購買並部署下面哪個設備()","options":["安全路由器","網絡審計系統","網頁防篡改系統","虛擬專用網(Virtual Private Network,VPN)系統"],"answer":"C","category":"網絡安全","sources":[{"bank":"rev2","n":13}]},{"id":854,"stem":"關於惡意代碼,以下說法錯誤的是:","options":["從傳播範圍來看,惡意代碼呈現多平臺傳播的特徵。","按照運行平臺,惡意代碼可以分為網絡傳播型病毒、文件傳播型病毒。","不感染的依附性惡意代碼無法單獨執行","為了對目標系統實施攻擊和破壞,傳播途徑是惡意代碼賴以生存和繁殖的基本條件"],"answer":"B","category":"惡意代碼與漏洞","sources":[{"bank":"rev2","n":14}]},{"id":855,"stem":"某單位對其主網站的一天訪問流量監測圖,圖顯示該網站在當天17:00到20:00間受到了攻擊,則從數據分析,這種攻擊類型最可能屬於下面什麼攻擊()。","options":["跨站腳本(Cross Site Scripting,XSS)攻擊","TCP會話劫持(TCP Hijack)攻擊","IP 欺騙攻擊","拒絕服務(Denial of Service,DoS)攻擊"],"answer":"D","category":"網絡安全","sources":[{"bank":"rev2","n":15}]},{"id":856,"stem":"當前,應用軟件安全已經日益引起人們的重視,每年新發現的應用軟件漏洞已經佔新發現漏洞總數一半以上。下列選項中,哪個與應用軟件漏洞成因無關:","options":["傳統的軟件開發工程未能充分考慮安全因素","開發人員對信息安全知識掌握不足","相比操作系統而言,應用軟件編碼所採用的高級語言更容易出現漏洞","應用軟件的功能越來越多,軟件越來越複雜,更容易出現漏洞"],"answer":"C","category":"惡意代碼與漏洞","sources":[{"bank":"rev2","n":16}]},{"id":857,"stem":"下面哪個模型和軟件安全開發無關()?","options":["微軟提出的“安全開發生命週期(Security Development Lifecycle,SDL)”","Gray McGraw等提出的“使安全成為軟件開發必須的部分(Building Security IN,BSI) ”","OWASP維護的“軟件保證成熟度模型(Software Assurance Maturity Mode,SAMM)”","“信息安全保障技術框架(Information Assurance Technical Framework,IATF)”"],"answer":"D","category":"工程與管理","sources":[{"bank":"rev2","n":17}]},{"id":858,"stem":"以下關於模糊測試過程的說法正確的是:","options":["模糊測試的效果與覆蓋能力,與輸入樣本選擇不相關","為保障安全測試的效果和自動化過程,關鍵是將發現的異常進行現場保護記錄,系統可能無法恢復異常狀態進行後續的測試","通過異常樣本重現異常,人工分析異常原因,判斷是否為潛在的安全漏洞,如果是安全漏洞,就需要進一步分析其危害性、影響範圍和修復建議","對於可能產生的大量異常報告,需要人工全部分析異常報告"],"answer":"C","category":"惡意代碼與漏洞","sources":[{"bank":"rev2","n":19},{"bank":"rev3","n":81}]},{"id":859,"stem":"防火牆是網絡信息系統建設中常常採用的一類產品,它在內外網隔離方面的作用是","options":["既能物理隔離,又能邏輯隔離","能物理隔離,但不能邏輯隔離","不能物理隔離,但是能邏輯隔離","不能物理隔離,也不能邏輯隔離"],"answer":"C","category":"物理與環境安全","sources":[{"bank":"rev2","n":21},{"bank":"rev4","n":34}]},{"id":860,"stem":"異常入侵檢測是入侵檢測系統常用的一種技術,它是識別系統或用戶的非正常行為或者對於計算機資源的非正常使用,從而檢測出入侵行為。下面說法錯誤的是","options":["在異常入侵檢測中,觀察的不是已知的入侵行為,而是系統運行過程中的異常現象","實施異常入侵檢測,是將當前獲取行為數據和已知入侵攻擊行為特徵相比較,若匹配則認為有攻擊發生","異常入侵檢測可以通過獲得的網絡運行狀態數據,判斷其中是否含有攻擊的企圖,並通過多種手段向管理員報警","異常入侵檢測不但可以發現從外部的攻擊,也可以發現內部的惡意行為"],"answer":"B","category":"網絡安全","sources":[{"bank":"rev2","n":22}]},{"id":861,"stem":"S公司在全國有20個分支機構,總部由10臺服務器、200個用戶終端,每個分支機構都有一臺服務器、100個左右用戶終端,通過專網進行互聯互通。公司招標的網絡設計方案中,四家集成商給出了各自的IP地址規劃和分配的方法,作為評標專家,請給5公司選出設計最合理的一個:","options":["總部使用服務器、用戶終端統一使用10.0.1.x、各分支機構服務器和用戶終端使用192.168.2.x---192.168.20.x","總部服務器使用10.0.1.1—11、用戶終端使用10.0.1.12—212 ,分支機構IP地址隨意確定即可","總部服務器使用10.0.1.x 、用戶端根據部門劃分使用10.0.2.x ,每個分支機構分配兩個A類地址段,一個用做服務器地址段、另外一個做用戶終端地址段","因為通過互聯網連接,訪問的是互聯網地址,內部地址經NAT映射,因此IP地址無需特別規劃,各機構自行決定即可。"],"answer":"C","category":"操作系統與主機安全","sources":[{"bank":"rev2","n":23}]},{"id":862,"stem":"口令破解是針對系統進行攻擊的常用方法,windows系統安全策略中應對口令破解的策略主要是帳戶策略中的帳戶鎖定策略和密碼策略,關於這兩個策略說明錯誤的是","options":["密碼策略主要作用是通過策略避免擁護生成弱口令及對用戶的口令使用進行管控","密碼策略對系統中所有的用戶都有效","賬戶鎖定策略的主要作用是應對口令暴力破解攻擊,能有效地保護所有系統用戶應對口令暴力破解攻擊","賬戶鎖定策略只適用於普通用戶,無法保護管理員administrator 賬戶應對口令暴力破解攻擊"],"answer":"C","category":"工程與管理","sources":[{"bank":"rev2","n":25}]},{"id":863,"stem":"windows文件系統權限管理使用訪問控制列表(Access Control List.ACL)機制,以下哪個說法是錯誤的:","options":["安裝Windows系統時要確保文件格式適用的是NTFS. 因為Windows的ACL機制需要NTFS文件格式的支持","由於Windows 操作系統自身有大量文件和目錄,因此很難對每個文件和目錄設置嚴格的訪問權限,為了使用上的便利,Windows上的ACL存在默認設置安全性不高的問題","Windows的ACL機制中,文件和文件夾的權限是主體進行關聯的,即文件夾和文件的訪問權限信息是寫在用戶數據庫中的","由於ACL 具有很好靈活性,在實際使用中可以為每一個文件設定獨立擁護的權限"],"answer":"C","category":"操作系統與主機安全","sources":[{"bank":"rev2","n":26},{"bank":"rev4","n":39},{"bank":"rev4","n":94}]},{"id":864,"stem":"由於發生了一起針對服務器的口令暴力破解攻擊,管理員決定對設置帳戶鎖定策略以對抗口令暴力破解。他設置了以下賬戶鎖定策略如下:\n賬戶鎖定閥值3次無效登陸;\n賬戶鎖定時間10分鐘;\n復位賬戶鎖定計數器5分鐘;\n以下關於以上策略設置後的說法哪個是正確的","options":["設置賬戶鎖定策略後,攻擊者無法再進行口令暴力破解,所有輸錯的密碼的擁護就會被鎖住","如果正常用戶部小心輸錯了3次密碼,那麼該賬戶就會被鎖定10分鐘,10分鐘內即使輸入正確的密碼,也無法登錄系統","如果正常用戶不小心連續輸入錯誤密碼3次,那麼該擁護帳號被鎖定5分鐘,5分鐘內即使交了正確的密碼,也無法登錄系統","攻擊者在進行口令破解時,只要連續輸錯3次密碼,該賬戶就被鎖定10分鐘,而正常擁護登陸不受影響"],"answer":"B","category":"操作系統與主機安全","sources":[{"bank":"rev2","n":27}]},{"id":865,"stem":"加密文件系統(Encrypting File System, EFS)是Windows操作系統的一個組件,以下說法錯誤的是()","options":["EFS採用加密算法實現透明的文件加密和解密,任何不擁有合適密鑰的個人或者程序都不能解密數據","EFS 以公鑰加密為基礎,並利用了widows系統中的CryptoAPI 體系結構","EFS加密系統適用於NTFS文件系統合FAT32文件系統(Windows環境下)","EFS加密過程對用戶透明,EFS加密的用戶驗證過程是在登陸windows 時進行的"],"answer":"C","category":"密碼與加密","sources":[{"bank":"rev2","n":28}]},{"id":866,"stem":"關於數據庫恢復技術,下列說法不正確的是:","options":["數據庫恢復技術的實現主要依靠各種數據的冗餘和恢復機制技術來解決,當數據庫中數據被破壞時,可以利用冗餘數據來進行修復","數據庫管理員定期地將整個數據庫或部分數據庫文件備份到磁帶或另一個磁盤上保存起來,是數據庫恢復中採用的基本技術","日誌文件在數據庫恢復中起着非常重要的作用,可以用來進行事務故障恢復和系統故障恢復,並協助後備副本進行介質故障恢復","計算機系統發生故障導致數據未存儲到固定存儲器上,利用日誌文件中故障發生前數據的循環,將數據庫恢復到故障發生前的完整狀態,這一對事務的操作稱為提交"],"answer":"D","category":"應急與災難恢復","sources":[{"bank":"rev2","n":29}]},{"id":867,"stem":"以下關於SMTP和POP3 協議的說法哪個是錯誤的","options":["SMTP和POP3協議是一種基於ASCII編碼的請求/響應模式的協議","SMTP和POP3協議明文傳輸數據,因此存在數據泄露的可能","SMTP和POP3協議缺乏嚴格的用戶認證,因此導致了垃圾郵件問題","SMTP和POP3協議由於協議簡單,易用性更高,更容易實現遠程管理郵件"],"answer":"D","category":"網絡安全","sources":[{"bank":"rev2","n":32}]},{"id":868,"stem":"安全多用途互聯網郵件擴展(Secure Multipurpose Internet Mail Extension, S/MIME )是指一種保障郵件安全的技術,下面描述錯誤的是()","options":["S/MIME 採用了非對稱密碼學機制","S/MIME支持數字證書","S/MIME採用了郵件防火牆技術","S/MIME支持用戶身份認證和郵件加密"],"answer":"C","category":"密碼與加密","sources":[{"bank":"rev2","n":33}]},{"id":869,"stem":"應用安全,一般是指保障應用程序使用過程和結果的安全。以下內容中不屬於應用安全防護考慮的是()","options":["身份鑑別,應用系統應對登陸的用戶進行身份鑑別,只有通過驗證的用戶才能訪問應用系統資源","安全標記,在應用系統層面對主體和客體進行標記,主體不能隨意更改權限,增加訪問","剩餘信息保護,應用系統應加強硬盤、內存或緩衝區中剩餘信息的保護,防止存儲在硬盤、內存或緩衝區的信息被非授權的訪問","機房與設施安全,保證應用系統處於有一個安全的環境條件,包括機房環境、機房安全等級、機房的建造和機房的裝修等"],"answer":"D","category":"物理與環境安全","sources":[{"bank":"rev2","n":34}]},{"id":870,"stem":"Apache Http Server(簡稱Apache)是一個開放源碼的web服務運行平臺,在使用過程中,該軟件默認會將自己的軟件名和版本號發送給客戶端。從安全角度出發,為隱藏這些信息,應當採取以下那種措施()","options":["安裝後,修改訪問控制配置文件","安裝後,修改配置文件Httpd.Conf中的有關參數","安裝後,刪除Apache Http Server源碼","從正確的官方網站下載Apache Http Server,並安裝使用"],"answer":"B","category":"操作系統與主機安全","sources":[{"bank":"rev2","n":35}]},{"id":871,"stem":"下面信息安全漏洞理解錯誤的是:","options":["討論漏洞應該從生命週期的角度出發,信息產品和信息系統在需求、設計、實現、配置、維護和使用等階段中均有可能產生漏洞","信息安全漏洞是由於信息產品和信息系統在需求、設計、開發、部署或維護階段,由於設計、開發等相關人員無意中產生的缺陷所造成的","信息安全漏洞如果被惡意攻擊者成功利用,可能會給信息產品和信息系統帶來安全損害,甚至帶來很大的經濟損失","由於人類思維能力、計算機計算能力的侷限性等因素,所以在信息產品和信息系統中產生新的漏洞是不可避免的"],"answer":"B","category":"惡意代碼與漏洞","sources":[{"bank":"rev2","n":36}]},{"id":872,"stem":"下面對“零日(zero-day)漏洞”的理解中,正確的是()","options":["指一個特定的漏洞,該漏洞每年1月1日零點發作,可以被攻擊者用來遠程攻擊,獲取主機權限","指一個特定的漏洞,特指在2010年被發現出來的一種漏洞,該漏洞被“震網”病毒所利用,用來攻擊伊朗布什爾核電站基礎設施","指一類漏洞,即特別好被利用,一旦成功利用該類漏洞,可以在1天內文完成攻擊,且成功達到攻擊目標","指一類漏洞,即剛被發現後立即被惡意利用的安全漏洞,一般來說,那些已經被小部分人發現,但是還未公開、還不存在安全補丁的漏洞都是零日漏洞"],"answer":"D","category":"惡意代碼與漏洞","sources":[{"bank":"rev2","n":37}]},{"id":873,"stem":"某單位發生的管理員小張在繁忙的工作中接到了一個電話,來電者:小張嗎?我是科技處的李強,我的郵箱密碼忘記了,現在打不開郵件,我着急收割郵件,麻煩膩先幫我把密碼改成123,我收完郵件自己修改掉密碼。熱心的小張很快的滿足了來電者的要求,隨後,李強發現郵箱系統登陸異常,請問下淚說法哪個是正確的","options":["小張服務態度不好,如果把李強的郵件收下來親自交給李強就不會發生這個問題","事件屬於服務器故障,是偶然事件,應向單位領導申請購買新的服務器","單位缺乏良好的密碼修改操作流程或小張沒按照操作流程工作","事件屬於郵件系統故障,是偶然事件,應向單位領導申請郵件服務軟件"],"answer":"C","category":"密碼與加密","sources":[{"bank":"rev2","n":38}]},{"id":874,"stem":"某網站管理員小鄧在流量監測中發現近期網站的入站ICMP流量上升了250%,儘管網站沒有發現任何的性能下降或其他問題。但為了安全起見,他仍然向主管領導提出了應對策略,作為主管負責人,請選擇有效的針對此問題的應對措施:","options":["在防火牆上設置策略,阻止所有的ICMP流量進入","刪除服務器上的ping.exe程序","增加帶寬以應對可能的拒絕服務攻擊","增加網站服務器以應對即將來臨的拒絕服務攻擊"],"answer":"A","category":"操作系統與主機安全","sources":[{"bank":"rev2","n":39}]},{"id":875,"stem":"下面四款安全測試軟件中,主要用於WEB安全掃描的是()","options":["isco Auditing Tools","cunetix Web Vulnerability Scanner","NMAP","ISS Database Scanner"],"answer":"B","category":"網絡安全","sources":[{"bank":"rev2","n":40}]},{"id":876,"stem":"某單位計劃在今年開發一套辦公自動化(OA)系統,將集團公司各地的機構通過互聯網進行協同辦公,在OA系統的設計方案評審會上,提出了不少安全開發的建設,作為安全專家,請指出大家提的建議中不太合適的一條:","options":["對軟件開發商提出安全相關要求,確保軟件開發商對安全足夠的重視,投入資源解決軟件安全問題","要求軟件開發人員進行安全開發培訓,使開發人員掌握基本軟件安全開發知識","要求軟件開發商使用Java而不是ASP作為開發語言,避免SQL注入漏洞","要求軟件開發商對軟件進行模塊化設計,各模塊明確輸入和輸出數據格式,並在使用前對數據進行校驗"],"answer":"C","category":"惡意代碼與漏洞","sources":[{"bank":"rev2","n":41}]},{"id":877,"stem":"下面有關軟件安全問題的描述中,哪項是由於軟件設計缺陷引起的()","options":["設計了三層Web架構,但是軟件存在SQL注入漏洞,導致被黑客攻擊後能直接訪問數據庫","使用C語言開發時,採用了一些存在安全問題的字符串處理函數,導致存在緩衝區溢出漏洞","設計了緩存用戶隱私數據機制以加快系統處理性能,導致軟件在發佈運行後,被黑客攻擊獲取到用戶隱私數據","使用了符合要求的密碼算法,但在使用算法接口時,沒有按照要求生成密鑰,導致黑客攻擊後能破解並得到明文數據"],"answer":"C","category":"惡意代碼與漏洞","sources":[{"bank":"rev2","n":44},{"bank":"rev4","n":55}]},{"id":878,"stem":"針對軟件的拒絕服務攻擊是通過消耗系統資源使軟件無法響應正常請求的一種攻擊方式,在軟件開發時分析拒絕服務攻擊的威脅,以下哪個不是需求考慮的攻擊方式","options":["攻擊者利用軟件存在的邏輯錯誤,通過發送某種類型數據導致運算進入死循環,CPU資源佔用始終100%","攻擊者利用軟件腳本使用多重嵌套諮詢,在數據量大時會導致查詢效率低,通過發送大量的查詢導致數據庫響應緩慢","攻擊者利用軟件不自動釋放連接的問題,通過發送大量連接消耗軟件併發連接數,導致併發連接數耗盡而無法訪問","攻擊者買通IDC人員,將某軟件運行服務器的網線拔掉導致無法訪問"],"answer":"D","category":"操作系統與主機安全","sources":[{"bank":"rev2","n":47}]},{"id":879,"stem":"某網站為了開發的便利,使用SA鏈接數據庫,由於網站腳本中被發現存在SQL注入漏洞,導致攻擊者利用內置存儲過程XP.cmctstell刪除了系統中的一個重要文件,在進行問題分析時,作為安全專家,你應該指出該網站設計違反了以下哪項原則:","options":["權限分離原則","最小特權原則","保護最薄弱環節的原則","縱深防禦的原則"],"answer":"B","category":"惡意代碼與漏洞","sources":[{"bank":"rev2","n":48}]},{"id":880,"stem":"微軟提出了STRIDE模型,其中Repudation(抵賴)的縮寫,關於此項安全要求,下面描述錯誤的是()","options":["某用戶在登陸系統並下載數據後,卻聲稱“我沒有下載過數據”,軟件系統中的這種威脅就屬於R威脅","解決R威脅,可以選擇使用抗抵賴性服務技術來解決,如強認證、數字簽名、安全審計等技術措施","R威脅是STRIDE六種威脅中第三嚴重的威脅,比D威脅和E威脅的嚴重程度更高","解決R威脅,也應按照確定建模對象、識別威脅、評估威脅以及消減威脅等四個步驟來進行"],"answer":"C","category":"風險管理","sources":[{"bank":"rev2","n":49}]},{"id":881,"stem":"關於信息安全管理,下面理解片面的是()","options":["信息安全管理是組織整體管理的重要、固有組成部分,它是組織實現其業務目標的重要保障","信息安全管理是一個不斷演進、循環發展的動態過程,不是一成不變的","信息安全建設中,技術是基礎,管理是拔高,既有效的管理依賴於良好的技術基礎","堅持管理與技術並重的原則,是我國加強信息安全保障工作的主要原則之一"],"answer":"C","category":"工程與管理","sources":[{"bank":"rev2","n":50},{"bank":"rev4","n":47}]},{"id":882,"stem":"小明是某大學計算科學與技術專業的畢業生,大四上學期開始找工作,期望謀求一份技術管理的職位,一次面試中,某公司的技術經理讓小王談一談信息安全風險管理中的背景建立的幾本概念與認識,小明的主要觀點包括:(1)背景建立的目的是為了明確信息安全風險管理的範圍和對象,以及對象的特性和安全要求,完成信息安全風險管理項目的規劃和準備;(2)背景建立根據組織機構相關的行業經驗執行,雄厚的經驗有助於達到事半功倍的效果(3)背景建立包括:風險管理準備、信息系統調查、信息系統分析和信息安全分析(4.)背景建立的階段性成果包括:風險管理計劃書、信息系統的描述報告、信息系統的分析報告、信息系統的安全要求報告、請問小明的論點中錯誤的是哪項:","options":["第一個觀點","第二個觀點","第三個觀點","第四個觀點"],"answer":"B","category":"工程與管理","sources":[{"bank":"rev2","n":52}]},{"id":883,"stem":"降低風險(或減低風險)指通過對面的風險的資產採取保護措施的方式來降低風險,下面那個措施不屬於降低風險的措施()","options":["減少威脅源,採用法律的手段制裁計算機的犯罪,發揮法律的威懾作用,從而有效遏制威脅源的動機","簽訂外包服務合同,將有計算難點,存在實現風險的任務通過簽訂外部合同的方式交予第三方公司完成,通過合同責任條款來應對風險","減低威脅能力,採取身份認證措施,從而抵制身份假冒這種威脅行為的能力","減少脆弱性,及時給系統打補丁,關閉無用的網絡服務端口,從而減少系統的脆弱性,降低被利用的可能性"],"answer":"B","category":"風險管理","sources":[{"bank":"rev2","n":53}]},{"id":884,"stem":"關於風險要素識別階段工作內容敘述錯誤的是:","options":["資產識別是指對需求保護的資產和系統等進行識別和分類","威脅識別是指識別與每項資產相關的可能威脅和漏洞及其發生的可能性","脆弱性識別以資產為核心,針對每一項需求保護的資產,識別可能被威脅利用的弱點,並對脆弱性的嚴重程度進行評估","確認已有的安全措施僅屬於技術層面的工作,牽涉到具體方面包括:物理平臺、系統平臺、網絡平臺和應用平臺"],"answer":"D","category":"風險管理","sources":[{"bank":"rev2","n":54},{"bank":"rev4","n":48}]},{"id":885,"stem":"某單位的信息安全主管部門在學習我國有關信息安全的政策和文件後,認識到信息安全風險評估分為自評估和檢查評估兩種形式,該部門將有檢查評估的特點和要求整理成如下四條報告給單位領導,其中描述錯誤的是","options":["檢查評估可依據相關標準的要求,實施完整的風險評估過程;也可在自評估的基礎上,對關鍵環節或重點內容實施抽樣評估","檢查評估可以由上級管理部門組織,也可以由本級單位發起,其重點是針對存在的問題進行檢查和評測","檢查評估可以由上級管理部門組織,並委託有資質的第三方技術機構實施","檢查評估是通過行政手段加強信息安全管理的重要措施,具有強制性的特點"],"answer":"B","category":"風險管理","sources":[{"bank":"rev2","n":55},{"bank":"rev4","n":45}]},{"id":886,"stem":"規範的實施流程和文檔管理,是信息安全風險評估結能否取得成果的重要基礎,按照規範的風險評估實施流程,下面哪個文檔應當是風險要素識別階段的輸出成果()","options":[",《風險評估方案》","《需要保護的資產清單》","《風險計算報告》","《風險程度等級列表》"],"answer":"B","category":"風險管理","sources":[{"bank":"rev2","n":56}]},{"id":887,"stem":"在信息安全管理的實施過程中,管理者的作用於信息安全管理體系能否成功實施非常重要,但是一下選項中不屬於管理者應有職責的是()","options":["制定並頒發信息安全方針,為組織的信息安全管理體系建設指明方向並提供總體綱領,明確總體要求","確保組織的信息安全管理體系目標和相應的計劃得以制定,目標應明確、可度量,計劃應具體、可事實","向組織傳達滿足信息安全的重要性,傳達滿足信息安全要求、達成信息安全目標、符合信息安全方針、履行法律責任和持續改進的重要性","建立健全信息安全制度,明確安全風險管理作用,實施信息安全風險評估過程、確保信息安全風險評估技術選擇合理、計算正確"],"answer":"D","category":"工程與管理","sources":[{"bank":"rev2","n":57}]},{"id":888,"stem":"信息安全管理體系(Information Security Management System ,ISMS)的內部審覈和管理審覈是兩項重要的管理活動,關於這兩者,下面描述的錯誤是","options":["內部審覈和管理評審都很重要,都是促進ISMS持續改進的重要動力,也都應當按照一定的週期實施","內部審覈的實施方式多采用文件審覈和現場審覈的形式,而管理評審的實施方式多采用召開管理評審會議形式進行","內部審覈的實施主體組織內部的ISMS內審小組,而管理評審的實施主體是由國家政策指定的第三方技術服務機構","組織的信息安全方針、信息安全目標和有關ISMS文件等,在內部審覈中作為審覈標準使用,但在管理評審總,這些文件時被審對象"],"answer":"C","category":"工程與管理","sources":[{"bank":"rev2","n":58}]},{"id":889,"stem":"在風險管理中,殘餘風險是指實施了新的或增強的安全措施後還剩下的風險,關於殘餘風險,下面描述錯誤的是()","options":["風險處理措施確定以後,應編制詳細的殘餘風險清單,並獲得管理層對殘餘風險的書面批准,這也是風險管理中的一個重要過程","管理層確認接收殘餘風險,是對風險評估工作的一種肯定,表示管理層已經全面瞭解了組織所面臨的風險,並理解在風險一旦變為現實後,組織能夠且承擔引發的後果","接收殘餘風險,則表明沒有必要防範和加固所有的安全漏洞,也沒有必要無限制的提高安全保護措施的強度,對安全保護措施的選擇要考慮到成本和技術等因素的限制","如果殘餘風險沒有降低到可接受的級別,則只能被動的選擇接受風險,即對風險不進行下一步的處理措施,接受風險可能帶來的結果。"],"answer":"D","category":"風險管理","sources":[{"bank":"rev2","n":59}]},{"id":890,"stem":"關於業務連續性計劃(BCP)以下說法最恰當的是:","options":["組織為避免所有業務功能因重大事件而中斷,減少業務風此案而建立的一個控制過程。","組織為避免關鍵業務功能因重大事件而中斷,減少業務風險而建立的一個控制過程。","組織為避免所有業務功能因各種事件而中斷,減少業務風此案而建立的一個控制過程","組織為避免信息系統功能因各種事件而中斷,減少信息系統風險建立的一個控制過程"],"answer":"B","category":"應急與災難恢復","sources":[{"bank":"rev2","n":60}]},{"id":891,"stem":"恢復時間目標(RTO)和恢復點目標(RPO)是信息系統災難恢復中的重要概念,關於這兩個值能否為零,正確的選項是()","options":["RTO可以為0,RPO也可以為0","RTO可以為0,RPO不可以為0","RTO不可以為0,但RPO可以為0","RTO不可以為0,RPO也不可以為0"],"answer":"A","category":"應急與災難恢復","sources":[{"bank":"rev2","n":64},{"bank":"rev4","n":54}]},{"id":892,"stem":"某政府機構擬建設一機房,在工程安全監理單位參與下制定了招標文件,項目分二期,一期目標為年內實現系統上線運營,二期目標為次年上半年完成運行系統風險的處理:招標文件經營管理層審批後發佈,就此工程項目而言,以下正確的是:","options":["此項目將項目目標分解為系統上線運營和運行系統風險處理分期實施,具有合理性和可行性","在工程安全監理的參與下,確保了此招標文件的合理性","工程規劃不符合信息安全工程的基本原則","招標文件經營管理層審批,表明工程目標符合業務發展規劃"],"answer":"C","category":"工程與管理","sources":[{"bank":"rev2","n":65}]},{"id":893,"stem":"對系統工程(Systems Engineering ,SE )的理解,以下錯誤的是:","options":["系統工程偏重於對工程的組織與經營管理進行研究","系統工程不屬於技術實現,而是一種方法論","系統工程不是一種對所有系統都具有普遍意義的科學方法","系統工程是組織管理系統規劃、研究、製造、實驗、使用的科學方法"],"answer":"C","category":"工程與管理","sources":[{"bank":"rev2","n":66},{"bank":"rev3","n":70}]},{"id":894,"stem":"系統工程的模型之一霍爾三維結構模型由時間維、邏輯維和知識維組成。 有關此模型,錯誤的是:","options":["霍爾三維機構體系形成地描述了系統工程研究的框架","時間維表示系統工程活動從開始到結束按照時間順序排列的全過程","邏輯維的七個步驟與時間維的七個階段嚴格對應,即時間維第一階段應執行邏輯維第一步驟的活動,時間維第二階段應執行邏輯維第二步驟的活動","知識維列舉可能需要運用的工程、醫學、建築、商業、法律、管理、社會科學和藝術等各種知識和技能"],"answer":"C","category":"工程與管理","sources":[{"bank":"rev2","n":67}]},{"id":895,"stem":"以下哪一項不是信息系統集成項目的特點:","options":["信息系統集成項目要以滿足客戶和用戶的需求為根本出發點。","系統集成就是選擇最好的產品和技術,開發響應的軟件和硬件,將其集成到信息系統的過程。","信息系統集成項目的指導方法是“總體規劃、分步實施”。","信息系統集成包含技術,管理和商務等方面,是一項綜合性的系統工程"],"answer":"B","category":"工程與管理","sources":[{"bank":"rev2","n":69},{"bank":"rev4","n":44}]},{"id":896,"stem":"信息安全工程監理是信息系統工程監理的重要組成部分,信息安全工程監理適用的信息化工程中,以下選擇最合適的是：（）","options":["通用布纜系統工程","電子設備機房系統工程","計算機網絡系統工程","以上都適用"],"answer":"D","category":"工程與管理","sources":[{"bank":"rev2","n":70}]},{"id":897,"stem":"在使用系統安全工程-能力成熟度模型(SSE-CCM)對一個組織的安全工程能力成熟度進行測量時,有關測量結果,錯誤的理解是:","options":["如果該組織在執行某個特定的過程區域時具備了一個特定級別的部分公共特徵時,則這個組織在這個過程區域的能力成熟度未達到此級","如果該組織某個過程區域(Process Areas,PA)具備了“定義標準過程”、“執行已定義的過程”兩個公共特徵,則此過程區域的能力成熟度級別達到3級“充分定義級”","如果某個過程區域(Process Areas,PA)包含4個基本實施(Base Practices,BP),執行此PA時執行了3個BP,則此過程區域的能力成熟度級別為0","組織在不同的過程區域的能力成熟度可能處於不同的級別上"],"answer":"B","category":"工程與管理","sources":[{"bank":"rev2","n":74}]},{"id":898,"stem":"系統安全工程-能力成熟度模型(SSE-CMM)定義的包含評估威脅、評估脆弱性、評估影響和評估安全風險的基本過程領域是:","options":["風險過程","工程過程","保證過程","評估過程"],"answer":"A","category":"風險管理","sources":[{"bank":"rev2","n":75}]},{"id":899,"stem":"為了保障網絡安全,維護網絡安全空間主權和國家安全、社會公共利益,保護公民、法人和其他組織的合法權益,促進經濟社會信息化健康發展,加強在中華人民共和國境內建設、運營、維護和使用網絡,以及網絡安全的監督管理,2015年6月,第十二屆全國人大常委會第十五次會議初次審議了一部法律草案,並與7月6日起在網上全文公佈,向社會公開徵求意見,這部法律草案是()","options":["《中華人民共和國保守國家祕密法(草案)》","《中華人民共和國網絡安全法(草案)》","《中華人民共和國國家安全法(草案)》","《中華人民共和國互聯網安全法(草案)》"],"answer":"B","category":"網絡安全","sources":[{"bank":"rev2","n":79}]},{"id":900,"stem":"為了進一步提高信息安全的保障能力和防護水平,保障和促進信息化建設的健康發展,公安部等4 部分聯合發佈《關於信息安全等級保護工作的實施意見》(公通字[2004]66號),對等級保護工作的開展提供宏觀指導和約束,明確了等級保護工作的基本內容、工作要求和實施計劃,以及各部門工作職責分工等,關於該文件,下面理解正確的是","options":["該文件時一個由部委發佈的政策性文件,不屬於法律文件","該文件適用於2004年的等級保護工作,其內容不能越蘇到2005年及之後的工作","該文件時一個總體性知道文件,規定了所有信息系統都要納入等級保護定級範圍","該文件使用範圍為發文的這四個部門,不適用於其他部門和企業等單位"],"answer":"A","category":"法規與標準","sources":[{"bank":"rev2","n":80},{"bank":"rev4","n":50}]},{"id":901,"stem":"對於數字證書而言,一般採用的是哪個標準?","options":["ISO/IEC 1540B","802.11","GB/T 20984","X.509"],"answer":"D","category":"法規與標準","sources":[{"bank":"rev2","n":82}]},{"id":902,"stem":"在可信計算機系統評估準則(TCSEC)中,下列哪一項是滿足強制保護要求的最低級別?","options":["C2","C1","B2","B1"],"answer":"D","category":"法規與標準","sources":[{"bank":"rev2","n":83}]},{"id":903,"stem":"關於標準,下面哪項理解是錯誤的()","options":["標準是在一定範圍內為了獲得最佳秩序,經協協商一致制定並由公認機構批准,共同重複使用的一種規範性文件,標準是標準化活動的重要成果","國際標準是由國際標準化組織通過並公佈的標準,同樣是強制性標準,當國家標準和國際標準的條款發生衝突,應以國際標準條款為準。","行業標準是針對沒有國家標準而又才需要在全國某個行業範圍統一的技術要求而制定的標準,同樣是強制性標準,當行業標準和國家標準的條款發生衝突時,應以國家標準條款為準。","地方標準由省、自治區、直轄市標準化行政主管部門制度,冰報國務院標準化行政主管部門和國務院有關行政主管培訓部門備案,在公佈國家標準後,該地方標準即應廢止。"],"answer":"B","category":"法規與標準","sources":[{"bank":"rev2","n":84}]},{"id":904,"stem":"2005年,RFC4301(Request for Comments 4301:Security Architecture for the Intermet Protocol)發佈,用以取代原先的RFC2401,該標準建議規定了IPsec系統基礎架構,描述如何在IP層(IPv4/IPv6)為流量提供安全業務,請問此類RFC系列標準建設是由哪個組織發佈的()","options":["國際標準化組織","國際電工委員會","國際電信聯盟遠程通信標準化組織","Internet工程任務組"],"answer":"D","category":"法規與標準","sources":[{"bank":"rev2","n":85}]},{"id":905,"stem":"關於信息安全管理體系,國際上有標準(ISO/IEC 27001:2013)而我國發布了《信息技術安全技術信息安全管理體系要求》(GB/T 22080-2008)請問,這兩個標準的關係是:","options":["IDT (等同採用),此國家標準等同於該國際標準,僅有或沒有編輯性修改","EQV(等效採用),此國家標準不等效於該國際標準","NEQ(非等效採用),此國家標準不等效於該國際標準","沒有采用與否的關係,兩者之間版本不同,不應該直接比較"],"answer":"D","category":"法規與標準","sources":[{"bank":"rev2","n":86}]},{"id":906,"stem":"GB/T18336<>(CC)是測評標準類中的重要標準,該標準定義了保護輪廓(Protection Profile ,PP )和安全目標(Security Target ,ST)的評估準則,提出了評估保證級(Evaluation Assurance Level,EAL),其評估保證級共分為()個遞增的評估保證等級","options":["4","5","6","7"],"answer":"D","category":"法規與標準","sources":[{"bank":"rev2","n":87}]},{"id":907,"stem":"信息安全工程監理的職責包括:","options":["質量控制、進度控制、成本控制、合同管理、信息管理和協調","質量控制、進度控制、成本控制、合同管理和協調","確定安全要求、認可設計方案、監視安全態勢、建立保障證據和協調","確定安全要求、認可設計方案、監視安全態勢和協調"],"answer":"A","category":"工程與管理","sources":[{"bank":"rev2","n":88}]},{"id":908,"stem":"關於信息安全保障的概念,下面說法錯誤的是:","options":["信息系統面臨的風險和威脅是動態變化的,信息安全保障強調動態的安全理念","信息安全保障已從單純保護和防禦階段發展為集保護、檢測和響應為一體的綜合階段","在全球互聯互通的網絡空間環境下,可單純依靠技術措施來保障信息安全","信息安全保障把信息安全從技術擴展到管理,通過技術、管理和工程等措施的綜合融合,形成對信息、信息系統及業務使命的保障"],"answer":"C","category":"工程與管理","sources":[{"bank":"rev2","n":89}]},{"id":909,"stem":"ISO/IEC27001《信息技術 安全技術 信息安全管理體系要求》的內容是基於()","options":["S7799-1《信息安全實施細則》","S7799-2《信息安全管理體系規範》","信息技術安全評估準則(簡稱ITSEC)","信息技術安全評估通用標準(簡稱CC)"],"answer":"B","category":"法規與標準","sources":[{"bank":"rev2","n":93}]},{"id":910,"stem":"在GB/T18336《信息技術安全性評估準則》(CC標準)中,有關保護輪廓(Protection Profile,PP)和安全目標(Security Target,ST),錯誤的是:","options":["PP是描述一類產品或系統的安全要求","PP描述的安全要求與具體實現無關","兩份不同的ST不可能滿足同一份PP 的要求","ST與具體的實現有關"],"answer":"C","category":"法規與標準","sources":[{"bank":"rev2","n":94}]},{"id":911,"stem":"以下關於法律的說法錯誤的是()","options":["法律是國家意志的統一體現,有嚴密的邏輯體系和效力","法律可以是公開的,也可以是“內部”的","一旦制定,就比較穩定,長期有效,不允許經常更改","法律對違法犯罪的後果由明確規定,是一種“硬約束”"],"answer":"B","category":"法規與標準","sources":[{"bank":"rev2","n":97}]},{"id":912,"stem":"由於頻繁出現軟件運行時被黑客遠程攻擊獲取數據的現象,某軟件公司準備加強軟件安全開發管理,在下面做法中,對於解決問題沒有直接幫助的是()","options":["要求開發人員採用敏捷開發模型進行開發","要求所有的開發人員參加軟件安全意識培訓","要求規範軟件編碼,並制定公司的安全編碼準則","要求增加軟件安全測試環節,今早發現軟件安全問題"],"answer":"A","category":"工程與管理","sources":[{"bank":"rev2","n":98}]},{"id":913,"stem":"信息安全標準化工作是我國信息安全保障工作的重要組成部分之一,也是政府進行宏觀管理的重要依據,同時也是保護國家利益,促進產業發展的重要手段之一,關於我國標準化工作,下面選項中描述錯誤的是()","options":["我國是在國家質量監督檢驗疫總局管理下,由國家標準化管理委員會統一管理全國標準化工作,下設專業技術委員會","事關國家安全利益,信息安全因此不能和國際標準相同,而是要通過本國組織和專家制定標準,切實有效地保護國家利益和安全","我國歸口信息安全方面標準是“全國信息安全標準化技術委員會”,為加強有關工作,2016在其下設立“大數據安全特別工作組”","信息安全標準化工作是解決信息安全問題的重要技術支撐,其主要作業突出體現在能夠確保有關產品、設施的技術先進性、可靠性和一致性"],"answer":"B","category":"法規與標準","sources":[{"bank":"rev2","n":100}]},{"id":914,"stem":"最小特權是軟件安全設計的基本原則,某應用程序在設計時,設計人員給出了以下四種策略,其中有一個違反了最小特權的原則,作為評審專家,請指出是哪一個?","options":["軟件在Linux下按照時,設定運行時使用nobody用戶運行實例","軟件的日誌備份模塊由於需要備份所有數據庫數據,在備份模塊運行時,以數據庫備份操作員賬號連接數據庫","軟件的日誌模塊由於要向數據庫中的日誌表中寫入日誌信息,使用了一個日誌用戶賬號連接數據庫,該賬號僅對日誌表擁有權限","為了保證軟件在Windows下能穩定的運行,設定運行權限為system,確保系統運行正常,不會因為權限不足產生運行錯誤"],"answer":"D","category":"操作系統與主機安全","sources":[{"bank":"rev3","n":1}]},{"id":915,"stem":"主機A 向主機B發出的數據採用AH或ESP的傳輸模式對經過互聯網的數據流量進行保護時,主機A和主機B 的IP地址在應該在下列哪個範圍?","options":["10.0.0.0~10.255.255.255","172.16.0.0~172.31.255.255","192.168.0.0~192.168.255.255","不在上述範圍內"],"answer":"D","category":"網絡安全","sources":[{"bank":"rev3","n":2},{"bank":"rev4","n":11}]},{"id":916,"stem":"某電子商務網站最近發生了一起安全事件,出現了一個價值1000 元的商品用1元被買走的情況,經分析是由於設計時出於性能考慮,在瀏覽時使用Http協議,攻擊者通過僞造數據包使得向購物車添加商品的價格被修改.利用此漏洞,攻擊者將價值1000 元的商品以1元添加到購物車中,而付款時又沒有驗證的環節,導致以上問題,對於網站的這個問題原因分析及解決措施。最正確的說法應該是?","options":["該問題的產生是由於使用了不安全的協議導致的,為了避免再發生類似的闖題,應對全網站進行安全改造,所有的訪問都強制要求使用https","該問題的產生是由於網站開發前沒有進行如威脅建模等相關工作或工作不到位,沒有找到該威脅並採取相應的消減措施","該問題的產生是由於編碼缺陷,通過對網站進行修改,在進行訂單付款時進行商品價格驗證就可以解決","該問題的產生不是網站的問題,應報警要求尋求警察介入,嚴懲攻擊者即可"],"answer":"A","category":"網絡安全","sources":[{"bank":"rev3","n":3}]},{"id":917,"stem":"以下哪個選項不是防火牆提供的安全功能?","options":["IP地址欺騙防護","NAT","訪問控制","SQL注入攻擊防護"],"answer":"D","category":"網絡安全","sources":[{"bank":"rev3","n":4}]},{"id":918,"stem":"以下關於可信計算說法錯誤的是:","options":["可信的主要目的是要建立起主動防禦的信息安全保障體系","可信計算機安全評價標準(TCSEC)中第一次提出了可信計算機和可信計算基的概念","可信的整體框架包含終端可信、終端應用可信、操作系統可信、網絡互聯可信、互聯網交易等應用系統可信","可信計算平臺出現後會取代傳統的安全防護體系和方法"],"answer":"D","category":"工程與管理","sources":[{"bank":"rev3","n":5}]},{"id":919,"stem":"Linux系統對文件的權限是以模式位的形式來表示,對於文件名為test的一個文件,屬於admin 組中user用戶,以下哪個是該文件正確的模式表示?","options":["- rwx r-x r-x 3 user admin 1024 Sep 13 11:58 test","rwx r-x r-x 3 user admin 1024 Sep 13 11:58 test","- rwx r-x r-x 3 admin user 1024 Sep 13 11:58 test","rwx r-x r-x 3 admin user1024 Sep 13 11:58 test"],"answer":"A","category":"操作系統與主機安全","sources":[{"bank":"rev3","n":6}]},{"id":920,"stem":"應用軟件的數據存儲在數據庫中,為了保證數據安全,應設置良好的數據庫防護策略,以下不屬於數據庫防護策略的是?","options":["安裝最新的數據庫軟件安全補丁","對存儲的敏感數據進行安全加密","不使用管理員權限直接連接數據庫系統","定期對數據庫服務器進行重啓以確保數據庫運行良好"],"answer":"D","category":"操作系統與主機安全","sources":[{"bank":"rev3","n":8}]},{"id":921,"stem":"對惡意代碼的預防,需要採取增強安全防範策略與意識等措施,關於以下預防措施或意識,說法錯誤的是:","options":["在使用來自外部的移動介質前,需要進行安全掃描","限制用戶對管理員權限的使用","開放所有端口和服務,充分使用系統資源","不要從不可信來源下載或執行應用程序"],"answer":"C","category":"操作系統與主機安全","sources":[{"bank":"rev3","n":10}]},{"id":922,"stem":"安全專家在對某網站進行安全部署時,調整了Apache的運行權限,從root權限降低為nobody用戶,以下操作的主要目的是:","options":["為了提高Apache軟件運行效率","為了提高Apache軟件的可靠性","為了避免攻擊者通過Apache獲得root 權限","為了減少Apache上存在的漏洞"],"answer":"C","category":"操作系統與主機安全","sources":[{"bank":"rev3","n":11}]},{"id":923,"stem":"以下哪個是惡意代碼採用的隱藏技術:","options":["文件隱藏","進程隱藏","網絡連接隱藏","以上都是"],"answer":"D","category":"網絡安全","sources":[{"bank":"rev3","n":13}]},{"id":924,"stem":"傳輸控制協議(TCP)是傳輸層協議,以下關於TCP協議的說法,哪個是正確的?","options":["相比傳輸層的另外一個協議UDP,TCP既提供傳輸可靠性,還同時具有更高的效率,因此具有廣泛的用途","TCP協議包頭中包含了源IP地址和目的IP地址,因此TCP協議負責將數據傳送到正確的主機","TCP協議具有流量控制、數據校驗、超時重發、接收確認等機制,因此TCP協議能完全替代IP 協議","TCP協議雖然高可靠,但是相比UDP協議機制過於複雜,傳輸效率要比UDP低"],"answer":"D","category":"網絡安全","sources":[{"bank":"rev3","n":16}]},{"id":925,"stem":"以下關於UDP協議的說法,哪個是錯誤的?","options":["UDP具有簡單高效的特點,常被攻擊者用來實施流量型拒絕服務攻擊","UDP協議包頭中包含了源端口號和目的端口號,因此UDP可通過端口號將數據包送達正確的程序","相比TCP協議,UDP協議的系統開銷更小,因此常用來傳送如視頻這一類高流量需求的應用數據","UDP協議不僅具有流量控制,超時重發等機制,還能提供加密等服務,因此常用來傳輸如視頻會話這類需要隱私保護的數據"],"answer":"D","category":"網絡安全","sources":[{"bank":"rev3","n":17}]},{"id":926,"stem":"有關項目管理,錯誤的理解是:","options":["項目管理是一門關於項目資金、時間、人力等資源控制的管理科學","項目管理是運用系統的觀點、方法和理論,對項目涉及的全部工作進行有效地管理,不受項目資源的約束","項目管理包括對項目範圍、時間、成本、質量、人力資源、溝通、風險、採購、集成的管理","項目管理是系統工程思想針對具體項目的實踐應用"],"answer":"B","category":"工程與管理","sources":[{"bank":"rev3","n":18}]},{"id":927,"stem":"近年來利用DNS劫持攻擊大型網站惡性攻擊事件時有發生,防範這種攻擊比較有效的方法是?","options":["加強網站源代碼的安全性","對網絡客戶端進行安全評估","協調運營商對域名解析服務器進行加固","在網站的網絡出口部署應用級防火牆"],"answer":"C","category":"網絡安全","sources":[{"bank":"rev3","n":19}]},{"id":928,"stem":"關於源代碼審覈,下列說法正確的是:","options":["人工審覈源代碼審校的效率低,但採用多人並行分析可以完全彌補這個缺點","源代碼審覈通過提供非預期的輸入並監視異常結果來發現軟件故障,從而定位可能導致安全弱點的薄弱之處","使用工具進行源代碼審覈,速度快,準確率高,已經取代了傳統的人工審覈","源代碼審覈是對源代碼檢查分析,檢測並報告源代碼中可能導致安全弱點的薄弱之處"],"answer":"D","category":"綜合","sources":[{"bank":"rev3","n":20}]},{"id":929,"stem":"以下哪一項不屬於常見的風險評估與管理工具:","options":["基於信息安全標準的風險評估與管理工具","基於知識的風險評估與管理工具","基於模型的風險評估與管理工具","基於經驗的風險評估與管理工具"],"answer":"D","category":"風險管理","sources":[{"bank":"rev3","n":25}]},{"id":930,"stem":"以下說法正確的是:","options":["驗收測試是由承建方和用戶按照用戶使用手冊執行軟件驗收","軟件測試的目的是為了驗證軟件功能是否正確","監理工程師應按照有關標準審查提交的測試計劃,並提出審查意見","軟件測試計劃開始於軟件設計階段,完成於軟件開發階段"],"answer":"C","category":"法規與標準","sources":[{"bank":"rev3","n":26}]},{"id":931,"stem":"國家科學技術祕密的密級分為絕密級、機密級、祕密級,以下哪項屬於絕密級的描述?","options":["處於國際先進水平,並且有軍事用途或者對經濟建設具有重要影響的","能夠局部反應國家防禦和治安實力的","我國獨有、不受自然條件因素制約、能體現民族特色的精華,並且社會效益或者經濟效益顯著的傳統工藝","國際領先,並且對國防建設或者經濟建設具有特別重大影響的"],"answer":"D","category":"綜合","sources":[{"bank":"rev3","n":28}]},{"id":932,"stem":"關於我國加強信息安全保障工作的總體要求,以下說法錯誤的是:","options":["堅持積極防禦、綜合防範的方針","重點保障基礎信息網絡和重要信息系統安全","創建安全健康的網絡環境","提高個人隱私保護意識"],"answer":"D","category":"網絡安全","sources":[{"bank":"rev3","n":29}]},{"id":933,"stem":"根據《關於加強國家電子政務工程建設項目信息安全風險評估工作的通知》的規定,以下正確的是:","options":["涉密信息系統的風險評估應按照《信息安全等級保護管理辦法》等國家有關保密規定和標準進行","非涉密信息系統的風險評估應按照《非涉及國家祕密的信息系統分級保護管理辦法》等要求進行","可委託同一專業測評機構完成等級測評和風險評估工作,並形成等級測評報告和風險評估報告","此通知不要求將“信息安全風險評估”作為電子政務項目驗收的重要內容"],"answer":"C","category":"風險管理","sources":[{"bank":"rev3","n":30}]},{"id":934,"stem":"某單位信息安全崗位員工,利用個人業餘時間,在社交網絡平臺上向業內同不定期發佈信息安全相關知識和前沿動態資訊,這一行為主要符合以下哪一條註冊信息安全專業人員(CISP)職業道德準則:","options":["避免任何損害CISP聲譽形象的行為","自覺維護公衆信息安全,拒絕並抵制通過計算機網絡系統泄露個人隱私的行為","幫助和指導信息安全同行提升信息安全保障知識和能力","不在公衆網絡傳播反動、暴力、黃色、低俗信息及非法軟件"],"answer":"C","category":"網絡安全","sources":[{"bank":"rev3","n":31}]},{"id":935,"stem":"以下哪一項不是我國信息安全保障的原則:","options":["立足國情,以我為主,堅持以技術為主","正確處理安全與發展的關係,以安全保發展,在發展中求安全","統籌規劃,突出重點,強化基礎性工作","明確國家、企業、個人的責任和義務,充分發揮各方面的積極性,共同構築國家信息安全保障體系"],"answer":"A","category":"工程與管理","sources":[{"bank":"rev3","n":32}]},{"id":936,"stem":"下列選項中,哪個不是我國信息安全保障工作的主要內容:","options":["加強信息安全標準化工作,積極採用“等同採用、修改採用、制定”等多種方式,儘快建立和完善我國信息安全標準體系","建立國家信息安全研究中心,加快建立國家急需的信息安全技術體系,實現國家信息安全自主可控目標","建設和完善信息安全基礎設施,提供國家信息安全保障能力支撐","加快信息安全學科建設和信息安全人才培養"],"answer":"B","category":"工程與管理","sources":[{"bank":"rev3","n":33}]},{"id":937,"stem":"關於信息安全管理,說法錯誤的是:","options":["信息安全管理是管理者為實現信息安全目標(信息資產的CIA等特性,以及業務運作的持續)而進行的計劃、組織、指揮、協調和控制的一系列活動。","信息安全管理是一個多層面、多因素的過程,依賴於建立信息安全組織、明確信息安全角色及職責、制定信息安全方針策略標準規範、建立有效的監督審計機制等多方面非技術性的努力。","實現信息安全,技術和產品是基礎,管理是關鍵。","信息安全管理是人員、技術、操作三者緊密結合的系統工程,是一個靜態過程。"],"answer":"D","category":"工程與管理","sources":[{"bank":"rev3","n":34}]},{"id":938,"stem":"下列關於信息系統生命週期中實施階段所涉及主要安全需求描述錯誤的是:","options":["確保採購定製的設備、軟件和其他系統組件滿足已定義的安全要求","確保整個系統已按照領導要求進行了部署和配置","確保系統使用人員已具備使用系統安全功能和安全特性的能力","確保信息系統的使用已得到授權"],"answer":"B","category":"工程與管理","sources":[{"bank":"rev3","n":36}]},{"id":939,"stem":"下列關於信息系統生命週期中安全需求說法不準確的是:","options":["明確安全總體方針,確保安全總體方針源自業務期望","描述所涉及系統的安全現狀,提交明確的安全需求文檔","向相關組織和領導人宣貫風險評估準則","對系統規劃中安全實現的可能性進行充分分析和論證"],"answer":"C","category":"法規與標準","sources":[{"bank":"rev3","n":37}]},{"id":940,"stem":"小張在某單位是負責事信息安全風險管理方面工作的部門領導,主要負責對所在行業的新人進行基本業務素質培訓。一次培訓的時候,小張主要負責講解風險評估工作形式,小張認為:\n1.風險評估工作形式包括:自評估和檢查評估;\n2.自評估是指信息系統擁有、運營或使用單位發起的對本單位信息系統進行風險評估;\n3.檢查評估是信息系統上級管理部門組織或者國家有關職能部門依法開展的風險評估;\n4.對信息系統的風險評估方式只能是“自評估”和“檢查評估”中的一個,非此即彼.\n請問小張的所述論點中錯誤的是哪項:","options":["第一個觀點","第二個觀點","第三個觀點","第四個觀點"],"answer":"D","category":"風險管理","sources":[{"bank":"rev3","n":38}]},{"id":941,"stem":"風險評估工具的使用在一定程度上解決了手動評佑的侷限性,最主要的是它能夠將專家知識進行集中,使專家的經驗知識被廣泛使用,根據在風險評估過程中的主要任務和作用願理,風險評估工具可以為以下幾類,其中錯誤的是:","options":["風險評估與管理工具","系統基礎平颱風險評估工具","風險評估輔助工具","環境風險評估工具"],"answer":"D","category":"風險管理","sources":[{"bank":"rev3","n":40}]},{"id":942,"stem":"為了解風險和控制風險,應當及時進行風險評估活動,我國有關文件指出:風險評估的工作形式可分為自評估和檢查評估兩種,關於自評估,下面選項中描述錯誤的是()。","options":["自評估是由信息系統擁有、運營或使用單位發起的對本單位信息系統進行的風險評估","自評估應參照相應標準、依據制定的評估方案和準則,結合系統特定的安全要求實施","自評估應當是由發起單位自行組織力量完成,而不應委託社會風險評估服務機構來實施","週期性的自評估可以在評估流程上適當簡化,如重點針對上次評估後系統變化部分進行"],"answer":"C","category":"風險管理","sources":[{"bank":"rev3","n":41}]},{"id":943,"stem":"信息安全風險評估是信息安全風險管理工作中的重要環節,在國家網絡與信息安全協調小組發佈的《關於開展信息安全風險評估工作的意見》(國信辦(2006)5號)中,風險評估分為自評估和檢查評估兩種形式,並對兩種工作形式提出了有關工作原則和要求,下面選項中描述正確的是( )。","options":["信息安全風險評估應以自評估為主,自評估和檢查評估相互結合、互為補充","信息安全風險評估應以檢查評估為主,自評估和檢查評估相互結合、互為補充","自評估和檢查評估是相互排斥的,單位應慎重地從兩種工作形式選擇一個,並長期使用","自評估和檢查評估是相互排斥的,無特殊理由單位均應選擇檢查評估,以保證安全效果"],"answer":"A","category":"風險管理","sources":[{"bank":"rev3","n":42}]},{"id":944,"stem":"規範的實施流程和文檔管理,是信息安全風險評估結能否取得成果的重要基礎,某單位在實施風險評估時,形成了《風險評估方案》並得到了管理決策層的認可,在風險評估實施的各個階段中,該《風險評估方案》應是如下( )中的輸出結果。","options":["風險評估準備階段","風險要素識別階段","風險分析階段","風險結果判定階段"],"answer":"A","category":"風險管理","sources":[{"bank":"rev3","n":44}]},{"id":945,"stem":"規範的實施流程和文檔管理,是信息安全風險評估能否取得成功的重要基礎。某單41位在實施風險評估時,形成了《待評估信息系統相關設備及資產清單》。在風險評估實施的各個階段中,該《待評估信息系統相關設備及資產清單》應是如下()","options":["風險評估準備","風險要素識別","風險分析","風險結果判定"],"answer":"B","category":"風險管理","sources":[{"bank":"rev3","n":45}]},{"id":946,"stem":"風險要素識別是風險評估實施過程中的一個重要步驟,有關安全要素,請選擇一個最合適的選項()。","options":["識別面臨的風險並賦值","識別存在的脆弱性並賦值","制定安全措施實施計劃","檢查安全措施有效性"],"answer":"B","category":"風險管理","sources":[{"bank":"rev3","n":46}]},{"id":947,"stem":"某單位在實施信息安全風險評估後,形成了若干文擋,下面( )中的文擋不應屬於風險評估中“風險評估準備”階段輸出的文檔。","options":["《風險評估工作計劃》,主要包括本次風險評估的目的、意義、範圍、目標、組織結構、角色及職責、經費預算和進度安排等內容","《風險評估方法和工具列表》。主要包括擬用的風險評估方法和測試評估工具等內容","《已有安全措施列表》,主要包括經檢查確認後的已有技術和管理各方面安全措施等內容","《風險評估準則要求》,主要包括風險評估參考標準、採用的風險分析方法、風險計算方法、資產分類標準、資產分類準則等內容"],"answer":"C","category":"風險管理","sources":[{"bank":"rev3","n":47}]},{"id":948,"stem":"文檔體系建設是信息安全管理體系(ISMS)建設的直接體現,下列說法不正確的是:","options":["組織內的信息安全方針文件、信息安全規章制度文件、信息安全相關操作規範文件等文 檔是組織的工作標準,也是ISMS審覈的依據","組織內的業務系統日誌文件、風險評估報告等文檔是對上一級文件的執行和記錄,對這些記錄不需要保護和控制","組織在每份文件的首頁,加上文件修訂跟蹤表,以顯示每一版本的版本號、發佈日期、編寫人、審批人、主要修訂等內容","層次化的文檔是ISMS建設的直接體現,文檔體系應當依據風險評估的結果建立"],"answer":"B","category":"工程與管理","sources":[{"bank":"rev3","n":48}]},{"id":949,"stem":"某項目的主要內容為建造A類機房,監理單位需要根據《電子信息系統機房設計規範》(GB 50174-2008)的相關要求,對承建單位的施工設計方案進行審覈,以下關於監理單位給出的審覈意見錯誤的是:","options":["在異地建立備份機房時,設計時應與主用機房等級相同","由於高端小型機發熱量大,因此採用活動地板上送風,下回風的方式","因機房屬於A級主機房,因此設計方案中應考慮配備柴油發電機,當市電發生故障時,所配備的柴油發電機應能承擔全部負荷的需要","級主機房應設置潔淨氣體滅火系統"],"answer":"B","category":"物理與環境安全","sources":[{"bank":"rev3","n":49}]},{"id":950,"stem":"在工程實施階段,監理機構依據承建合同、安全設計方案、實施方案、實施記錄、國家或地方相關標準和技術指導文件,對信息化工程進行安全____檢查,以驗證項目是否實現了項目設計目標和安全等級要求。","options":["功能性","可用性","保障性","符合"],"answer":"D","category":"工程與管理","sources":[{"bank":"rev3","n":50}]},{"id":951,"stem":"下系統工程說法錯誤的是:","options":["系統工程是基本理論的技術實現","系統工程是一種對所有系統都具有普遍意義的科學方法","系統工程是組織管理系統規劃、研究、製造、試驗、使用的科學方法","系統工程是一種方法論"],"answer":"A","category":"工程與管理","sources":[{"bank":"rev3","n":51}]},{"id":952,"stem":"組織建立業務連續性計劃(BCP)的作用包括:","options":["在遭遇災難事件時,能夠最大限度地保護組織數據的實時性,完整性和一致性;","提供各種恢復策略選擇,儘量減小數據損失和恢復時間,快速恢復操作系統、應用和數據;","保證發生各種不可預料的故障、破壞性事故或災難情況時,能夠持續服務,確保業務系統的不間斷運行,降低損失;","以上都是。"],"answer":"D","category":"應急與災難恢復","sources":[{"bank":"rev3","n":52}]},{"id":953,"stem":"業務系統運行中異常錯誤處理合理的方法是:","options":["讓系統自己處理異常","調試方便,應該讓更多的錯誤更詳細的顯示出來","捕獲錯誤,並拋出前臺顯示","捕獲錯誤,只顯示簡單的提示信息,或不顯示任何信息"],"answer":"D","category":"綜合","sources":[{"bank":"rev3","n":53}]},{"id":954,"stem":"以下哪項不是應急響應準備階段應該做的?","options":["確定重要資產和風險,實施針對風險的防護措施","編制和管理應急響應計劃","建立和訓練應急響應組織和準備相關的資源","評估事件的影響範圍,增強審計功能、備份完整系統"],"answer":"D","category":"應急與災難恢復","sources":[{"bank":"rev3","n":54}]},{"id":955,"stem":"關於祕鑰管理,下列說法錯誤的是:","options":["科克霍夫原則指出算法的安全性不應基於算法的保密,而應基於祕鑰的安全性","保密通信過程中,通信方使用之前用過的會話祕鑰建立會話,不影響通信安全","祕鑰管理需要考慮祕鑰產生、存儲、備份、分配、更新、撤銷等生命週期過程每一個環節","在網絡通信中。通信雙方可利用Diffie-He11man協議協商出會話祕鑰"],"answer":"B","category":"工程與管理","sources":[{"bank":"rev3","n":55}]},{"id":956,"stem":"以下屬於哪一種認證實現方式:用戶登錄時,認證服務器(Authentication Server,AS)產生一個隨機數發送給用戶,用戶用某種單向算法將自己的口令、種子祕鑰和隨機數混合計算後作為一次性口令,併發送給AS,AS用同樣的方法計算後,驗證比較兩個口令即可驗證用戶身份。","options":["口令序列","時間同步","挑戰/應答","靜態口令"],"answer":"C","category":"操作系統與主機安全","sources":[{"bank":"rev3","n":56}]},{"id":957,"stem":"在對某面向互聯網提供服務的某應用服務器的安全檢測中發現,服務器上開放了以下幾個應用,除了一個應用外其他應用都存在明文傳輸信息的安全問題,作為一名檢測人員,你需要告訴用戶對應用進行安全整改以外解決明文傳輸數據的問題,以下哪個應用已經解決了明文傳輸數據問題:","options":["SSH","HTTP","FTP","SMTP"],"answer":"A","category":"操作系統與主機安全","sources":[{"bank":"rev3","n":57}]},{"id":958,"stem":"以下哪個屬性不會出現在防火牆的訪問控制策略配置中?","options":["本局域網內地址","百度服務器地址","HTTP 協議","病毒類型"],"answer":"D","category":"網絡安全","sources":[{"bank":"rev3","n":58}]},{"id":959,"stem":"某linux系統由於root口令過於簡單,被攻擊者猜解後獲得了root口令,發現被攻擊後,管理員更改了root口令,並請安全專家對系統進行檢測,在系統中發現有一個文件的權限如下 -r-s--x--x 1 test tdst 10704 apr 15 2002/home/test/sh請問以下描述哪個是正確的:","options":["該文件是一個正常文件,test用戶使用的shell,test不能讀該文件,只能執行","該文件是一個正常文件,是test用戶使用的shell,但test用戶無權執行該文件","該文件是一個後門程序,該文件被執行時,運行身份root ,test用戶間接獲得了root 權限","該文件是一個後門程序,由於所有者是test,因此運行這個文件時文件執行權限為test"],"answer":"D","category":"操作系統與主機安全","sources":[{"bank":"rev3","n":59}]},{"id":960,"stem":"某網站為了更好向用戶提供服務,在新版本設計時提供了用戶快捷登錄功能,用戶如果使用上次的IP地址進行訪問,就可以無需驗證直接登錄,該功能推出後,導致大量用戶賬號被盜用,關於以上問題的說法正確的是:","options":["網站問題是由於開發人員不熟悉安全編碼,編寫了不安全的代碼,導致攻擊面增大,產生此安全問題","網站問題是由於用戶缺乏安全意識導致,使用了不安全的功能,導致網站攻擊面增大,產生此問題","網站問題是由於使用便利性提高,帶來網站用戶數增加,導致網站攻擊面增大,產生此安全問題","網站問題是設計人員不瞭解安全設計關鍵要素,設計了不安全的功能,導致網站攻擊面增大,產生此問題"],"answer":"D","category":"工程與管理","sources":[{"bank":"rev3","n":60}]},{"id":961,"stem":"為了保障系統安全,某單位需要對其跨地區大型網絡實時應用系統進行滲透測試,以下關於滲透測試過程的說法不正確的是","options":["由於在實際滲透測試過程中存在不可預知的風險,所以測試前要提醒用戶進行系統和數據備份,以便出現問題時可以及時恢復系統和數據","滲透測試從“逆向”的角度出發,測試軟件系統的安全性,其價值在於可以測試軟件在實際系統中運行時的安全狀況","滲透測試應當經過方案制定、信息收集、漏洞利用、完成滲透測試報告等步驟","為了深入發掘該系統存在的安全威脅,應該在系統正常業務運行高峯期進行滲透測試"],"answer":"D","category":"風險管理","sources":[{"bank":"rev3","n":63}]},{"id":962,"stem":"提高阿帕奇系統(Apache HTTP Server)系統安全性時,下面哪項措施不屬於安全配置()?","options":["不在Windows下安裝Apache,只在Linux和Unix下安裝","安裝Apache時,只安裝需要的組件模塊","不使用操作系統管理員用戶身份運行Apache,而是採用權限受限的專用用戶賬號來運行","積極瞭解Apache的安全通告,並及時下載和更新"],"answer":"A","category":"操作系統與主機安全","sources":[{"bank":"rev3","n":65}]},{"id":963,"stem":"某公司開發了一個遊戲網站,但是由於網站軟件存在漏洞,在網絡中傳輸大數據包時總是會丟失一些數據,如一次性傳輸大於2000個字節數據時,總是會有3 到5個字節不能傳送到對方,關於此案例,可以推斷的是()","options":["該網站軟件存在保密性方面安全問題","該網站軟件存在完整性方面安全問題","該網站軟件存在可用性方面安全問題","該網站軟件存在不可否認性方面安全問題"],"answer":"B","category":"安全模型與訪問控制","sources":[{"bank":"rev3","n":66}]},{"id":964,"stem":"信息安全保障是網絡時代各國維護國家安全和利益的首要任務,以下哪個國家最早將網絡安全上長升為國家安全戰略,並制定相關戰略計劃。","options":["中國","俄羅斯","美國","英國"],"answer":"C","category":"網絡安全","sources":[{"bank":"rev3","n":67}]},{"id":965,"stem":"我國黨和政府一直重視信息安全工作,我國信息安全保障工作也取得了明顯成效,關於我國信息安全實踐工作,下面說法錯誤的是()","options":["加強信息安全標準化建設,成立了“全國信息安全標準化技術委員會”制訂和發佈了大批信息安全技術,管理等方面的標準。","重視信息安全應急處理工作,確定由國家密碼管理局牽頭成立“國家網絡應急中心”推動了應急處理和信息通報技術合作工作進展","推進信息安全等級保護工作,研究制定了多個有關信息安全等級保護的規範和標準,重點保障了關係國定安全,經濟命脈和社會穩定等方面重要信息系統的安全性","實施了信息安全風險評估工作,探索了風險評估工作的基本規律和方法,檢驗並修改完善了有關標準,培養和鍛鍊了人才隊伍"],"answer":"B","category":"法規與標準","sources":[{"bank":"rev3","n":68}]},{"id":966,"stem":"為保障信息系統的安全,某經營公衆服務系統的公司準備並編制一份針對性的信息安全保障方案,並嚴格編制任務交給了小王,為此,小王決定首先編制出一份信息安全需求描述報告,關於此項工作,下面說法錯誤的是()","options":["信息安全需求是安全方案設計和安全措施實施的依據","信息安全需求應當是從信息系統所有者(用戶)的角度出發,使用規範化,結構化的語言來描述信息系統安全保障需求","信息安全需求應當基於信息安全風險評估結果,業務需求和有關政策法規和標準的合規性要求得到","信息安全需求來自於該公衆服務信息系統的功能設計方案"],"answer":"D","category":"法規與標準","sources":[{"bank":"rev3","n":69}]},{"id":967,"stem":"關於我國信息安全保障的基本原則,下列說法中不正確的是:","options":["要與國際接軌,積極吸收國外先進經驗並加強合作,遵循國際標準和通行做法,堅持管理與技術並重","信息化發展和信息安全不是矛盾的關係,不能犧牲一方以保證另一方","在信息安全保障建設的各項工作中,既要統籌規劃,又要突出重點","在國家信息安全保障工作中,要充分發揮國家、企業和個人的積極性,不能忽視任何一方的作用。"],"answer":"A","category":"工程與管理","sources":[{"bank":"rev3","n":71},{"bank":"rev5","n":43}]},{"id":968,"stem":"2005年,RFC4301(Request for Comments 4301:Security Architecture for the Internet Protocol)發佈,用以取代原先的RFC2401,該標準建議規定了IPsec系統基礎架構,描述如何在IP層(IPv4/IPv6)位流量提供安全業務。請問此類RFC系列標準建議是由下面哪個組織發佈的()。","options":["國際標準化組織(International Organization for Standardization,ISO)","國際電工委員會(International Electrotechnical Commission,IEC)","國際電信聯盟遠程通信標準化組織(ITU Telecommunication Standardization Secctor,ITU-T)","Internet工程任務組(Internet Engineering Task Force,IETF)"],"answer":"D","category":"法規與標準","sources":[{"bank":"rev3","n":72}]},{"id":969,"stem":"PDCERF方法是信息安全應急響應工作中常用的一種方法,它將應急響應分成六個階段。其中,主要執行如下工作應在哪一個階段:關閉信息系統、和/或修改防火牆和路由器的過濾規則,拒絕來自發起攻擊的嫌疑主機流量、和/或封鎖被攻破的登錄賬號等()","options":["準備階段","遏制階段","根除階段","檢測階段"],"answer":"B","category":"應急與災難恢復","sources":[{"bank":"rev3","n":75}]},{"id":970,"stem":"在網絡信息系統中對用戶進行認證識別時,口令是一種傳統但仍然使用廣泛的方法,口令認證過程中常常使用靜態口令和動態口令。下面找描述中錯誤的是( )","options":["所謂靜態口令方案,是指用戶登錄驗證身份的過程中,每次輸入的口令都是固定、靜止不變的","使用靜態口令方案時,即使對口令進行簡單加密或哈希後進行傳輸,攻擊者依然可能通過重放攻擊來欺騙信息系統的身份認證模塊","動態口令方案中通常需要使用密碼算法產生較長的口令序列,攻擊者如果連續地收集到足夠多的歷史口令,則有可能預測出下次要使用的口令","通常,動態口令實現方式分為口令序列、時間同步以及挑戰/應答等幾種類型"],"answer":"C","category":"操作系統與主機安全","sources":[{"bank":"rev3","n":76}]},{"id":971,"stem":"以下哪一項不是常見威脅對應的消減措施:","options":["假冒攻擊可以採用身份認證機制來防範","為了防止傳輸的信息被篡改,收發雙方可以使用單向Hash函數來驗證數據的完整性","為了防止發送方否認曾經發送過的消息,收發雙方可以使用消息驗證碼來防止抵賴","為了防止用戶提升權限,可以採用訪問控制表的方式來管理權限"],"answer":"C","category":"操作系統與主機安全","sources":[{"bank":"rev3","n":80}]},{"id":972,"stem":"國務院信息化工作辦公室於2004年7月份下發了《關於做好重要信息系統災難備份工作的通知》,該文件中指出了我國在災備工作原則,下面哪項不屬於該工作原則( )","options":["統籌規劃","分組建設","資源共享","平戰結合"],"answer":"B","category":"應急與災難恢復","sources":[{"bank":"rev3","n":82}]},{"id":973,"stem":"二十世紀二十年代,德國發明家亞瑟 謝爾比烏斯發明了Engmia密碼機,按照密碼學發展歷史階段劃分,這個階段屬於()","options":["古典密碼階段。這一階段的密碼專家常常靠直覺和技術來設計密碼,而不是憑藉推理和證明,常用的密碼運算方法包括替代方法和轉換方法()","近代密碼發展階段。這一階段開始使用機械代替手工計算,形成了機械式密碼設備和更進一步的機電密碼設備","現代密碼學的早起發展階段。這一階段以香農的論文“保密系統的通信理論”為理論基礎,開始了對密碼學的科學探索","現代密碼學的近期發展階段。這一階段以公鑰密碼思想為標誌,引發了密碼學歷"],"answer":"B","category":"密碼與加密","sources":[{"bank":"rev3","n":84}]},{"id":974,"stem":"小王在學習定量風險評估方法後,決定試着為單位機房計算火災的風險大小,假設單位機房的總價值為400萬元人民幣,暴露係數是25%,年度發生率為0.2,那麼小王計算的年度預期損失應該是()","options":["100萬元人民幣","400萬元人民幣","20萬元人民幣","180萬元人民幣"],"answer":"C","category":"風險管理","sources":[{"bank":"rev3","n":85}]},{"id":975,"stem":"關於信息安全事件和應急響應的描述不正確的是()","options":["信息安全事件,是指由於自然或人為以及軟、硬件本身缺陷或故障的原因,對信息系統造成危害,或在信息系統內發生對社會造成負面影響事件","至今已有一種信息安全策略或防護措施,能夠對信息及信息系統提供絕對的保護,這就使得信息安全事件的發生是不可能的","應急響應是指組織為了應對突發/重大信息安全事件的發生所做的準備,以及在事件發生後所採取的措施","應急響應工作與其他信息安全管理工作將比有其鮮明的特點:具有高技術複雜性志專業性、強突發性、對知識經驗的高依賴性,以及需要廣泛的協調與合作"],"answer":"B","category":"應急與災難恢復","sources":[{"bank":"rev3","n":87}]},{"id":976,"stem":"目前,很多行業用戶在進行信息安全產品選項時,均要求產品需通過安全測評,關於信息安全產品測評的意義,下列說法中不正確的是()","options":["有助於建立和實施信息安全產品的市場準入制度","對用戶採購信息安全產品、設計、建設、使用和管理安全的信息系統提供科學公正的專業指導","對信息安全產品的研究、開發、生產以及信息安全服務的組織提供嚴格的規範引導和質量監督","打破市場壟斷,為信息安全產品發展創造一個良好的競爭環境"],"answer":"D","category":"法規與標準","sources":[{"bank":"rev3","n":88},{"bank":"rev5","n":82}]},{"id":977,"stem":"若一個組織聲稱自己的ISMS符合ISO/TEC27001或GB22080標準要求,其信息安全控制措施通常在以下方面實施常規控制,不包括哪一項()","options":["信息安全方針、信息安全組織、資產管理","人力資源安全、物理和環境安全、通信和操作管理","訪問控制、信息系統獲取、開發和維護、符合性","規劃與建立ISMS"],"answer":"D","category":"工程與管理","sources":[{"bank":"rev3","n":89}]},{"id":978,"stem":"信息安全事件和分類方法有多種,依據GB/Z 20986-2007《信息安全技術自信安全事件分類分級指南》,信息安全事件分為7個基本類別,描述正確的是()","options":["有害程序事件、網絡攻擊事件、信息破壞事件、信息內容安全事件、設備設施故障、災害性事件和其他信息安全事件","網絡貢獻事件、拒絕服務攻擊事件、信息破壞事件、信息內容安全事件、設備設施故障、災害性事件和其他信息安全事件","網絡攻擊事件、網絡釣魚事件、信息破壞事件、信息內容安全事件、設備設施故障、災害性事件和其他信息安全事件","網絡攻擊事件、網絡掃描竊聽事件、信息破壞事件、信息內容安全事件、設備設施故障、災害性事件和其他信息安全事件"],"answer":"A","category":"應急與災難恢復","sources":[{"bank":"rev3","n":90}]},{"id":979,"stem":"王工是某單位的系統管理員,他在某次參加了單位組織的風險管理工作時,根據任務安排,他使用了Nessus工具來掃描和發現數據庫服務器的漏洞,根據風險管理的相關理論,他這個是掃描活動屬於下面哪一個階段的工作()","options":["風險分析","風險要素識別","風險結果判定","風險處理"],"answer":"B","category":"風險管理","sources":[{"bank":"rev3","n":91}]},{"id":980,"stem":"某市環衛局網絡建設是當地政府投資的重點項目。總體目標就是用於交換式千兆以太網為主幹,超五類雙絞線作水平佈線,由大型交換機和路由器連通幾個主要的工作區域,在各區域建立一個閉路電視監控系統,再把信號通過網絡傳輸到各監控中心,其中對交換機和路由器進行配置是網絡安全中的一個不可缺少的步驟,下面對於交換機和路由器的安全配置,操作錯誤的是( )","options":["保持當前版本的操作系統,不定期更新交換機操作系統補丁","控制交換機的物理訪問端口,關閉空閒的物理端口","帶外管理交換機,如果不能實現的話,可以利用單獨的VLAN號進行帶內管理","安全配置必要的網絡服務,關閉不必要的網絡服務"],"answer":"A","category":"網絡安全","sources":[{"bank":"rev3","n":94}]},{"id":981,"stem":"組織第一次建立業務連續性計劃時,最為重要的活動是:","options":["制定業務連續性策略","進行業務影響分析","進行災難恢復演練","構建災備系統"],"answer":"A","category":"應急與災難恢復","sources":[{"bank":"rev3","n":97}]},{"id":982,"stem":"防止非法授權訪問數據文件的控制措施,哪項是最佳的方式:","options":["自動文件條目","磁帶庫管理程序","訪問控制軟件","鎖定庫"],"answer":"C","category":"操作系統與主機安全","sources":[{"bank":"rev3","n":98}]},{"id":983,"stem":"白盒測試的具體優點是:","options":["其檢查程序是否可與系統的其他部分一起正常運行","在不知程序內部結構下確保程序的功能性操作有效","其確定程序準確性成某程序的特定邏輯路徑的狀態","其通過嚴格限制訪問主機系統的受控或虛擬環境中執行對程序功能的檢查"],"answer":"C","category":"安全模型與訪問控制","sources":[{"bank":"rev3","n":99}]},{"id":984,"stem":"為某航空公司的訂票系統設計業務連續性計劃時,最適用於異地數據轉移/備份的方法是:","options":["文件映像處理","電子鏈接","硬盤鏡像","熱備援中心配置"],"answer":"D","category":"應急與災難恢復","sources":[{"bank":"rev3","n":100}]},{"id":985,"stem":"小陳學習了有關信息安全管理體系的內容後,認為組織建立信息安全管理體系並持續運行,比起簡單地實施信息安全管理,有更大的作用,他總結了四個方面的作用,其中總結錯誤的是( )","options":["可以建立起文檔化的信息安全管理規範,實現有“法”可依,有章可循,有據可查","可以強化員工的信息安全意識,建立良好的安全作業習慣,培育組織的信息安全企業文化","可以增強客戶、業務夥伴、投資人對該組織保障其業務平臺和數據信息的安全信心","可以深化信息安全管理,提高安全防護效果,使組織通過國際標準化組織的ISO 9001認證"],"answer":"D","category":"工程與管理","sources":[{"bank":"rev4","n":1}]},{"id":986,"stem":"隨着“互聯網”概念的普及,越來越多的新興住宅小區引入了“智能樓宇”的理念,某物業為提供高檔次的服務,防止網絡主線路出現故障,保證小區內網絡服務的可用,穩定、高效,計劃通過網絡冗餘配置的是()。","options":["接入互聯網時,同時採用不同電信運營商線路,相互備份且互不影響。","核心層、匯聚層的設備和重要的接入層設備均應雙機設備。","規劃網絡IP地址,制定網絡IP地址分配策略","保證網絡帶寬和網絡設備的業務處理能力具備冗餘空間,滿足業務高峯期和業務發展需求"],"answer":"A","category":"網絡安全","sources":[{"bank":"rev4","n":2}]},{"id":987,"stem":"在網絡信息系統建設中部署防火牆,往往用於提高內部網絡的安全防護能力。某公司準備部署一臺防火牆來保護內網主機,下列選項中部署位置正確的是()","options":["內網主機——交換機——防火牆——外網","防火牆——內網主機——交換機——外網","內網主機——防火牆——交換機——外網","防火牆——交換機——內網主機——外網"],"answer":"A","category":"網絡安全","sources":[{"bank":"rev4","n":4}]},{"id":988,"stem":"下列關於軟件安全開發中的BSI(Build Security In)系列模型說法錯誤的是()","options":["IS含義是指將安全內建到軟件開發過程中,而不是可有可無,更不是遊離於軟件開發生命週期之外","軟件安全的三根支柱是風險管理、軟件安全觸點和安全測試","軟件安全觸點是軟件開發生命週期中一套輕量級最優工程化方法,它提供了從不同角度保障安全的行為方式","SI系列模型強調應該使用工程化的方法來保證軟件安全,即在整個軟件開發生命週期中都要確保將安全作為軟件的一個有機組成部分"],"answer":"B","category":"工程與管理","sources":[{"bank":"rev4","n":5}]},{"id":989,"stem":"訪問控制是對用戶或用戶訪問本地或網絡上的域資源進行法令一種機制。在Windows2000以後的操作系統版本中,訪問控制是一種雙重機制,它對用戶的授權基於用戶權限和對象許可,通常使用ACL、訪問令牌和授權管理器來實現訪問控制功能。以下選項中,對windows操作系統訪問控制實現方法的理解錯誤的是()","options":["ACL只能由管理員進行管理","ACL是對象安全描述的基本組成部分,它包括有權訪問對象的用戶和級的SID","訪問令牌存儲着用戶的SID,組信息和分配給用戶的權限","通過授權管理器,可以實現基於角色的訪問控制"],"answer":"A","category":"操作系統與主機安全","sources":[{"bank":"rev4","n":6}]},{"id":990,"stem":"在現實的異構網絡環境中,越來越多的信息需要實現安全的互操作。即進行跨域信息交換和處理。Kerberos協議不僅能在域內進行認證,也支持跨域認證,下圖顯示的是Kerberos協議實現跨域認證的7個步驟,其中有幾個步驟出現錯誤,圖中錯誤的描述正確的是:","options":["步驟1和步驟2發生錯誤,應該向本地AS請求並獲得遠程TGT","步驟3和步驟4發生錯誤,應該向本地TGS請求並獲得遠程TGT","步驟5和步驟6發生錯誤,應該向遠程AS請求並獲得遠程TGT","步驟5和步驟6發生錯誤,應該向遠程TGS請求並獲得遠程SGT"],"answer":"B","category":"網絡安全","sources":[{"bank":"rev4","n":7}]},{"id":991,"stem":"某黑客通過分析和整理某報社記者小張的博客,找到一些有用的信息,通過僞裝的新聞線索,誘使其執行木馬程序,從而控制了小張的電腦,並以她的電腦為攻擊的端口,使報社的局域網全部感染木馬病毒,為防範此類社會工程學攻擊,報社不需要做的是()","options":["加強信息安全意識培訓,提高安全防範能力,瞭解各種社會工程學攻擊方法,防止受到此類攻擊","建立相應的安全相應應對措施,當員工受到社會工程學的攻擊,應當及時報告","教育員工注重個人隱私保護","減少系統對外服務的端口數量,修改服務旗標"],"answer":"D","category":"工程與管理","sources":[{"bank":"rev4","n":8}]},{"id":992,"stem":"2016年9月,一位安全研究人員在Google Cloud IP上通過掃描,發現了完整的美國路易斯安邦州290萬選民數據庫。這套數據庫中囊括了諸如完整姓名、電子郵箱地址、性別與種族、選民狀態、註冊日期與編號、正黨代名和密碼,以防止攻擊者利用以上信息進行()攻擊。","options":["默認口令","字典","暴力","XSS"],"answer":"B","category":"密碼與加密","sources":[{"bank":"rev4","n":9}]},{"id":993,"stem":"下圖中描述網絡動態安全的P2DR模型,這個模型經常使用圖形的形式來表達的下圖空白處應填()","options":["策略","方針","人員","項目"],"answer":"A","category":"工程與管理","sources":[{"bank":"rev4","n":10}]},{"id":994,"stem":"小王是某大學計算機科學與技術專業的學生,最近因為生病缺席了幾堂信息安全課程,這幾次課的內容是自主訪問控制與強制訪問控制,為了趕上課程進度,他向同班的小李借來課堂筆記,進行自學。而小李在聽課時由於經常走神,所以筆記中會出現一些錯誤。下列選項是小李筆記中關於強制訪問控制模型的內容,其中出現錯誤的選項是()","options":["強制訪問控制是指主體和客體都有一個固定的安全屬性,系統用該安全屬性來決定一個主體是否可以訪問某個客體","安全屬性是強制性的規定,它由安全管理員或操作系統根據限定的規則確定,不能隨意修改","系統通過比較客體和主體的安全屬性來決定主體是否可以訪問客體","它是一種對單個用戶執行訪問控制的過程控制措施"],"answer":"D","category":"安全模型與訪問控制","sources":[{"bank":"rev4","n":12}]},{"id":995,"stem":"下圖排序你認為那個是正確的:","options":["1是主體,2是客體,3是實施,4是決策","1是客體,2是主體3是決策,4是實施","1實施,2是客體3是主題,4是決策","1是主體,2是實施3是客體,4是決策"],"answer":"D","category":"安全模型與訪問控制","sources":[{"bank":"rev4","n":13}]},{"id":996,"stem":"模糊測試,也稱Fuzz測試,是一種通過提供非預期的輸入並監視異常結果來發現軟件故障的方法。下面描述正確的是()","options":["模糊測試本質上屬於黑盒測試","模糊測試本質上屬於白盒測試","模糊測試有時屬於黑盒測試,有時屬於白盒測試,取決於其使用的測試方法","模糊測試既不屬於黑盒測試,也不屬於白盒測試"],"answer":"A","category":"惡意代碼與漏洞","sources":[{"bank":"rev4","n":15}]},{"id":997,"stem":"下圖是安全測試人員連接某遠程主機時的操作界面,請您仔細分析該圖,下面分析推理正確的是()","options":["安全測試人員鏈接了遠程服務器的220端口","安全測試人員的本地操作系統是Linux","遠程服務器開啓了FTP服務,使用的服務器軟件名FTP Server","遠程服務器的操作系統是windows系統"],"answer":"D","category":"操作系統與主機安全","sources":[{"bank":"rev4","n":17}]},{"id":998,"stem":"小華在某電子商務公司工作,某天他在查看信息系統設計文檔時,發現其中標註該信息系統的RPO(恢復點目標)指標為3小時。請問這意味着()","options":["該信息系統發生重大安全事件後,工作人員應在3小時內到位,完成問題定位和應急處理工作","該信息系統發生重大安全事件後,工作人員應在3小時內完整應急處理工作並恢復對外運行","該信息系統發生重大安全事件後,工作人員在完成處置和災難恢復工作後,系統至少能提供3小時的緊急業務服務能力","該信息系統發生重大安全事件後,工作人員在完成處置和災難恢復工作後,系統至多能丟失3小時的業務數據"],"answer":"D","category":"應急與災難恢復","sources":[{"bank":"rev4","n":19}]},{"id":999,"stem":"陳工學習了信息安全風險的有關知識,瞭解到信息安全風險的構成過程,有五個方面:起源、方式、途徑、受體和後果,他畫了下面這張圖來描述信息安全風險的構成過程,圖中空白處應填寫?","options":["信息載體","措施","脆弱性","風險評估"],"answer":"C","category":"風險管理","sources":[{"bank":"rev4","n":20}]},{"id":1000,"stem":"風險分析師風險評估工作的一個重要內容,GB/T 20984-2007在資料性附錄中給出了一種矩陣法來計算信息安全風險大小,如下圖所示,圖中括號應填那個?","options":["安全資產價值大小等級","脆弱性嚴重程度等級","安全風險隱患嚴重等級","安全事件造成損失大小"],"answer":"D","category":"風險管理","sources":[{"bank":"rev4","n":23}]},{"id":1001,"stem":"關於補丁安裝時應注意的問題,以下說法正確的是","options":["在補丁安裝部署之前不需要進行測試,因為補丁發佈之前廠商已經經過了測試","補丁的獲取有嚴格的標準,必須在廠商的官網上獲取","信息系統打補丁時需要做好備份和相應的應急措施","補丁安裝部署時關閉和重啓系統不會產生影響"],"answer":"C","category":"操作系統與主機安全","sources":[{"bank":"rev4","n":25}]},{"id":1002,"stem":"某電子商務網站架構設計時,為了避免數據誤操作,在管理員進行訂單刪除時,需要由審覈員進行審覈後該刪除操作才能生效,這種設計是遵循了發下哪個原則","options":["權限分離原則","最小的特權原則","保護最薄弱環節的原則","縱深防禦的原則"],"answer":"A","category":"操作系統與主機安全","sources":[{"bank":"rev4","n":26}]},{"id":1003,"stem":"實體身份鑑別的方法多種多樣,且隨着技術的進步,鑑別方法的強度不斷提高,常見的方法有指令鑑別、令牌鑑別、指紋鑑別等。如圖,小王作為合法用戶使用自己的賬戶進行支付、轉賬等操作。這說法屬於下列選項中的()","options":["實體所知的鑑別方法","實體所有的鑑別方法","實體特徵的鑑別方法","實體所見的鑑別方法"],"answer":"C","category":"操作系統與主機安全","sources":[{"bank":"rev4","n":27}]},{"id":1004,"stem":"定量風險分析是從財務數字上對安全風險進行評估,得出可以量化的風險分析結果,準確度量風險的可以性和損失量。小王採用該方法來為單位機房計算火災風險大小,假設單位機房的總價值為200萬元人民幣,暴露係數(ExposureFactor,EF)是x,年度發生率(Annual izod Eato of Occurrence,ARO)為0.1,而小王計算的年度預期損失(Annual izod Loss Erpectancy,ALE)值為5萬元人民幣,由此,x值應該是","options":["2.5%","25%","5%","50%"],"answer":"B","category":"風險管理","sources":[{"bank":"rev4","n":28}]},{"id":1005,"stem":"關於Kerberos認證協議,以下說法錯誤的是:","options":["只要用戶拿到了認證服務器(AS)發送的票據許可票據(TGT)並且該TGT沒有過期,就可以使用該TGT通過票據授權服務器(TGS)完成到任一個服務器的認證而不必重新輸入密碼","認證服務器(AS)和票據授權服務器(TGS)是集中式管理,容易形成瓶頸,系統的性能和安全也嚴重依賴於AS和TGS的性能和安全","該協議通過用戶獲得票據許可票據、用戶獲得服務許可票據、用戶獲得服務三個階段,僅支持服務器對用戶的單向認證","該協議是一種基於對稱密碼算法的網絡認證協議,隨用戶數量增加,密鑰管理較複雜"],"answer":"C","category":"操作系統與主機安全","sources":[{"bank":"rev4","n":29}]},{"id":1006,"stem":"kerberos協議是常用的集中訪問控制協議,通過可信第三的認證服務,減輕應用Kerberos的運行環境由祕鑰分發中心(KDC)、應用服務器和客戶端三個部分組成,認證服務器AS和票據授權服務器","options":["1——2——3","3——2——1","2——1——3","3——1——2"],"answer":"D","category":"操作系統與主機安全","sources":[{"bank":"rev4","n":30}]},{"id":1007,"stem":"某單位系統管理員對組織內核心資源的訪問制定訪問策略,針對每個用戶指明能夠訪問的資源,對於不在指定資源列表中的對象不允許訪問。該訪問控制策略屬於以下哪一種:","options":["強制訪問控制","基於角色的訪問控制","自主訪問控制","基於任務的訪問控制"],"answer":"C","category":"操作系統與主機安全","sources":[{"bank":"rev4","n":31}]},{"id":1008,"stem":"根據Bell-LaPedula模型安全策略,下圖中寫和讀操作正確的是( )","options":["可讀可寫","可讀不可寫","可寫不可讀","不可讀不可寫"],"answer":"B","category":"工程與管理","sources":[{"bank":"rev4","n":33},{"bank":"rev4","n":98}]},{"id":1009,"stem":"張主任的計算機使用Windows7操作系統,他常登陸的用戶名為zhang,張主任給他個人文件夾設置了權限為只有zhang這個用戶有權訪問這個目錄,管理員在某次維護中無意將zhang這個用戶刪除了,隨後又重新建了一個用戶名為zhang,張主任使用zhang這個用戶登錄系統後,發現無法訪問他原來的個人文件夾,原因是:","options":["任何一個新建用戶都需要經過授權才能訪問系統中的文件","Windows7不認為新建立的用戶zhang與原來用戶zhang是同一個用戶,因此無權訪問","用戶被刪除後,該用戶創建的文件夾也會自動刪除,新建用戶找不到原來用戶的文件夾,因此無法訪問","新建的用戶zhang會繼承原來用戶的權限,之所以無權訪問是因為文件夾經過了加密"],"answer":"B","category":"操作系統與主機安全","sources":[{"bank":"rev4","n":35},{"bank":"rev6","n":61}]},{"id":1010,"stem":"ISO27002(Information technology-Security techniques0Codeofpratice for inforeation security managcacnt)是重要的信息安全管理標準之一,下圖是關於其演進變化示意圖,圖中括號空白處應填寫()","options":["S 7799.1.3","ISO 17799","S/NZS 4630","NIST SP 800-37"],"answer":"B","category":"法規與標準","sources":[{"bank":"rev4","n":40}]},{"id":1011,"stem":"自主訪問控制模型(DAC)的訪問控制關係可以用訪問控制(ACL)來表示,該ACL利用在客體上附加一個主體明細表的方法來表示訪問控制矩陣,通常使用由客體指向的鏈表來存儲相關數據。下面選項中說法正確的是()","options":["ACL是Bell-LaPadula模型的一種具體實現","ACL在刪除用戶時,去除該用戶所有的訪問權限比較方便","ACL對於統計某個主體能訪問哪些客體比較方便","ACL在增加客體時,增加相關的訪問控制權限較為簡單"],"answer":"D","category":"操作系統與主機安全","sources":[{"bank":"rev4","n":41},{"bank":"rev6","n":44}]},{"id":1012,"stem":"某學員在學習國家標準《信息系統安全保障評估框架第一部分:簡介和一般模型》(GB/T 20274.1-2006)後,繪製了一張簡化的信息系統安全保障模型圖,如下所示。請為圖中括號空白處選擇合適的選項()","options":["安全保障(方針和組織)","安全防護(技術和管理)","深度防禦(策略、防護、檢測、響應)","保障要素(管理、工程、技術、人員)"],"answer":"D","category":"工程與管理","sources":[{"bank":"rev4","n":49}]},{"id":1013,"stem":"Linux系統的安全設置中,對文件的權限操作是一項關鍵操作。通過對文件權限的設置,能夠保障不同用戶的個人隱私和系統安全。文件fib.c的文件屬性信息如下圖所示,小張想要修改其文件權限,為文件主增加執行權限,並刪除組外其他用戶的寫權限,那麼以下操作中正確的是()","options":["#chmod u+x, a-w fib.c","#chmod ug+x, o-w fib.c","#chmod 764 fib.c","#chmod 467 fib.c"],"answer":"C","category":"操作系統與主機安全","sources":[{"bank":"rev4","n":52}]},{"id":1014,"stem":"如圖一所示:主機A和主機B需要通過IPSec隧道模式保護二者之間的通信流量,這種情況下IPSec的處理通常發生在哪二個設備中?","options":["主機A和安全網關1;","主機B和安全網關2;","主機A和主機B中;","安全網關1和安全網關2中;"],"answer":"D","category":"網絡安全","sources":[{"bank":"rev4","n":60}]},{"id":1015,"stem":"公鑰基礎設施,引入數字證書的概念,用來表示用戶的身份,下圖簡要的描述了終端實體(用戶),從認證權威機構CA申請、撤銷和更新數字證書的流程,請為中間框空白處選擇合適的選項()","options":["證書庫","RA","OCSP","RL庫"],"answer":"B","category":"密碼與加密","sources":[{"bank":"rev4","n":67}]},{"id":1016,"stem":"社會工程學定位在計算機信息安全工作鏈的一個最脆弱的環節,即“人”這個環節上。這些社會工程黑客在某黑客大會上成功攻入世界五百強公司,其中一名自稱是CSO雜誌做安全調查,半小時內,攻擊者選擇了在公司工作兩個月安全工程部門的合約僱員,在詢問關於工作滿意度以及食堂食物質量問題後,僱員開始透露其他信息,包括:操作系統、服務包、殺毒軟件、電子郵件及瀏覽器。為對抗此類信息收集和分析,公司需要做的是()","options":["通過信息安全培訓,使相關信息發佈人員瞭解信息收集風險,發佈信息最小化原則","減少系統對外服務的端口數量,修改服務旗標","關閉不必要的服務,部署防火牆、IDS等措施","系統安全管理員使用漏洞掃描軟件
