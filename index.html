對系統進行安全審計"],"answer":"A","category":"工程與管理","sources":[{"bank":"rev4","n":70}]},{"id":1017,"stem":"基於TCP的主機在進行一次TCP連接時簡要進行三次握手,請求通信的主機A要與另一臺主機B建立連接時,A需要先發一個SYN數據包向B主機提出連接請示,B收到後,回覆一個ACK/SYN確認請示給A主機,然後A再次回應ACK數據包,確認連接請求。攻擊通過僞造帶有虛假源地址的SYN包給目標主機,使目標主機發送的ACK/SYN包得不到確認。一般情況下,目標主機會等一段時間後纔會放棄這個連接等待。因此大量虛假SYN包同時發送到目標主機時,目標主機上就會有大量的連接請示等待確認,當這些未釋放的連接請示數量超過目標主機的資源限制時。正常的連接請示就不能被目標主機接受,這種SYN Flood攻擊屬於()","options":["拒絕服務攻擊","分佈式拒絕服務攻擊","緩衝區溢出攻擊","SQL注入攻擊"],"answer":"A","category":"網絡安全","sources":[{"bank":"rev4","n":71}]},{"id":1018,"stem":"信息安全是國家安全的重要組成部分,綜合研究當前世界各國信息安全保障工作,總結錯誤的是()","options":["各國普遍將與國家安全、社會穩定和民生密切相關的關鍵基礎設施作為信息安全保障的重點","各國普遍重視戰略規劃工作,逐步發佈網絡安全戰略、政策評估報告、推進計劃等文件","各國普遍加強國際交流與對話,均同意建立一致的安全保障系統,強化各國安全系統互通","各國普遍積極推動信息安全立法和標準規範建設,重視應急響應、安全監管和安全測評"],"answer":"C","category":"法規與標準","sources":[{"bank":"rev4","n":72}]},{"id":1019,"stem":"風險要素識別是風險評估實施過程中的一個重要步驟,小李將風險要素識別的主要過程使用圖形來表示,如下圖所示,請為圖中空白框處選擇一個最合適的選項()。","options":["識別面臨的風險並賦值","識別存在的脆弱性並賦值","制定安全措施實施計劃","檢查安全措施有效性"],"answer":"B","category":"風險管理","sources":[{"bank":"rev4","n":80}]},{"id":1020,"stem":"小李去參加單位組織的信息安全培訓後,他把自己對管理信息管理體系ISMS的理解畫了一張圖,但是他還存在一個空白處未填寫,請幫他選擇一個合適的選項()","options":["監控和反饋ISMS","批准和監督ISMS","監視和評審ISMS","溝通和諮詢ISMS"],"answer":"C","category":"工程與管理","sources":[{"bank":"rev4","n":83}]},{"id":1021,"stem":"下圖是某單位對其主網站一天流量的監測圖,如果該網站當天17:00到20:00之間受到攻擊,則從圖中數據分析,這種攻擊可能屬於下面什麼攻擊。","options":["跨站腳本攻擊","TCP會話劫持","IP欺騙攻擊","拒絕服務攻擊"],"answer":"D","category":"網絡安全","sources":[{"bank":"rev4","n":85}]},{"id":1022,"stem":"小李是某公司系統規劃師,某天他針對公司信息系統的現狀,繪製了一張系統安全建設規劃圖,如下圖所示。請問這個圖形是依據下面哪個模型來繪製的( )","options":["PDR","PPDR","PDCA","IATF"],"answer":"B","category":"法規與標準","sources":[{"bank":"rev4","n":96}]},{"id":1023,"stem":"關於微軟的SDL原則,棄用不安全的函數屬於哪個價格段?","options":["規劃","設計","實現","測試"],"answer":"C","category":"工程與管理","sources":[{"bank":"rev5","n":1}]},{"id":1024,"stem":"優秀源代碼審覈工具有哪些特點( A )\n1安全性 2多平臺性 3可擴民性 4知識性 5集成性","options":["12345","234","1234","23"],"answer":"A","category":"綜合","sources":[{"bank":"rev5","n":2}]},{"i 是否適用於不同的瀏覽器","符合最新HTML版本的頁面能否在瀏覽器中正確顯示"],"answer":"A","category":"綜合","sources":[{"bank":"rev5","n":10}]},{"id":1032,"stem":"下列關於測試方法的敘述中不正確的是()","options":["從某種角度上講,白盒測試與墨盒測試都屬於動態測試","功能測試屬於黑盒測試","結構測試屬於白盒測試","對功能的測試通常是要考慮程序的內部結構的"],"answer":"D","category":"綜合","sources":[{"bank":"rev5","n":11}]},{"id":1033,"stem":"小王學習了災難備份的相關知識,瞭解到常用的數據備份方式包括完全備份、增量備\n份、差量備份,為了鞏固所學知識,小王對這種備份方式進行對比,其中在數據恢復速\n度方面三種備份方式由快到慢的順序是()","options":["完全備份、增量備份、差量備份","完全備份、差量備份、增量備份","增量備份、差量備份、完全備份","差量備份、增量備份、完全備份"],"answer":"B","category":"應急與災難恢復","sources":[{"bank":"rev5","n":12},{"bank":"rev6","n":84}]},{"id":1034,"stem":"以下哪一項不屬於Web應用軟件表示層測試關注的範疇()。","options":["排版結構的測試","數據完整性測試","客戶端兼容性的測試","鏈接結構的測試"],"answer":"B","category":"安全模型與訪問控制","sources":[{"bank":"rev5","n":13}]},{"id":1035,"stem":"以下哪些不是《國家網絡空間安全戰略》中闡述的我國網絡空間當前任務?","options":["捍衛網絡空間主權","保護關鍵信息基礎設施","提升網絡空間防護能力","阻斷與國外網絡連接"],"answer":"D","category":"網絡安全","sources":[{"bank":"rev5","n":15}]},{"id":1036,"stem":"在信息安全保障工作中人才是非常重要的因素,近年來,我國一直調試重視我國信自\n成安全人才隊伍培養建設。在以下關於我國關於人才培養工作的描述中,錯誤的是()\n。","options":["在《中胃信息化領導小組關於加強信息安全保障工作的中意見》(中辦發[2003]27號) 中,針對信息安全人才建設與培養工作提出了“加快網絡空間安全人才培養增強全民信息 安全意識”的指導精神","2015年,為加快網絡安全高層次人才培養,經報國務院學位委員會 批准,國務院學位委員會、教育部決定“工學”門類下增設“網絡空間安全“一級學科,這 對於我國網絡信息安全人才成體系化、規模化、系統培養到積極的推到作用","經過十餘年的發展,我國信息安全人才培養已經成熟和體系化,每年培養的信息全從 人員的數量較多 ,能同社會實際需求相匹配;同時,高效信息安全專業畢業人才的合能力要求高、知識 更全面,因面社會化培養重點放在非安全專業人才培養上","除正規大學教育外,我國信息安全非學歷教育已基本形成了以各種認證為核心,輔以 各種職業技能培訓的信息安全人才培訓休系,包括“註冊信息安全專業人員(CISP)”資質 認證和一些大型企業的信息安全資質認證"],"answer":"C","category":"工程與管理","sources":[{"bank":"rev5","n":16}]},{"id":1037,"stem":"王明買了一個新的藍牙耳機,但王明聽說使用藍牙設備有一定的安全威脅,於是王明\n找到對藍牙技術有所瞭解的王紅,希望王紅能夠給自己一點建議,以下哪一條建議不可\n取()","options":["在選擇使用藍牙設備時,應考慮設備的技術實現及設置是否具備防止上述安全威脅的 能力","選擇使用工能合適的設備而不是功能儘可能多的設備、儘量關閉不使用的服務及功能","如果藍牙設備丟失,最好不要做任何操作","在配對時使用隨機生成的密鑰、不使用時設置不可被其他藍牙設備發現"],"answer":"C","category":"風險管理","sources":[{"bank":"rev5","n":17}]},{"id":1038,"stem":"某公司正在進行IT系統災難恢復測試,下列問題中哪個最應該引起關注()","options":["由於有限的測試時間窗,僅僅測試了最必的系統,其他系統在今年的剩餘時間裏陸續 獨測試","在測試的過程中,有些備份系統有缺陷或者不 唯一性、持久性、兼容性、互操作性、動態更新","DOI命名規則中前綴和後綴兩部之間用“ ; ”分開","DOI的體現形式只有網絡域名和字符碼兩種形式"],"answer":"B","category":"工程與管理","sources":[{"bank":"rev5","n":42}]},{"id":1061,"stem":"攻擊者通過向網絡或目標主機發送僞造的ARP應答報文,修改目標計算機上ARP緩存,形\n成一個錯誤的IP地址<-\n>MAC地址映射,這個錯誤的映射在目標主機在需要發送數據時封裝錯誤的MAC地址。欺騙\n攻擊過程如下圖所示,其屬於欺騙攻擊中的哪一種欺騙攻擊的過程()","options":["RP","IP","NS","SN"],"answer":"A","category":"網絡安全","sources":[{"bank":"rev5","n":44}]},{"id":1062,"stem":"組織應依照已確定的訪問控制策略限制對信息和(\n)功能的訪間。對訪間的限制要基於各個業務應用要求,訪問控制策略還要與組織的訪問\n策略一致。應建立安全登錄規程控制實現對系統和應用的訪問。宜選擇合適的身份驗證\n技術以驗證用戶身份。在需要強認證和()時,宜使用如加密、智能卡、令牌或生物手段等\n替代密碼的身份驗證方法。應建立交互式的口令管理系統,並確保使用優質的口令。對於\n可能覆蓋系統和應用的控制措施的實用工具和程序的使用,應加以限制並()。對程序源代\n碼和相關事項(例如設計、說明書、驗證計劃和確認計劃\n的訪問宜嚴格控制,以防引入非授權功能、避免無意識的變更和維持有價值的知識產權\n的()。對於程序源代碼的保存,可以通過這種代碼的中央存儲控制來實現,更好的是放\n在( )中","options":["應用系統:身份驗證:嚴格控制;保密性:源程序庫","身份驗證;應用系統;嚴格控制:保密性;源程序庫","應用系統;嚴格控制:身份驗證;保密性;源程序庫","應用系統;保密性;身份驗證;嚴格控制;源程序庫"],"answer":"A","category":"工程與管理","sources":[{"bank":"rev5","n":45}]},{"id":1063,"stem":"OSI模型把網絡通信工作分為七層,如圖所示,0SI模型的每一層只與相鄰的上下兩層直接\n通信,當發送進程需要發送信息時,它把數據交給應用層。應用層對數據進行加工處理後\n,傳給表示層。再經過一次加工後,數據被到會話層,這一過程一直繼續到物理層接收數據\n後進行實際的傳輸,每一次的加工又稱為數據封裝。其中IP層對應OSI模型中的那一層()","options":["應用層","傳輸層","應用層","網絡層"],"answer":"D","category":"網絡安全","sources":[{"bank":"rev5","n":46}]},{"id":1064,"stem":"以下關於軟件安全問題對應關係錯誤的是?()","options":["缺點( Defect)軟件實現和設計上的弱點","缺陷(Bug)-實現級上的軟件問題","瑕疵(Flaw)-種更深層次、設計層面的問題","故障( Failure)- 由於軟件存在缺點造成的一種外部表現,是靜態的、程序執行過程中出現的行為表現"],"answer":"C","category":"惡意代碼與漏洞","sources":[{"bank":"rev5","n":47}]},{"id":1065,"stem":"自主訪問控制(DAC)是應用很廣泛的訪問控制方法,常用於多種商業系統中。以下對D\nAC模型的理解中,存在錯誤的是()","options":["在DAC模型中,資源的所有者可以規定誰有權訪問它們的資源","DAC是一種對單個用戶執行訪問控制的過程和措施","DAC可為用戶提供靈活調整的安全策略，具有較好的易用性和可擴展性，可以抵禦特洛伊木馬的攻擊","在DAC中,具有某種訪問能力的主體能夠自主地將訪問權的某個子集授予其它主體"],"answer":"C","category":"安全模型與訪問控制","sources":[{"bank":"rev5","n":48}]},{"id":1066,"stem":"惡意代碼經過20多年的發展,破壞性、種類和感染性都得到增強。隨着計算機的網絡\n化程度逐步提高,網絡播的惡意代碼對人們日常生活影響越來越大。小李發現在自己的電\n腦查出病毒的過程中,防病毒軟件通過對有毒件的檢測,將軟件行為與惡意代碼行為模型\n進行匹配,判斷出該軟件存在惡意代碼,這種方式屬於( )","options":["簡單運行","行為檢測","特徵數據匹配","特徵碼掃描"],"answer":"B","category":"惡意代碼與漏洞","sources":[{"bank":"rev5","n":49}]},{"id":1067,"stem":"信息安全風險值應該是以下哪些因素的函數?( )","options":["信息資產的價值、面臨的威脅以及自身存在的脆弱性","病毒、黑客、漏洞等","保密信息如國家祕密、商業祕密等","網絡、系統、應用的複雜程度"],"answer":"A","category":"風險管理","sources":[{"bank":"rev5","n":50}]},{"id":1068,"stem":"管理層應該表現對 ( ),程序和控制措施的支持,\n並以身作則。管理職責要確保僱員和承包方人員都了(\n)角色和職責,並遵守相應的條款和條件。組織要建立信息安全意識計劃,並定期組織信息\n安全()。組織立正式的(),確保正確和公平的對待被懷疑安全違規的僱員。紀律處理過程\n要規定(),考慮例如違規的性質、重要性及對於業務的影響等因素,以及相關法律、業務\n合同和其他因素。","options":["信息安全:信息安全政策:教育和培訓;紀律處理過程:分級的響應","信息安全政策:信息安全:教育和培訓:紀律處理過程:分級的響應","信息安全政策:教育和培訓:信息安全;紀律處理過程:分級的響應","信息安全政策:紀律處理過程信息安全;教育和培訓:分級的響應"],"answer":"B","category":"工程與管理","sources":[{"bank":"rev5","n":51}]},{"id":1069,"stem":"近幾年,無線通信技術迅猛發展,廣泛應用於各個領域。而無線信道是一個開放性信道\n,它在賦予無線用戶通信自由的同時也給無線通信網絡帶來一些不安全因素,下列選項中\n,對無線通信技術的安全特點描述正確的是()","options":["無線信道是一個開放信道,任何具有適當無線設備的人均可以通過搭線竊聽而獲得網絡 通信內容","通過傳輸流分析,攻擊者可以掌握精確的通信內容","對於無線局域網絡和無線個人區域網絡來說,它們的通信內容更容易被竊聽","羣通信方式可以防止網絡外部人員獲取網絡內部通信內容"],"answer":"C","category":"網絡安全","sources":[{"bank":"rev5","n":52}]},{"id":1070,"stem":"軟件的可維護性可用七個質量特性來衡量,分別是:可理解性、可測試性、可修改性、\n可靠性、可移植性、可使用性和效率對於不同類型的維護,這些側重點也是不同的,在可\n維護性的特性中相互促進的是( )","options":["可理解性和可測試性","效率和可移植性","效率和可修改性","效率和可理解性"],"answer":"A","category":"綜合","sources":[{"bank":"rev5","n":53}]},{"id":1071,"stem":"下列選項中對信息系統審計概念的描述中不正確的是( )","options":["信息系統審計,也可稱作IT審計或信息系統控制審計","信息系統審計是一個獲取並評價證據的過程,審計對象是信息系統相關控制,審計目標 則是判斷信息系統是否能夠保證其安全性、可靠性、經濟性以及數據的真實性、完整性 等相關屬性","信息系統審計是單一的概念,是對會計信息系統的安全性、有效性進行檢查","從信息系統審計內容上看,可以將信息系統審計分為不同專項審計,例如安全審計、項 目合規審計、績效審計等。"],"answer":"C","category":"風險管理","sources":[{"bank":"rev5","n":54},{"bank":"rev6","n":67}]},{"id":1072,"stem":"隨着互聯網的迅猛發展、WEB信息的增加,用戶要在信息海洋裏查找自己所需的信息,就像\n大海撈針一樣,\n索引擎技術恰好解決了這一難題。以下關於搜索引擎技術特點的描述中錯誤的是( )","options":["搜索引擎以一定的策略在Web系統中搜索和發現信息","搜索引擎可以分為目錄導航式與網頁索引式","搜索器在 Internet上逐個訪問Web站點,並建立一個網站的關鍵字列表","索引器功能是理解搜索器獲取的信息, 向用戶顯示查詢結果"],"answer":"D","category":"工程與管理","sources":[{"bank":"rev5","n":55}]},{"id":1073,"stem":"“規劃(Plan)-實施(Do)-檢查( Check)-處置(Act)”(PDCA過程)又叫(\n),是管理學中的一個通用模型,最早由( )於1930年構想,後來被美國質量管理專家(\n)博士在1950年再度挖掘出來,並加以廣泛宣傳和運用於持續改善產品質量的過程。PDCA\n循環就是按照“規劃、實施、檢查、處置”的順序進行質量管理,並且循環不止地進行下去\n的( ),建立符合國際標準ISO 9001的質量管理體系即是一個典型的PDCA過程,建立IS0\n14001環境管理體系、IS0 20000I服務 ( )也是一個類似的過程。","options":["質量環; 休哈特 ;戴明; 管理體系; 科學程序","質量環; 戴明; 休哈特; 管理體系; 科學程序","質量環: 戴明; 休哈特; 科學程序; 管理體系","質量環; 休哈特 ;戴明; 科學程序; 管理體系"],"answer":"D","category":"工程與管理","sources":[{"bank":"rev5","n":56}]},{"id":1074,"stem":"ZigBee主要的信息安全服務為( )、 ( )、( )、(\n)。訪問控制使設備能夠選擇其願意與之通信的其他設備。為了實現訪問控制,設備必須\n在ACL中維護一個(\n),表明它願意接受來自這些設備的數據。數據加密使用的密鑰可能是一組設備共享,或者\n兩兩共享。數據加密服務於 Beacon、\ncommand以及數據載荷。數據()主要是利用消息完整性校驗碼保證沒有密鑰的節點不會修\n改傳輸中的消息,進一步確認消息來自一個知道( )的節點","options":["訪問控制、數據加密、數據完整性、序列抗重播保護;設備列表;完整性:密鑰","訪問控制、加密、完整性、序列抗重播保護;設備列表;完整性;密鑰","訪問控制、加密、數據完整性、序列抗重播保護;列表;完整性;密鑰","訪問控制、數據加密、數據完整性、序列抗重播;列表;完整性;密鑰"],"answer":"A","category":"密碼與加密","sources":[{"bank":"rev5","n":57}]},{"id":1075,"stem":"在一個網絡中,當擁有的網絡地址容量不夠多,或普通終端計算機沒有必要分配靜態IP\n地址時,可以採用通過在計算機連接到網絡時,每次為其臨時在IP地址池中選擇一個IP地\n址並分配的方式為( )","options":["動態分配IP地址","靜態分配IP地址","網絡地址轉換分配地址","手動分配"],"answer":"A","category":"網絡安全","sources":[{"bank":"rev5","n":58}]},{"id":1076,"stem":"信息安全風險管理是基於( )的信息安全管理,也就是,始終以(\n)為主線進行信息安全的管理。應根據實際(\n)的不同來理解信息安全風險管理的側重點,即( )選擇的範圍和對象重點應有所不同。","options":["風險; 風險; 信息系統: 風險管理","風險; 風險; 風險管理; 信息系統","風險管理; 信息系統; 風險;風險","風險管理; 風險; 風險 ;信息系統"],"answer":"A","category":"風險管理","sources":[{"bank":"rev5","n":59}]},{"id":1077,"stem":"數據鏈路層負責監督相鄰網絡節點的信息流動,用檢錯或糾錯技術來確保正確的傳輸\n,確保解決該層的流量控制問題。數據鏈路層的數據單元是( )","options":["報文","比特流","幀","包"],"answer":"C","category":"網絡安全","sources":[{"bank":"rev5","n":61}]},{"id":1078,"stem":"以下對於標準化特點的描述哪項是錯誤的?","options":["標準化的對象是共同的、可重複的事物。不是孤立的一件事、一個事物","標準化必須是靜態的,相對科技的進步和社會的發展不能發現變化","標準化的相對性,原有標準隨着社會發展和環境變化,需要更新","標準化的效益,通過應用體現經濟和社會效益,否則就沒必要"],"answer":"B","category":"法規與標準","sources":[{"bank":"rev5","n":62}]},{"id":1079,"stem":"以下哪個是國際信息安全標準化組織的簡稱?","options":["NSI","ISO","IEEE","NIST"],"answer":"B","category":"法規與標準","sources":[{"bank":"rev5","n":63}]},{"id":1080,"stem":"某公司財務服務器受到攻擊被攻擊者刪除了所有用戶數據,包括系統日誌,公司網絡管\n理員在瞭解情況後,給出了一些解決措施建議,作為信息安全主管,你必須指出不恰當的\n操作並阻止此次操作()","options":["由於單位並無專業網絡安全應急人員,網絡管理員希望出具授權書委託某網絡安全公司 技術人員對本次攻擊進行取證","由於公司缺乏備用硬盤,因此計劃將恢復服務器上被刪除的日誌文件進行本地恢復後再 提取出來進行取證","由於公司缺乏備用硬盤,因此網絡管理員申請採購與服務器硬盤同一型號的硬盤用於存 儲恢復出來的數據","由於公司並無專業網絡安全應急人員,因此由網絡管理員負責此次事件的應急協調相關 工作"],"answer":"B","category":"應急與災難恢復","sources":[{"bank":"rev5","n":65}]},{"id":1081,"stem":"在你對遠端計算機進行ping操作,不同操作系統回應的數據包中初始TTL值是不同的,\n TTL是IP協議包中的一個值,它告訴網絡,數據包在網絡中的時間是否太長而應被丟棄。\n(簡而言之,你可以通過TTL值推算一下下列數據包已經通過了多少個路由器)根據回應的\n數據包中的TL值,可以大致判斷( )","options":["內存容量","操作系統的類型","對方物理位置","對方的MAC地址"],"answer":"B","category":"網絡安全","sources":[{"bank":"rev5","n":66}]},{"id":1082,"stem":"(\n)攻擊是建立在人性“弱點”利用基礎上的攻擊,大部分的社會工程學攻擊都是經過(\n)才能實施成功的。即使是最簡單的“直接攻擊”也需要進行 (\n)。如果希望受害者接受攻擊者所( ),攻擊者就必須具備這個身份需要的 ( )","options":["社會工程學: 精心策劃; 前期的準備; 僞裝的身份; 一些特徵","精心策劃; 社會工程學; 前期的準備; 僞裝的身份; 一些特徵","精心策劃; 社會工程學; 僞裝的身份; 前期的準備: 一些特徵","社會工程學; 僞裝的身份; 精心策劃; 前期的準備; 一些特徵"],"answer":"A","category":"工程與管理","sources":[{"bank":"rev5","n":67}]},{"id":1083,"stem":"內容安全是我國信息安全保障工作中的一個重要環節,互聯網所帶來的數字資源大爆發\n是使得內容安全越 越受到重視,以下哪個描述不屬於內容安全的範疇 ( )","options":["某雜誌在線網站建立內容正版化審覈團隊,對向網站投稿的內容進行版權審覈,確保無 侵犯版權行為後才能在網站好進行發佈","某網站採取了技術措施,限制對同一P地址對網站的併發連接,避免爬蟲通過大量的訪問 採集網站發佈數據","某論壇根據相關法律要求, 進行了大量的關鍵詞過濾, 使用戶無法發佈包含被過濾關鍵詞的相關內容","某論壇根據國家相關法律要求,為了保證用戶信息泄露,對所有用戶信息,包括用戶名、 密碼、身份證號等都進行了加密的存儲"],"answer":"D","category":"法規與標準","sources":[{"bank":"rev5","n":68}]},{"id":1084,"stem":"惡意軟件抗分析技術的發展,惡意軟件廣泛使用了加殼、加密、混淆等抗分析技術,\n對惡意軟件的分析難度越來越大。對惡意代碼分析的研究已經成為信息安全領域的一個\n研究熱點。小趙通過查閱發現一些安全軟件的沙箱功能\n實際上是虛擬化技術的應用,是動態分析中廣泛採用的一種技術。小趙列出了一些動態分\n析的知識,其中錯誤的是( )","options":["動態分析是指在虛擬運行環境中,使用測試及監控軟件,檢測惡意代碼行為,分析其執 行流程及處理數據的狀態,從而判斷惡意代碼的性質,並掌握其行為特點","動態分析針對性強,並且具有較高的準確性,但由於其分析過程中覆蓋的執行路徑有限 ,分析的完整性難以保證","動態分析通過對其二進制文件的分析,獲得惡意代碼的基本結構和特徵,瞭解其工作方 式和機制","動態分析通過監控系統進程、文件和註冊表等方面出現的非正常操作和變化,可以對惡 意代碼非法行為進行分析"],"answer":"C","category":"惡意代碼與漏洞","sources":[{"bank":"rev5","n":69}]},{"id":1085,"stem":"安全評估技術採用()這一工具,它是一種能夠自動檢測遠程或本地主機和網絡安全性\n弱點的程序。","options":["安全掃描器","安全掃描儀","自動掃描器","自動掃描儀"],"answer":"A","category":"網絡安全","sources":[{"bank":"rev5","n":70}]},{"id":1086,"stem":"小張在一不知名的網站上下載了魯大師並進行了安裝,電腦安全軟件提示該軟件有惡\n意捆綁,小張驚出一身汗,因為他知道惡意代碼將隨之進入系統後會對他的系統信息安全\n造成極大的威脅,那麼惡意代碼的軟件部署常的實現方式不包括( )","options":["攻擊者在獲得系統的上傳權限後,將惡意代碼部署到目標系統","惡意代碼自身就是軟件的一部分,隨軟件部署傳播","內嵌在軟件中,當文件被執行時進入目標系統","惡意代碼通過網上激活"],"answer":"D","category":"惡意代碼與漏洞","sources":[{"bank":"rev5","n":71}]},{"id":1087,"stem":"操作系統是作為一個支撐軟件,使得你的程序或別的應用系統在上面正常運行的一個\n環境。操作系統提供了多的管理功能,主要是管理系統的軟件資源和硬件資源。操作系統\n軟件自身的不安全性,系統開發設計的不周而下的破綻,都給網絡安全留下隱患。某公司\n的網絡維護師為實現該公司操作系統的安全目標,按書中所學建立了\n應的安全機制,這些機制不包括()","options":["標識與鑑別","訪問控制","權限管理","網絡雲盤訪問保護"],"answer":"D","category":"網絡安全","sources":[{"bank":"rev5","n":72}]},{"id":1088,"stem":"信息安全應急響應,是指一個組織為了應對各種安全意外事件的發生所採取的防範措施,\n既包括預防性措施也包括事件發生後的應對措施。應急響應方法和過程並不是唯一的,在\n下面的應急響應管理流程圖中,空白方填寫正確的選項是( )","options":["培訓階段","文檔階段","報告階段","檢測階段"],"answer":"D","category":"應急與災難恢復","sources":[{"bank":"rev5","n":73},{"bank":"rev6","n":69}]},{"id":1089,"stem":"即時通訊安全是移動互聯網時代每個用戶和組織機構都應該認真考慮的問題,特別對\n於使用即時通訊進行工作交流和協作的組織機構。安全使用即時通訊應考慮許多措施,下\n列措施中錯誤的是( )","options":["如果經費許可,可以使用自建服務器的即時通訊系統","在組織機構安全管理體系中制定相應安全要求,例如禁止在即時通訊中傳輸敏感及以上 級別的文檔;建立管理流程及時將離職員工移除等","選擇在設計上已經為商業應用提供安全防護的即時通訊軟件,例如提供傳輸安全性保護 等即時通訊","涉及重要操作包括轉賬無需方式確認"],"answer":"D","category":"工程與管理","sources":[{"bank":"rev5","n":74}]},{"id":1090,"stem":"如果有一名攻擊者在搜索引擎中搜索“.doc+ XXX. com”找到XXX.com\n網站上所有的word文檔。該攻擊者通過搜索“mdb”、“.ini”+域名,找到該域名下的mdb庫\n文件、ini配置文件等非公開信息,通過這 些敏感信息對該網站進行攻擊,請問這屬於(\n )","options":["定點挖掘","攻擊定位","網絡實施嗅探","溢出攻擊"],"answer":"A","category":"網絡安全","sources":[{"bank":"rev5","n":75}]},{"id":1091,"stem":"以下哪些因素屬於信息安全特徵?( )","options":["系統和網絡的安全","系統和動態的安全","技術、管理、工程的安全","系統的安全;動態的安全;無邊界的安全;非傳統的安全"],"answer":"D","category":"工程與管理","sources":[{"bank":"rev5","n":76}]},{"id":1092,"stem":"信息應按照其法律要求、價值、對泄露或篡改的()和關鍵性予以分類。信息資產的所\n有者應對其分類負責。分類的結果表明了(\n),該價值取決於其對組織的敏感性和關鍵性如保密性、完整性和有效性。信息要進行標\n記並體現其分類,標記的規程需要涵蓋物理和電子格式的 (\n)。分類信息的標記和安全處理是信息共享的一個關鍵要求。(\n)和元數據標籤是常見的形式。標記應易於辨認,規程應對標記附着的位置和方式給出指\n導,並考慮到信息被訪問的方式和介質類型的處理方式。組織要建立與信息分類一致的資\n產處理、加工、存儲和( )","options":["敏感性; 物理標籤; 資產的價值; 信息資產; 交換規程","敏感性; 信息資產; 資產的價值; 物理標籤; 交換規程","資產的價值; 敏感性; 信息資產; 物理標籤; 交換規程","敏感性;資產的價值 ;信息資產物理標籤;交換規程"],"answer":"D","category":"風險管理","sources":[{"bank":"rev5","n":79}]},{"id":1093,"stem":"殺毒軟件一般是通過對代碼與特徵庫中的特徵碼進行比對,判斷這個文件是否是為惡\n意代碼,如果是則進\n女聯繫到病毒庫中對該病毒的描述,從而確認其行為,達到分析的目的。下列對惡意代碼\n靜態分析的說法中,錯誤的是( )","options":["靜態分析不需要實際執行惡意代碼,它通過對其二進制文件的分析,獲得惡意代碼的基 本結構和特徵,瞭解其工作方式和機制","靜態分析通過查找惡意代碼二進制程序中嵌入的可疑字符串,如:文件名稱、URL地址、 域名、調用函數等來進行分析判斷","靜態分析檢測系統函數的運行狀態,數據流轉換過程,能判別出惡意代碼行為和正常軟 件操作","靜態分析方法可以分析惡意代碼的所有執行路徑,但是隨着程序複雜度的提高,冗餘路 徑增多,會出現分析效率很低的情況"],"answer":"C","category":"惡意代碼與漏洞","sources":[{"bank":"rev5","n":80}]},{"id":1094,"stem":"數據庫是一個單位或是一個應用領域的通用數據處理系統,它存儲的是屬於企業和事\n業部門、團體和個人的有關數據的集合。數據庫中的數據是從全局觀點出發建立的,按一\n定的數據模型進行組織、描述和存儲。其結構基於數據間的自然聯繫,從而可提供一切必\n要的訪問路徑,且數據不再針對某一應用,而是面向全組織,具有整體的結構化特徵。數據\n庫作為應用系統數據存儲的系統,毫無疑問會成為信息安全的重點防護對象。數據庫安全\n涉及到數據資產的安全存儲和安全訪問,對數據庫安全要求不包括下列( )","options":["向所有用戶提供可靠的信息服務","拒絕執行不正確的數據操作","拒絕非法用戶對數據庫的訪問","能跟蹤記錄,以便為合規性檢查、安全責任審查等提供證據和跡象等"],"answer":"A","category":"工程與管理","sources":[{"bank":"rev5","n":81}]},{"id":1095,"stem":"下面關於信息系統安全保障模型的說法不正確的是:","options":["國家標準《信息系統安全保障評估框架第一部分:簡介和一般模型》 GB / 202714.1- 2006)中的信息系統安全保障模型將風險和策略作為基礎和核心","模型中的信息系統生命週期模型是抽象的概念性說明模型,在信息系統安全保障具體操 作時,可根據具體環境和要求進行改動和細化","信息系統安全保障強調的是動態持續性的長效安全,而不僅是某時間點下的安全","信息系統安全保障主要是確保信息系統的保密性、完整性和可用性,單位對信息系統運 行維護和使用的人員在能力和培訓方面不需要投入"],"answer":"D","category":"工程與管理","sources":[{"bank":"rev5","n":83}]},{"id":1096,"stem":"風險評估相關政策,目前主要有( )\n(國信辦[2006]5號)。主要內容包括:分析信息系統資產的( ),評估信息系統面臨的(\n)、存在的( )、已有的安全措施和殘餘風險的影響等、兩類信息系統的(\n)、涉密信息系統參照“分級保護”、 非涉密信息系統參照“等級保護”。","options":["《關於開展信息安全風險評估工作的意見》;重要程度 ;安全威脅;脆弱性; 工作開展","《關於開展風險評估工作的意見》;安全威脅;重要程度;脆弱性;工作開展","《關於開展風險評估工作的意見》; 重要程度; 安全威脅; 脆弱性; 工作開展","《關於開展信息安全風險評估工作的意見》 脆弱性;重要程度; 安全威脅; 工作開展"],"answer":"A","category":"風險管理","sources":[{"bank":"rev5","n":84}]},{"id":1097,"stem":"( )在實施攻擊之前,需要儘量收集僞裝身份(),這些信息是攻擊者僞裝成功的(\n)。例如攻擊者要僞裝成某個大型集團公司總部的(\n),那麼他需要了解這個大型集團公司所處行業的一些行規或者 (\n)、公司規則制度、組織架構等信息,甚至包括集團公司中相關人員的綽號等等。","options":["攻擊者;所需要的信息;系統管理員;基礎;內部約定","所需要的信息;基礎;攻擊者;系統管理員;內部約定","攻擊者;所需要的信息:基礎;系統管理員;內部約定","所需要的信息;攻擊者;基礎;系統管理員;內部約定"],"answer":"C","category":"工程與管理","sources":[{"bank":"rev5","n":85}]},{"id":1098,"stem":"小紅和小明在討論有關於現在世界上的IP地址數量有限的問題,小紅說他看到有新聞\n說在2011年2月3日,全球互聯網IP地址相關管理組織宣佈現有的互聯網IP地址已於當天劃\n分給所有的區域互聯網註冊管理機構,IP地址總庫已經枯竭,小明嚇了一跳覺得以後上網\n會成問題,小紅安慰道,不用擔心,現在IPv6已經被試用它有好多優點呢,以下小紅說的優\n點中錯誤的是( )","options":["網絡地址空間的得到極大擴展","IPv6對多播進行了改進,使得具有更大的多播地址空間","繁雜報頭格式","良好的擴展性"],"answer":"C","category":"網絡安全","sources":[{"bank":"rev5","n":86}]},{"id":1099,"stem":"方法指導類標準主要包括GB/T-T25058-2010-\n《信息安全技術信息系統安全等級保護實施指南》GB / T25070-\n2010《信息系統等級保護安全設計技術要求》等。其中《等級保護實施指南》原以()政策文\n件方式發佈,後修改後以標準發佈。這些標準主要對如何開展()做了詳細規定。狀況分析\n類標準主要包括GB/T28448-\n2012《信息安全技術信息系統安全等級保護測評要求》和GB/T\n284492012《信息安全技術信息系統安全等級保護測評過程指南》等。其中在()工作期間還\n發佈過《等級保護測評準則》等文件,後經過修改以《等級保護測評要求》發佈。這些標準主\n要對如何開展( )工作做出了( )","options":["公安部;等級保護試點;等級保護工作;等級保護測評;詳細規定","公安部;等級保護工作;等級保護試點;等級保護測評;詳細規定","公安部;等級保護工作;等級保護測評;等級保護試點;詳細規定","公安部;等級保護工作;等級保護試點;詳細規定;等級保護測評"],"answer":"B","category":"法規與標準","sources":[{"bank":"rev5","n":87}]},{"id":1100,"stem":"下列選項中,對風險評估文檔的描述中正確的是( )","options":["評估結果文檔包括描述資產識別和賦值的結果,形成重要資產列表","描述評估結果中不可接受的風險制定風險處理計劃,選擇適當的控制目標及安全措施, 明確責任、進度、資源,並通過對殘餘風險的評價以確定所選擇安全措施的有效性的《風 險評估程序》","在文檔分發過程中作廢文檔可以不用添加標識進行保留","對於風險評估過程中形成的相關文檔行,還應規定其標識、儲存、保護、檢索、保存期 限以及處置所需的控制"],"answer":"D","category":"風險管理","sources":[{"bank":"rev5","n":88}]},{"id":1101,"stem":"下列軟件開發模型中,支持需求不明確,特別是大型軟件系統的開發,並支持多種軟件\n開發方法的模型是( )","options":["原型模型","瀑布模型","噴泉模型","螺旋模型"],"answer":"D","category":"工程與管理","sources":[{"bank":"rev5","n":89}]},{"id":1102,"stem":"供電安全是所有電子設備都需要考慮的問題,只有持續平穩的電力供應才能保障電子設\n備作穩定可靠因此電力供應需要解決問題包括兩個,一是確保電力供應不中斷、二是確保\n電力供應平穩。下列選項中,對電力供應的保障措施的描述正確的是()","options":["可以採用雙路供電來確保電力供應穩定性","UPS可提供持續、平穩的電力供應,不會受到電湧的影響","可以部署電湧保護器來確保電力供應穩定性","發動機供電是目前電力防護最主要的技術措施"],"answer":"C","category":"物理與環境安全","sources":[{"bank":"rev5","n":90}]},{"id":1103,"stem":"漏洞掃描是信息系統風險評估中的常用技術措施,定期的漏洞掃描有助於組織機構發\n現系統中存在的安全漏洞。漏洞掃描軟件是實施漏洞掃描的工具,用於測試網絡、操作系\n統、數據庫及應用軟件是否存在漏洞。某公司安全管理組成員小李對漏洞掃描技術和工\n具進行學習後有如下理解,其中錯誤的是( )","options":["主動掃描工作方式類似於IDS ( Intrusion Detection Systems)","VE ( Common Vulnerabilities& Exposures) 為每個漏洞確定了唯一的名稱和標準化的描述","X. Scanner採用多線程方式對指定IP地址段進行安全漏洞掃描","ISS 的 System Scanner通過依附於主機上的掃描器代理偵測主機內部的漏洞"],"answer":"A","category":"惡意代碼與漏洞","sources":[{"bank":"rev5","n":91}]},{"id":1104,"stem":"組織應開發和實施使用()來保護信息的策略,基於風險評估,宣確定需要的保護級別,\n並考慮需要的加密算法的類型、強度和質量。當實施組織的()時,宣考慮我國應用密碼技\n術的規定和限制,以及(\n)跨越國界時的向題。組織應開發和實施在密鑰生命週期中使用和保護密鑰的方針。方針\n應包括密鑰在其全部生命週期中的管理要求,包括密鑰的生成、存儲、歸檔、檢索、分配\n、卸任和銷燬。宜根據最好的實際效果選擇加密算法、密鑰長度和使用習慣。適合的(\n )要求密鑰在生成、存儲、歸檔、檢索、分配、卸任和銷燬過程中的安全。宜保護所有\n的密鑰免遭修改和丟失。另外,祕密和私有密鑰需要防範非授權的泄露。用來生成、存儲\n和歸檔密鑰的設備宜進行( )。","options":["加密控制措施; 加密信息; 密碼策略; 密鑰管理; 物理保護","加密控制措施; 密碼策略; 密鑰管理; 加密信息; 物理保護","加密控制措施; 密碼策略; 加密信息; 密鑰管理: 物理保護","加密控制措施; 物理保護; 密碼策略; 加密信息; 密鑰管理"],"answer":"C","category":"密碼與加密","sources":[{"bank":"rev5","n":92}]},{"id":1105,"stem":"來源於課本118頁,27002的知識點\n93.由於病毒攻擊、非法入侵等原因,校園網整體癱瘓,或者校園網絡中心全部DNS主WEB服\n務器不能正常工作;由於病毒攻擊、非法入侵、人為破壞或不可抗力等原因,造成校園網\n出口中斷,屬於以下哪種級別事件( )","options":["特別重大事件","重大事件","較大事件","一般事件"],"answer":"D","category":"應急與災難恢復","sources":[{"bank":"rev5","n":93}]},{"id":1106,"stem":"安全審計是事後認定違反安全規則行為的分析技術,在檢測違反安全規則方面、準確\n發現系統發生的事件以對事件發生的事後分析方面,都發揮着巨大的作用。但安全審計也\n有無法實現的功能,以下哪個需求是網絡安全審計無法實現的功能( )","options":["發現系統中存儲的漏洞和缺陷","發現用戶的非法操作行為","發現系統中存在後門及惡意代碼","發現系統中感染的惡意代碼類型及名稱"],"answer":"D","category":"惡意代碼與漏洞","sources":[{"bank":"rev5","n":94}]},{"id":1107,"stem":"數位物件識別號 (Digital Object Identifier,簡稱DOI\n)是一套識別數位資源的機制,涵括的對象有視頻報告或書籍等等。它既有一套為資源命\n名的機制,也有一套將識別號解析為具體地址的協定。DOI碼由前綴和後兩部分組成,之間\n用“/”分開,並且前綴以“.”再分為兩部分。以下是一個典型的DOI識別號\n10.1006/jmbi.1998.2354,下列選項錯誤的是( )","options":["“10.1006”是前綴,由國際數位物件識別號基金會確定","“10”為DOI目前唯一的特定代碼,用以將DOI與其他採用同樣技術的系統區分開","“1006”是註冊代理機構的代碼,或出版社代碼,用於區分不同的註冊機構","後綴部分為: jmbi.1998. 2354,由資源發行者自行指定,用於區分一個單獨的數字資料,不具有唯一性"],"answer":"D","category":"綜合","sources":[{"bank":"rev5","n":95}]},{"id":1108,"stem":"某網盤被發現泄露了大量私人信息,通過第三方網盤搜索引擎可查詢到該網盤用戶的\n大量照片、通訊錄。盤建議用戶使用“加密分享”功能,以避免消息泄露,“加密分享”可以\n採用以下哪些算法( )。","options":["MD5 算法,SHA-1算法","SA算法,RSA算法","SHA-1算法,SM2算法","RSA算法,SM2算法"],"answer":"D","category":"密碼與加密","sources":[{"bank":"rev5","n":96}]},{"id":1109,"stem":"作為單位新上任的CS0,你組織了一次本單位的安全評估工作以瞭解單位安全現狀。在\n漏洞掃描報告發現了某部署在內網且僅對內部服務的業務系統存在一個漏洞,對比上一年\n度的漏洞掃描報告,發現這個\n經報告出來,經詢問安全管理員得知,這個業務系統開發商已經倒閉,因此無法修復。對於\n這個問題, 處理 ( )","options":["向公司管理層提出此問題,要求立即立項重新開發此業務系統,避免單位中存在這樣的 安全風險","既然此問題不是新發現的問題,之前已經存在,因此與自己無關,可以不予理會","讓安全管理人員重新評估此漏洞存在的安全風險並給出進一步的防護措施後再考慮如 何處理","讓安全管理員找出驗收材料看看有沒有該業務系統源代碼,自己修改解決這個漏洞"],"answer":"C","category":"工程與管理","sources":[{"bank":"rev5","n":97}]},{"id":1110,"stem":"以下哪項網絡攻擊會對《網絡安全法》定義的網絡運行安全造成影響?","options":["DOS攻擊","網頁篡改","個人信息泄露","發佈謠言信息"],"answer":"A","category":"網絡安全","sources":[{"bank":"rev5","n":98}]},{"id":1111,"stem":"軟件工程方法提出起源於軟件危機,而其目的應該是最終解決軟件的問題的是( )","options":["質量保證","生產危機","生產工程化","開發效率"],"answer":"C","category":"工程與管理","sources":[{"bank":"rev5","n":99}]},{"id":1112,"stem":"風險評估的過程包括 ( )、( )、( )和(\n)四個階段。在信息安全風險管理過程中,風險評估建立階段的輸出,形成本階段的最終輸\n出《風險評估報告》,此文檔為風險處理活動提供輸入。( )風險評估的四個階段。","options":["風險評估準備; 風險要素識別; 風險分析; 監控審查; 風險結果判定; 溝通諮詢","風險評估準備; 風險要素識別; 監控審查 ;風險分析; 風險結果判定; 溝通諮詢","風險評估準備; 監控審查 ;風險要素識別; 風險分析 ;風險結果判定; 溝通諮詢","風險評估準備; 風險要素識別: 風險分析: 風險結果判定 監控審查, 溝通諮詢"],"answer":"D","category":"風險管理","sources":[{"bank":"rev5","n":100}]},{"id":1113,"stem":"CC標準是目前系統安全認證方面最權威的標準,以下哪一項沒有體現CC標準的先進性:","options":["結構的開放性","表達方式的通用性","獨立性","實用性"],"answer":"C","category":"法規與標準","sources":[{"bank":"rev6","n":1}]},{"id":1114,"stem":"以下哪個現象較好的印證了信息安全特徵中的動態性( )","options":["經過數十年的發展,互聯網上已經接入了數億臺各種電子設備","剛剛經過風險評估並針對風險採取處理措施後僅一週,新的系統漏洞使得信息系統面臨 新的風險","某公司的信息系統面臨了來自美國的“匿名者”黑客組織的攻擊","某公司儘管部署了防火牆、防病毒等安全產品,但服務器中數據仍產生了泄露"],"answer":"B","category":"風險管理","sources":[{"bank":"rev6","n":3}]},{"id":1115,"stem":"Linux系統的安全設置主要從磁盤分區、賬戶安全設置、禁用危險服務、遠程登錄安全、\n用戶鑑別安全、審計策略、保護root賬戶、使用網絡防火牆和文件權限操作共10個方面\n來完成。小張在學習了Linux系統安全的相關知識後,嘗試為自己計算機上的Linux系統\n進行安全配置。下列選項是他的部分操作,其中不合理的是( )。\n編輯文件/etc/passwd,檢查文件中用戶ID,禁用所有ID=0的用戶","options":["編輯文件/etc/ssh/sshd _config, 將Permit RootLogin設置為no","編輯文件/etc/pam.d/system~auth,設置auth required pam tally. so onerr=fail","eny=6 unlock_time-300","編輯文件/etc/profile, 設置TMOUT=600"],"answer":"A","category":"操作系統與主機安全","sources":[{"bank":"rev6","n":7}]},{"id":1116,"stem":"PDCA循環又叫戴明環,是管理學常用的一種模型。關於PDCA四個字母,下面理解錯誤的\n是( )","options":["P是Plan,指分析問題、發現問題、確定方針、目標和活動計劃","是Do,指實施、具體運作,實現計劃中的內容","是Check,指檢查、總結執行計劃的結果,明確效果,找出問題","是Aim,指瞄準問題,抓住安全事件的核心,確定責任"],"answer":"D","category":"應急與災難恢復","sources":[{"bank":"rev6","n":8}]},{"id":1117,"stem":"有關質量管理,錯誤的理解是( )。","options":["質量管理是與指揮和控制組織質量相關的一系列相互協調的活動,是為了實現質量目 標,而進行的所有管理性質的活動","規範質量管理體系相關活動的標準是ISO 9000系列標準","質量管理體系將資源與結果結合,以結果管理方法進行系統的管理","質量管理體系從機構,程序、過程和總結四個方面進行規範來提升質量"],"answer":"C","category":"工程與管理","sources":[{"bank":"rev6","n":12}]},{"id":1118,"stem":"隨着即時通訊軟件的普及使用,即時通訊軟件也被惡意代碼利用進行傳播,以下哪項功\n能不是惡意代碼利用即時通訊進行傳播的方式","options":["利用即時通訊軟件的文件傳送功能發送帶惡意代碼的可執行文件","利用即時通訊軟件發送指向惡意網頁的URL","利用即時通訊軟件發送指向惡意地址的二維碼","利用即時通訊發送攜帶惡意代碼的JPG圖片"],"answer":"C","category":"惡意代碼與漏洞","sources":[{"bank":"rev6","n":15}]},{"id":1119,"stem":"GB/T 22080-2008 《信息技術 安全技術 信息安全管理體系\n要求》指出,建立信息安全管理體系應參照PDCA模型進行,即信息安全管理體系應包括建\n立ISMS、 實施和運行ISMS、監視和評審ISMS、\n保持和改進ISMS等過程,並在這些過程中應實施若干活動。請選出以下描述錯誤的選項\n( )。","options":["“制定ISMS方針”是建立ISMS階段工作內容","“安施培訓和意識教育計劃”是實施和運行ISMS階段工作內容","“進行有效性測量”是監視和評審ISMS階段工作內容","“實施內部審覈”是保持和改進ISMS階段工作內容"],"answer":"D","category":"工程與管理","sources":[{"bank":"rev6","n":16}]},{"id":1120,"stem":"某單位需要開發一個網站,為了確保開發出安全的軟件。軟件開發商進行了OA系統的威\n脅建模,根據威脅建模,SQL注入是網站系統面臨的攻擊威脅之一,\n根據威脅建模的消減威脅的做法。以下哪個屬於修改設計消除威脅的做法( )","options":["在編碼階段程序員進行培訓,避免程序員寫出存在漏洞的代碼","對代碼進行嚴格檢查,避免存在SQL注入漏洞的腳本被髮布","使用靜態發佈,所有面向用戶發佈的數據都使用靜態頁面","在網站中部署防SQL注入腳本,對所有用戶提交數據進行過濾"],"answer":"C","category":"惡意代碼與漏洞","sources":[{"bank":"rev6","n":17}]},{"id":1121,"stem":"某企業內網中感染了一種依靠移動存儲進行傳播的特洛伊木馬病毒,由於企業部署的殺\n毒軟件,為了解決該病毒在企業內部傳播,作為信息化負責人,你應採取以下哪項策略\n()","options":["更換企業內部殺毒軟件,選擇一個可以查殺到該病毒的軟件進行重新部署","向企業內部的計算機下發策略,關閉系統默認開啓的自動播放功能","禁止在企業內部使用如U盤、移動硬盤這類的移動存儲介質","在互聯網出口部署防病毒網關,防止來自互聯網的病毒進入企業內部"],"answer":"B","category":"惡意代碼與漏洞","sources":[{"bank":"rev6","n":19}]},{"id":1122,"stem":"分佈式拒絕服務(Distributed Denial of Service,\nDDos)攻擊指藉助於客戶/服務器技術,將多個計算機聯合起來作為攻擊平臺。對一個或\n多個目標發動DDoS攻擊,從而成倍地提高拒絕服務攻擊的威力。一般來說,DDoS攻擊的\n主要目的是破壞目標系統的()","options":["保密性","完整性","可用性","真實性"],"answer":"C","category":"操作系統與主機安全","sources":[{"bank":"rev6","n":20}]},{"id":1123,"stem":"Apache HTTP\nServer(簡稱Apache)是個開放源碼的Web服務運行平臺,在使用過程中,該軟件默認會\n將自己的軟件名和版本號發送給客戶端。從安全角度出發,為隱藏這些信息,應當採取\n以下哪種措施()","options":["不選擇Windons平臺,應選擇在Linux平臺下安裝使用","安裝後。修改配置文件httpd.conf中的有關參數","安裝後。刪除Apache HTTP Server源碼","從正確的官方網站下載Apache HTTP Server. 並安裝使用"],"answer":"B","category":"操作系統與主機安全","sources":[{"bank":"rev6","n":22}]},{"id":1124,"stem":"安全漏洞產生的原因不包括以下哪一點()","options":["軟件系統代碼的複雜性","軟件系統市場出現信息不對稱現象","複雜異構的網絡環境","攻擊者的惡意利用"],"answer":"D","category":"密碼與加密","sources":[{"bank":"rev6","n":23}]},{"id":1125,"stem":"某軟件在設計時,有三種用戶訪問模式,分別是僅管理員可訪問、所有合法用戶可訪問\n和允許匿名訪問)採用這三種訪問模式時,攻擊面最高的是()。","options":["僅管理員可訪問","所有合法用戶可訪問","允許匿名","三種方式一樣"],"answer":"C","category":"工程與管理","sources":[{"bank":"rev6","n":25}]},{"id":1126,"stem":"某政府機構委託開發商開發了一個\nOA系統。其中公交分發功能使用了FTP協議,該系統運行過程中被攻擊者通過FTP對OA系\n統中的腳本文件進行了篡改,安全專家提出使用Http下載代替FTP功能以解決以上問題,\n該安全問題的產生主要是在哪個階段產生的()","options":["程序員在進行安全需求分析時,沒有分析出OA系統開發的安全需求","程序員在軟件設計時,沒遵循降低攻擊面的原則,設計了不安全的功能","程序員在軟件編碼時,缺乏足夠的經驗,編寫了不安全的代碼","程序員在進行軟件測試時,沒有針對軟件安全需求進行安全測試"],"answer":"B","category":"網絡安全","sources":[{"bank":"rev6","n":27}]},{"id":1127,"stem":"從SABSA的發展過程,可以看出整個SABSA在安全架構中的生命週期(如下圖所示),在\n此SABSA生命週期中,前兩個階段的過程被歸類為所謂的( ),其次是(\n),它包含了建築設計中的( )、物理設計、組件設計和服務管理設計,再者就是(\n),緊隨其後的則是( )","options":["設計;戰略與規劃;邏輯設計;實施;管理與衡量","戰略與規劃;邏輯設計;設計;實施;管理與衡量","戰略與規劃;實施;設計;邏輯設計;管理與衡量","戰略與規劃;設計;邏輯設計;實施;管理與衡量"],"answer":"D","category":"工程與管理","sources":[{"bank":"rev6","n":28}]},{"id":1128,"stem":"在Linux系統中,下列哪項內容不包含在/etc/passwd文件中()","options":["用戶名","用戶口令明文","用戶主目錄","用戶登錄後使用的 SHELL"],"answer":"B","category":"操作系統與主機安全","sources":[{"bank":"rev6","n":32}]},{"id":1129,"stem":"某攻擊者想通過遠程控制軟件潛伏在某監控方的UNIX系統的計算機中,如果攻擊者打算\n長時間地遠程監控某服務器上的存儲的敏感數據,必須要能夠清除在監控方計算機中存\n在的系統日誌。否則當監控方查看自己的系統日誌的時候,就會發現被監控以及訪向的\n痕跡。不屬於清除痕跡的方法是()。","options" ","n":75}]},{"id":1158,"stem":"某單位在進行內部安全評估時,安全員小張使用了單位採購的漏洞掃描軟件進行單位內\n的信息系統漏洞掃描。漏洞掃描報告的結論為信息系統基本不存在明顯的安全漏洞,然\n而此報告在內部審計時被質疑,原因在於小張使用的漏洞掃描軟件採購於三年前,服務\n已經過期,漏洞庫是半年前最後一次更新的。關於內部審計人員對這份報告的說法正確\n的是()","options":["內部審計人員的質疑是對的,由於沒有更新漏洞庫,因此這份漏洞掃描報告準確性無 法保證","內部審計人員質疑是錯的,漏洞掃描軟件是正版採購,因此掃描結果是準確的","內部審計人員的質疑是正確的,因為漏洞掃描報告是軟件提供,沒有經過人為分析, 因此結論不會準確","內部審計人員的質疑是錯誤的,漏洞軟件是由專業的安全人員操作的,因此掃描結果 是準確的"],"answer":"A","category":"惡意代碼與漏洞","sources":[{"bank":"rev6","n":76}]},{"id":1159,"stem":"組織應定期監控、審查、審計()服務,確保協議中的信息安全條款和條件被遵守,信\n息安全事件和問題得到妥善管理。應將管理供應商關係的責任分配給指定的個人或()\n團隊。另外,組織應確保落實供應商符合性審查和相關協議要求強制執行的責任。應保\n存足夠的技術技能和資源的可用性以監視協議要求尤其是()要求的實現。當發現服務\n交付的不足時,宜採取().當供應商提供的服務,包括對()方針、規程和控制措施的\n維持和改進等發生變更時,應在考慮到其對業務信息、系統、過程的重要性和重新評估\n風險的基礎上管理。","options":["供應商;服務管理;信息安全;合適的措施;信息安全","服務管理;供應商;信息安全;合適的措施;信息安全","供應商;信息安全;服務管理;合適的措施;信息安全","供應商;合適的措施;服務管理;信息安全;信息安全"],"answer":"A","category":"工程與管理","sources":[{"bank":"rev6","n":79}]},{"id":1160,"stem":"下列關於面向對象測試問題的說法中,不正確的是()","options":["在面向對象軟件測試時,設計每個類的測試用例時,不僅僅要考慮用各個成員方法的 輸入參數,還需要考慮如何設計調用的序列","構造抽象類的驅動程序會比構造其他類的驅動程序複雜","類B繼承自類A,如對B進行了嚴格的測試,就意味着不需再對類A進行測試","在存在多態的情況下,為了達到較高的測試充分性,應對所有可能的綁定都進行測試"],"answer":"C","category":"綜合","sources":[{"bank":"rev6","n":80}]},{"id":1161,"stem":"火災是機房日常運營中面臨最多的安全威脅之一,火災防護的工作是通過構建火災預防\n、檢測和響應系統,保護信息化相關人員和信息系統,將火災導致的影響降低到可接受\n的程度。下列選項中,對火災的預防、檢測和抑制的措施描述錯誤的選項是()。","options":["將機房單獨設置防火區,選址時遠離易燃易爆物品存放區域,機房外牆使用非燃燒材 料,進出機房區域的門採用防火門或防火捲簾,機房通風管設防火栓","火災探測器的具體實現方式包括;煙霧檢測、溫度檢測、火焰檢測、可燃氣體檢測及 多種檢測複合等","自動響應的火災抑制系統應考慮同時設立兩組獨立的火災探測器,只要有一個探測器 報警,就立即啓動滅火工作","前在機房中使用較多的氣體滅火劑有二氧化碳、七氟丙烷、三氟甲烷等"],"answer":"C","category":"物理與環境安全","sources":[{"bank":"rev6","n":81}]},{"id":1162,"stem":"在網絡交易發達的今天,貿易雙方可以通過簽署電子合同來保障自己的合法權益。某中\n心推出電子簽名服務,按照如圖方式提供電子簽名,不屬於電子簽名的基本特性的是(\n)。","options":["不可僞造性","不可否認性","保證消息完整性","機密性"],"answer":"D","category":"密碼與加密","sources":[{"bank":"rev6","n":85}]},{"id":1163,"stem":"風險評估文檔是指在整個風險評估過程中產生的評估過程文檔和評估結果文檔,其中,","options":["明確評估的目的、職責、過程、相關的文檔要求,以及實施本次評估所需要的各種資產","、威脅、脆弱性識別和判斷依據的文檔是()","《風險評估方案》 B.《風險評估程序》","《資產識 組織的\n其他安全要求的()。攜帶重要、敏感和或關鍵業務信息的設備不宜無人值守,若有可\n能,要以物理的方式鎖起來,或使用()來保護設備。對於使用移動計算設施的人員要\n安排培訓,以提高他們對這種工作方式導致的附加風險的意識,並且要實施控制措施。","options":["加密技術;業務信息;特定規程;專用鎖","業務信息;特定規程;加密技術;專用鎖","業務信息;加密技術;特定規程;專用鎖","業務信息;專用鎖;加密技術;特定規程"],"answer":"C","category":"密碼與加密","sources":[{"bank":"rev6","n":93}]},{"id":1170,"stem":"在規定的時間間隔或重大變化發生時,組織的額()和實施方法(如信息安全的控制目\n標、控制措施、方針、過程和規程)應()。獨立評審宜由管理者啓動,由獨立被評審\n範圍的人員執行,例如內部審覈部、獨立的管理人員或專門進行這種評審的第三方組織\n。從事這些評審的人員宜具備適當的()。管理人員宜對自己職責範圍內的信息處理是\n否符合合適的安全策略、標準和任何其他安全要求進行()。為了日常功評審的效率,\n可以考慮使用自動測量和()。評審結果和管理人員採取的糾正措施宜被記錄,且這些\n記錄宜予以維護。","options":["信息安全管理;獨立審查;報告工具;技能和經驗;定期評審","信息安全管理;技能和經驗;獨立審查;定期評審;報告工具","獨立審查;信息安全管理;技能和經驗;定期評審;報告工具","信息安全管理;獨立審查;技能和經驗;定期評審;報告工具"],"answer":"D","category":"工程與管理","sources":[{"bank":"rev6","n":94}]},{"id":1171,"stem":"選擇信息系統部署的場地應考慮組織機構對信息安全的需求並將安全性防在重要的位置\n,信息資產的保護很大程度上取決與場地的安全性,一個部署在高風險場所的額信息系\n統是很難有效的保障信息資產安全性的。為了保護環境安全,在下列選項中,公司在選\n址時最不應該選址的場地是().","options":["自然災害較少的城市","部署嚴格監控的獨立園區","大型醫院旁的建築","加油站旁的建築"],"answer":"D","category":"風險管理","sources":[{"bank":"rev6","n":95}]},{"id":1172,"stem":"1998年英國公佈標準的第二部分《信安全管理體系規範》,規定()管理體系要求與()\n要求,它是一個組織的全面或部分信息安全管理體系評估的(),它可以作為一個正式\n認證方案的()。BS 7799-1與BS7799-\n2經過修訂於1999年重新予以發佈,1999版考慮了信息處理技術,尤其是在網絡和通信領\n域應用的近期發展,同時還非常強調了商務涉及的信息安全及()的責任。","options":["信息安全;信息安全控制;根據;基礎;信息安全","信息安全控制;信息安全;根據;基礎;信息安全","信息安全控制;信息安全;基礎;根據;信息安全","信息安全;信息安全控制;基礎;根據;信息安全"],"answer":"D","category":"工程與管理","sources":[{"bank":"rev6","n":96}]},{"id":1173,"stem":"某計算機機房由於人員疏忽或設備老化可能會有發生火災的風險。該計算機機房的資產\n價值為200萬元;如果發生火災,資產總值將損失至資產值的25%;這種火災發生的可能\n性為25年發生一次。則這種威脅的年度損失預期值為().","options":["10,000元","15,000元","20,000元","25,000元"],"answer":"C","category":"風險管理","sources":[{"bank":"rev6","n":97}]},{"id":1174,"stem":"安全審計師一種很常見的安全控制措施,它在信息全保障系統中,屬於()措施。","options":["保護","檢測","響應","恢復"],"answer":"B","category":"風險管理","sources":[{"bank":"rev6","n":98}]},{"id":1175,"stem":"下列選項分別是四種常用的資產評估方法,哪個是目前採用最為廣泛的資產評估方法(\n)。","options":["基於知識的分析方法","基於模型的分析方法","定量分析","定性分析"],"answer":"D","category":"風險管理","sources":[{"bank":"rev6","n":99}]},{"id":1176,"stem":"訪問控制方法可分為自主訪問控制、強制訪問控制和基於角色訪問控制,它們具有不同\n的特點和應用場景。如果需要選擇一個訪問控制模型,要求能夠支持最小特權原則和職\n責分離原則,而且在不同的系統配置下可以具有不同的安全控制,那麼在(1)自主訪問\n控制,(2)強制訪問控制,(3)基於角色的訪問控制(4)基於規則的訪問控制中,能\n夠滿足以上要求的選項有()","options":["只有(1)(2)","只有(2)(3)","只有(3)(4)","只有(4)"],"answer":"C","category":"操作系統與主機安全","sources":[{"bank":"rev6","n":100}]}];
const EXPL = {"1":"《關於加強信息安全保障工作的意見》提出的九項重點工作包括保證信息安全資金投入、加快信息安全人才培養、重視信息安全應急處理工作等，而提高信息技術產品的國產化率屬於產業發展的具體舉措，不在九項重點工作之列。","2":"該模型的保障體系以風險和策略為基礎，強調安全保障貫穿信息系統全生命週期的動態性，並通過技術、管理、工程、人員四類要素實現安全特徵；將安全威脅和風險控制措施作為基礎和核心並非該模型的特點。","3":"信息系統安全保障既包含客觀的保障措施，也包含所有者主觀的信心，通過技術、管理、工程和人員四個方面客觀評估安全保障措施，向信息系統所有者證明其現有保障能力能夠滿足安全目標，故B的表述最準確。","4":"PDR由防護、檢測、反應三個環節構成，P2DR在其基礎上增加了策略環節，以策略指導防護、檢測與反應並形成持續調整的安全循環，因此比PDR多出的環節是策略。","5":"Kerchhoff假設認為密碼系統的安全性不應依賴於算法的保密，算法可以公開並允許被分析，全部祕密集中於密鑰，因此係統的安全性僅依賴於密鑰，與明文、密文和信道無關。","6":"對稱密碼算法中,通訊雙方必須安全且祕密地共享密鑰,才能進行安全的消息傳輸。如果在不安全的傳輸信道上通信,密鑰可能被竊取;加密算法可以是公開的;將傳輸信息夾雜在無用信息中傳輸並提取不是對稱密碼算法安全傳輸的必要條件。所以選B。","7":"代替密碼是保持明文字符位置不變、依據密鑰將每個明文字母替換為另一個密文字母的密碼；僅按密鑰改變字符位置屬於移位密碼，逐比特異或屬於流密碼，故A正確。","8":"AES的分組長度固定為一百二十八位，其密鑰長度可為128位、192位或256位，不包含64位，因此64位不是AES可能的密鑰長度。","9":"用密鑰K2對消息加密向接收方提供保密性，用密鑰K1對密文計算MAC並由接收方重新計算比對，可驗證消息在傳輸中未被篡改，即提供完整性；該過程未涉及簽名與不可否認性，故提供保密性和消息完整性。","10":"CRL即證書吊銷列表，由CA簽署並定期發佈，列出已提前作廢的證書，驗證數字證書時必須查詢CRL以確認其未被吊銷；ARL只是CRL的歸檔形式，CSS與KMS與證書作廢無關。","11":"時間戳用於標識消息產生的時刻，接收方據此拒絕過期或重複出現的報文，從而防止攻擊者截獲合法消息後再次發送的重放攻擊；它與死鎖、丟失、擁塞等系統運行問題無關。","12":"SSL在傳輸層之上為點對點通信（如瀏覽器與Web服務器之間）建立安全通道，常以Web服務器方式部署；它同時使用非對稱與對稱密碼體制，工作於應用層而非網絡層，AH、ESP、IKE屬於IPSec的協議。","13":"BLP模型的簡單安全性要求主體安全級支配客體安全級方可讀取，星特性要求主體安全級支配客體安全級方可寫入。C中Alice的類別集合{NUC,EU}不含文件安全級中的US，屬於向上寫，違反星特性，不能被授權；D為同級別讀取，符合簡單安全性，屬於可授權訪問。","14":"星完整性原則是Biba模型對寫操作的約束，即低完整性主體不得向高完整性對象寫入，也就是不允許向上寫，以防止低可信數據污染高可信數據；Biba的簡單性原則纔是不允許向上讀，Bell-LaPadula模型關注的是機密性。","15":"身份鑑別是用戶向系統聲明身份並提供憑證、由系統驗證其真實性的過程，依照系統提示輸入用戶名與口令正是典型的口令鑑別方式；設定文檔讀寫權限屬於訪問控制，對文檔加密屬於保密性保護。","16":"Kerberos基於可信第三方與密鑰分發中心，通過AS、TGS與TGT實現分佈式網絡環境下客戶端與服務器的雙向認證並支持單點登錄，稱其無法實現分佈式環境下的認證是不正確的；其真正缺點在於AS與TGS集中管理易形成瓶頸。","17":"TACACS+採用客戶端與服務器結構，將認證、授權與審計三種功能分離並集中部署於專用服務器，由中心統一維護和下發訪問控制策略，屬於集中式訪問控制機制，而非自主訪問控制或強制訪問控制。","18":"令牌、智能卡與生物檢測設備是三類相互獨立的鑑別手段，同時用於識別和鑑別，依據的是多因素鑑別原則——以多種不同性質的因素相互印證，任一因素失效均不影響整體鑑別的可靠性。","19":"蜜網以誘騙為目的，用於吸引和轉移攻擊者注意力、延緩其對真實目標的攻擊，誘導入侵併在不被察覺的情況下記錄攻擊活動，配合實現攻擊檢測與報警；對攻擊活動的監視、檢測和分析是入侵檢測系統等設備的職能。","20":"審計系統由日誌記錄、日誌分析和日誌報告三部分組成：先記錄系統與用戶的活動形成審計日誌，再對日誌進行分析以發現異常和違規行為，最終以報告形式呈現結果供安全管理人員覈查處置。","21":"安全審計屬於事後追溯與覈查機制，可輔助辨識未授權活動和攻擊、覈查活動與既定安全策略的一致性、發現需要改進的安全控制；它不具備在線阻斷能力，阻斷違規訪問由訪問控制、防火牆等機制完成。","22":"UDP在IP實現主機間通信的基礎上，通過端口號區分同一主機上的不同應用程序，嚮應用程序發送用戶數據報時必須使用由IP地址與端口號構成的套接字地址，即使用端口地址。","23":"WAPI的安全機制由WAI與WPI兩部分組成，其中WAI負責無線接入用戶的身份鑑別與證書管理，WPI負責無線鏈路上數據的加密與完整性保護，因此說WAI實現對傳輸數據的加密是不正確的。","24":"VLAN的規劃方法通常包括基於交換機端口、基於MAC地址、基於網絡層協議以及基於用戶等劃分方式；數字證書用於公鑰基礎設施中的身份綁定與鑑別，與VLAN的劃分無關。","25":"內網兩百臺終端僅有少量公網地址時，宜在出口路由器上啓用源NAT，將內網私有源地址轉換為少量公網地址實現多對一複用；目的NAT用於對外發布服務，增加路由器與申請地址均非最佳方案。","26":"標準訪問控制列表僅依據數據包的源IP地址判斷允許或拒絕，不涉及目的地址、端口號和數據包大小；需要按目的地址與端口進行過濾時應使用擴展訪問控制列表。","27":"橋接即透明模式防火牆以二層方式串接在網絡中，無需修改原有網絡配置、性能較高且自身不易被直接攻擊；它工作在數據鏈路層，通常不承擔地址轉換功能，故易於實現NAT不屬於其優點。","28":"基於行為的入侵檢測系統以正常行為基線和統計模型判斷偏離活動，難以與攻擊特徵精確匹配，因而誤報率高於基於特徵的入侵檢測系統；基於特徵的系統只能匹配已知攻擊簽名，無法檢測新型攻擊。","29":"NIDS的常見技術包括協議分析、零拷貝抓包、IP碎片重組、模式匹配與狀態檢測等；SYN Cookie是服務器應對SYN Flood拒絕服務攻擊、保護連接資源的技術，不屬於網絡入侵檢測技術。","30":"root是超級用戶，對文件和程序不受所有者限制，但系統日誌管理、用戶增刪等管理工作並非只能以root登錄完成，普通用戶可通過su切換身份或經sudo獲得授權執行，常規應用一般也無需root運行，故C不正確。","31":"test為普通文件，模式首位不應為d，所有者應為user、所屬組應為admin，故正確的表示以rwxr-xr-x開頭且所有者列顯示user、組列顯示admin；以d開頭表示目錄，所有者與組顛倒亦不符合題意。","32":"使用netshare\\\\127.0.0.1\\c$/delete命令刪除系統中的c$等管理共享並重啓系統,在Windows系統重啓後,這些管理共享通常會自動重新創建,這不是有效的共享安全防護措施。確保共享有高強度密碼防護、禁止“空會話”連接、安裝軟件防火牆阻止外部對共享目錄的連接都是有效的防護措施。所以選A。","33":"Windows系統採用SID(安全標識符)來標識用戶對文件或文件夾的權限,而不是用戶名。Windows系統默認生成administrator和guest兩個賬號,administrator賬號可以改名和刪除(但不建議刪除),guest賬號默認是禁用狀態,可以啓用、改名和刪除相關設置受系統策略限制。所以選A。","34":"Windows服務不一定是獨立的可執行程序,也可以是動態鏈接庫等形式;Windows服務的運行不需要用戶的交互登陸,可以在後臺自動運行;Windows服務可以設置啓動類型,如自動、手動、禁用等,並非都是隨系統啓動而啓動;Windows服務可以以系統權限運行,不一定需要用戶登陸後以登錄用戶權限啓動。所以選B。","35":"IIS的訪問控制由網絡地址訪問控制、Web服務器許可與NTFS許可三類過渡類型共同實現，逐層限定可訪問的客戶端與資源；異常行為過濾屬於入侵檢測系統的功能，不是IIS支持的訪問控制類型。","36":"數據庫完整性規則由完整性約束條件、完整性檢查機制和違約處理機制三部分組成，分別用於定義約束、判斷數據是否違反約束以及在違約時執行相應處理，完整性修復機制不屬於完整性規則的內容。","37":"授權粒度指授權數據對象的大小，可細到屬性、字段、元組、表乃至數據庫；粒度越小，授權與回收越精確，越能落實最小授權原則，因此授權的數據對象粒度越小，授權子系統就越靈活。","38":"訪問控制的粒度決定用戶可訪問的數據範圍，粒度越細越能實現細粒度保護與最小權限，與數據庫安全性直接相關；數據庫大小、關係表中屬性與元組的數量只反映數據規模，不直接影響安全性。","39":"數據庫管理系統即DBMS，是專門負責數據庫建立、運行、管理與維護的系統軟件，提供數據定義、數據操縱以及安全性、完整性與併發控制功能；SQL語言與觸發器只是其中的機制而非管理系統。","40":"SMTP是用於從郵件客戶端向郵件服務器發送和中繼郵件的協議，POP與IMAP則用於從服務器讀取郵件，因此發送郵件僅需使用SMTP，POP只負責接收郵件。","41":"Apache把配置按功能拆分：access.conf專門用於控制用戶對服務器目錄的訪問權限（Directory、Allow、Deny等指令），httpd.conf是服務器主配置文件，srm.conf負責資源映射（Alias、ScriptAlias）與虛擬主機，inet.conf屬系統守護進程配置，均非目錄訪問控制文件。","42":"PGP 以 RSA 公鑰體系結合對稱加密來保護電子郵件，同時提供數字簽名以確保機密性與完整性，屬於郵件加密軟件；它並非反垃圾郵件工具，也不依賴 SSL 或 VPN 技術，更不是安全的郵件信箱系統本身。","43":"惡意代碼以加密保護自身代碼與變體，使特徵碼難以匹配、靜態分析與除錯難以進行，因此加密是其自我保護的重要機制；加密本身並不能保證惡意代碼不被發現或不被破壞，故 B、C 的說法過於絕對。","44":"反跟蹤技術通過隱藏執行進程、規避追蹤與檢測，降低惡意代碼被發現和被分析的幾率，故 A 正確；它無法繞過所有殺毒軟件的查殺，也不能保證惡意代碼不被清除，B、C 用詞過於絕對。","45":"純文字檔不含可被系統解釋執行的指令碼，病毒無法注入文字檔中並執行，故 C 為不正確的說法；注入引導區的引導型病毒、常駐於磁盤扇區文件映像的病毒，以及嵌入文件與模板宏的宏病毒，皆為真實存在的感染能力。","46":"用戶輸入的數據被解釋器當作命令或查詢語句的一部分執行，正是代碼注入漏洞的典型定義，例如 SQL 注入與命令注入；緩衝區溢出屬內存寫越界，設計錯誤與信息泄漏則屬其他漏洞類別。","47":"完整性檢查與控制旨在確保寫入數據庫的數據正確且符合語義，故其防範對象是不合語義與不正確的數據；非法用戶、非法操作與非法授權屬訪問控制與權限管理範疇，由身份鑑別及授權機制負責。","48":"存儲過程經預先編譯後可重複執行以提升性能，能通過事務回滾維護數據的完整性與一致性，並可依執行權限管控強化數據庫安全；用戶的查詢數量取決於業務需求，不會因使用存儲過程而減少，故 B 非其優點。","49":"C 語言標準字符串函式庫中的 strcpy、strcat 等函式不檢查邊界，正是緩衝區溢出的常見成因，因此使用它並非防護措施；嚴格驗證輸入字符串長度、過濾不合規則的字元、改用第三方安全的字符串函式庫纔是有效做法。","50":"計算機取證的準備階段包括取得取證授權、準備取證工具以及準備經寫保護的存儲介質；保護數據屬於證據固定與採集階段的工作，不在準備階段之內。","51":"DNS欺騙的成因在於協議缺乏嚴格認證、查詢結果會在系統中緩存從而擴大污染範圍、傳輸的數據未經加密而易被僞造應答；DNS是一個分佈式系統只是其體系結構特點，與主機被欺騙沒有因果關係，故A不是成因。","52":"ARP 欺騙使目標主機將網關的 IP 對應到攻擊者的 MAC 地址，流量因而被導向錯誤地址，造成目標主機無法訪問網絡；ARP 欺騙屬第二層攻擊，不會直接取得主機控制權，也不會導致系統崩潰、藍屏或死機。","53":"IP 欺騙的關鍵在於僞裝成受信任主機與目標建立 TCP 工作階段，而 TCP 序號遵循可預測的產生規則，攻擊者必須先猜準序號才能完成握手並完成會話操作，難度最高；對受信任主機施以拒絕服務只是輔助步驟。","54":"Teardrop 利用畸形碎片數據包在目標主機重組時造成系統宕機，屬利用協議實現缺陷的攻擊，並不以海量數據包消耗帶寬；Land、UDP Flood 與 Smurf 皆以大量數據包淹沒目標，屬流量型拒絕服務攻擊。","55":"攻擊者攔截公鑰後以自身公鑰替換併發送給接收方，使對方以攻擊者的密鑰加密數據，從中攔截並解密通信，正是中間人攻擊；重放攻擊是重複發送獲取到的數據包，字典攻擊針對口令猜測，Smurf 屬放大式拒絕服務。","56":"域名的註冊人、聯繫信息、有效期與名稱服務器等登記數據存放於 whois 數據庫，可直接查詢取得；路由表屬網絡層的路徑信息，DNS 記錄用於名稱與地址的解析，MIBs 庫屬 SNMP 的管理信息數據庫。","57":"no ip directed-broadcast 會關閉定向廣播，使路由器不再把 ICMP 回應要求放大廣播給整個子網，可用於減輕 Smurf 攻擊；Diecast、Batcast 與 Coke 均非此設置針對的攻擊。","58":"Nmap 用於主機與連接埠探測，Nslookup 用於查詢 DNS 記錄，Xscan 用於掃描主機弱點與服務信息，皆屬攻擊信息收集階段的工具；LC 屬口令破解工具，用於攻擊後期的密碼破解，不是信息收集工具。","59":"黑盒測試指不考慮程序內部結構、僅依需求規格檢驗輸入與輸出是否符合預期，與測試報告是否對外保密無關，故 A 的說法錯誤；避免使用真實生產數據、妥善保存測試文件、留意多餘功能是否被實現，皆為正確觀念。","60":"SDL 將安全活動嵌入需求、設計、實現、測試到發佈的完整開發流程，是對開發流程本身的重構，而非傳統開發過程的額外補充，故 D 不屬於 SDL 的思想；持續改進、將安全意識融入團隊文化與安全可度量性皆為其核心原則。","61":"大量發送 ICMP 回應要求迫使被攻擊主機持續應答而耗盡資源，無法處理正常的網絡信息流，即 ICMP Flood 攻擊；Land 攻擊將來源與目的地址設為同一主機，Smurf 依靠廣播地址放大，Ping of Death 依靠超大數據包。","62":"開放認證模式允許任何終端無需證書即可接入 AP，等於取消身份鑑別，無法提升 WLAN 的安全性；修改默認的 SSID、禁止 SSID 廣播以及啓用終端與 AP 間的雙向認證，才能降低被檢測與僞造的風險。","63":"以靜態 ARP 緩存綁定網關與主機的 IP 對 MAC 對應，可使主機不再接受攻擊者僞造的 ARP 應答，是對抗 ARP 欺騙的有效手段；全面阻斷 ARP 數據包會使通信癱瘓，殺毒軟件與操作系統類型均與此第二層攻擊無關。","64":"ISO/IEC 27001 的審計重點是確認信息安全管理體系是否符合標準要求並有效運行與持續改進，着眼於體系的符合性，並非對現有控制的好壞作出評判，故 A 說法不正確；過程方法與 PDCA 模型皆為標準核心內容。","65":"設置網絡連接時限屬於預防性的訪問控制，用於限制可訪問的期間，並不能發現未授權的信息處理活動；記錄並分析系統錯誤日誌與用戶、管理員操作日誌可檢測異常行為，啓用時鐘同步則確保日誌時間可信，供審計比對。","66":"網絡防火牆屬預防性控制，RAID 第 3 級屬糾正性控制，交易日誌屬檢測性控制，分配計算機用戶標識屬預防性控制，銀行對帳單的監督複審屬檢測性控制，故正確順序為 P、C、D、P、D。","67":"風險分析階段的工作是估算風險發生的可能性與影響程度，據以量化風險大小；風險分析準備着重於確定評估範圍與方法，風險要素標識着重於辨識資產、威脅、脆弱性與現有控制措施，風險結果判定則是將風險值與風險準則比較。","68":"威脅真正出現的可能性取決於威脅主體的能力與意圖，而窗戶壞了是與特定脆弱性相關的暴露點：窗戶未修好，威脅借該脆弱性真正出現的可能性增加；窗戶修好，脆弱性被消除，可能性隨之下降。因此只有D的因果方向正確，保持不變、修好後增加、未修好下降均不符合風險關係。","69":"安全控制的選擇應以成本效益與風險接受度為依據綜合取捨，而非單純挑選對業務效率影響最小的措施，否則可能為便利性過度讓步而留下風險；對每項控制做成本收益分析、選定實施時機與位置、評估對正常業務的負面影響皆為正確做法。","70":"風險控制措施越早實施成本越低、效益越高，系統投入使用後才部署往往需改造既有架構，針對性與成本皆較不利，故 C 違反原則；在開發之初即納入風險管理、貫穿系統生命週期、上線後重視殘餘風險管理皆為正確原則。","71":"資產標識的粒度依評估範圍與評估目的而定，可以是服務器與網絡設備等硬件，也可以是業務系統或組織機構，故 A 正確；風險評價針對資產與業務整體而非逐臺設備，脆弱性標識包含配置與技術檢測，威脅亦涵蓋自然災害等因素。","72":"建築物的自動化訪問審計系統記錄出入時間、出入口位置以及是否成功進入等事件數據，供事後追蹤與審計比對；出入的原因屬於人員的主觀意圖，系統無法自動獲取，需由人工登記。","73":"信息安全政策由管理階層宣告安全工作的意向與方向，須說明安全對組織的重要程度、應遵循的法令法規要求以及安全責任的歸屬；資安技術產品的選型範圍屬政策之下的技術規範與採購作業，不應納入政策文件。","74":"數據庫管理員與網絡管理員由同一人擔任違反職責分離原則，在人力無法補足時應以補償性控制降低風險，例如部署審計措施並定期審查其操作記錄；抱怨不作為、消極等待上級增派人力或直接接受該風險，皆未對風險作出處理。","75":"數據所有者最瞭解數據的價值、敏感度與業務需求，依法規與分類政策決定數據的分類等級，並授權他人處理；用戶依既定分類處理數據，安全員與審計員負責推動與檢查，均不承擔決定分類等級的責任。","76":"年度預期損失 ALE 等於單一預期損失 SLE 乘以年度發生率 ARO，即 138000 元乘以 45% 再乘以 0.1，結果為 6210 元；每 10 年發生 1 次對應 ARO 為 0.1，62100 元是漏乘 ARO 所致。","77":"信息系統的策略計劃着眼於組織未來業務目標與信息系統的長期對齊，需分析將來的業務目標以指導安全與信息架構的規劃；硬件採購規範、開發專案的目標日期與年度預算目標屬戰術層或作業層計劃的內容。","78":"ISO/IEC 27002 的控制領域涵蓋信息安全組織、資產管理、人力資源安全、訪問控制、密碼學、物理與環境安全、運營管理、通信安全以及合規性等，並未將內容安全列為獨立的控制領域。","79":"依 GB/T 20988 信息系統災難恢復規範，第二級為備用場地支持，僅要求具備可承接作業的備用場地，不要求部署備用數據處理設備；自第三級起纔要求備用數據處理設備與數據網絡冗餘，等級越高恢復時間目標越短。","80":"完全備份保存全部數據，恢復時只需還原這一份備份即可完成，故恢復時間最快；增量備份須先還原完全備份再依序疊加各次增量，差異備份亦需完全備份加上最後一次差異備份，磁盤鏡像則涉及整機重建，皆較為耗時。","81":"計算機應急響應小組即CERT（Computer Emergency Response Team），負責協調安全事件的響應、預警與通報；FIRST是事件響應組織的國際聯盟，SANA與CEAT均非該機構的規範簡稱。","82":"多組件事故由信息系統多個部分共同作用產生，單一檢測手段難以發現其全貌；集中日誌審計配合事件關聯分析軟件可把分散的告警與日誌聚合，還原完整事件鏈條，因此最為有效。","83":"災難恢復策略實現包括選擇和建設災難備份中心、實現災備系統技術方案以及實現技術支持與維護能力；分析業務功能屬於災難恢復需求分析階段的工作，不在策略實現之列。","84":"拒絕服務攻擊通過耗盡網絡帶寬、主機資源或應用資源，使網絡、主機和應用無法響應合法請求，它消耗的是資源而非破壞應用系統本身，故應用系統被破壞的說法不正確。","85":"保證過程中應先由PA驗證與證實安全，通過觀察、論證、分析和測試取得證據，再由PA建立保證論據加以整合，即前者為後者提供證據支持，D項把兩個過程域的支持關係說反了。","86":"保證過程的任務就是確立安全解決方案的置信度，形成保證論據並把這一置信度傳遞給顧客，使顧客信任安全需求已得到滿足；風險過程用於評估風險，工程過程用於實現安全方案。","87":"SSE-CMM的風險過程由評估威脅、評估脆弱性、評估影響和評估安全風險四個過程域組成，前三項是計算風險結果的輸入，評估安全風險是其綜合輸出；驗證與證實安全屬於保證過程。","88":"在系統安全能力成熟度模型中，達到3級充分定義後組織已建立標準安全過程，可對組織層面的過程進行規範定義；2級僅針對單個項目的計劃與跟蹤，4級和5級是在此基礎上的量化控制與持續改進。","89":"立項階段需要明確業務對信息安全的要求、識別法律法規提出的安全要求，並論證這些安全要求是否正確完善；通過測試證明系統功能和性能滿足安全要求屬於實現與驗收階段的工作，立項時尚無系統可測。","90":"信息安全建設應與信息化建設同步規劃、同步建設、同步運行，安全措施作為信息系統的組成部分在規劃之初即納入總體設計；先建設後補安全既難以融入體系架構，也會大幅抬高成本。","91":"作為甲方監督信息安全工程時，最應關注變更的原因以及變更對安全保障目標造成的影響，確認其不會引入新的風險；流程是否合規、進度是否拖延、記錄是否準確均屬管理性要求，服務於對變更影響的判斷。","92":"概念與需求定義階段應基於法律法規和用戶需求開展需求分析與風險評估，從信息系統建設之初就統籌考慮安全保障；調研產品選型屬於方案階段，落實開發規範屬於實現階段，規定驗收測試內容屬於驗收階段。","93":"測試確需使用生產數據時，測試系統應採用不低於生產系統的訪問控制措施，測試完成後立即清除全部敏感數據，並部署審計記錄生產數據的拷貝與使用情況；為測試數據部署備份與恢復並非必要，反而擴大敏感數據的留存範圍。","94":"我國信息安全保障堅持積極防禦、綜合防範的方針，綜合運用法律、管理和技術手段，相關部門各司其職，並遵循誰主管誰負責、誰經營誰負責的責任原則；C項所稱及時檢測、快速響應、綜合治理並非這一方針的表述。","95":"CC的通用性在於以統一語言規範安全要求描述與測試評估，便於用戶、開發者、評估者和認可者相互溝通，並適應全球化趨勢下合格評定與評估結果國際互認的需要；信息安全建設工程實施成熟度的評估依據的是SSE-CMM等模型，而非CC。","96":"TCSEC將安全保護能力由低到高劃分為D、C1、C2、B1、B2、B3、A1七個等級，A1為驗證保護級，要求對安全策略作形式化描述與驗證並進行隱蔽通道分析，是其中安全程度最高的等級。","97":"第三方服務的變更管理對象既包括第三方服務造成的系統變化，也包括服務商自身在人員、組織與流程上的變化；簽訂服務水平協議並不免除系統安全管理者的責任，協議執行情況的監督同樣屬於其職責。","98":"涉及國家祕密的信息系統開展安全保密測評應依據BMB22-2007《涉及國家祕密的計算機信息系統分級保護測評指南》，它規定了測評的項目與方法；BMB20是分級保護管理規範，GB17859是等級劃分準則。","99":"CC的評估保障級由低到高依次為EAL1至EAL7共七個級別；A1、B2、B3等屬於TCSEC的安全保護等級，E0至E6與AD0至AD6均不是CC所定義的評估級別。","100":"全國信息安全標準化技術委員會（TC260）下設的WG7工作組負責信息安全管理類標準的研製，涵蓋信息安全管理體系、風險評估與安全管理等內容；其餘工作組主要承擔密碼技術、網絡與系統安全等方向的標準工作。","101":"信息安全保障以支撐業務目標的實現為最終目的，從風險和策略出發，在信息系統生命週期內綜合運用管理、技術、標準等保障要素，持續確保信息的保密性、完整性和可用性；它並非與信息安全概念同時產生，也不與技術並列構成兩大手段。","102":"ATM終端在取款過程中發生故障後，銀行系統及時對賬戶餘額進行衝正，糾正了交易產生的錯誤數據、使賬目恢復準確一致，屬於數據完整性的保護；限制連接數保障的是可用性，審計功能用於事後追溯，鎖櫃保管文件屬於物理保密措施。","103":"依據GB/T20274，信息系統安全目標（ISST）是從建設者的角度描述的信息系統安全保障方案，說明系統應當具備的安全功能與保障要求，供設計、實現和評估參照；所有者與評估者角度描述的是安全保障要求與評估活動。","104":"常見密碼系統包含明文(待加密的消息)、密文(加密後的消息)、密鑰(加密和解密使用的參數)、加密算法(將明文轉換為密文的規則)、解密算法(將密文轉換為明文的規則)。信道是消息傳輸的通道,不屬於密碼系統基本元素;摘要是哈希函數的輸出結果,不是密碼系統基本元素。所以選C。","105":"認證中心CA的職責是受理證書申請、在請求實體與其公鑰之間建立並簽署綁定關係、發放並分發用戶證書、撤銷和中止用戶證書；CA自身公鑰的產生與分發由上級CA和目錄倉庫（Repository）負責，可以不由該CA本身完成，故B為答案。","106":"VPN在公共網絡上以隧道承載數據，其安全功能體現為加密保護傳輸數據的保密性、鑑別確認通信雙方的身份、以及通過密鑰管理保障密鑰的安全生成與更新；防火牆與撥號屬於網絡接入手段，壓縮屬於性能優化，均非安全功能。","107":"審計系統由日誌記錄、日誌分析和日誌報告三部分組成：日誌記錄採集原始事件，日誌分析從中發現異常並做關聯，日誌報告將結果呈現給管理人員以支持處置；日誌處理並非其標準組成劃分。","108":"OSI 參考模型的安全服務由網絡層與應用層提供，這兩層可以覆蓋保密性、身份鑑別、數據完整性、抗抵賴和訪問控制服務，因此本題選A（網絡層）。表示層主要負責數據格式轉換、加密與壓縮等語法語義處理，並不提供身份鑑別服務；會話層負責會話管理；物理層不提供上述安全服務。（部分資料把本題答案標為 B 表示層，屬來源標註錯誤。）","109":"HTTPS在HTTP之下加入SSL/TLS安全層，對傳輸內容加密，竊聽者難以獲得其中的信息；FTP與TELNET以明文傳輸賬號口令和數據，TACACS+僅對認證授權報文加密，其建立之後的鏈接數據仍可能被竊聽。","110":"權限串rwxr-xr-x表示文件擁有者具有讀、寫和執行權限，所屬組成員與其他用戶均為r-x，即既能讀也能執行；D項稱其他用戶只能執行，遺漏了其讀權限，屬於解釋錯誤。","111":"在Unix系統中，/etc/services文件記錄常用服務接口（端口號與協議）同其所提供服務的對應關係，供網絡程序查詢服務對應的端口；決定inetd啓動哪些服務的是inetd.conf文件。","112":"數據庫事務日誌按順序記錄各事務對數據的修改，在系統故障時用於回滾未提交事務並重做已提交事務，從而把數據庫恢復到一致狀態，其用途是數據恢復；事務處理、完整性約束與保密性控制由其他機制實現。","113":"X.500是目錄服務標準，用於組織和查詢目錄信息，與電子郵件系統無關；X.400是報文處理即電子郵件標準，PEM與PGP則用於郵件的加密保護和數字簽名，均服務於郵件系統的安全。","114":"域名註冊信息（註冊人及聯繫方式、註冊與到期日期、域名服務器等）保存在whois數據庫中，可通過whois查詢獲得；路由表與MIBs庫屬於網絡運行管理信息，DNS記錄只把域名解析為地址，均不含註冊信息。","115":"no ip directed-broadcast用於關閉定向廣播，可阻止攻擊者僞造受害者地址、向網絡廣播地址大量發送ICMP回顯請求，從而利用廣播放大攻擊主機的Smurf攻擊。","116":"Fuzz測試通過構造大量畸形、非法的輸入數據驅動被測對象，觀察其異常與崩潰以發現軟件漏洞和可靠性錯誤，是一種有明確方法論依據的自動化漏洞測試；C項稱其沒有任何理論依據，不屬於Fuzz測試的特性。","117":"風險評估方法的選定在PDCA循環的建立（Plan）階段完成，即在體系建立時確定評估的對象、範圍、準則與方法；實施和運行、監視與評審、保持和改進階段則按既定方法執行、檢查並持續優化。","118":"ISO27002的前身是ISO/IEC 17799:2005，標準編號中並不存在ISO17799-1，故A的說法錯誤；該標準提出十一大類安全管理措施、其中風險評估與處置處於核心地位，對每項控制措施按控制措施、實施指南與其他信息三部分描述，並給出供組織選用的最佳實踐而非全部內容，B、C、D均為正確說法。","119":"建立背景（對象確立）階段要弄清評估對象的體系結構、安全環境與技術特性，明確評估範圍與準則；制定風險管理計劃屬於風險規劃階段的工作，不應在建立背景過程中完成。","120":"設置網絡連接時限是限制會話存續時間的預防性訪問控制措施，用於縮小暴露窗口，並不能發現未經授權的信息處理活動；記錄並分析系統錯誤日誌、用戶與管理員操作日誌，並啓用時鐘同步保證審計時間可信，屬於檢測手段。","121":"災難恢復是在風險事件造成損害後恢復業務與數據的糾正性機制，屬於事後補償性控制；訪問控制與防病毒系統偏重事前預防，入侵檢測屬於檢測性機制，均不是糾正機制。","122":"威脅真正出現的可能性取決於威脅主體的能力與意圖，而窗戶壞了是與特定脆弱性相關的暴露點：窗戶未修好，威脅借該脆弱性真正出現的可能性增加；窗戶修好，脆弱性被消除，可能性隨之下降。因此只有D的因果方向正確，保持不變、修好後增加、未修好下降均不符合風險關係。","123":"日誌須具備統一精確的時間戳、全面覆蓋系統資產，並記錄訪問源與訪問活動等要素，同時嚴格限制讀取權限；讓系統所有用戶方便讀取會破壞日誌的機密性與完整性，故不是必需特徵。","124":"SSE-CMM是面向系統安全工程的能力成熟度模型，屬於過程能力方案（Continuous），按過程域度量能力成熟度，可靈活選擇評估和改進的過程域；把它說成屬於組織能力方案（Staged）是錯誤說法。組織能力方案中每個能力級別對應一組已定義的過程域，過程能力方案則以公共特徵衡量單個過程域的成熟程度，A、B、C的表述均正確。","125":"SSE-CMM 由風險過程、工程過程、保證過程三大過程組構成，評估活動只是貫穿其中的能力度量手段，並不作為獨立的主要過程，故評估過程不屬於其主要過程。","126":"信息安全保障工作堅持安全保障措施與信息化建設同步規劃、同步建設、同步運行的三同步原則，安全必須內生於信息化建設的生命週期，而非在信息化完成之後才另行開展。","127":"信息安全工程監理模型由監理諮詢服務、諮詢監理支撐要素和監理諮詢階段過程三部分構成，用以規範監理活動的實施；控制管理措施屬於信息安全保障中的風險控制內容，不在該監理模型的組成之內。","128":"我國信息安全保障工作堅持積極防禦、綜合防範的方針，實行誰主管誰負責、誰運行誰負責的原則，並綜合利用法律、管理和技術手段；及時檢測、快速響應只是運維環節的要求，並非總體方針。","129":"ISO27001、ISO13335 與 GB/T22080 均屬信息安全管理類標準，而 GB/T18336 等同採用通用評估準則，用於評價信息系統的安全性，屬於安全性評估標準而非安全管理標準。","130":"SSE-CMM 是建立並度量安全工程過程成熟度的標準，關注安全工程過程的實施與改進；對信息系統安全等級進行評估屬於安全性評估與等級保護標準的範疇，並非 SSE-CMM 的用途。","131":"刑法第二百八十五條至二百八十七條規定了非法侵入計算機信息系統罪、破壞計算機信息系統罪以及利用計算機實施其他犯罪三類內容，並未規定國家重要信息系統管理者翫忽職守罪。","132":"合法原則要求計算機取證自始至終符合法律法規，取證主體、技術手段與證據保全程序均須合法，證據才具備法律效力；先獲取證據再補辦法律手續的做法違反合法原則。","133":"等級保護的定級階段包括兩個步驟：先對信息系統進行識別與描述，明確定級對象及其業務與資產情況，再依據受侵害客體和對客體的侵害程度確定系統的安全保護等級，即“系統識別與描述”加“等級確定”。原題庫在本題同時標註了(A)(B)，屬題源自身存疑；按《信息系統安全等級保護定級指南》的定級流程，規範表述為系統識別與描述、等級確定。","134":"《計算機信息系統國際聯網保密管理規定》由國家保密局制定，規範國際聯網中的保密要求；公安部主管計算機信息系統安全保護等級評定與網絡安全監察，工信部主管行業信息化管理。","135":"信息安全保障是通過技術、管理、工程等手段對信息資源的保密性、完整性、可用性予以保護，最終使信息系統所有者對業務持續運行獲得信心，即由客觀風險到主觀信心的過程。","136":"信息安全從信息技術安全演進到信息安全保障，根本動因在於信息系統承載着組織機構的業務使命，安全必須服務於使命的完成，僅依靠單點技術防護已不足以支撐業務目標的持續達成。","137":"通信安全階段以密碼技術保障傳輸信息的保密性，其關注重點僅是機密性；完整性與可用性是計算機安全與信息安全階段才系統納入的需求，故該說法錯誤。","138":"網絡戰士通常具備國家背景的資源、專業技戰能力與強大破壞力，在技術能力、所擁有的資源和破壞力三個維度上均高於個人黑客、網絡犯罪團伙與商業間諜，因此威脅最大。","139":"信息系統安全從技術、管理、工程三個方面進行評估：技術體系考察安全措施的有效性，管理體系考察安全制度及其執行，工程體系考察安全建設的實施過程與能力。","140":"完整性機制通過校驗、消息摘要與數字簽名等手段保證數據在傳輸和存儲中未被非法改動，可防範數據被篡改或破壞；竊聽屬於機密性問題，假冒與抵賴分別由鑑別與抗抵賴機制解決。","141":"P2DR 即 PPDR 動態安全模型，由策略、防護、檢測、響應四個要素構成，以策略為核心形成防護、檢測、響應的動態閉環；加密只是防護環節的一種具體技術手段，不是模型的獨立要素。","142":"確定信息系統安全保障需求時，應依據法規政策的要求、系統所承載的價值以及系統需要對抗的威脅綜合確定；系統的技術構成屬於安全實現的細節，不作為安全保障需求的確定因素。","143":"GB/T20274《信息系統安全保障評估框架》中，信息系統安全目標的評估對象是信息系統整體，並具體涵蓋信息系統安全管理、信息系統安全技術、信息系統安全工程三個方面，因此完整表述須包含“信息系統整體”，只列三項的選項不完整。","144":"信息安全保障管理體系建設應重點考慮國家與上級機關的政策法規要求、組織的業務使命以及信息系統面臨的風險；項目經費預算屬於實施過程中的資源約束，不是體系建設的核心考慮因素。","145":"公鑰密碼的應用包括數字簽名(利用私鑰簽名、公鑰驗證)、非安全信道的密鑰交換(如Diffie-Hellman密鑰交換)、身份認證等。消息認證碼(MAC)通常使用對稱密鑰,不屬於公鑰密碼應用。所以選C。","146":"哈希算法的碰撞是指找到兩個不同的消息，其計算得到的消息摘要完全相同；碰撞會削弱摘要的抗篡改能力，因此密碼應用要求哈希算法具備強抗碰撞性。","147":"DSA 是數字簽名算法，只能用於生成和驗證數字簽名，從而保證數據完整性與來源認證，不能用於對數據加密；加密需使用 RSA 等公鑰加密算法。","148":"PKI/CA 通過數字證書將公鑰與身份綁定，解決身份鑑別、完整性、機密性與抗抵賴問題；可用性是系統與服務的運行屬性，授權與訪問控制由訪問控制機制實現，二者均非 PKI/CA 要解決的問題。","149":"VPN 是用戶利用公用網絡建立的臨時性邏輯安全連接，通過隧道與加密技術實現遠程接入，並非租用與公共網絡隔離的物理專線；它同時提供身份認證、數據加密與完整性保護。","150":"訪問控制依據安全策略對主體的訪問請求進行允許或拒絕，核心目的是防止對系統資源的非授權訪問；資源的可靠性、可追查性與可信性分別由可靠性保障、審計等機制承擔。","151":"自主訪問控制由客體的所有者即創建者自主決定並授予其他主體對該客體的訪問權限，客體本身不具備決定權限的能力，故該說法不正確；其優點是靈活易擴展，缺點是難以實施統一強制的安全策略。","152":"ChineseWall 模型通過利益衝突類約束主體的訪問，同時保護保密性與完整性，多用於存在利益衝突的業務場景；只關注完整性的模型是 Clark-Wilson 模型與 Biba 模型，故該說法錯誤。","153":"BLP 模型中簡單安全規則要求不上讀，*-規則要求不下寫，即主體只能向等於或高於自身安全級的客體寫入數據，應表述為向上寫而非向下寫，故該說法不正確。","154":"ChineseWall 模型規定同一利益衝突域內的數據集只能訪問其中一個，訪問其一即禁止訪問同域內的其他數據；Y 與 Z 同處一個利益衝突域，因此無論是否訪問過 W，該用戶都只能訪問 Y 與 Z 中的一個。","155":"RBAC 模型將權限賦予角色、由角色關聯用戶，用戶必須被指派並激活某一角色後才能對對象執行操作；模型不依賴安全級，一個用戶可以擁有多個角色，權限也不直接與用戶關聯。","156":"Kerberos 協議分為三個步驟：客戶端先向認證服務器獲得票據許可票據，再向票據授予服務器換取服務許可票據，最後憑服務許可票據嚮應用服務器獲得所需的服務。","157":"非集中訪問控制中的域是指共享同一安全策略的主體與客體的集合，各域的訪問控制彼此獨立，跨域訪問必須事先建立信任關係，且信任可以是單向的，不必要求雙向。","158":"單點登錄是同一用戶在多個應用系統之間安全憑證的傳遞與共享，用戶一次認證即可訪問多個系統，從而便於使用、管理與開發；其憑證並不在多個用戶之間傳遞共享，故該說法不正確。","159":"在 ISO 的 OSI 安全體系結構中，抗抵賴安全服務由數字簽名機制提供，可證明數據來源及內容未被篡改，防止發送方否認已發送的行為；加密提供機密性，訪問控制與路由控制屬於訪問控制機制。","160":"WPA2 依據 IEEE 802.11i 標準實現幷包含其全部安全特性，採用 AES 加密與 802.1X 端口認證；802.11b、802.11c、802.11g 分別規定無線傳輸速率、橋接與傳輸標準，與安全特性無關。","161":"防火牆部署於網絡邊界，依據安全策略對進出數據流進行許可與拒絕，其主要功能正是訪問控制；內容過濾、查殺病毒需由專用網關完成，數據加密則由密碼技術實現，均非防火牆的核心功能。","162":"應用層防火牆工作於OSI模型第七層，能針對應用協議深度檢查，有效阻擋應用層攻擊且便於審計；但因需代理轉發、處理開銷大，其速度較慢且對用戶並不透明，故“速度快且對用戶透明”不是其特點。","163":"入侵檢測系統通過監控和分析用戶與系統活動、統計異常活動模式並比對已知攻擊特徵來發現入侵，屬於檢測手段；它不具備修復被破壞數據的能力，數據修復屬於應急響應與恢復階段的工作。","164":"SAM是Windows的用戶賬號數據庫，以註冊表形式存放於系統目錄下的sam文件，並由安全賬號管理器服務訪問操作；其中administrator與system賬號的信息為只讀，不可寫入，故該項說法錯誤。","165":"計算機病毒具有可感染性與依附性，必須寄生在引導區、可執行文件等載體之中，並通過複製把自身感染到其他程序或系統，本身不能獨立運行，因此正確描述是可感染、依附性。","166":"信息安全漏洞存在於網絡協議、操作系統、應用系統等技術環節，是設計、實現、配置或使用中的缺陷；業務數據本身是需要保護的資產與對象，並不構成漏洞的載體。","167":"社會工程利用人的心理弱點，通過欺騙、誘導等方式使用戶或系統管理員主動泄露口令等敏感信息，從而使攻擊者獲得系統資源的訪問權限；非法竊取、電子欺騙、電子竊聽均屬非主動泄露的技術手段。","168":"在安全開發生命週期的需求分析階段，核心任務是通過安全需求分析確定軟件必須遵循的安全標準及相關安全要求，為後續設計、編碼與測試提供依據；確定安全技術與工作量屬於後續環節的工作。","169":"信息安全管理者的各項日常工作，包括保護軟硬件、監視人員行為、阻礙並發現入侵等，最終都服務於同一根本目標，即保護組織的信息資產的機密性、完整性與可用性。","170":"信息安全管理的根本方法是風險管理，它貫穿信息系統全生命週期，以風險評估、風險處置、監督評審等活動持續指導安全決策；風險評估與風險處置只是其中的環節，應急響應屬於運營層面的措施。","171":"信息安全管理體系是組織整體管理體系的組成部分，具有明確的範圍與邊界，其基本過程遵循PDCA循環持續改進；風險評估只是體系運行中的一項活動，管理體系本身並非風險評估的手段，故該項不正確。","172":"PDCA模型又稱戴明環，通過計劃、實施、檢查、處置四個環節實現持續改進，既適用於組織整體活動，也適用於單個過程乃至個人，形成大環套小環逐層解決問題，故“不適合單個過程以及個人”的說法不正確。","173":"在PDCA模型中，計劃環節着重建立環境與目標，實施環節執行風險處理計劃，檢查環節持續監視與評審風險，處置環節則依據檢查結果採取糾正與預防措施，持續改進信息安全管理過程。","174":"PDCA循環必須按計劃、實施、檢查、處置的順序依次推進、週而復始，組織每個部分乃至個人均可形成大環套小環的循環，每輪循環後總結並提出新目標；不能由任意階段隨意開始，故該項描述不正確。","175":"在信息安全管理體系中，信息安全教育與培訓屬於實施和運行階段的活動，在體系建立後需面向全體員工落實安全意識提升與技能培訓，使安全策略真正落地；建立階段着重策劃，監視和評審階段着重檢查。","176":"PDCA由計劃、實施、檢查、改進四個環節構成，又稱戴明環，是適用於任何一項活動有效開展並持續改進的通用管理方法，並非只能用於信息安全管理體系，故該項描述不正確。","177":"風險管理的目的是認識風險並採取措施將風險降低到可接受的水平，風險不可能被徹底消除，故該項“將風險消除”的表述不正確；其餘關於風險管理構成、貫穿生命週期及規劃階段開展評估的說法均正確。","178":"風險是指需要保護的資產發生損失的可能性，它是威脅、漏洞以及二者相互作用後的綜合結果；設備只是資產的一種形態，攻擊目標與威脅事件無法完整表達風險的構成要素。","179":"抵賴是指通信一方事後否認曾經發生的通信事實，包括髮信者否認發送過某條消息或其內容、收信者否認接收過某條消息；收信者接收消息後篡改其中內容屬於破壞數據完整性，是篡改而非抵賴。","180":"風險不可能被完全消滅，信息安全追求的是將風險降低並控制在組織可接受的範圍之內，以此作為判斷系統是否安全的最合理標準；追求消滅風險或抵抗大部分風險都不現實，自適應模型只是實現手段。","181":"風險轉移是把風險的部分責任轉嫁給第三方，典型做法是購買保險或聘用第三方專業公司提供運維外包服務；部署綜合安全審計系統、實時監控網絡行為、制訂制度體系都屬於組織自身的降低風險措施。","182":"對操作系統打補丁和系統升級旨在修復已知漏洞、減少被利用的可能性，從而降低風險發生的概率與影響程度，屬於降低風險的控制措施；規避是停止使用該系統，轉移是交由第三方承擔，接受則是不採取措施。","183":"可接受風險是組織在衡量資產價值、處置成本與收益後認可並願意承擔的風險，因而具有一定合理性；總風險是處置前的整體風險，殘餘風險是風險處置之後仍然存在的風險，最小化風險則是控制的目標。","184":"監控審查的目的一是保證風險管理過程按既定方法有效執行並持續運行，二是保證風險管理成本的有效性，使安全投入與收益相匹配；其重點在於過程與成本，而非直接認可某項具體決定。","185":"風險管理遵循固定順序：先建立背景以確立對象與範圍，繼而開展風險評估以標識、分析和評價風險，再依據評估結果進行風險處理，最後批准並持續監督；審覈批准不能先於風險處理出現。","186":"建立背景即對象確立階段包括風險管理準備、信息系統調查、信息系統分析、信息安全分析四項活動，目的是明確評估對象與範圍、掌握系統現狀並確定安全要求；風險管理政策的制定屬於其後的環節。","187":"風險分析方法並無絕對優劣，定量與定性各有適用場景與所用工具，組織也可結合使用而非僅限一種；能夠滿足組織自身要求、文化與資源條件的風險評估方法就是最優方法，故該項描述正確。","188":"信息資產的分類與分級應由信息資產所有者負最終責任，因其最瞭解資產的價值、敏感性與受損後的影響；高級管理層負責制定方針與授權，部門經理與最終用戶僅在授權範圍內執行和使用。","189":"職責分離要求相互制約的崗位不得由同一人擔任，系統開發、計算機操作與系統維護之間必須分離以防舞弊；安全管理與變更管理同屬管理監督職能，由同一人執行不會產生自我審批的衝突，故可以合併。","190":"最小特權原則指一個人僅擁有其執行崗位所必需的足夠許可與權限，不多也不少，以此限制越權訪問和誤操作；選項A描述的是崗位輪換，B描述的是職責分離，D描述的是防止權限累積。","191":"災難恢復演練按深度由低到高分為系統級、應用級、業務級三個級別：系統級僅驗證單個系統的恢復能力，應用級驗證相關應用系統的整體恢復，業務級則檢驗整個業務運行的連續性，深度逐級遞增。","192":"崗位輪換要求組織內的敏感崗位不能由一個人長期負責，定期輪換可防止長期把持關鍵職權而形成舞弊與單點依賴，並降低人員離職帶來的風險；B是職責分離，C是最小特權，D是防止權限累積。","193":"構建內部安全管理組織體系必須獲得高級管理層對安全工作的承諾與支持、要求僱員遵從安全策略、清晰定義部門與崗位職責；在第三方協議中強調安全屬於外部相關方管理內容，並非內部體系的必需項。","194":"災難發生後，系統和數據必須恢復到的時間點要求即恢復點目標RPO，它限定允許丟失的數據量；恢復時間目標RTO約束的是恢復所需時長，數據狀態與運行狀態均非災難恢復指針的規範表述。","195":"發現信息系統遭受攻擊時，首先應與有關部門聯繫，按應急預案啓動響應並統一協調處置，以保證合法合規、協同有序；切斷通信線路、遏制攻擊行為、判斷破壞範圍都應在協調之後依預案實施。","196":"應急方法學將安全事件處理定義為準備、檢測、遏制、根除、恢復、跟進六個階段的固定順序：先檢測並確認事件，再遏制以控制影響範圍，繼而根除事件根源、恢復系統正常運行，最後總結跟進。","197":"備份應用系統數據時，首先必須明確需要備份哪些數據，即確定備份的範圍與內容，這是制定備份策略的前提；何時備份、何處備份以及如何存儲備份，都屬於確定內容之後的調度與實現問題。","198":"在系統安全工程能力成熟度模型的保證過程中，是PA驗證與證實安全為PA建立保證論據提供證據支持，論據建立在驗證結果之上；該項把兩者的支持方向說反，故錯誤，其餘關於保證與信任程度的表述均正確。","199":"能力成熟度模型的核心思想是組織的能力取決於其業務過程是否被嚴格定義、管理完善且可測可控，通過過程的持續改進提升能力；它着眼過程而非僅考察工程成果，其出發點與統計過程控制理論一致，也並非因信息安全而誕生。","200":"系統安全工程能力成熟度模型中，計劃和跟蹤級着重於項目層面的過程定義、計劃與執行，確保項目按計劃實施並得到跟蹤；組織層面的過程裁剪屬於定義級，系統化測量屬於量化管理級。","201":"信息安全工程監理的職責是對承建單位的工作進行審覈、監督與驗收把關，驗收測試方案應由承建單位編制，監理只負責審覈方案、監督測試過程並審覈測試報告，故編寫方案不屬於監理工作。","202":"工程監理受建設單位委託，作用是彌補其技術管理經驗的不足、改善雙方溝通並促進項目保質按期完成；攻克技術難點屬於承建單位自身的技術職責，監理不代為解決。","203":"TCSEC 將計算機系統安全劃分為D、C、B、A四大類，其中C類與B類又各分兩小級，共為四個大的等級，因此答案為4。","204":"信息系統的安全保護等級由系統的業務依賴程度和受破壞後的影響所決定，是系統固有的客觀屬性，在定級時不應受已採取或將採取的安全措施、風險評估結果的影響，且需同時考慮業務信息與服務安全兩方面。","205":"按GB/T 24364-2009，應急響應過程依次為準備、確認（檢測）、遏制、根除、恢復和總結，因此第二步是確認，即對安全事件進行監測與覈實。","206":"CC（通用準則，ISO/IEC 15408）由多國聯合制定並被國際廣泛採納，是目前國際通行的信息技術產品安全性評估標準；TCSEC、ITSEC為歐美早期準則，IATF屬防護框架。","207":"《信息安全等級保護管理辦法》規定等級保護實行自主定級、自主保護，由公安等部門監督檢察，跨省或全國聯網系統可由主管部門統一確定等級；涉及國家祕密的信息系統按涉密系統實行分級保護，並非按該辦法進行分等級保護。","208":"《保守國家祕密法》《刑法》《國家安全法》均由全國人大或其常委會制定，屬國家法律；《信息安全等級保護管理辦法》由公安部等四部門聯合發佈，屬部門規範性文件，不屬於國家法律。","209":"依據我國信息安全管理體系，黨政機關信息網絡的安全保衛工作由國家安全機關負責；公安機關負責公共信息網絡安全監察，保密部門負責保密工作，密碼主管部門負責密碼管理。","210":"《商用密碼管理條例》規定密碼管理機構主管全國商用密碼管理，商用密碼技術屬國家祕密並實行專控，產品由許可單位銷售；任何單位和個人不得使用未經批准的商用密碼產品，故D項表述與條例相反。","211":"公鑰密碼體制中經常使用到的困難問題包括大整數分解(如RSA算法基於該問題)、離散對數問題(如Diffie-Hellman密鑰交換、DSA算法基於該問題)、揹包問題等。僞隨機數發生器不是公鑰密碼體制中經常使用的困難問題,它是用於生成隨機數的工具。所以選D。","212":"RSA公鑰密碼算法既可以用於數據加密,也可以用於密鑰交換。DSS(數字簽名標準)主要用於數字簽名;Diffie-Hellman主要用於密鑰交換,不能直接用於數據加密;AES是對稱密碼算法,不屬於公鑰密碼算法。所以選C。","213":"AH協議提供數據源認證、數據完整性校驗、防重放和訪問控制，但其頭部不含加密字段，不加密載荷，故不能提供機密性；機密性需由ESP協議提供。","214":"我國至今未頒佈《信息安全法》，2017年施行的《網絡安全法》纔是相關法律，故D項說法錯誤；其餘關於增強全民信息安全意識、加強政府信息系統安全保密管理、四部委發佈等級保護管理辦法的表述均屬實。","215":"信息安全保障要素通常概括為技術、管理與人才（人）三方面，並通過工程實踐加以落實，形成技術、工程、管理協同的立體保障；組織並非與三者並列的保障要素。","216":"產品選購屬於信息安全保障的規劃設計階段工作；運行階段的安全工作包括安全評估、監控、備份與災難恢復等持續性運維活動，用以維持系統的安全狀態。","217":"信息安全風險管理是圍繞風險開展識別、評估、處置與監控的持續過程，既要了解風險，也要通過規避、降低、分擔或接受等方式控制風險；僅瞭解或僅轉移都失之片面。","218":"“看不懂”指未授權者即使取得數據也無法理解其內容，對應保密性服務，通過數據加密實現；身份認證對應“進不來”的准入，數據完整性對應“改不了”，訪問控制對應越權限制。","219":"拒絕服務攻擊通過耗盡系統資源、佔滿帶寬或使服務崩潰，令授權用戶無法正常獲得服務，直接損害的是信息系統與信息的可用性，並不破壞數據的完整性與保密性。","220":"VPN（虛擬專用網）利用隧道、加密與認證技術在公共網絡上構建邏輯專用通道，主要用途是建立安全的網絡通信；身份鑑別、行為審計與邊界訪問控制只是輔助功能或他類設備職責。","221":"SSL中客戶端用服務器公鑰加密並交換會話密鑰，公鑰還可用於驗證對方數字簽名的真實性並加密數據；私鑰用於解密會話密鑰與生成簽名，不能用於驗證簽名，故含私鑰驗證簽名的說法不成立。","222":"VPN通過身份驗證確認對端合法，通過加密保證傳輸機密性，通過校驗保證數據完整性；它無法保證網絡與業務系統的可用性，可用性需依靠冗餘、抗攻擊與容災措施保障。","223":"SSL工作在傳輸層與應用層之間，可被應用程序直接集成，實現簡單、易於配置；IPSec工作在網絡層，需配置網關與安全關聯，部署較複雜，且二者加密強度取決於所選算法。","224":"在Windows運行對話框中輸入Regedit即可啓動註冊表編輯器；Regsvr32用於註冊組件，組策略編輯器為gpedit.msc，選項中帶.msc、.mmc後綴的寫法均不存在。","225":"Windows安全中心自Windows XP Service Pack 2起引入，集中管理防火牆、自動更新與防病毒軟件狀態；NT、2000及2003版本均無此組件。","226":"Linux系統中root是超級用戶，UID為0，擁有對系統的最高權限；administrator是Windows的內置管理員賬戶，mail與nobody為權限極低的系統服務賬戶。","227":"電子郵件炸彈指利用程序在極短時間內向目標郵箱發送海量郵件，使郵箱空間被填滿、郵件服務癱瘓，屬於拒絕服務類攻擊；惡意鏈接、帶毒附件與恐嚇郵件分別屬於釣魚、病毒與社會工程。","228":"DNS同時使用UDP與TCP：域名查詢默認走UDP的53端口以追求效率，區域傳送等大數據量傳輸走TCP的53端口；SMTP、HTTP、FTP均只使用TCP。","229":"特洛伊木馬僞裝成有用或合法的程序誘使用戶主動運行，從而在後臺開啓後門、竊取信息；計算機病毒依附於其他程序並自我複製，蠕蟲可獨立傳播，邏輯炸彈則潛伏於程序內部。","230":"蠕蟲不依附於宿主程序，是可獨立運行的程序，並能利用網絡漏洞自主傳播、感染其他主機，因此具備可感染性與獨立性；病毒才具有依附性。","231":"“不感染、依附性”是木馬、後門、陷門的共同特點，它們需寄生於宿主程序且不主動感染其他文件；蠕蟲可獨立運行並主動感染網絡中的其他系統，故不具備該特點。","232":"漏洞掃描器通過比對漏洞特徵庫對主機、網絡設備與應用進行探測，用於識別系統中存在的脆弱性；防火牆與UTM用於邊界防護，IDS用於檢測入侵行為。","233":"包過濾防火牆工作在網絡層，只依據源與目的IP地址、端口、協議類型等報頭字段做粗粒度判斷，無法從細微之處分析數據包內容，但處理速度非常快，正是題目描述的優缺點；應用級網關與會話層網關能深入分析報文內容，代價是速度較慢。","234":"社會工程利用人的心理與信任獲取敏感信息，電話套問用戶名與口令是典型手段；緩衝區溢出與SQL注入屬於技術漏洞攻擊，PKI/CA是構建信任體系的技術。","235":"IDS可識別並報告數據文件的改動、統計分析異常活動模式並提升系統監控能力，屬於檢測手段；網絡協議自身的設計弱點需通過協議升級與安全配置解決，IDS無法彌補。","236":"防火牆部署於網絡邊界，依據預設規則允許或拒絕數據流通過，其最本質的功能是訪問控制；內容過濾、數據加密與查殺病毒並非防火牆的核心功能，需由專用系統承擔。","237":"需與互聯網通信的Web服務器應置於DMZ（非軍事區），對外提供服務的流量經防火牆受控放行，同時與內部網絡隔離，即使服務器被攻陷也難以直接威脅內網；置於內網風險過大，置於防火牆外則完全失去保護。","238":"路由器是三層設備，轉發時檢查數據包的目的IP地址，查找路由表確定下一跳與出接口；MAC地址用於同一鏈路內的幀交付，ARP用於IP到MAC的解析。","239":"包過濾型防火牆依據ACL（訪問控制列表）中定義的源地址、目的地址、協議及端口等條件對數據包進行匹配與放行或丟棄；路由表決定轉發路徑，NAT用於地址轉換。","240":"包過濾防火牆只檢查IP頭、TCP/UDP頭中的源地址、目的地址、協議號與端口等信息，不檢查數據包的有效載荷內容，故無法發現應用層惡意數據，需由應用代理或IDS補充。","241":"NAT工作於網絡層，只完成網絡層地址轉換，可隱藏內部真實地址、緩解公網IP地址不足並擴充私有地址空間的使用；對應用層協議進行代理屬於應用代理防火牆的功能，並非NAT所能實現。","242":"要限制telnet協議的具體命令，必須深入應用層解析協議內容，只有應用代理型防火牆能做到；包過濾與狀態檢測只識別IP地址、端口、協議和連接狀態，無法識別命令內容，NAT只做地址轉換，不提供命令級過濾。","243":"防火牆外網口與內網口各自配置了不同網段的IP地址，需在三層進行路由轉發並依策略過濾流量，屬於路由模式；透明模式接口不配置IP地址，代理模式則需應用層代理進程。","244":"防火牆部署於內網與互聯網的邊界，依訪問控制策略阻斷外部對內網的未授權訪問與攻擊；對內部人員發起的攻擊以及合法服務自身的應用層攻擊，防火牆難以有效防範。","245":"主機入侵檢測部署於被保護主機內部，監控本機日誌、特定用戶活動與系統運行狀態，可精確判斷攻擊是否成功；其視角侷限於本機，無法監測針對其他服務器的攻擊行為。","246":"實時分析網絡數據並檢測網絡系統非法行為是網絡入侵檢測系統的功能；主機入侵檢測依託主機本地資源與日誌運行，必然佔用本機資源並增加主機負擔，故該要求無法成立。","247":"基於異常的檢測技術先建立正常行為基準模型，凡偏離基準者即判定為攻擊，因而能發現特徵庫中沒有的未知攻擊；基於誤用的檢測只能比對已知攻擊特徵，無法標識未知手法。","248":"探頭要看到到達DMZ服務器的攻擊流量，就應鏡像防火牆DMZ區接口的流量；鏡像內網核心交換機看不到進入DMZ的流量，鏡像互聯網接口則只能看到地址轉換前的外部流量。","249":"注入攻擊源於程序對用戶輸入缺乏過濾，屬應用層問題，防火牆一般難以防範，注入成功後攻擊者可取得部分數據操作權限；防範重點在程序與數據庫層面，與操作系統版本及安全補丁關係不大，故C說法錯誤。","250":"攻擊者先竊聽網絡流量截獲密碼等憑據，再原樣重發該憑據以通過身份認證、完成未授權訪問，屬於重放攻擊；窮舉與字典攻擊靠大量猜測口令，社會工程攻擊則依靠欺騙人員。","251":"SYN Flood利用TCP三次握手的半連接狀態，耗盡服務器的連接隊列與內存等資源，使正常用戶無法建立連接，破壞的是系統的可用性，並不涉及保密性、完整性或真實性。","252":"當網絡出現擁塞時，路由器向源主機發送ICMP源抑制報文，要求源端降低數據發送速率以緩解擁塞；路由重定向用於更改下一跳，目標不可達用於數據包無法交付的情形。","253":"反覆向系統提交大量用戶名與口令組合、逐一嘗試直至命中正確口令的方式即密碼暴力破解；密碼分析針對密文求解，密碼嗅探是竊聽傳輸中的口令，賬戶信息收集僅獲取用戶清單。","254":"NTFS通過加密文件系統EFS對文件實現加密存儲，是Windows支持文件加密的文件系統；FAT16與FAT32不提供文件加密功能，EXT3則為Linux使用的文件系統。","255":"屏幕保護密碼只防止他人操作已登錄的終端，對遠程口令暴力破解毫無阻礙；賬戶鎖定策略可提高破解成本，更改內置管理員用戶名與設置強口令均能降低被猜解的風險。","256":"每一項開放的服務都可能成為攻擊入口，關閉非必要服務可縮小攻擊面，避免攻擊者利用服務漏洞或服務權限實施非法操作從而危害系統；穩定性與資源消耗並非主要安全目的。","257":"以管理員身份從遠程終端登錄屬於身份認證事件，記錄在Windows安全日誌中，可據此覈實登錄賬號、來源地址與時間；系統日誌、應用程序日誌與IIS日誌均不記錄此類認證事件。","258":"U盤病毒多借助Windows對可移動媒體的自動播放功能，在插入時自動執行病毒程序完成傳播；其傳播與自動補丁更新、服務自啓動無直接關係，關閉自動播放即可有效遏制。","259":"備份在數據損壞、丟失或被惡意加密後可將數據恢復到可用狀態，是保障可用性最有效的方法；加密主要保護保密性，安全刪除用於防止數據泄露，二者均不解決可用性問題。","260":"在Windows系統中,administrators組的管理權限最高,擁有對系統的完全控制權。everyone組包含所有用戶,權限較低;powerusers組擁有較多權限,但不如administrators組;users組權限相對較低,主要用於普通用戶操作。所以選B。","261":"執行mmc命令可啓動Microsoft管理控制檯，由其承載各類管理單元完成系統管理任務；regedit用於編輯註冊表，cmd僅為命令提示符，mfc並非系統自帶命令。","262":"信息安全風險由資產及其價值、面臨的威脅、存在的脆弱性三個要素共同作用產生，缺少任一要素風險即不成立；使命是評估工作所服務的背景目標，不屬於風險三要素。","263":"可接受風險指經評估後確認其具有一定合理性與可承受性、決定不再額外投入資源處理的風險；總風險是評估的初始結果，殘餘風險是實施控制措施之後仍留下的風險。","264":"統計顯示多數計算機系統面臨的最大威脅來自本單位僱員，內部人員熟悉系統與業務流程且持有合法訪問權限，其無意失誤或惡意行為造成的損失最為常見且難以防範。","265":"PGP提供郵件內容的公開鑰匙加密與數字簽名，可用於安全電子郵件的保密與真實性保護；SSL與TLS保護的是傳輸層會話，SET用於電子支付交易，均非郵件加密協議。","266":"HTTPS即在HTTP之下加入SSL協議實現傳輸層加密與服務器認證，從而保障網站訪問的機密性與完整性；IPSec保護網絡層通信，PGP用於郵件加密，SET用於支付交易。","267":"信息系統安全保護等級由低到高劃分為五級，從一般自主保護逐步上升到涉及國計民生與國家安全的關鍵領域最高等級，等級保護制度據此實施分級防護與監督管理。","268":"ISO/IEC 27001規定建立、實施、維護並持續改進信息安全管理體系ISMS的要求，是可供認證的標準；27002給出控制措施實踐指南，27003為實施指南，27004為度量指南。","269":"PDCA過程方法中P指Plan即策劃，而非Process處理；D為實施、C為檢查、A為改進行動，四個階段構成ISMS持續運行的循環，故A項對P的解釋不正確。","270":"控制措施按功能可分為預防性、檢查性與糾正性等類型，各自對應事前防範、事中發現與事後補救；管理性措施是按實施方式劃分的類別，與前三者不屬於同一分類維度。","271":"風險管理中的控制措施通常分為行政性、技術性與管理性等方面，從制度、技術手段與管理流程三個層面落實；道德屬於職業操守與安全意識層面的約束，不屬於控制措施分類。","272":"風險評估的活動包括標識資產、標識威脅與脆弱性、分析並計算風險大小，其產出是對風險的判斷；中斷引入風險的活動屬於風險處理階段採取的行動，不在評估範圍內。","273":"標識風險應以資產及其價值為起點，結合資產所面臨的威脅、存在的脆弱性，並考慮現有與計劃的控制措施，才能完整刻畫風險來源與大小；僅列系統漏洞或CIA屬性均不完整。","274":"風險分析要完成評估資產價值、標識脆弱性與威脅、估算安全事件發生的可能性並計算風險值；標識最終用戶屬於資產與訪問管理的範疇，不是風險分析過程中要做的工作。","275":"信息系統安全的最終目的是保障業務連續與發展，機構應將其視為業務促進因素，為業務運作保駕護航；若當成業務中心或風險中心，易使安全與業務對立甚至抑制業務發展。","276":"ISO/IEC 27001的過程方法強調以客觀測量為依據對ISMS進行持續改進，而非基於主觀測量；理解組織要求並建立方針目標、從整體業務風險角度管理風險、監視評審有效性均為其特點。","277":"檢查崗位職責時最重要的標準是職責清晰、每名人員都明確自己在組織中的角色與權責邊界，這是問責與最小權限得以落實的基礎；工作說明、輪休制度與績效監控均屬輔助手段。","278":"人員安全意識薄弱只能通過持續的安全教育和培訓來改善，使員工知悉安全政策、標識釣魚與社交欺騙並養成正確操作習慣；內容監控、追責懲處與訪問控制屬技術或事後手段，無法提升意識。","279":"預防性控制措施作用於風險事件發生之前，其目的就是減少威脅發生的可能性；降低風險發生後的影響屬於減輕性控制措施，D把預防與減輕兩類控制混在一起；保護弱點區域、減少災難發生的可能性只是預防控制在具體場景下的局部體現。","280":"業務可以外包，但與外包業務相關的不良後果及其風險，企業仍須承擔最終的直接或間接責任，不能因外包而完全轉移；其餘關於外包範圍與操作風險的說法均屬正確。","281":"SSE-CMM 將過程能力由低到高劃分為未實施、基本實施、計劃和跟蹤、充分定義、量化控制、持續改進六個級別，最高級別是持續改進而非量化控制，故該描述錯誤；其餘關於組建時間、級別數量與三類過程的說法均符合模型定義。","282":"SSE-CMM 即系統安全工程能力成熟度模型，用於度量並改進系統安全工程過程的能力成熟程度，其對象是系統安全工程過程，而非信息安全技術或產品能力。","283":"保證過程通過觀察、論證、分析和測試對安全進行自驗證與證實，由驗證與證實安全過程域取得的證據去支持建立保證論據過程域；該選項將兩個過程域的支持方向說反，故錯誤。","284":"SSAM 是與 SSE-CMM 配套使用的評估方法，用於對組織的安全工程過程能力進行評估；ISSE 是信息系統安全工程方法，GEM 是通用評估框架，SSR 並非評估方法。","285":"SSE-CMM 的能力級別共五級：第一級非正式執行、第二級計劃和跟蹤、第三級充分定義、第四級量化控制、第五級持續改進，故第三級為充分定義；計劃和跟蹤是第二級，量化控制是第四級，持續改進是第五級。","286":"SSE-CMM 工程過程類包含明確安全需求、獲取與提供安全輸入、協調安全等過程域，用於在系統生命週期中落實安全；評估影響屬於風險過程的活動，並非工程過程的過程域。","287":"SSE-CMM 將系統安全工程過程劃分為工程、組織和項目三類過程類，分別對應安全工程活動、組織過程能力建設與項目執行管理；資產是被保護的對象，不構成過程類。","288":"操作系統的安全加固屬於運行與運維階段對基礎環境採取的措施，並非開發階段的重點；開發階段應聚焦輸入數據校驗、數據處理過程控制與輸出數據驗證，以保證數據在處理鏈路中的正確性。","289":"輸入校驗可攔截超出取值範圍的數據、超長輸入與惡意代碼片段，從而防範緩衝區溢出和代碼注入攻擊；數據處理順序屬於程序內部邏輯控制，無法依靠輸入校驗來保證。","290":"信息安全問題產生的內因在於信息系統自身的高度複雜性與固有脆弱性，外因在於對手不斷演化的威脅與破壞行為；將其單純歸因於技術發展、犯罪動機或開發疏忽都只觸及局部原因。","291":"PPDR 模型由策略、保護、檢測與響應四個環節構成動態安全循環，四者首尾相接持續運作；加密只是保護環節中的一項技術手段，不屬於模型的四個組成部分。","292":"信息安全策略本質上是風險管理決策的產物，需依據資產價值、威脅與脆弱性所評估出的風險水平來確定控制措施與可接受風險；系統規模與網絡拓撲隻影響措施落地方式，並非策略制定的基礎。","293":"ISO/IEC 27001 以 PDCA 思想為組織建立、實施、運行、監控、審覈、維護和改進信息安全管理體系提供模型，可用於認證；控制措施與最佳實踐對應 27002，度量對應 27004。","294":"定級指南規定信息系統的安全保護等級由兩個要素決定：受侵害的客體（國家安全、社會秩序、公共利益以及公民和法人合法權益）與對客體造成侵害的程度（一般、嚴重、特別嚴重）。","295":"VPN 通過隧道、加密與認證技術在公共網絡上構建邏輯專用通道，主要用途是建立安全的網絡通信；用戶身份鑑別、行為審計與邊界訪問控制只是配套手段，並非其主要功能。","296":"IPSec 由認證頭 AH、封裝安全承載 ESP 以及負責密鑰協商與安全關聯建立的 IKE 三部分構成；DSS 是數字簽名標準，與 IPSec 協議族無關。","297":"特洛伊木馬不自我複製，而是僞裝成遊戲、工具等有用程序誘使用戶主動執行，從而在後臺竊取信息或開啓遠程控制通道；計算機病毒依附宿主文件，蠕蟲獨立傳播，邏輯炸彈依賴條件觸發。","298":"蠕蟲不依附宿主程序而可獨立運行，並利用網絡漏洞與口令猜測自主掃描、複製和傳播，因而同時具有可感染性與獨立性；依附於其他程序文件是計算機病毒的典型特徵。","299":"協議是網絡通信雙方共同遵守的規則與標準，規定報文格式、時序與應答機制，與操作系統類型、電纜介質和編程語言無關；只有遵循同一協議的主機才能相互理解並通信。","300":"ARP 請求以廣播幀形式發送，網橋、以太網交換機和集線器等二層設備都會轉發或泛洪廣播包，只有位於三層的路由器默認不轉發廣播流量，因而能隔離 ARP 廣播幀。","301":"漏洞掃描器主動探測主機與應用服務，比對漏洞庫和配置基線，用於發現系統中已存在的脆弱性並給出修復建議；防火牆與 UTM 側重邊界訪問控制，IDS 側重檢測入侵行為。","302":"入侵檢測按分析方式分為基於誤用檢測與基於異常檢測兩類，前者用已知攻擊特徵庫匹配、準確率高但難以發現新攻擊，後者依據正常行為模型標識偏離、可發現未知威脅而誤報較多。","303":"滲透測試遵循信息收集、漏洞分析與目標選定、嘗試漏洞利用、權限提升與痕跡清除的順序，第一步是儘量收集目標的網絡、主機與應用信息，為後續分析與攻擊路徑選定提供依據。","304":"社會工程利用人的信任、好奇與服從心理，通過電話、上門等方式向接線員等人員套取用戶名與口令等敏感信息，攻擊對象是人而非系統；緩衝區溢出與 SQL 注入屬於技術漏洞攻擊。","305":"在window系統中,netstat命令用於顯示本機各網絡端口詳細情況,包括連接的協議、本地地址、外部地址、狀態等信息。netshow不是Windows系統命令;ipconfig用於顯示網絡配置信息;Netview不是Windows系統命令。所以選B。","306":"在WindowsXP中用事件查看器查看日誌文件,可看到的日誌包括應用程序日誌、安全性日誌、系統日誌和IE日誌。用戶訪問日誌不是事件查看器直接分類查看的日誌類型;網絡攻擊日誌、網絡鏈接日誌、記賬日誌、服務日誌等不是事件查看器標準日誌分類。所以選B。","307":"ISO/IEC 27000 系列涵蓋術語詞彙、信息安全管理體系要求、實施指南與控制實踐、風險管理、度量與審覈等標準，其中並沒有名為《信息安全評估規範》的標準。","308":"信息安全管理體系是基於可認證的國際標準 ISO/IEC 27001 建立，綜合管理與技術手段保障組織信息安全，並屬於管理體系家族成員；ISO/IEC 27000 僅為詞彙與概覽性文件，不作為體系依據。","309":"PDCA 循環中 P 指 Plan 策劃，即確定方針、目標並制定計劃，而非 Process 處理；D 為實施、C 為檢查、A 為改進，四個階段依次循環以推動管理體系的持續改進。","310":"SSE-CMM 對工程過程能力的評價由宏觀到微觀分為能力級別、公共特徵（CF）與通用實踐（GP）三個層次：能力級別由公共特徵的達成情況決定，公共特徵又由通用實踐的執行來支撐。","311":"SSE-CMM 將過程能力由低到高劃分為未實施、基本實施、計劃和跟蹤、充分定義、量化控制、持續改進共六個級別，其中未實施為能力級別 0，其餘五級依次遞進，該描述完整且準確。","312":"SSE-CMM 工程過程類的過程域包括明確安全需求、獲取與提供安全輸入、協調安全等，用於在系統生命週期中落實安全活動；評估影響屬於風險過程的活動，不是工程過程的過程域。","313":"SSE-CMM 的過程類分為工程過程類、組織過程類和項目過程類，分別規範安全工程活動、組織過程能力建設與項目執行管理；管理過程類並非該模型中的劃分。","314":"ISSE是美國IATF 3.0版本中提出的用於設計和實施信息系統的安全工程框架，強調在系統生命週期各階段與系統工程同步開展安全活動，把安全需求轉化為工程實踐；教材對其定位是框架，而非方法、體系結構或標準。","315":"信息安全保障階段強調保護對象全生命週期的安全要求、多層次多角度的體系化防禦要求以及動態發展變化的特徵，通過體系化建設使風險處於可控狀態；高度複雜且不能控制並非其基本特徵。","316":"信息安全的核心價值在於為業務發展提供基礎安全保障，使業務在可接受的風險水平上持續運行，其投入應與業務風險和收益相權衡；與網絡系統聯繫密切只是客觀事實，未說明與業務的關係。","317":"PDR 與 P2DR 通過保護、檢測、響應在時間維度上動態循環，引入時間基線、強調持續保護與響應並採用多層防禦機制；模型依靠策略與技術機制自動運行，並非僅依賴人為的管理和控制。","318":"將產品劃分為 A、B、C、D 四個等級是美國 TCSEC 標準的做法；CC 標準以保護輪廓與安全目標表達安全需求，按功能要求與保證要求評估，並劃分為 EAL1 至 EAL7 七個保障等級。","319":"Kerckhoffs 準則要求密碼系統的安全性依賴於密鑰而非算法，即算法可以公開、密鑰必須保證安全；算法公開便於接受更嚴格的公開分析，也便於密鑰泄漏時快速更換密鑰。","320":"數字簽名由發送方使用己方私鑰對消息摘要進行簽名，接收方用發送方的公鑰驗證，從而證明發送者身份、內容完整性與不可抵賴；使用己方公鑰或對方密鑰都無法產生僅發送者能生成的簽名。","321":"PKI/CA 通過數字證書將公鑰與主體身份綁定，主要解決身份鑑別、數據完整性與不可否認性等問題，它並不保障系統可用性，也不負責授權與訪問控制，因此可用性搭配授權與訪問控制的組合不屬於其解決的問題。","322":"ISO7498-2 把鑑別（認證）列為五大安全服務之一，而數字簽名、訪問控制、路由控制與加密、流量填充等同屬用以實現服務的安全機制，故鑑別不屬於該模型所定義的安全機制。","323":"操作系統安全須從源頭構建：安裝階段保證介質與來源可信，部署階段進行最小化與加固配置，運行階段依靠制度化的安全管理持續運維，三者缺一不可，故以上各項均為基礎。","324":"ISO27002 按管理體系的思路組織內容，先劃分管理類別，再在每一類別下提出控制目標，並針對控制目標給出可供選擇的控制措施，形成管理類、控制目標、控制措施逐層展開的結構。","325":"ISO27002 的十一個控制領域涵蓋信息安全策略、信息安全組織、資產管理、人力資源安全、物理和環境安全、訪問控制、運行管理、合規性等，內容安全屬於內容治理範疇，不在其列。","326":"2003 年《國家信息化領導小組關於加強信息安全保障工作的意見》確立了信息安全保障工作的總體要求，其中明確提出加快信息安全人才培養、增強全民信息安全意識，等級保護等文件均晚於且未含此表述。","327":"IATF 以保護、檢測、響應構成的動態模型和深度防禦思想構建攻防一體的保障體系，並非基於 PDCA 循環；其對信息系統多層防護、描述保護領域安全需求與可選措施、體現分層深度強健性的說法均正確。","328":"CC 標準規定的是安全目標、安全功能要求與安全保障要求，為產品安全性評估提供統一的框架與等級尺度，並未詳細描述具體的安全評估方法學，評估方法由配套的評估方法學文件約定，故該項說法錯誤。","329":"信息安全保障的核心思想是在系統生命週期內以人為本、技術與管理並重，通過系統化的安全工程過程構建保障體系；僅側重建成後的運維、堆疊安全產品或只做檢測評估，都未體現這一整體性原理。","330":"IATF 以深度防禦為核心，關注本地計算環境、區域邊界、網絡和基礎設施、支撐性基礎設施等保護領域，並強調技術、管理與人相結合；以安全監測、漏洞監測和自適應填充安全間隙為循環的說法並非其思想。","331":"加密與解密互為可逆的數學變換，算法本身公開，運算過程完全由密鑰決定，密鑰相同則變換可逆，故加密和解密均在密鑰的控制下進行；明文與密文只是變換前後的數據形態，並不起控制作用。","332":"數字簽名由發送方使用自身私鑰對摘要加密生成，接收方只能使用與之配對的發送者公鑰進行驗證，從而確認簽名者身份與內容未被篡改；使用接收方自身的密鑰無法完成對發送方簽名的驗證。","333":"數字證書由 CA 使用自身私鑰簽名，內含持有者標識、有效期、頒發者以及持有者的公開密鑰，公鑰本屬公開數據可隨證書分發，私鑰必須由持有者嚴格保密，絕不會寫入證書，故該項說法錯誤。","334":"SSL 位於傳輸層與應用層之間，對上層應用協議提供機密性與完整性保護，典型用於保護基於 TCP/IP 的 HTTP、FTP 等應用傳輸；SKIP、SNMP、UDP、SONET 等並非其保護對象。","335":"WEP 採用 RC4 流密碼與靜態共享密鑰，初始向量過短且密鑰拼接方式存在明顯弱點，密鑰易被快速收集破解；WPA、WPA2 與 WAPI 引入了更強的密鑰協商與完整性校驗機制，安全性均高於 WEP。","336":"ICMP 是 TCP/IP 協議族中負責傳遞控制與差錯報文的協議，用於報告主機不可達、超時、重定向等錯誤並輔助網絡診斷；IGMP 用於組播組管理，ARP 用於地址解析，SNMP 用於網絡管理。","337":"NAT 將內部私有地址映射為外部合法地址進行通信，使內部網絡拓撲與真實地址不暴露給外部，從而起到隱藏內部網絡地址的作用；它本身不提供代理服務、入侵檢測或防病毒功能。","338":"信息安全領域的國際標準化工作由 ISO 與 IEC 聯合成立的第一聯合技術委員會 JTC 1 之下的第 27 分技術委員會負責，ISO/IEC 27001、27002 等信息安全系列標準即出自該分技術委員會。","339":"TCSEC 為評估操作系統等計算產品的可信賴程度提供了一套由低到高的分級方法；它並未對安全功能與安全保證作出明確區分，且已包含對可信通信網絡與可信數據庫系統的評估內容，故其餘各項均不準確。","340":"保護輪廓 PP 針對一類 TOE，從用戶視角給出與技術實現無關的安全需求，規定該類產品的安全功能與安全保障要求；對具體評估對象作規範化描述屬於安全目標 ST，預先定義的保證尺度由保障包表達。","341":"ISO/IEC 27001 由英國標準 BS 7799 的第二部分發展而來，規定建立、實施、運行、監控、評審、維護和改進信息安全管理體系的要求；BS 7799-1 是實踐準則，對應 ISO/IEC 27002。","342":"Smurf、Land、Teardrop 均通過構造異常報文或海量流量耗盡目標資源，屬典型的拒絕服務攻擊；CGI 溢出攻擊利用公共網關接口程序的漏洞實施溢出與越權，屬於對主機的入侵，不屬於 DoS 攻擊。","343":"X.400 是報文處理系統標準，規定電子郵件的消息格式、傳輸與存儲等內容處理規則；X.25 與 X.75 是分組交換網絡協議，X.500 是目錄服務標準，均不用於電子郵件系統。","344":"星型拓撲中各終端以獨立鏈路單獨連接中心節點，任一鏈路故障隻影響該鏈路所連的終端，其餘終端與網絡照常工作；樹型與複合型中鏈路故障會波及下游分支，環型則依賴共享環路易整體受影響。","345":"Chinese Wall 模型面向利益衝突場景，用戶一旦訪問了某一利益衝突類中的信息，即被禁止訪問與之衝突的其他類信息，其設計宗旨正是隻允許用戶訪問與已經擁有的信息不衝突的信息。","346":"GB/T 代號表示國家推薦性標準，GB/T 18020 應用級防火牆安全技術要求即屬此類；SJ/T 為電子行業行業標準，GA 為公共安全行業標準，ISO/IEC 15408 是國際標準，均非國家推薦性標準。","347":"對稱密鑰算法在加密數據與解密數據時使用同一把密鑰，收發雙方須安全共享該密鑰，如 DES、AES；非對稱體制使用公鑰與私鑰配對，加解密使用不同密鑰，公鑰算法本身即屬非對稱算法。","348":"預期年度損失 ALE 等於單次預期損失 SLE 乘以年度發生頻率 ARO，用於量化風險的經濟影響以便比較控制措施的成本收益；以全部損失乘以頻率混淆了單次與年度口徑，資產價值亦不等於單次損失。","349":"身份鑑別有三類基本方式：所知（如口令、PIN 碼）、所有（如令牌、智能卡）與所是（如指紋、虹膜等生物特徵），你是什麼即依據主體固有的生物特徵完成鑑別，其餘選項均非標準鑑別因素。","350":"當前員工擁有合法賬號與在網權限，熟悉內部流程與系統弱點，可長期、隱蔽地接觸核心資產，其越權操作、泄密與疏忽造成的風險在時間與範圍上最為持續廣泛，故帶來的安全風險最大。","351":"netstat 用於顯示當前活動的 TCP、UDP 連接、監聽端口及路由表，是查看本機開放端口情況的標準工具；nbtstat 用於查看 NetBIOS 名稱信息，net 用於管理網絡資源與共享，均無查看端口的功能。","352":"宏是應用程序中用於自動化操作的腳本指令，本身屬於正常功能組件，只有被寫入惡意代碼的宏才構成宏病毒；病毒、蠕蟲與特洛伊木馬均為典型的惡意代碼形式，故宏不屬於惡意代碼。","353":"DNS 區域傳送基於 TCP 協議並使用 53 號端口，常規域名解析查詢則主要使用 UDP 53；在防火牆上阻止 TCP 的 53 號端口即可防止外部發起區域傳送、避免區域數據被整體複製，同時不影響正常解析服務。","354":"IPsec 工作在網絡層，通過 AH 與 ESP 協議對 IP 報文提供來源認證、完整性與加密保護，凡承載於 IP 之上的傳輸層與應用層協議均可受益，因此 TCP、UDP 以及由其承載的 FTP 流量都能利用其安全功能。","355":"可用性取決於網絡服務能否持續可達，鏈路冗餘通過部署多條並行路徑，在鏈路故障時自動切換路由，避免單點故障造成服務中斷；數據冗餘主要保障完整性，軟件冗餘與電源冗餘分別針對可靠性與基礎設施層面。","356":"RSA 的安全性基於大整數分解難題，即兩個大素數的乘積在計算上難以分解出原素數，故公鑰可公開而私鑰難以由公鑰推出；ECC 基於橢圓曲線離散對數，Diffie-Hellman 基於離散對數，DES 為對稱分組算法。","357":"ISO 9000系列是質量管理與質量保證體系標準，着重於加工處理過程的質量，通過規範體系化的過程來保證質量穩定，而不是針對某一具體產品；原材料與生產廠家只是體系的涉及對象，產品合格是過程受控的結果。","358":"終止聘用關係時應進行離職談話以明確保密義務，要求員工簽署保密協議，同時禁用其賬號並更改其掌握的全部密碼，從制度與技術兩方面切斷訪問途徑；僅禁用賬號或僅列明責任都缺少協議約束，防護並不完整。","359":"字典攻擊將常用口令、單詞及其變體構造成口令表逐一嘗試，配合哈希比對可在短時間內命中弱口令，是破解口令最常用的手段；哄騙用於僞裝身份，DoS 與 WinNuk 針對服務可用性，均不用於口令破解。","360":"Intranet 是企業基於 TCP/IP 協議構建的內部網絡，可承載電子郵件、Java 應用等內部服務，其範圍受邊界防護限制而不對外公開；公衆網絡即公共互聯網不屬於其組成部分，與外部互聯的場景屬於 Extranet。","361":"防火牆部署於網絡邊界，依安全策略對進出流量執行過濾與訪問控制，能在入侵進入內網之前先行阻擋，故被視為安全防護的第一道防線；遠程服務器、Web服務器與安全外殼程序屬端點層面的防護，並非邊界屏障。","362":"時戳可記錄數據訪問與事件發生的先後順序，據以重建入侵的時序軸並比對各來源日誌，是安全調查與取證的核心依據；訪問路徑、數據定義與數據分類僅描述數據結構與屬性，無法還原事件發生的時間順序。","363":"隨機給出的字母無語意、無規律可循，既無聯想線索也無法拆解為有意義的片段，故最難記憶；生日、年薪、配偶姓名皆源自既有個人信息，倒轉或重排後仍可藉助聯想加以還原。","364":"風險分析着眼於攻擊面，系統的輸入輸出接口直接面對外部用戶與數據流，是威脅進入系統的主要入口，脆弱性最易被利用，故為最主要弱點；內部與外部計算處理屬系統內部環節，對外暴露面較小。","365":"風險是威脅利用脆弱性造成損失的可能性與影響之組合，風險越大代表潛在損失越嚴重、越超出可承受範圍，故越需要投入保護措施加以降低；風險小則可承受，中等風險亦非最優先對象。","366":"在安全策略體系中，標準（Standard）是對合規行為的強制性要求，必須嚴格執行且可審計違規；安全策略與方針屬方向性、指導性文件，流程僅描述具體作業步驟，三者皆不具強制約束力。","367":"後門繞過正常的認證與訪問控制，使攻擊者可取得系統控制權而實施黑客入侵；同時供應商能隨時中斷軟件運作或植入惡意邏輯，造成軟件中止，故最主要風險為軟件中止與黑客入侵；遠程監控與維護屬正常功能，非主要風險。","368":"任務緊急且功能核心的系統若外購或外包，易受供應商交期、質量與機密外泄等風險影響，控制權不在自身；由內部自行開發與維護可掌握進度、源碼與變更，風險最易管控，故應內部實現。","369":"技術控制、風險分析與故障管理皆需由管理體系統籌規劃與落實，缺乏安全性管理時各項控制無法協調一致、責任與流程皆屬空白，形成整體性安全缺口，故為產生總體安全性問題的主要原因。","370":"手工控制程序變動易遺漏且難以追蹤，自動軟件管理（軟件配置管理工具）可自動記錄、審覈與部署變更，確保版本一致性並減少人為疏失，效果最為有效；僅將制度、方案、標準書面化仍依賴人工執行。","371":"桔皮書（TCB安全要求評估準則）中，B2（強制性保護）是第一個要求對主體與客體標註安全標籤、實施強制訪問控制的等級；C1與D僅要求自主保護，B3雖要求標籤完整性但並非首個要求之等級。","372":"主機型入侵檢測須在被保護主機上安裝代理程序，持續獲取日誌與系統呼叫並加以分析，會佔用主機的處理器、內存與存儲資源，故“佔資源少”並非其優點；其優點在於成本較低、針對單一主機的視角集中且檢測細膩。","373":"計算機病毒主要破壞數據與程序的完整性、癱瘓系統運作而中斷可用性，並使服務失效（有效性）；其本質並非以竊取機密數據為目的，故保密性不在病毒直接威脅的服務之列。","374":"光纖以光脈衝傳輸信號，完全不受電磁干擾與串音影響，無接地迴路問題，衰減低、帶寬高且難以竊聽，故為最可靠的傳輸媒介；同軸電纜與屏蔽、非屏蔽雙絞線皆以電信號傳輸，易受電磁干擾。","375":"制度與措施界定安全目標、責任分工與作業規範，是漏洞分析、意外事故處理計劃及採購計劃得以依循的依據與基準；缺乏制度與措施時，其他組成部分無從建立亦無從評估，故為整個安全程序的基礎。","376":"密碼分析旨在不依賴密鑰而從密文推求明文或密鑰，並通過攻擊實驗評估算法抵抗破譯的能力，據以確定加密算法的強度並作為選型依據；增加代替功能、減少換位功能及確定換位方式皆屬算法設計範疇。","377":"通用準則（CC）將評估保證級（EAL）由EAL1至EAL7分為七級，保證程度逐級遞增，EAL7為形式化驗證設計的最高等級；六級、五級與四級皆與準則規定不符。","378":"可信計算基（TCB）指系統中實現安全策略的硬件、軟件與程序元件（含固件）之總和，構成受信任的保護機制集合；人員屬系統的用戶與管理者，並非TCB的技術組成部分。","379":"密文由算法與密鑰產生，字元分佈近似隨機且無固定語意，遍歷（窮舉）時缺乏可辨識的明文特徵，須嘗試整個密鑰空間方能破解，難度最高；用戶口令、鎖定口令與口令代碼的長度與格式可預期，較易窮舉。","380":"RSA同時支持數據加密與數字簽名，一套密鑰即可兼顧機密性與真實性；DSA僅用於產生與驗證簽名，不具加密功能，亦非對稱密鑰體系，故RSA的優點在於可提供數字簽名與加密雙重功能。","381":"公鑰加密以收件者Alice的公鑰對明文加密，與之配對的私鑰由Alice獨佔持有，故唯有Alice的私鑰能解密該密文；Sue的公鑰用於加密、Sue的私鑰用於簽名，皆無法解開送給Alice的密文。","382":"SSL的雙向身份認證（證書交換與驗證）在握手協議中完成，記錄協議只負責對數據進行分片、加密與完整性校驗，故“身份認證由記錄協議實現”為錯誤說法；其餘三項關於握手協議、警告協議與PKI/CA的描述皆正確。","383":"總部與分支機構皆為固定站點且各具邊界網關，宜採站點對站點的網關到網關VPN，在兩網關間建立隧道使整站點互通，集中管理且對終端用戶透明；主機到網關適用於行動辦公用戶，主機到主機僅適合少量點對點通信。","384":"DMZ對外提供網站與FTP等公開服務，面對Internet的邊界應配置外部防火牆並採“除非允許、皆被禁止”的白名單規則，僅放行必要服務端口，最大限度收斂攻擊面；“除非禁止、皆被允許”及不設防火牆皆過於寬鬆。","385":"靜態包過濾屬網絡層與傳輸層技術，檢查對象為IP首部、TCP首部及ICMP報文中的來源與目的地址、端口、協議與旗標等字段；HTTP首部位於應用層負載內，須由應用層防火牆或代理服務器方能解析，故非其操作對象。","386":"文件控制程序應確保文件易於取得、清晰可標識並妥善維護，包括標識更改與修訂狀態、在使用處可得適用最新版本、防止作廢文件被非預期使用，並允許需要者依規定對文件進行轉移、存儲與銷燬；限制需要者處理文件與要求相反，故非規定措施。","387":"風險模型中資產價值應由資產所有者依業務重要性評定，而非由用戶決定，故該說法錯誤；其餘三項符合風險規律：脆弱性越高風險越高、威脅降低風險降低、安全措施增強則風險降低。","388":"風險處置須符合成本效益原則，僅當不處置所承受的負面影響損失大於安全投入時，實施該項控制措施才產生正效益，故在此情況下采用；損失小於或等於投入時，宜改採風險承受、轉移等其他處置方式。","389":"RPO（恢復點目標）規範可容忍的數據遺失時間間隔，要求完全不遺失數據即代表恢復點必須與故障點重合，故RPO必須為0；RTO（恢復時間目標）規範業務恢復所需時長，與數據遺失量無直接關係。","390":"該指南規定信息安全事件分級須參考三項重要因素：信息系統的重要程度、事件造成的系統損失，以及事件造成的社會影響；用戶數量僅反映系統規模，並非分級考量因素，故為正確答案。","391":"有害程序事件指病毒、木馬、蠕蟲、後門與勒索軟件等惡意代碼侵染系統的事件，木馬攻擊屬之；信息被篡改屬數據安全事件，黃色反動信息傳播屬內容安全事件，網絡釣魚屬欺詐類事件。","392":"一個單位的應急響應計劃內容最全面的表述是應急組織架構、事件檢測機制、事件預警通報機制、應急響應流程、人力保障與技術保障六項，兼顧組織分工、事前監測與通報、事中處置和後方保障；A、B以聯絡措施或保障措施取代檢測與預警通報，C缺少事件檢測與預警通報機制的明確劃分，覆蓋均不完整。","393":"業務應用數據隨交易與業務處理持續變動，更新頻率最高、時效性最強，故需以最高頻率（如增量乃至即時備份）縮小RPO；臨時數據生命週期短，基礎數據與系統數據相對穩定，備份頻率要求較低。","394":"業務影響分析（BIA）通過標識關鍵業務功能、量化中斷損失並排定恢復優先級，揭示各技術系統對業務的重要性，是設置恢復目標與策略的前提；確定恢復目標、制定策略與預案均在業務影響分析之後進行。","395":"風險管理的監控與審查包括過程質量管理、持續跟蹤系統自身或所處環境的變化以更新風險評估結果、協調內外部組織機構的風險管理活動；成本效益管理屬於風險處理環節對控制措施取捨的權衡，不在監控與審查的內容之中。","396":"殘餘風險是實施控制措施之後仍殘留的風險，衡量時須綜合威脅、脆弱性與資產價值，並計入既有控制措施的有效性；僅列威脅與脆弱性而忽略控制效果，或以損失頻率取代資產價值，皆不完整。","397":"ISMS（ISO/IEC 27001）以業務風險為基礎建立信息安全管理體系，依業務風險評估結果決定控制措施與優先級，並循建立、實施、運作、監視、評審、保持與改進的週期持續運作；僅以信息系統防護或單一安全風險為基礎皆不足。","398":"依信息系統安全保護等級管理要求，第三級（監督保護級）系統應每年進行一次等級測評，以確認其安全措施持續符合相應等級的保護要求；第二級為每兩年一次，第四級與第五級要求更為嚴格。","399":"有主性訪問許可為每個客體設置一個所有者，所有者對其客體具有全部控制權，且是唯一有權修改該客體訪問控制表的主體；選項D稱所有者並非唯一有權修改者，與有主性的定義相悖，故為不正確的描述。","400":"BLP模型的三項主要任務是：定義使系統獲得安全的狀態集合、檢查系統的初始狀態為安全狀態、檢查所有狀態變化均始於一個安全狀態並終止於另一個安全狀態，以此保證強制訪問控制不被違反；選擇系統的終止狀態不屬於其主要任務。","401":"RADIUS是遠程撥號用戶認證服務，屬於通用的認證、授權與計費（AAA）協議，廣泛用於網絡接入的集中認證與計費。它以UDP而非TCP通信，基本組件是認證、授權與計費而非加密，故其餘說法皆不準確。","402":"模糊測試（Fuzz）通過向程序輸入大量非預期、畸形的數據以觸發異常與崩潰，是軟件安全測試中經常採用的方法之一。安全測試不限於黑盒測試，關注的是安全缺陷而非功能，也無法發現所有安全問題。","403":"威脅建模常用數據流圖（DFD），其構成元素為外部實體、過程與數據流，分別描述系統邊界外的交互者、處理邏輯與數據走向。“內部實體”並非其元素，故選C。","404":"混合加密結合兩者優點：以效率高的對稱加密對通信數據本身加解密，再以公鑰加密安全地協商與分發會話密鑰，兼顧運算性能與密鑰分發安全，TLS、IPsec即採用此方案。","405":"消息摘要以哈希值與原文綁定，接收方重新計算摘要並比對，即可判斷內容在傳輸途中是否被他人篡改，保障完整性。不可抵賴性由數字簽名本身提供，摘要並非用於加密明文或提供解密密碼。","406":"認證中心（CA）是PKI中受信任的第三方，核心職責是簽發並管理數字證書，包括證書的簽發、更新、吊銷與吊銷列表發佈，為公鑰與身份的綁定背書；驗證信息、公佈黑名單、撤銷證書只是該職責的局部內容。","407":"安全隔離網閘通過專用硬件通信通道與專用安全通信協議，在應用層完成數據交換，徹底斷開TCP/IP連接，因此不支持也不應支持數據包路由，否則將繞過隔離機制，故不會使用的技術是支持數據包路由。","408":"反動態跟蹤的常見手段包括禁止跟蹤中斷、封鎖鍵盤輸入與屏幕屏蔽等，用以干擾調試器對程序的動態追蹤。“僞指令法”屬於對抗靜態分析與特徵標識的技術，不屬於反動態跟蹤方式。","409":"校驗和（FCS）在幀中附帶校驗值，接收方重算比對即可發現數據被複制或篡改，教材指出其可防止複製攻擊；校驗和不含密鑰、不能鑑別通信方身份，因此防不住中間人攻擊，也無法防竊聽，防重放需依賴時序標記。","410":"SYN Flood利用TCP三次握手中服務器維護半連接隊列的缺陷，大量發送SYN而不完成握手，耗盡連接資源導致拒絕服務。TCP位於TCP/IP模型的傳輸層，故與網絡接口層、互聯網絡層及應用層無關。","411":"MAC（消息認證碼）必須以通信雙方共享的密鑰計算，用以提供消息認證與完整性保護，而哈希函數無需密鑰，故“都不需要密鑰”的說法錯誤。兩者輸出皆為固定長度，且均不屬於非對稱加密算法。","412":"PKI/CA憑藉數字證書與數字簽名解決身份認證、完整性與不可抵賴性，並可結合加密保障保密性，但無法保證信息系統與服務的可用性；可用性需依靠冗餘設計、備份與應急響應等措施保障。","413":"LDAP目錄服務在PKI中承擔證書的發佈與查詢，提供證書的保存、修改、刪除和獲取能力，供用戶檢索證書及吊銷列表。證書吊銷列表只是其發佈內容之一，註冊審批與生成證書分屬RA與CA的職責。","414":"智能卡內含微處理器與集成電路，可在卡內執行運算並保護密鑰與敏感數據；內存卡只有存儲芯片而無處理能力，僅能保存信息。因此智能卡的處理與防篡改能力更強，B的對比表述正確。","415":"消息源認證需依靠哈希與消息認證算法，SHA1可用於IPsec的AH、ESP認證機制（如HMAC-SHA1）驗證報文來源與完整性。IDEA、AES、3DES均為對稱加密算法，只解決保密性而非源認證。","416":"VLAN在交換機上按邏輯劃分廣播域，把廣播流量限制在各虛擬局域網內部，避免廣播風暴擴散到整個網絡，因此劃分VLAN主要解決的是隔離廣播問題；提升安全性、隔離故障域屬附帶效果，與帶寬問題無關。","417":"SSL VPN在SSL/TLS安全通道上對傳輸數據進行加密，具備數據加密能力。MPLS VPN依賴運營商的標籤轉發、GRE僅作隧道封裝、L2TP本身不提供加密（需配合IPsec），故使用數據加密技術的是SSL VPN。","418":"互聯總部的端口需以路由模式轉發總部與各分部之間的數據，保持端到端地址可達；對外提供互聯網接入的端口則以NAT模式隱藏內部地址、節約公網地址。故端口1用NAT模式、端口2用路由模式最合理。","419":"DNS域名解析以UDP為主、端口號53，僅在區域傳輸等場景使用TCP，故稱其使用TCP協議是錯誤的。SMTP使用TCP 25、FTP數據連接使用TCP 20、TFTP使用UDP 69的描述均正確。","420":"緩衝區溢出是指程序向緩衝區填充數據時超出其容量，溢出數據覆蓋相鄰的合法數據（含返回地址），進而誘使程序執行攻擊者植入的指令。A描述的是SQL注入，B是跨站腳本攻擊，D是泛義的安全缺陷定義。","421":"SSL/TLS在會話建立後使用雙方共享的對稱會話密鑰保護通信，密鑰為通信雙方共有，無法像數字簽名那樣證明某條消息確由某一方發出，因此不能提供不可抵賴性；SSL通過證書支持真實性、通過報文鑑別碼保證完整性、通過加密保證保密性。","422":"IP欺騙利用的是TCP/IP協議對源IP地址的鑑別方式——僅憑源地址建立信任、缺乏對源地址真實性的認證，攻擊者僞造源地址即可冒充受信任主機發起會話；IP與TCP的尋址機制本身不是被利用的鑑別漏洞，結束會話是四次握手而非攻擊點。","423":"分片攻擊在接收端對IP分片進行重組時生效：攻擊者構造偏移量與長度互相重疊或矛盾的分片，使重組後的報文頭部被改寫，從而繞過防火牆與入侵檢測規則，故發生在對數據進行重組之時。","424":"Wireshark是網絡數據包捕獲與協議分析工具，用於流量抓取與排障，不具備漏洞掃描能力。BT5內建多種掃描與測試套件，Nmap可通過腳本掃描標識漏洞，Nessus是專業的漏洞掃描器。","425":"DHCP Snooping將端口劃分為信任端口與非信任端口，比對報文源MAC與CHADDR字段是否一致，並對端口DHCP報文限速，以阻擋僞造DHCP服務器。限制端口允許的MAC最大條目屬於端口安全功能，並非該特性的描述。","426":"信息安全需求來源通常包括法律法規與合同條約的要求、組織自身的原則、目標與規定，以及風險評估的結果。安全廠商發佈的漏洞與病毒預警屬運行期的威脅情報輸入，並非安全需求的來源。","427":"風險評估階段需鑑定與估價ISMS範圍內的信息資產、評估資產面臨的各種威脅與脆弱性，並界定已存在或規劃中的安全控制措施。根據評估結果實施安全控制措施屬於風險處置與體系實施運行階段，不在評估之內。","428":"信息安全策略變更通常由每年至少一次的管理評審、業務發生重大變更、管理機構與組織架構變更等因素驅動，需由管理層重新審視策略方向。單一設備的變更屬日常運維事件，不構成策略變更的原因。","429":"通知相關人員ISMS的變更屬於保持與改進階段的活動，用以確保體系變更得到溝通與落實。規劃和建立階段確立策略與目標，實施和運行階段落實控制措施，監視和評審階段執行監控與內部審覈。","430":"信息安全管理手冊是ISMS的綱領性文件，闡述帶有高層目標的信息安全策略，界定體系範圍與管理框架；管理制度、指南與記錄文檔屬下層支持性文件，用於落實策略而非承載高層目標。","431":"應急響應計劃的制定涵蓋需求分析與響應策略制定、編制計劃文檔、以及計劃的測試、培訓、演練與維護，構成週而復始的持續改進過程。計劃的廢棄與存檔不屬於該過程，持續維護與修訂纔是其中環節。","432":"我國信息安全事件分級依據信息系統的重要程度、系統損失與社會影響三個要素綜合判定事件等級。系統保密級別是涉密信息的分類屬性，並非事件分級的要素。","433":"符合性管理既要檢查與法律法規的符合性，也要檢查與組織安全策略方針的符合性，並注意用戶個人隱私保護。僅在內部使用的信息系統同樣受外部法律法規與行業監管約束，故B的說法錯誤。","434":"網絡入侵檢測系統以鏡像流量方式分析網絡數據，不影響現有網絡與數據源、與操作系統無關，可實時監視並檢測網絡攻擊與濫用行為。但加密流量的內容不可見，無法分析加密數據，這是其侷限而非優點。","435":"制定數據備份方案需要考慮的兩個因素是適合的備份時間和備份的存儲位置，二者共同決定備份頻率、備份類型與介質的保管方式；備份介質、備份數據量屬實施細節，恢復數據的最大允許時間是制定備份方案時輸入的需求指標。","436":"SSE-CMM（系統安全工程能力成熟度模型）用於度量與改進系統安全工程過程的能力，可對獲取組織、工程組織與認證組織產生作用，為其過程能力評估與改進提供統一基準。","437":"霍爾三維結構以時間維、邏輯維與知識維三個座標將系統工程程序化：時間維表示工作階段的先後，邏輯維表示每一階段的推理步驟，知識維表示各階段所需運用的專業知識，三者構成空間矩陣。","438":"安全規劃必須以用戶的業務與安全需求為起點。僅憑一張網絡拓撲圖編寫規劃，未與用戶共同確立安全需求，方案必然與實際業務脫節，實施後纔出現諸多安全隱患並影響業務效率，此為根本原因。","439":"風險評估的產出是風險標識、分析與評價結果，具體的安全控制措施由風險處置環節結合成本效益與標準要求選定，評估本身不能直接確定需要實施的具體控制措施，故C錯誤；其餘選項均正確描述了評估與ISMS的銜接關係。","440":"等級保護要求二級及以上信息系統到公安機關辦理備案，並非僅針對三級以上系統，故D說法錯誤。非涉密系統實行等級保護、涉密系統實行分級保護，遵循自主定級、自主保護，並分等級按標準建設、管理和監督，皆為正確表述。","441":"《關於加強政府信息系統安全和保密管理工作的通知》和《政府信息系統安全檢查辦法》明確由國務院信息化工作辦公室具體負責組織安全檢查，工信部並非文件規定的組織檢查主體，故D表述錯誤；以自查為主、抽查為輔並按需進行技術檢測，誰主管誰負責、誰運行誰負責、誰使用誰負責，管理制度與技術手段並重，均為文件明確內容。","442":"保護輪廓PP針對某一類TOE的應用環境，規定與具體實現無關的通用安全功能要求與保證要求，並提出相應級別的保證要求；基於一個或多個PP選定要求的是安全目標ST，功能與質量則是要求本身的分類。","443":"1999年《商用密碼管理條例》規定商用密碼技術屬於國家祕密，故A正確；國家對商用密碼產品的科研、生產、銷售和使用實行專管控理而非認證管理，商用密碼用於保護不屬於國家祕密的信息，任何單位和個人不得自行研製或使用境外生產的商用密碼產品，故B、C、D均錯誤。","444":"《電子簽名法》第十六條列明證書應載明認證服務提供者與持有人名稱、證書序列號、有效期、簽名驗證數據及服務提供者的電子簽名等，並未要求記載證書適用範圍，故C屬非必須內容。","445":"規定要求涉密計算機信息系統不得直接或間接與國際互聯網及其他公共信息網絡聯接，必須實行物理隔離，即在網絡線路與設備上完全隔開；邏輯隔離、防火牆、VLAN劃分僅屬網絡層面措施，不能滿足保密要求。","446":"規定要求保密審覈實行部門管理，有關單位應依據國家保密法規建立健全上網信息保密審批領導責任制，由單位領導對上網信息把關審批；專人負責制、民主集中制等均非文件表述。","447":"PPDR模型由安全策略（Policy）、防護（Protection）、檢測（Detection）、響應（Response）四部分構成，A把響應寫成恢復，屬於錯誤解釋；該模型的重要貢獻正是引入時間因素，並對如何實現系統安全、評價安全狀態給出可操作的描述，Pt>Dt+rt與Et=Dt+rt兩式為其標準公式，B、C、D均為正確說法。","448":"能力表隨主體保存，主體持有權限憑據，便於將訪問權限授予並傳遞給其他主體，但難以在各客體上同步回收，故D正確；A、B將控制表與能力表的定義說反，C亦錯，隨主體保存的是能力表而非控制表。","449":"Cookie欺騙是指篡改或僞造Cookie中的身份與會話數據以繞過身份驗證，並非提交精妙構造的移動代碼，後者屬腳本注入攻擊，故C錯誤；Cookie存放敏感信息確有風險，改用session驗證是有效防範手段。","450":"HTTPS在HTTP之下加入SSL/TLS安全層，瀏覽器與Web服務器雙方都必須支持SSL/TLS協議才能完成握手、協商密鑰並加密傳輸，故A正確；僅一方支持無法建立安全通道。","451":"依據計算機信息網絡國際聯網有關規定，發生黑客入侵等網絡安全事件時，應向公安機關公共信息網絡安全監察部門及其各地機構報告；互聯網安全協會與產業商會為行業組織，無受理職責。","452":"當安全事件的負面影響溢出本組織邊界、波及客戶或公衆利益時，組織應向公衆和媒體披露以履行告知義務並控制影響擴大；並非任何事件都需公告，也不以事件平息作為披露前提。","453":"HVACR是供熱、通風、空調與製冷等機房環境支持系統的簡稱，屬物理與環境安全需要保障的基礎設施；電磁泄漏防護、物理訪問控制、生物標識均為其他技術領域。","454":"信息系統生命週期通常劃分為規劃、設計、實施、運行維護和廢棄五個階段，覆蓋從需求確立到退役處置的全過程；僅列設計實施運維或省略設計、廢棄階段的劃分均不完整。","455":"計算機取證旨在依法收集、固定並鑑定證據，據以追查肇事者、還原犯罪過程、認定受害損失程度，屬司法取證範疇；恢復數據、降低損失是應急響應與數據恢復工作的目標，並非取證的作用。","456":"風險處理階段依據風險評估結果選擇並實施控制措施，選購與部署安全產品正屬於風險處理（風險降低）的具體手段；背景建立用於確定範圍與準則，風險評估負責標識與分析，批准監督屬後續認可環節。","457":"消息鑑別碼MAC由通信雙方共享的密鑰對消息計算出固定長度的短數據塊並附於消息之後，接收方以同一密鑰重算並比對，從而驗證消息完整性與來源；數字簽名使用私鑰且長度與算法相關，散列碼不含密鑰。","458":"生物特徵鑑別系統以錯誤接受率與錯誤拒絕率曲線的交點，即交叉錯判率CER，作為衡量系統整體準確度的綜合指針；單獨的錯誤拒絕率或錯誤接受率只反映單一偏向，無法全面評價系統性能。","459":"RADIUS、TACACS+與Diameter均為集中式認證、授權與賬戶管理協議，屬集中訪問控制管理技術；TEMPEST是針對設備電磁泄漏發射的防護標準，與訪問控制管理無關。","460":"數字簽名由簽名者使用自己的私鑰對消息摘要進行運算生成，接收方則用簽名者的公鑰驗證，從而實現來源鑑別與不可否認性；私鑰由簽名者獨佔，故不能使用對方私鑰或己方公鑰簽名。","461":"WAPI作為我國無線局域網安全標準，採用自主研發的公開密鑰體制密碼算法，基於祕密共享的橢圓曲線密碼算法實現雙向鑑別、證書認證與密鑰協商；其並非國際通用商用加密標準、流密碼或哈希算法。","462":"該機制先建立正常活動基線，再將觀察到的活動與基線比較並標識顯著偏差以發現入侵，稱為異常檢測（濫用檢測之外的基於使用剖面方法）；特徵檢測依賴已知攻擊簽名，差距分析與比對分析非IDS標準術語。","463":"視圖將用戶可訪問的行列限定在其授權範圍內，使其只能看到完成本職工作所需的最小數據集合，從而在數據庫層面落實最小權限原則；與縱深防禦、職責分離無直接對應關係。","464":"攻擊者在遠程網頁HTML中嵌入惡意腳本，瀏覽器下載頁面時將其作為可信內容解釋執行，從而竊取會話信息，屬跨站腳本（XSS）漏洞；緩衝區溢出涉及內存寫越界，SQL注入針對數據庫查詢語句。","465":"反跟蹤、加密與模糊變換（多態、變形）都用於隱匿自身、規避檢測與清除，屬惡意代碼的生存技術；自動解壓縮是自釋放包的打包解壓方式，服務於傳播與封裝，並非生存技術。","466":"釣魚攻擊以僞造的網頁誘騙用戶主動輸入並提交口令，利用的是人的信任與疏忽而非算法弱點，實質屬社會工程學攻擊；密碼分析學研究算法弱點，旁路攻擊依賴功耗等物理側信道，暴力破解則窮舉口令。","467":"會話密鑰僅在本次通信會話期間使用，會話結束即銷燬，因此生命週期最短；長期使用的祕密密鑰、公鑰與私鑰需長期保存並按週期更新，保存時間遠長於會話密鑰。","468":"路由器工作於網絡層，轉發時需解析IP包頭中的目的IP地址以查詢路由表決定下一跳，並重寫鏈路層幀頭；以太網幀頭由交換機據以轉發，TCP與UDP頭部埠信息屬傳輸層，非轉發依據。","469":"數字證書內容包括證書主體名稱、主體公鑰、有效期、序列號以及簽發者對證書內容的數字簽名等；驗證該簽名所需的是簽發者的公鑰，它包含在簽發者自身的證書中，並不寫入本證書。","470":"公開密鑰基礎設施由CA、RA、證書及證書撤銷清單CRL等組成，負責公鑰的簽發、更新與撤銷管理；IKE是IPSec中協商會話密鑰的協議，不屬PKI的組成部分。","471":"PPTP、L2TP與IPSec均為構建虛擬專用網的隧道與安全協議標準；TACACS+是專有的設備遠程管理與認證、授權、賬戶協議，不提供VPN隧道功能。","472":"NTFS使用事務日誌自動記錄所有文件和文件夾更新,能利用日誌文件重做或恢復未成功操作;NTFS分區可為每個文件或文件夾設置單獨許可權限;對於大磁盤,NTFS文件系統比FAT有更高磁盤利用率。而NTFS文件系統不能有效兼容linux下的EXT3文件格式,這是其不具備的優勢。所以選D。","473":"攻擊過程依次為偵察與信息收集、漏洞分析與目標選定、獲取系統權限、實施攻擊，最後清除日誌與痕跡、打掃戰場以隱匿足跡並維持權限；前三項均為前序步驟。","474":"軟件缺陷源於需求分析缺乏安全需求與安全質量定義、設計缺乏安全考慮與權限限制、編碼時因缺乏安全知識或未過濾檢查數據而產生邏輯錯誤；測試中的非常規操作只是暴露既有缺陷，並不產生缺陷。","475":"TCP與UDP同屬ISO/OSI參考模型的傳輸層，為上層應用提供端到端的數據傳輸服務；鏈路層負責節點間幀傳輸，會話層與表示層分別管理會話和數據格式，均不承載這兩個協議。","476":"該標準規定信息系統安全目標是開發者、評估者與用戶三方之間，就信息系統的安全特性及評估範圍所達成的一致；風險與使命、安全要求與目的屬評估的背景輸入，並非雙方一致的內容本身。","477":"信息安全保障的最終目標是保障信息系統持續實現組織機構的使命，掌控風險、維護保密性完整性可用性、使技術管理與工程質量達標，均為實現這一目標的手段與中間要求。","478":"IATF以保護資產為核心，將信息技術系統劃分為本地計算環境、區域邊界、網絡和基礎設施、支撐性基礎設施四個部分，並針對各部分提出安全需求與防護措施；內網外網等劃分非其模型。","479":"信息系統安全保障要求由技術安全保障要求、管理安全保障要求與安全工程安全保障要求三部分構成，對應技術、管理、工程三類保障能力；成熟度與控制需求等表述混入了能力評估用語。","480":"IPSec的密鑰協商有兩種方式：手工配置方式由管理員手動設置密鑰與參數，自動協商方式由IKE協議動態協商並管理安全關聯；隧道只是IPSec的封裝模式，並非密鑰協商方式。","481":"ISO7498-2中的業務流量填充機制通過在不通信時持續發送填充報文，掩蓋真實通信的頻次、長度與時序特徵，使攻擊者難以藉助流量分析推斷通信內容，因而屬於保障數據保密性的安全服務，與訪問控制、身份鑑別無關。","482":"PDCA循環必須依計劃、實施、檢查、處置的順序依次推進，大環套小環並螺旋式上升，每一輪循環都從計劃階段啓動，不能從任意階段開始；其餘三項均為該循環的固有特點。","483":"該條例確立的是計算機信息系統安全等級保護制度，並明確使用單位應建立健全安全管理制度、公安部主管全國計算機信息系統安全保護工作；條例中並無性能測試與安全測評制度，故該項表述錯誤。","
